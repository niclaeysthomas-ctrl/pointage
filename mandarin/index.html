<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mandarin">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mandarin entre amis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&family=Young+Serif&display=swap">
<style>
/* Concept : papier de riz froid, encre de jade, sceaux vermillon ; les couleurs vives sont réservées aux tons. */
:root{
  --paper:#EEF2EF; --surface:#FBFCFB; --sunk:#E2E8E4; --line:#CFD8D3;
  --ink:#15201C; --ink2:#4C5A55; --jade:#1D5A52; --jade-2:#2B7468; --jade-soft:#D6E6E1;
  --cinnabar:#BF3B2A; --cinnabar-soft:#F4DCD5; --on-accent:#FFFFFF;
  --t1:#C23B28; --t2:#A86A05; --t3:#2C7F45; --t4:#2759AB; --t5:#80908A;
  --good:#2C7F45; --good-soft:#DCEFE2; --bad:#BF3B2A; --bad-soft:#F7E0DA;
  --shadow:0 1px 2px rgba(21,32,28,.06),0 6px 20px rgba(21,32,28,.06);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-py:"Noto Sans","Figtree",system-ui,sans-serif;
  --f-hz:"Noto Serif SC","Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --plum:#6B4A8A; --plum-soft:#E8E0F0; --sand:#8A6420; --sand-soft:#F3E8D2;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1513; --surface:#161E1B; --sunk:#1D2724; --line:#2A3632;
  --ink:#E6ECE9; --ink2:#A0AEA9; --jade:#7CC4B6; --jade-2:#5FAE9F; --jade-soft:#1C3631;
  --cinnabar:#EC735E; --cinnabar-soft:#3A221D; --on-accent:#0F1513;
  --t1:#F0806C; --t2:#E2B054; --t3:#71C98D; --t4:#80A9F0; --t5:#8A9893;
  --good:#71C98D; --good-soft:#18352A; --bad:#EC735E; --bad-soft:#3A221D;
  --plum:#C3A6E0; --plum-soft:#2C2238; --sand:#E2BE78; --sand-soft:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1513; --surface:#161E1B; --sunk:#1D2724; --line:#2A3632;
  --ink:#E6ECE9; --ink2:#A0AEA9; --jade:#7CC4B6; --jade-2:#5FAE9F; --jade-soft:#1C3631;
  --cinnabar:#EC735E; --cinnabar-soft:#3A221D; --on-accent:#0F1513;
  --t1:#F0806C; --t2:#E2B054; --t3:#71C98D; --t4:#80A9F0; --t5:#8A9893;
  --good:#71C98D; --good-soft:#18352A; --bad:#EC735E; --bad-soft:#3A221D;
  --plum:#C3A6E0; --plum-soft:#2C2238; --sand:#E2BE78; --sand-soft:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
[lang="zh-CN"]{font-family:var(--f-hz)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--jade);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:1.6rem} h3{font-size:1.18rem} h4{font-size:1.02rem}
p{margin:0}
.muted{color:var(--ink2)} .small{font-size:.875rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--jade)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.center{display:flex;justify-content:center}

/* Tons */
.py{font-family:var(--f-py);font-weight:500;letter-spacing:.01em;display:block}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.no-tones .py span{color:inherit}
.py.m-fade{opacity:.4;transition:opacity .2s}
.py.m-fade:hover,button:hover .py.m-fade,.py.m-fade:focus{opacity:1}
.py.m-veil{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .2s;border-radius:6px}
.py.m-veil.shown{filter:none;user-select:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;font-family:var(--f-py);font-weight:500;margin-top:14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:-1px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand-seal{width:34px;height:34px;display:grid;place-items:center;background:var(--cinnabar);color:var(--on-accent);border-radius:7px;font-family:var(--f-hz);font-weight:700;font-size:1.2rem;transform:rotate(-4deg)}
.brand-n{font-family:var(--f-display);font-size:1.12rem;line-height:1.1}
.brand-n small{display:block;font-family:var(--f-body);font-size:.72rem;color:var(--ink2);letter-spacing:.04em}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.streak{display:flex;align-items:center;gap:4px;font-weight:600;font-size:.9rem;padding:6px 10px;border-radius:999px;background:var(--sunk);color:var(--ink2)}
.streak svg{width:16px;height:16px}
.streak.lit{background:var(--cinnabar-soft);color:var(--cinnabar)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:20px;height:20px}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink2);font-size:.72rem;font-weight:600}
.tab-ic{font-family:var(--f-hz);font-size:1.25rem;line-height:1;width:34px;height:28px;display:grid;place-items:center;border-radius:10px}
.tab.on{color:var(--jade)}
.tab.on .tab-ic{background:var(--jade-soft)}
@media (min-width:860px){
  body{padding-bottom:32px}
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:19;border-top:0;border-bottom:1px solid var(--line);background:var(--paper)}
  .nav-in{height:auto;max-width:980px;display:flex;gap:4px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tab{flex-direction:row;gap:8px;font-size:.92rem;padding:6px 14px 6px 6px;border-radius:12px}
  .tab:hover{background:var(--sunk)}
  .tab.on{background:var(--jade-soft)}
  .tab.on .tab-ic{background:transparent}
}

/* Contenu */
main{max-width:980px;margin:0 auto;padding-block:20px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:600;border:1.5px solid transparent;min-height:44px;transition:transform .08s,background .15s}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--jade);color:var(--on-accent)}
.btn.primary:hover{background:var(--jade-2)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--jade)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.9rem}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Accueil */
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.home{grid-template-columns:1fr}}
.hero{display:flex;gap:22px;align-items:center;background:var(--jade);color:var(--on-accent);border-radius:20px;padding:24px;position:relative;overflow:hidden;min-width:0}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .muted{color:inherit;opacity:.85}
.hero h2{font-size:1.75rem;margin:4px 0}
.hero-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero .row{margin-top:10px}
.hero .btn.primary{background:var(--on-accent);color:var(--jade)}
.hero .btn.ghost{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--on-accent) 45%,transparent)}
.hero-hz{font-family:var(--f-hz);font-weight:700;font-size:clamp(3rem,10vw,4.6rem);line-height:1;writing-mode:vertical-rl;letter-spacing:.06em;opacity:.95;flex:none}
@media (max-width:480px){.hero{flex-direction:column;align-items:flex-start}.hero-hz{writing-mode:horizontal-tb}}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.review{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.review > div{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 200px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:600}
.stats dd{margin:2px 0 0;font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats small{font-family:var(--f-body);font-size:.8rem;color:var(--ink2)}
.level{display:flex;flex-direction:column;gap:12px}
.level-h{display:flex;gap:12px;align-items:center;margin-top:8px}
.lvl-tag{display:inline-grid;place-items:center;min-width:40px;height:30px;padding:0 8px;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:700;font-size:.85rem;letter-spacing:.04em;flex:none}
.lvl-tag.sm{min-width:30px;height:22px;font-size:.7rem;border-radius:6px;vertical-align:2px;font-family:var(--f-body)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ucard{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:border-color .15s,transform .15s;min-width:0}
.ucard:hover{border-color:var(--jade);transform:translateY(-1px)}
.ucard.cur{border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
.u-hz{font-family:var(--f-hz);font-size:1.7rem;font-weight:700;min-width:64px;text-align:center;line-height:1.1}
.u-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.u-num{font-size:.72rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.u-title{font-weight:600}
.u-sub{font-size:.85rem;color:var(--ink2)}
.dots{display:flex;gap:4px;margin-top:8px}
.dots i{width:16px;height:4px;border-radius:2px;background:var(--sunk)}
.dots i.on{background:var(--jade)}
.seal{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:8px;color:var(--line);font-family:var(--f-hz);font-weight:700;font-size:1.2rem}
.seal.on{border:0;background:var(--cinnabar);color:var(--on-accent);transform:rotate(-6deg);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--on-accent) 30%,transparent)}
.seal.big{width:64px;height:64px;font-size:2rem;border-radius:12px}
.foot-note{text-align:center;max-width:60ch;margin:4px auto 0}

/* Unité */
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--jade);font-weight:600;padding:4px 0}
.back svg{width:18px;height:18px}
.unit-head{display:flex;align-items:center;gap:20px}
.uh-hz{font-family:var(--f-hz);font-weight:700;font-size:clamp(2.6rem,9vw,4rem);line-height:1}
.uh-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.step{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s}
.step:hover{border-color:var(--jade)}
.st-ic{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--sunk);font-family:var(--f-hz);font-size:1.4rem;flex:none}
.step.done .st-ic{background:var(--jade-soft);color:var(--jade)}
.st-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.st-n{font-weight:600}
.st-d{font-size:.85rem;color:var(--ink2)}
.st-min{font-size:.8rem;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.st-min svg{width:22px;height:22px;color:var(--jade)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);text-align:left}
.chip [lang]{font-size:1.25rem;font-weight:500}
.chip .py{font-size:.85rem}
.chip-f{font-size:.78rem;color:var(--ink2)}

/* Pages */
.page-h{display:flex;flex-direction:column;gap:6px;max-width:65ch}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:7px 12px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--ink2);font-family:var(--f-py)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.tones-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
.tones-grid > div{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:720px){.tones-grid{grid-template-columns:1fr}}
.quad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.qcell:hover{border-color:var(--jade)}
.qhz{font-family:var(--f-hz);font-size:1.8rem;line-height:1.2}
.qcell .py{font-size:1rem}
.qf{font-size:.75rem;color:var(--ink2)}
.tchart{width:100%;max-width:420px;height:auto;justify-self:center}
.tchart .grid{stroke:var(--line);stroke-width:1}
.tchart .axis{fill:var(--ink2);font-size:11px;font-family:var(--f-body)}
.tchart .lab{font-size:13px;font-weight:700;font-family:var(--f-body)}
.tchart .line{fill:none;stroke-width:6;stroke-linecap:round;pointer-events:none}
.tchart .hit{fill:none;stroke:transparent;stroke-width:22;cursor:pointer}
.tchart .tpath:hover .line,.tchart .tpath:focus .line{stroke-width:8}
.tc1{stroke:var(--t1)}.tc2{stroke:var(--t2)}.tc3{stroke:var(--t3)}.tc4{stroke:var(--t4)}
.tc1f{fill:var(--t1)}.tc2f{fill:var(--t2)}.tc3f{fill:var(--t3)}.tc4f{fill:var(--t4)}
.game-intro{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.game-play{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.big-say{width:84px;height:84px;border-radius:50%;border:0;background:var(--jade);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.big-say svg{width:38px;height:38px}
.big-say.sm{width:56px;height:56px}.big-say.sm svg{width:26px;height:26px}
.tone-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:480px}
.topt{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:12px;background:var(--paper);border:2px solid var(--line)}
.topt b{font-family:var(--f-display);font-size:1.5rem;font-weight:400}
.topt span{font-size:.75rem;color:var(--ink2)}
.tc1b b{color:var(--t1)}.tc2b b{color:var(--t2)}.tc3b b{color:var(--t3)}.tc4b b{color:var(--t4)}
.topt.right{border-color:var(--good);background:var(--good-soft)}
.topt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.game-res{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.game-res .py{display:inline;font-size:1.1rem}
.sounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.snd,.sd{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.snd-k{font-family:var(--f-py);font-weight:600;font-size:1.05rem;color:var(--jade)}
.snd-ex{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.mini{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.mini [lang]{font-size:1.1rem}
.mini .py{display:inline;font-size:.9rem}
.sandhi{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px}
.search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.wgroup{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.wg-h{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.wg-h [lang]{font-weight:700}
.words{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.words li + li{border-top:1px solid var(--line)}
.wrow{width:100%;display:grid;grid-template-columns:72px minmax(90px,140px) minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 14px}
.wrow:hover{background:var(--paper)}
.w-hz{font-size:1.35rem;font-weight:500}
.w-f{font-size:.92rem;min-width:0}
@media (max-width:520px){.wrow{grid-template-columns:64px minmax(0,1fr) auto;row-gap:0}.w-py{grid-column:2}.w-f{grid-column:2;grid-row:2}.wst{grid-column:3;grid-row:1/3}}
.wst{font-size:.72rem;font-weight:600;letter-spacing:.03em}
.wst.new{color:var(--ink2)}

<script>

// Pinyin : le ton écrit est le ton réellement prononcé pour 一 et 不 (comme dans les manuels).

    ["T","再见！","Zàijiàn!","Au revoir !"]],
    q: { q: "Que répond Xiao Li quand Tom s'excuse ?", opts: ["没关系 · ce n'est pas grave","谢谢 · merci","再见 · au revoir"] } },
  cult: { title: "Se saluer en Chine", hz: "你吃了吗？", py: "Nǐ chī le ma?", fr: "Tu as mangé ?",
    text: "<p>Pas de bise en Chine : un sourire, un signe de tête ou une poignée de main légère suffisent. Entre amis, 你好 peut même sonner un peu formel. On entend souvent un simple 嗨 hāi, ou une question en guise de bonjour : 你吃了吗？ « Tu as mangé ? ». Personne n'attend vraiment de réponse détaillée.</p><p>Tu as remarqué 小李 Xiǎo Lǐ ? 小 « petit » devant un nom de famille est un surnom affectueux pour quelqu'un de plus jeune ou d'âge égal. Pour quelqu'un de plus âgé, on dit 老 lǎo « vieux » : 老王 Lǎo Wáng. Ce n'est pas vexant, c'est chaleureux.</p>",
    fact: "Demande à tes amis s'ils ont un surnom en 小 : c'est souvent comme ça que leurs proches les appellent." } },

{ id: "u2", lvl: "A1", hz: "名字", title: "Se présenter", sub: "Nom, nationalité, questions",

    ex: [["中国","Zhōngguó","Chine"],["是","shì","être"],["人","rén","personne"],["什么","shénme","quoi"],["吃","chī","manger"]] },

  dlg: { title: "À une soirée", lines: [
    ["W","你好！你叫什么名字？","Nǐ hǎo! Nǐ jiào shénme míngzi?","Salut ! Comment tu t'appelles ?"],
    ["T","我叫汤姆。你呢？","Wǒ jiào Tāngmǔ. Nǐ ne?","Je m'appelle Tom. Et toi ?"],
    ["W","我叫王芳。你是哪国人？","Wǒ jiào Wáng Fāng. Nǐ shì nǎ guó rén?","Je m'appelle Wang Fang. Tu viens de quel pays ?"],
    ["T","我是法国人。你是中国人吗？","Wǒ shì Fǎguórén. Nǐ shì Zhōngguórén ma?","Je suis français. Tu es chinoise ?"],

  cult: { title: "Les noms chinois", hz: "王芳", py: "Wáng Fāng", fr: "Wang (nom de famille) Fang (prénom)",
    text: "<p>En chinois, <b>le nom de famille vient en premier</b> : dans 王芳, 王 Wáng est le nom de famille et 芳 Fāng le prénom. Les noms de famille ont presque tous une seule syllabe, et quelques-uns sont extrêmement répandus : 王 Wáng, 李 Lǐ et 张 Zhāng sont portés par des centaines de millions de personnes.</p><p>Les étrangers reçoivent souvent un nom chinois. Il peut imiter le son (汤姆 Tāngmǔ pour Tom) ou être choisi pour son sens. Demander à tes amis de t'en trouver un est une excellente façon d'entrer dans la langue.</p>",
    fact: "Les prénoms chinois sont choisis pour leur sens : 芳 fāng évoque un parfum de fleurs." } },

{ id: "u3", lvl: "A1", hz: "一二三", title: "Les nombres", sub: "Compter et dire son âge",

    text: "Les nombres sont très logiques : 十一 = 10 + 1 (11), 二十 = 2 × 10 (20), 二十五 = 2 × 10 + 5 (25). Pour l'âge, pas de verbe : on dit littéralement « moi 25 ans ». On demande 你多大？ à un adulte et 你几岁？ à un enfant.",
    ex: [["我二十八岁。","Wǒ èrshíbā suì.","J'ai 28 ans."],["你多大？","Nǐ duō dà?","Quel âge as-tu ?"],["他十九岁。","Tā shíjiǔ suì.","Il a 19 ans."],["九十九","jiǔshíjiǔ","99"]],

  cult: { title: "Les chiffres porte-bonheur", hz: "八", py: "bā", fr: "huit, le chiffre de la chance",
    text: "<p>Le 8 se dit bā, qui rappelle 发 fā, « s'enrichir ». C'est le chiffre le plus recherché : numéros de téléphone, plaques d'immatriculation, dates de mariage. À l'inverse, 四 sì ressemble à 死 sǐ, « mourir ». Beaucoup d'immeubles n'ont pas de 4e étage, ou pas de 14e.</p><p>On compte aussi d'une seule main : 6 avec le pouce et l'auriculaire tendus, 8 avec le pouce et l'index en forme de L, 10 avec le poing fermé ou les index croisés. Pratique au marché, déroutant la première fois.</p>",

{ id: "u4", lvl: "A1", hz: "家", title: "La famille", sub: "Frères, sœurs, possession",
  words: [["家","jiā","famille, maison"],["爸爸","bàba","papa"],["妈妈","māma","maman"],["哥哥","gēge","grand frère"],["姐姐","jiějie","grande sœur"],["弟弟","dìdi","petit frère"],["妹妹","mèimei","petite sœur"],["和","hé","et (entre deux noms)"],["有","yǒu","avoir, il y a"],["没有","méiyǒu","ne pas avoir"],["的","de","particule de possession"],["个","gè","classificateur général"],["两","liǎng","deux (+ classificateur)"]],
  pron: { title: "Le ton neutre",
    text: "Certaines syllabes perdent leur ton : elles deviennent <b>courtes et légères</b>. C'est le cas du second caractère dans les mots redoublés de la famille, et des particules comme 吗, 呢, 的. En pinyin, elles n'ont pas d'accent, et l'application les affiche en gris.",
    ex: [["爸爸","bàba","papa"],["妈妈","māma","maman"],["哥哥","gēge","grand frère"],["谢谢","xièxie","merci"],["我的","wǒ de","mon, à moi"]] },
  gram: { title: "Possession et quantité", patterns: ["Sujet + 的 + Nom","Sujet + 有 + Nombre + 个 + Nom"],
    text: "<b>的</b> marque la possession : 我的 = mon, à moi. Avec la famille proche, on l'omet souvent : 我妈妈 = ma mère. Entre un nombre et un nom, il faut un <b>classificateur</b> : 个 gè est le plus courant. Devant un classificateur, « deux » se dit 两 liǎng, pas 二. Enfin, la négation de 有 est toujours <b>没有</b>, jamais 不有.",
    ex: [["我有一个哥哥。","Wǒ yǒu yí gè gēge.","J'ai un grand frère."],["她有两个妹妹。","Tā yǒu liǎng gè mèimei.","Elle a deux petites sœurs."],["我没有姐姐。","Wǒ méiyǒu jiějie.","Je n'ai pas de grande sœur."],["你家有几个人？","Nǐ jiā yǒu jǐ gè rén?","Vous êtes combien dans ta famille ?"]],
    order: [{ fr: "J'ai deux petits frères.", t: [["我","wǒ"],["有","yǒu"],["两个","liǎng gè"],["弟弟","dìdi"]] },{ fr: "Je n'ai pas de grand frère.", t: [["我","wǒ"],["没有","méiyǒu"],["哥哥","gēge"]] }] },
  dlg: { title: "Frères et sœurs", lines: [
    ["L","汤姆，你家有几个人？","Tāngmǔ, nǐ jiā yǒu jǐ gè rén?","Tom, vous êtes combien dans ta famille ?"],
    ["T","我家有五个人：爸爸、妈妈、两个妹妹和我。","Wǒ jiā yǒu wǔ gè rén: bàba, māma, liǎng gè mèimei hé wǒ.","Nous sommes cinq : papa, maman, mes deux petites sœurs et moi."],
    ["L","你有哥哥吗？","Nǐ yǒu gēge ma?","Tu as un grand frère ?"],
    ["T","没有。你呢？","Méiyǒu. Nǐ ne?","Non. Et toi ?"],
    ["L","我有一个姐姐，她三十二岁。","Wǒ yǒu yí gè jiějie, tā sānshí'èr suì.","J'ai une grande sœur, elle a 32 ans."],
    ["T","王芳呢？","Wáng Fāng ne?","Et Wang Fang ?"],

  cult: { title: "Une famille, beaucoup de mots", hz: "奶奶", py: "nǎinai", fr: "grand-mère (côté père)",
    text: "<p>Le chinois distingue précisément chaque membre de la famille. La grand-mère paternelle est 奶奶 nǎinai, la maternelle 外婆 wàipó (ou 姥姥 lǎolao dans le nord). Il existe aussi un mot différent pour l'oncle côté père et côté mère, selon qu'il est plus âgé ou plus jeune que le parent.</p><p>Entre amis, on appelle volontiers un ami plus âgé 哥 gē (« grand frère ») ou 姐 jiě (« grande sœur »). De 1980 à 2015, la politique de l'enfant unique a fait de beaucoup de trentenaires des enfants uniques : leurs cousins jouent souvent le rôle de frères et sœurs.</p>",
    fact: "Pour un cousin, on dit 表哥 biǎogē ou 堂哥 tánggē selon le côté de la famille." } },

    text: "<p>En Chine, on partage rarement l'addition. Entre amis, chacun essaie de payer pour tout le monde, parfois avec une véritable lutte amicale à la caisse. L'usage veut que l'autre invite la fois suivante. Le pourboire, lui, ne se pratique généralement pas.</p><p>Les plats sont posés au centre et tout le monde se sert avec ses baguettes. Une règle à retenir : ne plante jamais tes baguettes à la verticale dans un bol de riz, cela rappelle l'encens des rites funéraires.</p>",
    fact: "Proposer 我请客 la prochaine fois que tes amis t'invitent fera très bonne impression." } },

{ id: "u7", lvl: "A2", hz: "几点", title: "L'heure et les rendez-vous", sub: "Fixer un moment ensemble",
  words: [["现在","xiànzài","maintenant"],["点","diǎn","heure (« h »)"],["半","bàn","demi, et demie"],["分","fēn","minute"],["今天","jīntiān","aujourd'hui"],["明天","míngtiān","demain"],["晚上","wǎnshang","soir"],["星期","xīngqī","semaine"],["星期六","xīngqīliù","samedi"],["有空","yǒu kòng","être libre"],["一起","yìqǐ","ensemble"],["见","jiàn","voir, se retrouver"],["吧","ba","particule de suggestion"]],
  pron: { title: "ü : le « u » français",
    text: "Bonne nouvelle : le ü chinois est exactement le « u » de « lune ». Piège : après j, q, x et y, on écrit u mais on prononce ü. 去 qù se dit donc « tchu », pas « tchou ». Le u normal, lui, se prononce « ou » : 不 bù se dit « bou ».",
    ex: [["去","qù","aller"],["女","nǚ","femme"],["鱼","yú","poisson"],["不","bù","ne… pas"],["五","wǔ","cinq"]] },
  gram: { title: "Le moment avant l'action", patterns: ["Sujet + Quand + Verbe","Quand + Sujet + Verbe"],
    text: "En chinois, on dit <b>quand</b> avant de dire <b>quoi</b>. L'expression de temps se place juste après le sujet, ou tout au début de la phrase, jamais à la fin comme dans « on se voit samedi ». Ajouter <b>吧</b> en fin de phrase transforme une affirmation en proposition : « …, ça te dit ? »",
    ex: [["我明天晚上有空。","Wǒ míngtiān wǎnshang yǒu kòng.","Je suis libre demain soir."],["我们七点半见吧。","Wǒmen qī diǎn bàn jiàn ba.","On se retrouve à 7 h 30 ?"],["现在几点？","Xiànzài jǐ diǎn?","Quelle heure est-il ?"],["星期六我们一起看电影吧！","Xīngqīliù wǒmen yìqǐ kàn diànyǐng ba!","Samedi, on va voir un film ensemble ?"]],
    order: [{ fr: "On se voit demain à 8 h.", t: [["我们","wǒmen"],["明天","míngtiān"],["八点","bā diǎn"],["见","jiàn"]], alt: [[1,0,2,3]] },{ fr: "Tu es libre samedi ?", t: [["你","nǐ"],["星期六","xīngqīliù"],["有空","yǒu kòng"],["吗","ma"]], alt: [[1,0,2,3]] }] },
  dlg: { title: "Ciné samedi ?", lines: [
    ["W","汤姆，你星期六有空吗？","Tāngmǔ, nǐ xīngqīliù yǒu kòng ma?","Tom, tu es libre samedi ?"],
    ["T","有空。你想做什么？","Yǒu kòng. Nǐ xiǎng zuò shénme?","Oui. Tu veux faire quoi ?"],
    ["W","我们一起看电影吧！小李也想看。","Wǒmen yìqǐ kàn diànyǐng ba! Xiǎo Lǐ yě xiǎng kàn.","Et si on allait voir un film ? Xiao Li veut le voir aussi."],
    ["T","好啊！几点？","Hǎo a! Jǐ diǎn?","Avec plaisir ! À quelle heure ?"],
    ["W","电影八点开始。我们七点半见吧？","Diànyǐng bā diǎn kāishǐ. Wǒmen qī diǎn bàn jiàn ba?","Le film commence à 8 h. On se retrouve à 7 h 30 ?"],
    ["T","好！星期六晚上七点半见！","Hǎo! Xīngqīliù wǎnshang qī diǎn bàn jiàn!","Parfait ! À samedi soir, 7 h 30 !"]],
    q: { q: "À quelle heure se retrouvent-ils ?", opts: ["19 h 30","20 h","7 h"] } },
  cult: { title: "Une semaine en chiffres", hz: "星期天", py: "xīngqītiān", fr: "dimanche",
    text: "<p>Les jours de la semaine sont numérotés : 星期一 « semaine-un » est lundi, jusqu'à 星期六, samedi. Seul dimanche fait exception : 星期天 ou 星期日. Les mois suivent la même logique : 一月 janvier, 二月 février… jusqu'à 十二月.</p><p>Autre surprise : toute la Chine vit à l'heure de Pékin, alors que le pays s'étend sur l'équivalent de cinq fuseaux horaires. Dans l'extrême ouest, au Xinjiang, le soleil se couche très tard, et beaucoup d'habitants utilisent une heure locale officieuse.</p>",
    fact: "Pour « lundi », on entend aussi 周一 zhōuyī ou 礼拜一 lǐbàiyī." } },

{ id: "u8", lvl: "A2", hz: "哪儿", title: "Où es-tu ?", sub: "Lieux, transports, distances",
  words: [["去","qù","aller"],["来","lái","venir"],["哪儿","nǎr","où ?"],["这儿","zhèr","ici"],["那儿","nàr","là-bas"],["在","zài","être (à un endroit)"],["饭馆","fànguǎn","restaurant"],["地铁","dìtiě","métro"],["坐","zuò","prendre (un transport), s'asseoir"],["走路","zǒulù","marcher, à pied"],["远","yuǎn","loin"],["近","jìn","proche"],["离","lí","(distance) de"]],
  pron: { title: "-n ou -ng ?",
    text: "Les finales -n et -ng distinguent des mots différents. Pour <b>-n</b>, le bout de la langue touche l'arrière des dents du haut : son net, comme dans « Anne ». Pour <b>-ng</b>, la langue reste au fond et le son passe par le nez, comme à la fin de « camping ».",
    ex: [["近","jìn","proche"],["星期","xīngqī","semaine"],["饭馆","fànguǎn","restaurant"],["中国","Zhōngguó","Chine"],["很","hěn","très"]] },
  gram: { title: "Où ? Comment ? À quelle distance ?", patterns: ["Sujet + 在 + Lieu","Sujet + 坐 + Transport + 去 + Lieu","A + 离 + B + 远 / 近"],
    text: "<b>在</b> + lieu indique où l'on se trouve, sans 是. Pour dire comment on va quelque part, le moyen de transport vient <b>avant</b> le verbe 去 : « je prends le métro aller ». <b>离</b> sert à parler de distance : A 离 B 很近 = A est près de B.",
    ex: [["你在哪儿？","Nǐ zài nǎr?","Tu es où ?"],["我在饭馆。","Wǒ zài fànguǎn.","Je suis au restaurant."],["我坐地铁去。","Wǒ zuò dìtiě qù.","J'y vais en métro."],["饭馆离这儿很近。","Fànguǎn lí zhèr hěn jìn.","Le restaurant est tout près d'ici."]],
    order: [{ fr: "Je vais au restaurant en métro.", t: [["我","wǒ"],["坐地铁","zuò dìtiě"],["去","qù"],["饭馆","fànguǎn"]] },{ fr: "Le restaurant est loin d'ici ?", t: [["饭馆","fànguǎn"],["离","lí"],["这儿","zhèr"],["远吗","yuǎn ma"]] }] },
  dlg: { title: "Au téléphone", lines: [
    ["T","喂，小李！你在哪儿？","Wéi, Xiǎo Lǐ! Nǐ zài nǎr?","Allô, Xiao Li ! Tu es où ?"],
    ["L","我在地铁站。你呢？","Wǒ zài dìtiězhàn. Nǐ ne?","Je suis à la station de métro. Et toi ?"],
    ["T","我在饭馆。王芳也在这儿。你来吗？","Wǒ zài fànguǎn. Wáng Fāng yě zài zhèr. Nǐ lái ma?","Je suis au restaurant. Wang Fang est là aussi. Tu viens ?"],
    ["L","来！饭馆离地铁站远吗？","Lái! Fànguǎn lí dìtiězhàn yuǎn ma?","J'arrive ! Le restaurant est loin de la station ?"],
    ["T","不远，很近。走路五分钟。","Bù yuǎn, hěn jìn. Zǒulù wǔ fēnzhōng.","Pas loin, c'est tout près. Cinq minutes à pied."],
    ["L","好，我现在去！","Hǎo, wǒ xiànzài qù!","OK, j'y vais tout de suite !"]],
    q: { q: "Comment Xiao Li va-t-il de la station au restaurant ?", opts: ["À pied, en cinq minutes","En métro","En taxi"] } },
  cult: { title: "哪儿 ou 哪里 ?", hz: "哪里", py: "nǎlǐ", fr: "où ? (forme du sud)",
    text: "<p>À Pékin et dans le nord, on ajoute volontiers un petit « r » en fin de mot : 哪儿 nǎr, 一点儿 yìdiǎnr. C'est le 儿化 érhuà. Dans le sud, on dit plutôt 哪里 nǎlǐ et 一点 yìdiǎn. Les deux formes sont correctes : demande à tes amis d'où ils viennent, et imite leur façon de parler.</p><p>Côté transports, les grandes villes ont des métros immenses, on paie presque tout en scannant un QR code, et le réseau de trains à grande vitesse, le 高铁 gāotiě, est le plus vaste du monde.</p>",
    fact: "Si tes amis disent 哪里 au lieu de 哪儿, ils viennent probablement du sud." } },

{ id: "u9", lvl: "A2", hz: "昨天", title: "Raconter sa journée", sub: "了 et l'action accomplie",
  words: [["昨天","zuótiān","hier"],["了","le","action accomplie, changement"],["已经","yǐjīng","déjà"],["还没","hái méi","pas encore"],["买","mǎi","acheter"],["东西","dōngxi","chose, affaires"],["朋友","péngyou","ami, amie"],["很多","hěn duō","beaucoup (de)"],["累","lèi","fatigué"],["睡觉","shuìjiào","dormir, se coucher"],["开心","kāixīn","joyeux, content"],["回家","huí jiā","rentrer à la maison"]],
  pron: { title: "不 change de ton",
    text: "不 se dit bù, sauf devant un 4e ton : il devient alors <b>bú</b>. C'est pour ça que tu as vu 不是 bú shì et 不客气 bú kèqi. Comme pour 一, l'application écrit le ton réellement prononcé.",
    ex: [["不是","bú shì","ce n'est pas"],["不太","bú tài","pas très"],["不想","bù xiǎng","ne pas avoir envie"],["不喝","bù hē","ne pas boire"],["不来","bù lái","ne pas venir"]] },
  gram: { title: "了 : c'est fait !", patterns: ["Sujet + Verbe + 了 + Objet","Sujet + 没 + Verbe"],
    text: "Le chinois n'a pas de passé composé, mais la particule <b>了</b> indique qu'une action est accomplie. Pour dire qu'on n'a pas fait quelque chose, on place <b>没</b> devant le verbe et 了 disparaît. 还没 = pas encore. En fin de phrase, 了 peut aussi signaler un changement : 我饿了 « j'ai faim (maintenant) ».",
    ex: [["我昨天买了很多东西。","Wǒ zuótiān mǎile hěn duō dōngxi.","Hier, j'ai acheté plein de choses."],["你吃饭了吗？","Nǐ chī fàn le ma?","Tu as mangé ?"],["我还没吃。","Wǒ hái méi chī.","Je n'ai pas encore mangé."],["他已经回家了。","Tā yǐjīng huí jiā le.","Il est déjà rentré."]],
    order: [{ fr: "Hier, j'ai vu un film.", t: [["我","wǒ"],["昨天","zuótiān"],["看了","kànle"],["一个电影","yí gè diànyǐng"]], alt: [[1,0,2,3]] },{ fr: "Je n'ai pas encore mangé.", t: [["我","wǒ"],["还没","hái méi"],["吃饭","chī fàn"]] }] },
  dlg: { title: "Le lendemain", lines: [
    ["W","汤姆，你昨天做什么了？","Tāngmǔ, nǐ zuótiān zuò shénme le?","Tom, tu as fait quoi hier ?"],
    ["T","我和朋友去买东西了。买了很多东西！","Wǒ hé péngyou qù mǎi dōngxi le. Mǎile hěn duō dōngxi!","Je suis allé faire les magasins avec des amis. J'ai acheté plein de trucs !"],
    ["W","你累吗？","Nǐ lèi ma?","Tu es fatigué ?"],
    ["T","很累！我十点就睡觉了。","Hěn lèi! Wǒ shí diǎn jiù shuìjiào le.","Très ! Je me suis couché dès 22 h."],
    ["W","小李呢？他回家了吗？","Xiǎo Lǐ ne? Tā huí jiā le ma?","Et Xiao Li ? Il est rentré ?"],
    ["T","他还没回家，他在朋友家玩游戏！","Tā hái méi huí jiā, tā zài péngyou jiā wán yóuxì!","Il n'est pas encore rentré, il joue aux jeux vidéo chez un ami !"],
    ["W","哈哈，他一定很开心！","Hāha, tā yídìng hěn kāixīn!","Haha, il doit être ravi !"]],
    q: { q: "Qu'a fait Tom hier ?", opts: ["Du shopping avec des amis","Il a joué aux jeux vidéo","Il est allé au cinéma"] } },
  cult: { title: "微信, l'appli à tout faire", hz: "微信", py: "Wēixìn", fr: "WeChat",
    text: "<p>En Chine, WeChat ne sert pas seulement à envoyer des messages. On y paie ses courses, on y commande un taxi, on y partage ses photos dans le 朋友圈 péngyouquān, le « cercle d'amis ». Pour garder le contact avec des amis chinois, c'est presque toujours là que tout se passe.</p><p>Les messages vocaux y sont très populaires, souvent plus que l'écrit. Pour toi, c'est une chance : écouter et envoyer des vocaux est l'un des meilleurs entraînements possibles.</p>",
    fact: "Envoie un petit vocal 你好！ à tes amis : c'est la meilleure façon de tester ta prononciation." } },

{ id: "u10", lvl: "A2", hz: "天气", title: "Météo et ressenti", sub: "Les adjectifs sans 是",
  words: [["天气","tiānqì","temps (météo)"],["怎么样","zěnmeyàng","comment ? ça va comment ?"],["冷","lěng","froid"],["热","rè","chaud"],["下雨","xià yǔ","pleuvoir"],["太…了","tài…le","trop… !","太好了"],["有点儿","yǒudiǎnr","un peu (souvent négatif)"],["觉得","juéde","trouver, avoir l'impression"],["舒服","shūfu","confortable, se sentir bien"],["漂亮","piàoliang","joli, beau"],["非常","fēicháng","extrêmement"],["身体","shēntǐ","corps, santé"]],
  pron: { title: "Questions : les tons ne bougent pas",
    text: "En français, on monte la voix pour poser une question. En chinois, ce sont les tons qui portent la mélodie : si tu montes la voix sur la dernière syllabe, tu risques de changer le mot. La question est marquée par 吗 ou par un mot interrogatif, prononcés légèrement.",
    ex: [["你累吗？","Nǐ lèi ma?","Tu es fatigué ?"],["好吃吗？","Hǎochī ma?","C'est bon ?"],["天气怎么样？","Tiānqì zěnmeyàng?","Quel temps fait-il ?"],["冷吗？","Lěng ma?","Il fait froid ?"]] },
  gram: { title: "Les adjectifs : sans 是 !", patterns: ["Sujet + 很 + Adjectif","太 + Adjectif + 了","Sujet + 有点儿 + Adjectif"],
    text: "Un adjectif peut fonctionner comme un verbe : on ne dit <b>pas</b> 今天是冷, mais 今天<b>很</b>冷. Ici, 很 ne veut pas vraiment dire « très », il est presque obligatoire. 太…了 exprime l'excès ou l'enthousiasme : 太好了 ! « génial ! ». 有点儿 veut dire « un peu », mais pour quelque chose de négatif : 有点儿冷, jamais 有点儿漂亮.",
    ex: [["今天很冷。","Jīntiān hěn lěng.","Il fait froid aujourd'hui."],["太好了！","Tài hǎo le!","Génial !"],["我有点儿累。","Wǒ yǒudiǎnr lèi.","Je suis un peu fatigué."],["你觉得怎么样？","Nǐ juéde zěnmeyàng?","Qu'est-ce que tu en penses ?"]],
    order: [{ fr: "Aujourd'hui, il fait un peu froid.", t: [["今天","jīntiān"],["有点儿","yǒudiǎnr"],["冷","lěng"]] },{ fr: "Il fait vraiment beau aujourd'hui !", t: [["今天","jīntiān"],["天气","tiānqì"],["太好了","tài hǎo le"]] }] },
  dlg: { title: "Pékin, Paris", lines: [
    ["T","北京今天天气怎么样？","Běijīng jīntiān tiānqì zěnmeyàng?","Quel temps fait-il à Pékin aujourd'hui ?"],
    ["W","有点儿冷，还下雨。","Yǒudiǎnr lěng, hái xià yǔ.","Un peu froid, et en plus il pleut."],
    ["T","巴黎也很冷！","Bālí yě hěn lěng!","À Paris aussi, il fait froid !"],
    ["W","你身体怎么样？昨天你很累。","Nǐ shēntǐ zěnmeyàng? Zuótiān nǐ hěn lèi.","Tu te sens comment ? Hier, tu étais très fatigué."],
    ["T","今天很舒服，谢谢！","Jīntiān hěn shūfu, xièxie!","Aujourd'hui je me sens bien, merci !"],
    ["W","太好了！天冷，多喝热水！","Tài hǎo le! Tiān lěng, duō hē rè shuǐ!","Super ! Il fait froid, bois beaucoup d'eau chaude !"],
    ["T","哈哈，好的！","Hāha, hǎo de!","Haha, d'accord !"]],
    q: { q: "Quel temps fait-il à Pékin ?", opts: ["Un peu froid et pluvieux","Très chaud","Beau et doux"] } },
  cult: { title: "多喝热水, le remède universel", hz: "多喝热水", py: "duō hē rè shuǐ", fr: "bois beaucoup d'eau chaude",
    text: "<p>Un rhume, un coup de fatigue, un mal de ventre ? La réponse sera presque toujours 多喝热水 : « bois beaucoup d'eau chaude ». Héritée en partie de la médecine traditionnelle, l'idée est d'éviter le froid dans le corps, y compris les boissons glacées.</p><p>La phrase est devenue un mème : en ligne, on se moque du petit ami qui répond 多喝热水 à tous les problèmes. Mais dans la vie, c'est une vraie marque d'attention.</p>",
    fact: "Au restaurant, on te servira souvent de l'eau chaude sans même que tu la demandes." } },

{ id: "u11", lvl: "A2", hz: "手机", title: "Garder le contact", sub: "Savoir, pouvoir, envoyer",
  words: [["手机","shǒujī","téléphone portable"],["号码","hàomǎ","numéro"],["微信","Wēixìn","WeChat"],["发","fā","envoyer"],["消息","xiāoxi","message, nouvelle"],["打电话","dǎ diànhuà","téléphoner"],["给","gěi","à (quelqu'un), donner"],["等","děng","attendre"],["说","shuō","parler, dire"],["中文","Zhōngwén","chinois (langue)"],["会","huì","savoir faire (appris)"],["能","néng","pouvoir (être capable)"],["可以","kěyǐ","pouvoir (avoir le droit)"]],
  pron: { title: "Numéros et 3e tons enchaînés",
    text: "Dans les numéros (téléphone, chambre, bus), 一 se prononce souvent <b>yāo</b>, pour ne pas le confondre avec 七 qī. Et quand deux 3e tons se suivent, le premier devient un 2e ton : 可以 kěyǐ se dit « kéyǐ », 你好 se dit « ní hǎo ».",
    ex: [["一一零","yāo yāo líng","110, la police","幺幺零"],["可以","kěyǐ","se dit « kéyǐ »"],["手机","shǒujī","portable"],["你好","nǐ hǎo","se dit « ní hǎo »"]] },
  gram: { title: "会, 能, 可以 : trois « pouvoir »", patterns: ["会 + Verbe · savoir faire","能 + Verbe · être capable","可以 + Verbe · avoir le droit","给 + Personne + Verbe"],
    text: "<b>会</b> : une compétence apprise (parler une langue, nager). <b>能</b> : la possibilité dans la situation (« tu peux m'attendre ? »). <b>可以</b> : la permission (« je peux t'appeler ? »). Dans la vie, 能 et 可以 se recoupent souvent. <b>给</b> + personne se place avant le verbe : 给我发消息 « envoie-moi un message ».",
    ex: [["我会说一点儿中文。","Wǒ huì shuō yìdiǎnr Zhōngwén.","Je parle un peu chinois."],["你能等我吗？","Nǐ néng děng wǒ ma?","Tu peux m'attendre ?"],["我可以给你打电话吗？","Wǒ kěyǐ gěi nǐ dǎ diànhuà ma?","Je peux t'appeler ?"],["给我发微信吧！","Gěi wǒ fā Wēixìn ba!","Envoie-moi un message WeChat !"]],
    order: [{ fr: "Je parle un peu chinois.", t: [["我","wǒ"],["会说","huì shuō"],["一点儿","yìdiǎnr"],["中文","Zhōngwén"]] },{ fr: "Je peux t'appeler ?", t: [["我","wǒ"],["可以","kěyǐ"],["给你","gěi nǐ"],["打电话吗","dǎ diànhuà ma"]] }] },
  dlg: { title: "On s'ajoute ?", lines: [
    ["W","汤姆，你的中文很好！","Tāngmǔ, nǐ de Zhōngwén hěn hǎo!","Tom, ton chinois est très bon !"],
    ["T","谢谢！我会说一点儿。","Xièxie! Wǒ huì shuō yìdiǎnr.","Merci ! Je parle un peu."],
    ["W","你有微信吗？我可以加你吗？","Nǐ yǒu Wēixìn ma? Wǒ kěyǐ jiā nǐ ma?","Tu as WeChat ? Je peux t'ajouter ?"],
    ["T","可以！我给你我的手机号码。","Kěyǐ! Wǒ gěi nǐ wǒ de shǒujī hàomǎ.","Bien sûr ! Je te donne mon numéro."],
    ["W","好，我给你发消息。","Hǎo, wǒ gěi nǐ fā xiāoxi.","OK, je t'envoie un message."],
    ["T","晚上我能给你打电话吗？我想练习中文。","Wǎnshang wǒ néng gěi nǐ dǎ diànhuà ma? Wǒ xiǎng liànxí Zhōngwén.","Je peux t'appeler ce soir ? J'aimerais pratiquer mon chinois."],
    ["W","可以！八点以后吧。","Kěyǐ! Bā diǎn yǐhòu ba.","Oui ! Après 20 h, d'accord ?"]],
    q: { q: "Pourquoi Tom veut-il appeler Wang Fang ?", opts: ["Pour pratiquer son chinois","Pour l'inviter au cinéma","Pour lui demander son numéro"] } },
  cult: { title: "520 veut dire « je t'aime »", hz: "五二零", py: "wǔ èr líng", fr: "520, qui sonne comme 我爱你",
    text: "<p>Les Chinois adorent jouer avec les chiffres. 520 wǔ èr líng ressemble à 我爱你 wǒ ài nǐ, « je t'aime » : le 20 mai est devenu une fête des amoureux en ligne. 88 bābā veut dire « bye-bye », et 666 liùliùliù, « trop fort ! », vient des joueurs de jeux vidéo.</p><p>Dans les messages, 哈哈哈 est le rire de base : plus il y a de 哈, plus c'est drôle. Méfie-toi en revanche de l'émoji souriant tout simple de WeChat : beaucoup le perçoivent comme froid, voire ironique.</p>",
    fact: "Pour ajouter quelqu'un sur WeChat, on scanne son QR code : 我扫你 wǒ sǎo nǐ, « je te scanne »." } },

{ id: "u12", lvl: "A2", hz: "去过", title: "Expériences et voyages", sub: "过 : je l'ai déjà vécu",
  words: [["过","guo","expérience vécue"],["次","cì","fois"],["第一次","dì yī cì","la première fois"],["旅游","lǚyóu","voyager (en touriste)"],["地方","dìfang","endroit"],["好玩","hǎowán","amusant, sympa"],["北京","Běijīng","Pékin"],["上海","Shànghǎi","Shanghai"],["长城","Chángchéng","la Grande Muraille"],["一定","yídìng","absolument, sûrement"],["从来没","cónglái méi","n'avoir jamais"],["还","hái","encore, en plus"]],
  pron: { title: "Le 3e ton, en vrai",
    text: "Dans les tableaux, le 3e ton descend puis remonte. Mais dans une phrase, il ne remonte presque jamais : il reste <b>bas et grave</b>, comme une voix qui grogne. Il ne remonte complètement que seul ou en fin de phrase. Écoute la différence.",
    ex: [["好","hǎo","seul : descend et remonte"],["好吃","hǎochī","hǎo reste bas"],["北京","Běijīng","běi reste bas"],["我想去","wǒ xiǎng qù","se dit « wó xiǎng qù »"],["你好","nǐ hǎo","se dit « ní hǎo »"]] },
  gram: { title: "过 : déjà vécu", patterns: ["Sujet + Verbe + 过 + Objet","Sujet + 没 + Verbe + 过","Verbe + 过 + Nombre + 次"],
    text: "<b>过</b> après un verbe signifie qu'on a déjà vécu cette expérience, au moins une fois dans sa vie. Négation : 没 + verbe + 过, « je ne l'ai jamais fait », renforcée avec 从来没. Pour compter les fois, on utilise <b>次</b> après 过.",
    ex: [["我去过北京。","Wǒ qùguo Běijīng.","Je suis déjà allé à Pékin."],["你吃过饺子吗？","Nǐ chīguo jiǎozi ma?","Tu as déjà mangé des jiaozi ?"],["我从来没去过上海。","Wǒ cónglái méi qùguo Shànghǎi.","Je ne suis jamais allé à Shanghai."],["我去过两次长城。","Wǒ qùguo liǎng cì Chángchéng.","Je suis allé deux fois à la Grande Muraille."]],
    order: [{ fr: "Je suis déjà allé en Chine.", t: [["我","wǒ"],["去过","qùguo"],["中国","Zhōngguó"]] },{ fr: "Je ne suis jamais allé à Shanghai.", t: [["我","wǒ"],["没","méi"],["去过","qùguo"],["上海","Shànghǎi"]] }] },
  dlg: { title: "Tu es déjà allé en Chine ?", lines: [
    ["L","汤姆，你去过中国吗？","Tāngmǔ, nǐ qùguo Zhōngguó ma?","Tom, tu es déjà allé en Chine ?"],
    ["T","没去过。你去过法国吗？","Méi qùguo. Nǐ qùguo Fǎguó ma?","Jamais. Et toi, tu es déjà allé en France ?"],
    ["L","去过一次。我非常喜欢巴黎。","Qùguo yí cì. Wǒ fēicháng xǐhuan Bālí.","Une fois. J'ai adoré Paris."],
    ["W","汤姆，你一定要来中国旅游！","Tāngmǔ, nǐ yídìng yào lái Zhōngguó lǚyóu!","Tom, il faut absolument que tu viennes visiter la Chine !"],
    ["T","我想去北京看长城。好玩吗？","Wǒ xiǎng qù Běijīng kàn Chángchéng. Hǎowán ma?","J'aimerais aller à Pékin voir la Grande Muraille. C'est sympa ?"],
    ["L","非常好玩！可是人很多。","Fēicháng hǎowán! Kěshì rén hěn duō.","Génial ! Mais il y a beaucoup de monde."],
    ["W","你来北京，我们带你玩！","Nǐ lái Běijīng, wǒmen dài nǐ wán!","Si tu viens à Pékin, on te fait visiter !"]],
    q: { q: "Combien de fois Xiao Li est-il allé en France ?", opts: ["Une fois","Jamais","Deux fois"] } },
  cult: { title: "Une langue, beaucoup de parlers", hz: "普通话", py: "Pǔtōnghuà", fr: "le mandarin standard",
    text: "<p>Ce que tu apprends s'appelle 普通话 Pǔtōnghuà, « la langue commune ». Basé sur la prononciation de Pékin, il est enseigné à l'école dans toute la Chine. Mais beaucoup de Chinois parlent aussi une langue régionale, souvent incompréhensible pour les autres : le cantonais 粤语 Yuèyǔ à Canton et Hong Kong, le shanghaïen, le minnan à Taïwan et au Fujian…</p><p>À l'écrit, la Chine continentale utilise des caractères simplifiés, tandis que Taïwan, Hong Kong et Macao gardent les caractères traditionnels.</p>",
    fact: "Demande à tes amis s'ils parlent un dialecte : ils seront ravis de t'en apprendre quelques mots." } },

{ id: "u13", lvl: "B1", hz: "比较", title: "Comparer et choisir", sub: "比, 更, 最, 还是",
  words: [["比","bǐ","par rapport à (comparaison)"],["更","gèng","encore plus"],["最","zuì","le plus"],["一样","yíyàng","pareil"],["跟","gēn","avec, et"],["还是","háishi","ou (dans une question)"],["比较","bǐjiào","plutôt, assez"],["便宜","piányi","bon marché"],["贵","guì","cher"],["方便","fāngbiàn","pratique"],["差不多","chàbuduō","à peu près pareil"],["选","xuǎn","choisir"]],
  pron: { title: "Le rythme des expressions",
    text: "Le chinois adore les expressions en quatre syllabes. Pour bien les dire, garde chaque ton net et donne à toutes les syllabes la même durée, comme un métronome. 马马虎虎, littéralement « cheval cheval tigre tigre », veut dire « comme ci, comme ça ».",
    ex: [["马马虎虎","mǎmahūhū","comme ci, comme ça"],["差不多","chàbuduō","à peu près"],["一模一样","yìmú yíyàng","identique"],["越来越好","yuèláiyuè hǎo","de mieux en mieux"]] },
  gram: { title: "Comparer", patterns: ["A + 比 + B + Adjectif","A + 跟 + B + 一样 + Adjectif","X + 还是 + Y ？"],
    text: "Avec <b>比</b>, on ne met jamais 很 : 北京比上海冷 (et non 很冷). Pour insister, on ajoute <b>更</b> « encore plus ». <b>最</b> donne le superlatif, <b>一样</b> l'égalité. Dans une question qui propose un choix, « ou » se dit <b>还是</b>.",
    ex: [["北京比上海冷。","Běijīng bǐ Shànghǎi lěng.","Pékin est plus froid que Shanghai."],["火锅比饺子更贵。","Huǒguō bǐ jiǎozi gèng guì.","La fondue chinoise est encore plus chère que les jiaozi."],["地铁跟出租车一样方便。","Dìtiě gēn chūzūchē yíyàng fāngbiàn.","Le métro est aussi pratique que le taxi."],["你想喝茶还是喝咖啡？","Nǐ xiǎng hē chá háishi hē kāfēi?","Tu veux du thé ou du café ?"]],
    order: [{ fr: "Le thé est moins cher que le café.", t: [["茶","chá"],["比","bǐ"],["咖啡","kāfēi"],["便宜","piányi"]] },{ fr: "Tu veux du thé ou du café ?", t: [["你想喝","nǐ xiǎng hē"],["茶","chá"],["还是","háishi"],["咖啡","kāfēi"]] }] },
  dlg: { title: "Fondue ou raviolis ?", lines: [
    ["W","今天晚上我们吃火锅还是吃饺子？","Jīntiān wǎnshang wǒmen chī huǒguō háishi chī jiǎozi?","Ce soir, on mange une fondue chinoise ou des jiaozi ?"],
    ["L","火锅比饺子贵，但是更好吃！","Huǒguō bǐ jiǎozi guì, dànshì gèng hǎochī!","La fondue est plus chère que les jiaozi, mais encore meilleure !"],
    ["T","我觉得差不多，两个我都喜欢。","Wǒ juéde chàbuduō, liǎng gè wǒ dōu xǐhuan.","Pour moi, c'est pareil : j'aime les deux."],
    ["W","汤姆，你最喜欢什么中国菜？","Tāngmǔ, nǐ zuì xǐhuan shénme Zhōngguó cài?","Tom, quel plat chinois tu préfères ?"],
    ["T","我最喜欢饺子。可是我还没吃过火锅。","Wǒ zuì xǐhuan jiǎozi. Kěshì wǒ hái méi chīguo huǒguō.","Les jiaozi. Mais je n'ai encore jamais mangé de fondue chinoise."],
    ["L","那今天一定要吃火锅！","Nà jīntiān yídìng yào chī huǒguō!","Alors ce soir, c'est fondue, obligé !"],
    ["W","好！离这儿最近的那家比较便宜，也很方便。","Hǎo! Lí zhèr zuì jìn de nà jiā bǐjiào piányi, yě hěn fāngbiàn.","OK ! Celle qui est la plus proche d'ici est plutôt bon marché, et c'est pratique."]],
    q: { q: "Que vont-ils manger ce soir ?", opts: ["Une fondue chinoise (火锅)","Des jiaozi","Des plats français"] } },
  cult: { title: "面子 : ne pas perdre la face", hz: "哪里哪里", py: "nǎlǐ nǎlǐ", fr: "oh non, pas du tout (réponse modeste)",
    text: "<p>Le 面子 miànzi, la « face », c'est l'image qu'on donne aux autres. On évite de mettre quelqu'un dans l'embarras devant un groupe : une critique se fait en privé, avec tact. On offre et on reçoit aussi les cadeaux ou les cartes de visite à deux mains.</p><p>Face à un compliment, on répond avec modestie : 哪里哪里 nǎlǐ nǎlǐ (littéralement « où ça, où ça ? ») ou 还好 hái hǎo, « ça va ». Tes amis te diront 你的中文很好 ! dès ton premier 你好. Réponds 哪里哪里, et ils seront vraiment impressionnés.</p>",
    fact: "Dire merci trop souvent à des amis proches peut sembler distant : entre proches, on se rend service sans compter." } },

{ id: "u14", lvl: "B1", hz: "因为", title: "Donner son avis", sub: "Parce que, bien que, en fait",
  words: [["因为","yīnwèi","parce que"],["所以","suǒyǐ","donc, c'est pourquoi"],["但是","dànshì","mais"],["虽然","suīrán","bien que"],["认为","rènwéi","estimer, considérer"],["同意","tóngyì","être d'accord"],["有意思","yǒu yìsi","intéressant"],["问题","wèntí","question, problème"],["其实","qíshí","en fait"],["当然","dāngrán","bien sûr"],["可能","kěnéng","peut-être, possible"],["难","nán","difficile"]],
  pron: { title: "Les particules qui changent tout",
    text: "En fin de phrase, une petite particule au ton neutre change l'humeur : 好吧 « bon, d'accord… » (un peu résigné), 好啊 « oh oui, avec plaisir ! », 好吗 ? « d'accord ? ». 是吗 ? veut dire « ah bon ? ». La voix de synthèse rend mal l'émotion : imite surtout l'intention.",
    ex: [["好吧","hǎo ba","bon, d'accord…"],["好啊","hǎo a","oh oui !"],["好吗","hǎo ma","d'accord ?"],["是吗","shì ma","ah bon ?"]] },
  gram: { title: "Relier ses idées", patterns: ["因为 … ，所以 …","虽然 … ，但是 …"],
    text: "En français, on dit « parce que » ou « donc », rarement les deux. En chinois, on aime utiliser <b>la paire complète</b> : 因为…所以…, 虽然…但是… Cela structure la phrase et aide l'autre à suivre. À l'oral, on garde parfois une seule des deux moitiés.",
    ex: [["因为下雨，所以我们不去了。","Yīnwèi xià yǔ, suǒyǐ wǒmen bú qù le.","Comme il pleut, on n'y va plus."],["虽然中文很难，但是很有意思。","Suīrán Zhōngwén hěn nán, dànshì hěn yǒu yìsi.","Le chinois a beau être difficile, c'est passionnant."],["其实我觉得没问题。","Qíshí wǒ juéde méi wèntí.","En fait, je pense que ça ne pose pas de problème."],["我不同意，因为太贵了。","Wǒ bù tóngyì, yīnwèi tài guì le.","Je ne suis pas d'accord, parce que c'est trop cher."]],
    order: [{ fr: "Bien que ce soit cher, c'est très bon.", t: [["虽然","suīrán"],["很贵","hěn guì"],["但是","dànshì"],["很好吃","hěn hǎochī"]] },{ fr: "Comme je suis fatigué, je rentre.", t: [["因为","yīnwèi"],["我很累","wǒ hěn lèi"],["所以","suǒyǐ"],["我回家了","wǒ huí jiā le"]] }] },
  dlg: { title: "Le chinois, c'est dur ?", lines: [
    ["L","汤姆，你觉得中文难吗？","Tāngmǔ, nǐ juéde Zhōngwén nán ma?","Tom, tu trouves le chinois difficile ?"],
    ["T","虽然声调很难，但是我觉得很有意思。","Suīrán shēngdiào hěn nán, dànshì wǒ juéde hěn yǒu yìsi.","Les tons ont beau être difficiles, je trouve ça passionnant."],
    ["W","我同意！其实汉字更难。","Wǒ tóngyì! Qíshí Hànzì gèng nán.","D'accord avec toi ! En fait, les caractères sont encore plus durs."],
    ["T","当然！因为汉字太多了，所以我先学拼音。","Dāngrán! Yīnwèi Hànzì tài duō le, suǒyǐ wǒ xiān xué pīnyīn.","Évidemment ! Comme il y a énormément de caractères, j'apprends d'abord le pinyin."],
    ["L","我认为一年以后你可能就能跟我们聊天了！","Wǒ rènwéi yì nián yǐhòu nǐ kěnéng jiù néng gēn wǒmen liáotiān le!","Je pense que dans un an, tu pourras sûrement discuter avec nous !"],
    ["T","真的吗？那太好了！","Zhēn de ma? Nà tài hǎo le!","C'est vrai ? Ce serait génial !"],
    ["W","没问题，我们每天跟你说中文！","Méi wèntí, wǒmen měitiān gēn nǐ shuō Zhōngwén!","Pas de problème, on te parlera chinois tous les jours !"]],
    q: { q: "Selon Wang Fang, qu'est-ce qui est le plus difficile ?", opts: ["Les caractères (汉字)","Les tons","Le pinyin"] } },
  cult: { title: "Dire non sans dire non", hz: "再说吧", py: "zài shuō ba", fr: "on verra (souvent : non)",
    text: "<p>Un « non » direct peut sembler brutal. On préfère des formules plus douces : 不太方便 « ce n'est pas très pratique », 我考虑一下 « je vais y réfléchir », ou 再说吧 « on en reparlera ». Dans bien des cas, cela veut dire non, poliment.</p><p>L'inverse existe aussi : quand on t'invite ou qu'on t'offre quelque chose, il est d'usage de refuser une première fois par politesse, avant d'accepter. Si tes amis insistent, ils sont sincères.</p>",
    fact: "Un 没问题 méi wèntí franc et rapide, lui, veut vraiment dire « aucun problème »." } },

{ id: "u15", lvl: "B1", hz: "打算", title: "Projets et avenir", sub: "Prévoir, espérer, progresser",

  pron: { title: "Les vœux du Nouvel An",
    text: "Pour le Nouvel An chinois, tout le monde échange des vœux en quatre syllabes. Lis-les lentement, chaque ton bien posé, puis accélère. Tes amis seront ravis de les recevoir en message vocal.",
    ex: [["新年快乐","xīnnián kuàilè","bonne année"],["恭喜发财","gōngxǐ fācái","prospérité !"],["身体健康","shēntǐ jiànkāng","bonne santé"],["万事如意","wànshì rúyì","que tout aille comme tu le souhaites"]] },
  gram: { title: "Parler de ses projets", patterns: ["Sujet + 打算 / 准备 + Verbe","越来越 + Adjectif","Sujet + 正在 + Verbe"],
    text: "Le chinois n'a pas de futur : on utilise des verbes de projet comme <b>打算</b> (prévoir de) ou <b>准备</b> (s'apprêter à), et des mots de temps (明年, 以后). <b>越来越</b> + adjectif décrit une évolution, souvent avec 了 à la fin. <b>正在</b> + verbe indique une action en cours.",
    ex: [["我打算明年去中国。","Wǒ dǎsuan míngnián qù Zhōngguó.","Je prévois d'aller en Chine l'an prochain."],["我的中文越来越好了。","Wǒ de Zhōngwén yuèláiyuè hǎo le.","Mon chinois s'améliore de plus en plus."],["我正在学汉字。","Wǒ zhèngzài xué Hànzì.","Je suis en train d'apprendre les caractères."],["希望以后有机会一起旅游。","Xīwàng yǐhòu yǒu jīhuì yìqǐ lǚyóu.","J'espère qu'on aura l'occasion de voyager ensemble."]],
    order: [{ fr: "Mon chinois s'améliore de plus en plus.", t: [["我的中文","wǒ de Zhōngwén"],["越来越","yuèláiyuè"],["好了","hǎo le"]] },{ fr: "Je prévois d'aller en Chine l'an prochain.", t: [["我","wǒ"],["打算","dǎsuan"],["明年","míngnián"],["去中国","qù Zhōngguó"]], alt: [[0,2,1,3],[2,0,1,3]] }] },
  dlg: { title: "Rendez-vous à Pékin", lines: [
    ["W","汤姆，春节你有什么打算？","Tāngmǔ, Chūnjié nǐ yǒu shénme dǎsuan?","Tom, qu'est-ce que tu prévois pour le Nouvel An chinois ?"],
    ["T","我正在准备去中国！我打算二月去北京。","Wǒ zhèngzài zhǔnbèi qù Zhōngguó! Wǒ dǎsuan èryuè qù Běijīng.","Je suis en train de préparer un voyage en Chine ! Je compte aller à Pékin en février."],
    ["L","太好了！春节的时候，你可以来我家吃年夜饭。","Tài hǎo le! Chūnjié de shíhou, nǐ kěyǐ lái wǒ jiā chī niányèfàn.","Génial ! Pour la fête, tu peux venir chez moi pour le repas du réveillon."],
    ["T","真的吗？谢谢你！我希望有机会认识你的家人。","Zhēn de ma? Xièxie nǐ! Wǒ xīwàng yǒu jīhuì rènshi nǐ de jiārén.","C'est vrai ? Merci ! J'espère avoir l'occasion de rencontrer ta famille."],
    ["W","汤姆，你的中文越来越好了！","Tāngmǔ, nǐ de Zhōngwén yuèláiyuè hǎo le!","Tom, ton chinois s'améliore de plus en plus !"],
    ["T","哪里哪里！因为你们每天跟我说中文。","Nǎlǐ nǎlǐ! Yīnwèi nǐmen měitiān gēn wǒ shuō Zhōngwén.","Oh, pas du tout ! C'est parce que vous me parlez chinois tous les jours."],
    ["L","那我们北京见！","Nà wǒmen Běijīng jiàn!","Alors, rendez-vous à Pékin !"]],
    q: { q: "Que propose Xiao Li à Tom ?", opts: ["Venir au repas du réveillon chez lui","Visiter la Grande Muraille","Apprendre les caractères ensemble"] } },
  cult: { title: "春节, la Fête du Printemps", hz: "红包", py: "hóngbāo", fr: "enveloppe rouge",
    text: "<p>Le Nouvel An chinois suit le calendrier lunaire : il tombe entre fin janvier et mi-février. C'est la plus grande fête de l'année. La veille, toute la famille se réunit pour le 年夜饭 niányèfàn, le repas du réveillon, et on colle sur les portes des bandes de papier rouge portant des vœux.</p><p>On offre aux enfants et aux plus jeunes des 红包, des enveloppes rouges contenant de l'argent. Aujourd'hui, on les envoie aussi sur WeChat, parfois sous forme de jeu entre amis : le premier qui clique gagne la plus grosse part.</p>",
    fact: "Pendant le 春运, la période des retours du Nouvel An, des centaines de millions de personnes traversent le pays pour rentrer en famille." } }

// ===== Mandarin entre amis : moteur =====
const STEPS = [
  { k: "sons", n: "Sons", ic: "音", min: 3, d: "Un point de prononciation" },
  { k: "gram", n: "Grammaire", ic: "法", min: 4, d: "Une structure, des phrases à construire" },
  { k: "dlg", n: "Dialogue", ic: "话", min: 3, d: "Une scène entre amis" },
  { k: "cult", n: "Culture", ic: "文", min: 2, d: "Un court récit" },
  { k: "defi", n: "Défi", ic: "印", min: 4, d: "Gagne le sceau de l'unité" }
];
const DAY = 86400000;
// Les mots d'une unité sont découpés en petites séances :
// au plus 4 mots et environ 4 caractères nouveaux par séance.
const _firstWord = {};
UNITS.forEach(u => u.words.forEach(w => [...w[0]].forEach(c => { if (/[\u4e00-\u9fff]/.test(c) && !_firstWord[c]) _firstWord[c] = w[0]; })));
function chunksOf(u) {
  const out = [], loads = []; let cur = [], load = 0;
  u.words.forEach(w => {
    const fresh = new Set([...w[0]].filter(c => _firstWord[c] === w[0])).size;
    const cost = 1 + Math.max(0, fresh - (w[0].length === 1 ? 1 : 0));
    if (cur.length && (cur.length >= 4 || load + cost > 6)) { out.push(cur); loads.push(load); cur = []; load = 0; }
    cur.push(w); load += cost;
  });
  if (cur.length) { out.push(cur); loads.push(load); }
  // une toute petite dernière séance rejoint la précédente
  const n = out.length;
  if (n > 1 && out[n - 1].length === 1 && out[n - 2].length <= 3 && loads[n - 1] + loads[n - 2] <= 7) out[n - 2].push(...out.pop());
  return out;
}
const _steps = {};
function stepsOf(u) {
  if (_steps[u.id]) return _steps[u.id];
  const ch = chunksOf(u);
  const mots = ch.map((ws, i) => ({ k: "mots" + (i + 1), n: ch.length > 1 ? `Mots ${i + 1}/${ch.length}` : "Mots", ic: "字", min: 4, d: ws.map(w => w[0]).join(" · "), words: ws }));
  return (_steps[u.id] = [STEPS[0], ...mots, ...STEPS.slice(1)]);
}
const INTERVALS = [0, 1, 3, 7, 16, 35]; // jours par boîte

// ---------- utilitaires ----------
const $ = (s, r = document) => r.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const dayStr = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const ttsText = s => String(s).replace(/[（(][^)）]*[)）]/g, "").replace(/…+/g, "，");

// ---------- état ----------
const KEY = "mandarin-entre-amis-v1";
const DEFAULT = { done: {}, words: {}, chars: {}, streak: { n: 0, last: null }, best: 0, settings: { pinyin: "auto", rate: 0.8, tones: true } };
let S = load();
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); return Object.assign({}, DEFAULT, o, { settings: Object.assign({}, DEFAULT.settings, o.settings || {}) }); } } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function migrate() {
  if (!S.chars) S.chars = {};
  UNITS.forEach(u => {
    if (S.done[u.id + ":mots"]) { stepsOf(u).filter(s => s.words).forEach(s => (S.done[u.id + ":" + s.k] = true)); delete S.done[u.id + ":mots"]; }
  });
  Object.keys(S.words).forEach(h => [...h].forEach(c => { if (CHARS[c] && !S.chars[c]) S.chars[c] = Date.now(); }));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function markActivity() {
  const t = dayStr(Date.now()), y = dayStr(Date.now() - DAY);
  if (S.streak.last === t) return;
  S.streak.n = S.streak.last === y ? S.streak.n + 1 : 1;
  S.streak.last = t; save();
}
function streakNow() { const t = dayStr(Date.now()), y = dayStr(Date.now() - DAY); return (S.streak.last === t || S.streak.last === y) ? S.streak.n : 0; }

// mots à plat
const ALLW = [];
UNITS.forEach((u, ui) => u.words.forEach(w => ALLW.push({ h: w[0], p: w[1], f: w[2], tts: w[3] || w[0], u: u.id, ui, lvl: u.lvl })));
const WMAP = Object.fromEntries(ALLW.map(w => [w.h, w]));
const unitById = id => UNITS.find(u => u.id === id);

// SRS
function srsAdd(h) { if (!S.words[h]) S.words[h] = { b: 1, d: Date.now() + DAY }; }
function srsAnswer(h, ok) {
  const w = S.words[h]; if (!w) return;
  if (ok) { w.b = Math.min(5, w.b + 1); w.d = Date.now() + INTERVALS[w.b] * DAY; }
  else { w.b = 1; w.d = Date.now() + 10 * 60000; }
  save();
}

// ---------- pinyin coloré ----------
const TM = { a: "aāáǎà", e: "eēéěè", i: "iīíǐì", o: "oōóǒò", u: "uūúǔù", "ü": "üǖǘǚǜ" };
const STRIP = {}; const TONEOF = {};
for (const v in TM) for (let t = 0; t < 5; t++) { STRIP[TM[v][t]] = v; if (t) TONEOF[TM[v][t]] = t; }
const INI = ["zh", "ch", "sh", "b", "p", "m", "f", "d", "t", "n", "l", "g", "k", "h", "j", "q", "x", "r", "z", "c", "s", "y", "w"];
const FIN = new Set("a o e i u ü ai ei ao ou an en ang eng ong er ia ie iao iu ian in iang ing iong ua uo uai ui uan un uang ueng üe üan ün ue".split(" "));

function validSyl(s, first, last) {
  if (last && s.length > 1 && s.endsWith("r") && validSyl(s.slice(0, -1), first, false)) return true;
  for (const i of INI) if (s.startsWith(i)) { const f = s.slice(i.length); if (f && FIN.has(f)) return true; }
  return first && FIN.has(s) && /^[aoe]/.test(s);
}
function splitWord(word) {
  const b = baseOf(word), n = b.length, memo = {};
  const go = pos => {
    if (pos === n) return [];
    if (pos in memo) return memo[pos];
    for (let len = Math.min(7, n - pos); len >= 1; len--) {
      if (validSyl(b.slice(pos, pos + len), pos === 0, pos + len === n)) { const r = go(pos + len); if (r) return (memo[pos] = [len, ...r]); }
    }
    return (memo[pos] = null);
  };
  const lens = go(0); if (!lens) return null;
  const out = []; let p = 0; const chars = [...word];
  for (const l of lens) { out.push(chars.slice(p, p + l).join("")); p += l; }
  return out;
}
const toneOf = syl => { for (const c of syl) if (TONEOF[c]) return TONEOF[c]; return 5; };
const LETTERS = /[A-Za-züÜāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙ]+/g;
function colorize(py) {
  let out = "", last = 0;
  py.replace(LETTERS, (m, off) => {
    out += esc(py.slice(last, off)); last = off + m.length;
    const syl = splitWord(m);
    out += syl ? syl.map(s => `<span class="t${toneOf(s)}">${esc(s)}</span>`).join("") : esc(m);
    return m;

}
function addTone(base, t) {

  if (idx < 0) for (let i = base.length - 1; i >= 0; i--) if ("aeiouü".includes(base[i])) { idx = i; break; }

}
function retone(py) {

  py.replace(LETTERS, (m, off) => { parts.push({ t: py.slice(last, off) }); const s = splitWord(m); parts.push(s ? { s } : { t: m }); last = off + m.length; return m; });
  parts.push({ t: py.slice(last) });
  const syls = []; parts.forEach((p, pi) => p.s && p.s.forEach((s, si) => { if (baseOf(s) !== "r") syls.push([pi, si]); }));

}

// modes d'affichage du pinyin
function modeFor(lvl) {

// ---------- voix ----------
let VOICE = null, voiceChecked = false, warned = false;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices();
  if (v.length) voiceChecked = true;
  VOICE = v.find(x => /zh[-_]CN/i.test(x.lang)) || v.find(x => /cmn/i.test(x.lang)) || v.find(x => /^zh/i.test(x.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = () => { pickVoice(); if ($("#settings") && !$("#settings").hidden) renderSettings(); }; }
function speak(text, opt = {}) {
  if (!("speechSynthesis" in window)) { toast("Ce navigateur ne propose pas de synthèse vocale."); return; }
  try {
    if (!opt.queue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(ttsText(text));
    u.lang = VOICE ? VOICE.lang : "zh-CN"; if (VOICE) u.voice = VOICE;
    u.rate = (opt.rate || S.settings.rate); u.pitch = opt.pitch || 1;
    if (opt.onend) { u.onend = opt.onend; u.onerror = opt.onend; }
    speechSynthesis.speak(u);
    if (!VOICE && voiceChecked && !warned) { warned = true; toast("Aucune voix chinoise trouvée sur cet appareil : le son peut manquer. Détails dans Réglages."); }
  } catch (e) { if (opt.onend) opt.onend(); }
}

function newGameQ() { const s = pick(TONE_SETS), t = 1 + Math.floor(Math.random() * 4); return { hz: s.hz[t - 1], base: s.base, t, fr: s.fr[t - 1] }; }
function refreshGame() { const g = $("#game"); if (g) { g.innerHTML = gameHTML(); bindGame(); } }

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "");

let L = null;
function startLesson(cfg) {
  L = Object.assign({ i: 0, score: 0, total: 0, handler: null, finished: false }, cfg);

  $("#lTitle").textContent = cfg.title;

}
function closeLesson() { try { speechSynthesis.cancel(); } catch (e) {} $("#lesson").hidden = true; document.body.classList.remove("lesson-open"); L = null; render(); }
const api = {
  lock() { $("#lNext").disabled = true; },
  unlock() { $("#lNext").disabled = false; },
  setNext(label, fn) { $("#lNext").textContent = label; L.handler = fn || null; },
  result(ok, msg) {
    L.total++; if (ok) L.score++;
    const f = $("#lFeedback"); f.className = "l-fb " + (ok ? "good" : "bad"); f.innerHTML = msg; f.hidden = false;
    L.handler = null; $("#lNext").textContent = "Continuer"; $("#lNext").disabled = false; $("#lNext").focus({ preventScroll: true });
  }
};
function renderScreen() {
  const body = $("#lBody"); body.innerHTML = ""; $(".l-body").scrollTop = 0;
  const f = $("#lFeedback"); f.hidden = true; f.className = "l-fb";
  $("#lNext").disabled = false; $("#lNext").textContent = "Continuer"; L.handler = null;
  $("#lProg").style.width = (100 * L.i / (L.screens.length + 1)) + "%";
  L.screens[L.i](body, api);
}
function nextScreen() {
  if (!L) return;
  if (L.handler) { const h = L.handler; h(); return; }
  if (L.finished) { closeLesson(); return; }
  if (L.i < L.screens.length - 1) { L.i++; renderScreen(); return; }
  finishLesson();
}
function finishLesson() {
  const res = L.onDone ? L.onDone(L.score, L.total) : {};
  L.finished = true;
  $("#lProg").style.width = "100%";
  const body = $("#lBody");
  $("#lFeedback").hidden = true;
  body.innerHTML = `<div class="summary${res.seal ? " with-seal" : ""}">
    ${res.seal ? `<div class="stamp" lang="zh-CN">${res.seal}</div>` : `<div class="sum-ic">${res.ok === false ? "再" : ICON.check}</div>`}
    <h2>${res.title || "Étape terminée"}</h2>
    ${L.total ? `<p class="sum-score">${L.score} / ${L.total} bonnes réponses</p>` : ""}
    <p class="muted">${res.text || ""}</p>
  </div>`;
  $("#lNext").textContent = res.ok === false ? "Fermer" : "Terminer";
  $("#lNext").disabled = false;
}

function distractors(w, n, field) {
  const pool = shuffle(ALLW.filter(x => x.h !== w.h && x.u === w.u)).concat(shuffle(ALLW.filter(x => x.u !== w.u && Math.abs(x.ui - w.ui) <= 3)));
  const out = []; const seen = new Set([w[field]]);
  for (const x of pool) { if (!seen.has(x[field])) { seen.add(x[field]); out.push(x); } if (out.length === n) break; }
  return out;
}
function wordMCQ(w, type, opt = {}) {
  type = type || pick(["hz2f", "f2hz", "au2f"]);
  const lvl = w.lvl;
  let kicker, prompt, options, auto = false;
  if (type === "hz2f") {
    kicker = "Que veut dire ce mot ?";
    prompt = `<div class="qp-hz"><span lang="zh-CN">${w.h}</span>${py(w.p, lvl)}</div>${sayBtn(w.tts)}`;
    options = shuffle([w, ...distractors(w, 3, "f")]).map(x => ({ html: esc(x.f), ok: x.h === w.h }));
  } else if (type === "f2hz") {
    kicker = "Comment dit-on…";
    prompt = `<div class="qp-f">« ${esc(w.f)} »</div>`;
    options = shuffle([w, ...distractors(w, 3, "h")]).map(x => ({ html: `<span lang="zh-CN" class="o-hz">${x.h}</span>${py(x.p, lvl)}`, ok: x.h === w.h, say: x.tts }));
  } else if (type === "au2f") {
    kicker = "Écoute : que veut dire ce mot ?";
    prompt = `<button class="big-say" data-say="${esc(w.tts)}" aria-label="Réécouter">${ICON.sound}</button>`;
    options = shuffle([w, ...distractors(w, 3, "f")]).map(x => ({ html: esc(x.f), ok: x.h === w.h }));
    auto = true;
  } else { // ton : quel pinyin ?
    kicker = "Écoute : quel est le bon pinyin ?";
    prompt = `<div class="qp-hz"><span lang="zh-CN">${w.h}</span></div><button class="big-say sm" data-say="${esc(w.tts)}" aria-label="Réécouter">${ICON.sound}</button>`;
    const vars = tonedVariants(w.p, 3);
    options = shuffle([w.p, ...vars]).map(p => ({ html: py(p, "A1", "show"), ok: p === w.p }));
    auto = true;
  }
  return scrMCQ({ kicker, prompt, options, auto: auto ? w.tts : null, answer: `<span lang="zh-CN">${w.h}</span> ${py(w.p, "A1", "show")} · ${esc(w.f)}`, onAnswer: ok => opt.onAnswer && opt.onAnswer(ok) });
}
function scrMCQ(q) {
  return (el, api) => {
    el.innerHTML = `<p class="q-kicker">${q.kicker}</p><div class="q-prompt">${q.prompt}</div>
      <div class="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}">${o.html}</button>`).join("")}</div>`;
    api.lock();

    });

}
function scrOrder(item, lvl) {
  return (el, api) => {
    const tiles = item.t.map((t, i) => ({ h: t[0], p: t[1], i }));
    const answers = [item.t.map((_, i) => i)].concat(item.alt || []);
    let bank = shuffle(tiles), guard = 0;
    while (answers.some(a => a.join() === bank.map(t => t.i).join()) && guard++ < 20) bank = shuffle(tiles);
    let placed = [];
    const m = modeFor(lvl); const tm = m === "veil" ? "none" : m;
    const tileHTML = t => `<button class="tile" data-i="${t.i}"><span lang="zh-CN">${t.h}</span>${tm === "none" ? "" : py(t.p, lvl, tm)}</button>`;
    el.innerHTML = `<p class="q-kicker">Construis la phrase</p><div class="qp-f">« ${esc(item.fr)} »</div>
      <div class="answer" aria-label="Ta phrase"></div><div class="bank"></div>`;
    const draw = () => {
      $(".answer", el).innerHTML = placed.map(tileHTML).join("") || `<span class="muted small">Touche les blocs dans le bon ordre</span>`;
      $(".bank", el).innerHTML = bank.map(t => placed.includes(t) ? `<span class="tile ghost">${t.h}</span>` : tileHTML(t)).join("");
      $(".answer", el).querySelectorAll(".tile").forEach(b => b.onclick = () => { if (checked) return; placed = placed.filter(t => t.i !== +b.dataset.i); draw(); });
      $(".bank", el).querySelectorAll(".tile:not(.ghost)").forEach(b => b.onclick = () => { if (checked) return; const t = tiles[+b.dataset.i]; placed.push(t); speak(t.h); draw(); });
      if (!checked) { if (placed.length === tiles.length) api.unlock(); else api.lock(); }
    };
    let checked = false;
    api.setNext("Vérifier", () => {
      checked = true;
      const got = placed.map(t => t.i).join();
      const ok = answers.some(a => a.join() === got);
      $(".answer", el).classList.add(ok ? "right" : "wrong");
      const sentence = item.t.map(t => t[0]).join("");
      speak(sentence);
      api.result(ok, ok ? `Parfait ! <span lang="zh-CN">${sentence}</span>` : `Bon ordre : <span lang="zh-CN">${sentence}</span> ${py(item.t.map(t => t[1]).join(" "), "A1", "show")}`);
    });
    draw();
  };
}
