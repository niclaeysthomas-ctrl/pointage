// --- étapes ---
function startStep(u, k) {
  const step = stepsOf(u).find(s => s.k === k);
  const title = `${u.hz} · ${step.n}`;
  const done = (extra) => { S.done[u.id + ":" + k] = true; markActivity(); save(); return extra; };
  const sealIfComplete = r => { if (unitDone(u) && k !== "defi") r.text = (r.text || "") + " Unité complète : sceau obtenu !"; return r; };
  let screens = [], onDone;

  if (k === "sons") {
    const p = u.pron;
    screens.push(scrInfo(`<p class="q-kicker">Prononciation</p><h2 class="l-h">${esc(p.title)}</h2><p>${p.text}</p>
      <div class="pron-ex">${p.ex.map(e => `<button class="pex" data-say="${esc(e[3] || e[0])}"><span class="pex-hz" lang="zh-CN">${e[0]}</span>${py(e[1], "A1", "show")}<span class="small muted">${esc(e[2])}</span></button>`).join("")}</div>
      <p class="muted small">Touche chaque exemple, écoute, puis répète à voix haute. C'est en le disant que ça rentre.</p>`));
    shuffle(p.ex).slice(0, 2).forEach(e => {
      const others = shuffle(p.ex.filter(x => x !== e).map(x => x[1]));
      const opts = shuffle([e[1], ...tonedVariants(e[1], 1), ...others].filter((v, i, a) => a.indexOf(v) === i).slice(0, 4));
      if (!opts.includes(e[1])) opts[0] = e[1];
      screens.push(scrMCQ({ kicker: "Écoute : quel pinyin entends-tu ?", prompt: `<button class="big-say" data-say="${esc(e[3] || e[0])}" aria-label="Réécouter">${ICON.sound}</button>`,
        options: shuffle(opts).map(o => ({ html: py(o, "A1", "show"), ok: o === e[1] })), auto: e[3] || e[0], answer: `<span lang="zh-CN">${e[0]}</span> ${py(e[1], "A1", "show")}` }));
    });
    onDone = () => sealIfComplete(done({ title: "Oreille affûtée", text: "Pense à répéter les exemples à voix haute, même seul." }));
  }

  if (step.words) {
    const ws = step.words.map(w => WMAP[w[0]]);
    const newChars = [];
    ws.forEach((w, i) => {
      const fresh = [...new Set([...w.h])].filter(c => CHARS[c] && CHAR_FIRST[c] && CHAR_FIRST[c].word === w.h);
      if (w.h.length === 1 && fresh.length) {
        screens.push(scrWordIntro(w, u.lvl, i + 1, ws.length));
        screens.push(scrCharIntro(w.h));
      } else {
        screens.push(scrWordIntro(w, u.lvl, i + 1, ws.length));
        fresh.forEach(c => screens.push(scrCharIntro(c, w.h)));
      }
      newChars.push(...fresh);
    });
    const qs = shuffle(ws);
    const bc = shuffle(newChars.filter(buildable));
    const types = ["au2f", "f2hz", "hz2f"];
    qs.slice(0, bc.length ? 3 : 4).forEach((w, i) => screens.push(wordMCQ(w, types[i % 3])));
    if (bc.length) screens.push(buildMCQ(bc[0], newChars));
    onDone = () => {
      ws.forEach(w => srsAdd(w.h)); newChars.forEach(c => { if (!S.chars[c]) S.chars[c] = Date.now(); });
      return sealIfComplete(done({ title: `${ws.length} mots, ${newChars.length} caractère${newChars.length > 1 ? "s" : ""}`, text: "Ils reviendront dans tes révisions demain. Retrouve les fiches dans l'onglet Mots, rubrique Caractères." }));
    };
  }

  if (k === "gram") {
    const g = u.gram;
    screens.push(scrInfo(`<p class="q-kicker">Grammaire</p><h2 class="l-h">${esc(g.title)}</h2>${g.patterns.map(patternHTML).join("")}<p>${g.text}</p>${exList(g.ex, u.lvl)}`));
    g.order.forEach(o => screens.push(scrOrder(o, u.lvl)));
    onDone = () => sealIfComplete(done({ title: "Structure en poche", text: "Essaie de fabriquer une phrase à toi avec cette structure et envoie-la à un ami." }));
  }

  if (k === "dlg") {
    screens.push(scrDialogue(u));
    const q = u.dlg.q; const right = q.opts[0];
    screens.push(scrMCQ({ kicker: "As-tu compris ?", prompt: `<div class="qp-f">${esc(q.q)}</div>`, options: shuffle(q.opts).map(o => ({ html: esc(o), ok: o === right })), answer: esc(right) }));
    screens.push(el => { el.innerHTML = `<p class="q-kicker">À toi de jouer</p><h2 class="l-h">Prends la place de Tom</h2><p class="muted small">Réécoute chaque réplique de Tom et répète-la à voix haute, en imitant la mélodie.</p>${dialogueHTML(u.dlg, u.lvl)}`; bindDialogue(el, u.dlg); el.querySelectorAll(".line:not(.me)").forEach(x => x.classList.add("dim")); });
    onDone = () => sealIfComplete(done({ title: "Scène jouée", text: "Ce dialogue utilise ce que tu viens d'apprendre : relis-le dans quelques jours, il te paraîtra facile." }));
  }

  if (k === "cult") {
    const c = u.cult;
    screens.push(scrInfo(`<p class="q-kicker">Culture</p><h2 class="l-h">${esc(c.title)}</h2>
      <div class="cult-word"><button class="pex" data-say="${esc(c.hz)}"><span class="pex-hz" lang="zh-CN">${c.hz}</span>${py(c.py, "A1", "show")}<span class="small muted">${esc(c.fr)}</span></button></div>
      <div class="prose">${c.text}</div><aside class="fact"><b>Le saviez-vous ?</b> ${c.fact}</aside>`));
    onDone = () => sealIfComplete(done({ title: "Bonne lecture", text: "Parles-en à tes amis : ils auront sûrement leur propre version de l'histoire." }));
  }

  if (k === "defi") {
    const ws = shuffle(ALLW.filter(w => w.u === u.id));
    ["hz2f", "f2hz", "au2f", "hz2f", "f2hz"].forEach((t, i) => screens.push(wordMCQ(ws[i % ws.length], t, { onAnswer: ok => srsAnswer(ws[i % ws.length].h, ok) })));
    const tw = ws.find(w => w.p.replace(/[^a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, "").length > 1 && tonedVariants(w.p, 3).length === 3) || ws[5];
    screens.push(wordMCQ(tw, "tone"));
    const ucs = [...new Set(u.words.flatMap(w => [...w[0]]))].filter(c => CHARS[c] && buildable(c));
    if (ucs.length) screens.push(buildMCQ(pick(ucs), ucs));
    u.gram.order.forEach(o => screens.push(scrOrder(o, u.lvl)));
    screens.unshift(scrInfo(`<p class="q-kicker">Défi de l'unité</p><h2 class="l-h">Gagne le sceau <span lang="zh-CN">${u.hz[0]}</span></h2><p>${screens.length} questions sur les mots, les tons et la grammaire de l'unité. Il faut <b>${screens.length - 2} bonnes réponses</b> pour obtenir le sceau.</p><p class="muted small">Pas de stress : tu peux recommencer autant de fois que tu veux.</p>`));
    const need = screens.length - 3;
    onDone = (score, total) => {
      if (score >= need) {
        S.done[u.id + ":defi"] = true; markActivity(); save();
        return unitDone(u) ? { seal: u.hz[0], title: "Sceau obtenu !", text: `L'unité « ${u.title} » est complète. ${UNITS.indexOf(u) < UNITS.length - 1 ? "La suivante t'attend." : "Tu as terminé tout le parcours !"}` }
          : { seal: u.hz[0], title: "Défi réussi !", text: "Termine les autres étapes de l'unité pour valider le sceau." };
      }
      markActivity();
      return { ok: false, title: "Presque !", text: `Il fallait ${need} bonnes réponses. Revois les mots de l'unité, puis retente le défi.` };
    };
  }
  startLesson({ title, screens, onDone });
}

// --- révision ---
function startReview() {
  let list = dueWords().slice(0, 10), practice = false;
  if (!list.length) { practice = true; list = shuffle(Object.keys(S.words).filter(h => WMAP[h])).slice(0, 8); }
  if (!list.length) return;
  const screens = []; const requeued = new Set();
  const mk = h => wordMCQ(WMAP[h], pick(["hz2f", "f2hz", "au2f", "hz2f", "tone"]), {
    onAnswer: ok => {
      if (!practice || !ok) srsAnswer(h, ok);
      if (!ok && !requeued.has(h)) { requeued.add(h); L.screens.push(mk(h)); }
    }
  });
  list.forEach(h => screens.push(mk(h)));
  startLesson({ title: practice ? "Entraînement libre" : "Révision", screens, onDone: (s, t) => {
    markActivity();
    const left = dueWords().length;
    return { title: practice ? "Entraînement terminé" : "Révision terminée", text: left ? `Encore ${left} mot${left > 1 ? "s" : ""} à revoir : tu peux relancer une révision.` : "Tout est à jour. Les prochains mots reviendront au bon moment." };
  } });
}

// ---------- réglages ----------
function renderSettings() {
  const st = S.settings;
  const vtxt = !("speechSynthesis" in window) ? "Ce navigateur ne propose pas de synthèse vocale : l'application fonctionne, mais sans le son."
    : VOICE ? `Voix chinoise utilisée : ${esc(VOICE.name)}. C'est une voix de synthèse : bonne pour les tons, moins naturelle qu'un locuteur natif.`
    : voiceChecked ? "Aucune voix chinoise n'a été trouvée sur cet appareil. Sur ordinateur, tu peux en ajouter une dans les réglages de langue du système (chinois simplifié). Sur iPhone et Android, elle est généralement déjà installée."
    : "Recherche des voix disponibles…";
  $("#setBody").innerHTML = `
    <div class="set-group"><h3>Pinyin</h3>
      <div class="seg wide" role="group">${[["auto", "Selon le niveau"], ["show", "Toujours"], ["hide", "Masqué"]].map(([k, n]) => `<button type="button" class="${st.pinyin === k ? "on" : ""}" data-pinyin="${k}">${n}</button>`).join("")}</div>
      <p class="small muted">« Selon le niveau » : visible en A1, estompé en A2, masqué en B1 (touche le texte flou pour le révéler). Cela t'habitue peu à peu à lire les caractères.</p></div>
    <div class="set-group"><h3>Couleurs des tons</h3>
      <label class="switch"><input type="checkbox" id="sTones" ${st.tones ? "checked" : ""}> <span>Colorer le pinyin selon le ton</span></label>
      <div class="legend"><span class="t1">1</span><span class="t2">2</span><span class="t3">3</span><span class="t4">4</span><span class="t5">neutre</span></div></div>
    <div class="set-group"><h3>Voix</h3>
      <div class="seg wide" role="group">${[[0.6, "Très lente"], [0.8, "Lente"], [1, "Normale"]].map(([k, n]) => `<button type="button" class="${st.rate === k ? "on" : ""}" data-rate="${k}">${n}</button>`).join("")}</div>
      <p class="small muted">${vtxt}</p>
      <button class="btn ghost sm" data-say="你好，很高兴认识你！">${ICON.sound} Tester la voix</button></div>
    <div class="set-group"><h3>Sources des caractères</h3>
      <p class="small muted">Décompositions et ordre des traits : projet libre Make Me a Hanzi (données sous licence Arphic Public License et LGPL). Les formes anciennes sont des dessins simplifiés, refaits pour l'application d'après les écritures sur os et sur bronze : ce ne sont pas des reproductions exactes. Les étymologies suivent les explications les plus admises ; quand l'origine est discutée, la fiche le dit. Les moyens mnémotechniques, eux, sont des images pour retenir, pas de l'histoire.</p></div>
    <div class="set-group"><h3>Progression</h3>
      <p class="small muted">Ta progression est enregistrée dans ce navigateur, sur cet appareil uniquement. Si tu changes d'appareil ou effaces les données du navigateur, elle repart de zéro.</p>
      <button class="btn danger sm" id="resetBtn">Réinitialiser ma progression</button></div>`;
  $("#setBody").querySelectorAll("[data-pinyin]").forEach(b => b.onclick = () => { S.settings.pinyin = b.dataset.pinyin; save(); renderSettings(); render(); });
  $("#setBody").querySelectorAll("[data-rate]").forEach(b => b.onclick = () => { S.settings.rate = +b.dataset.rate; save(); renderSettings(); speak("你好"); });
  $("#sTones").onchange = e => { S.settings.tones = e.target.checked; save(); render(); };
  const rb = $("#resetBtn"); let armed = false;
  rb.onclick = () => {
    if (!armed) { armed = true; rb.textContent = "Confirmer : tout effacer"; rb.classList.add("armed"); return; }
    const keep = S.settings; S = JSON.parse(JSON.stringify(DEFAULT)); S.settings = keep; save(); closeSettings(); render(); toast("Progression réinitialisée.");
  };
}
function openSettings() { renderSettings(); $("#settings").hidden = false; }
function closeSettings() { $("#settings").hidden = true; }

// ---------- démarrage ----------
function init() {
  migrate(); save();
  $("#gear").innerHTML = ICON.gear;
  $("#lClose").innerHTML = ICON.close;
  $("#setClose").innerHTML = ICON.close;
  $("#charClose").innerHTML = ICON.close;
  $("#charClose").onclick = closeChar;
  $("#charSheet").onclick = e => { if (e.target.id === "charSheet") closeChar(); };
  $("#gear").onclick = openSettings;
  $("#setClose").onclick = closeSettings;
  $("#settings").onclick = e => { if (e.target.id === "settings") closeSettings(); };
  $("#lClose").onclick = closeLesson;
  $("#lNext").onclick = nextScreen;
  $("#brand").onclick = () => go("parcours");
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if (!$("#charSheet").hidden) closeChar(); else if (!$("#settings").hidden) closeSettings(); else if (L) closeLesson(); }
    if (e.key === "Enter" && L && !$("#lNext").disabled && !e.target.closest("button, input")) nextScreen();
  });
  const h = (location.hash || "").slice(1);
  if (TABS.some(t => t.k === h)) VIEW.tab = h;
  render();
}


// ===== Caractères : fiches, formes anciennes, ordre des traits =====
const TYPE_LABEL = { P: "Dessin", I: "Idées associées", S: "Sens + son", D: "Signe abstrait", E: "Emprunté pour le son", F: "Forme simplifiée" };
const TYPE_HELP = {
  P: "Le caractère vient d'un dessin de ce qu'il représente.",
  I: "Plusieurs éléments se combinent pour former une idée.",
  S: "Un élément donne le sens, un autre donne le son. C'est le cas de la majorité des caractères.",
  D: "Un signe simple qui indique une idée (un trait, au-dessus, en dessous).",
  E: "Le caractère a été réutilisé pour un autre mot qui se prononçait pareil.",
  F: "Forme simplifiée en Chine continentale au XXe siècle."
};
const COMP_COLORS = ["c-a", "c-b", "c-c", "c-d"];

function parseChar(c) {
  const raw = CHARS[c]; if (!raw) return null;
  const [p, f, t, comps, ety, mn, anc] = raw.split("|");
  return {
    c, p, f, types: [...t], ety, mn, anc: anc || COMP_ANCIENT[c] || "",
    comps: comps ? comps.split(";").map(x => {
      let [g, m] = x.split("="); const snd = g.endsWith("*") || g.includes("*"); const noAnc = g.includes("~");
      g = g.replace(/[*~]/g, "");
      return { g, m, snd, anc: noAnc ? "" : (COMP_ANCIENT[g] || "") };
    }) : []
  };
}
// Ordre d'apparition des caractères dans le parcours
const CHAR_LIST = []; const CHAR_FIRST = {};
UNITS.forEach(u => chunksOf(u).forEach((ws, ci) => ws.forEach(w => [...w[0]].forEach(c => {
  if (CHARS[c] && !CHAR_FIRST[c]) { CHAR_FIRST[c] = { u: u.id, chunk: ci, word: w[0] }; CHAR_LIST.push(c); }
}))));
const wordsWithChar = c => ALLW.filter(w => w.h.includes(c));

function ancientSVG(key, cls = "anc") {
  const d = ANCIENT[key]; if (!d) return "";
  return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><path d="${d}"/></svg>`;
}
let _sid = 0;
function strokeSVG(c) {
  const d = STROKES[c];
  if (!d) return `<span class="hz-fallback" lang="zh-CN">${c}</span>`;
  const id = "sk" + (++_sid);
  return `<svg class="strokes" viewBox="0 0 1024 1024" data-char="${c}" role="img" aria-label="Ordre des traits de ${c}">
    <defs>${d[0].map((p, i) => `<clipPath id="${id}-${i}"><path d="${p}"/></clipPath>`).join("")}</defs>
    <g transform="scale(1,-1) translate(0,-900)">
      ${d[0].map(p => `<path class="sk-bg" d="${p}"/>`).join("")}
      ${d[1].map((m, i) => `<polyline class="sk-ink" clip-path="url(#${id}-${i})" points="${m}"/>`).join("")}
    </g></svg>`;
}
function animateStrokes(svg) {
  if (!svg || !svg.querySelectorAll) return;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;
  const lines = [...svg.querySelectorAll(".sk-ink")]; let delay = 0;
  lines.forEach(l => {
    let len = 600; try { len = l.getTotalLength() + 120; } catch (e) {}
    l.getAnimations && l.getAnimations().forEach(a => a.cancel());
    l.style.strokeDasharray = len;
    const dur = Math.max(260, len * 0.9);
    try { l.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, delay, fill: "both", easing: "ease-in-out" }); } catch (e) {}
    delay += dur + 120;
  });
}

function compsHTML(ch) {
  if (!ch.comps.length) return "";
  return `<div class="comps">${ch.comps.map((k, i) => `
    <div class="comp ${COMP_COLORS[i % 4]}">
      ${k.anc ? ancientSVG(k.anc, "anc sm") : ""}
      <span class="comp-g" lang="zh-CN">${esc(k.g)}</span>
      <span class="comp-m">${esc(k.m)}</span>
      ${k.snd ? `<span class="comp-snd">donne le son</span>` : ""}
    </div>${i < ch.comps.length - 1 ? '<span class="comp-plus">+</span>' : ""}`).join("")}</div>`;
}
function charCardHTML(c, opt = {}) {
  const ch = parseChar(c); if (!ch) return "";
  const uses = wordsWithChar(c).filter(w => w.h !== c).slice(0, 4);
  return `<article class="ccardx">
    <div class="cx-top">
      ${ch.anc ? `<figure class="evo"><div class="evo-anc">${ancientSVG(ch.anc)}</div><figcaption>forme ancienne</figcaption></figure><span class="evo-arrow" aria-hidden="true">→</span>` : ""}
      <figure class="evo now"><button type="button" class="stroke-box" data-replay aria-label="Revoir l'ordre des traits">${strokeSVG(c)}</button><figcaption>aujourd'hui · touche pour tracer</figcaption></figure>
    </div>
    <div class="cx-id">
      <div>${py(ch.p, "A1", "show")}<span class="cx-f">${esc(ch.f)}</span></div>
      ${sayBtn(c, "Écouter " + c)}
    </div>
    <div class="types">${ch.types.map(t => `<span class="tag" title="${esc(TYPE_HELP[t])}">${TYPE_LABEL[t]}</span>`).join("")}</div>
    ${compsHTML(ch)}
    <section class="cx-sec"><h4>D'où il vient</h4><p>${esc(ch.ety)}</p></section>
    <section class="cx-sec mn"><h4>Pour le retenir</h4><p>${esc(ch.mn)}</p></section>
    ${uses.length && !opt.noUses ? `<section class="cx-sec"><h4>Tu le retrouves dans</h4><div class="uses">${uses.map(w => `<button type="button" class="mini" data-say="${esc(w.tts)}"><span lang="zh-CN">${w.h}</span>${py(w.p, "A1", "show")}<span class="small muted">${esc(w.f)}</span></button>`).join("")}</div></section>` : ""}
  </article>`;
}
function bindCard(root) {
  root.querySelectorAll("[data-replay]").forEach(b => b.onclick = () => { animateStrokes(b.querySelector(".strokes")); speak(b.querySelector(".strokes")?.dataset.char || ""); });
  const svg = root.querySelector(".strokes"); if (svg) setTimeout(() => animateStrokes(svg), 250);
}

// Écrans de leçon
function scrWordIntro(w, lvl, n, tot) {
  return (el, api) => {
    const chars = [...w.h].filter(c => CHARS[c]);
    const parts = chars.length > 1 ? `<div class="breakdown"><p class="q-kicker">Mot à mot</p><div class="bd-row">${chars.map((c, i) => { const ch = parseChar(c); return `<span class="bd"><span lang="zh-CN">${c}</span><span class="small">${esc(ch.f.split(/[;,(]/)[0])}</span></span>${i < chars.length - 1 ? '<span class="comp-plus">+</span>' : ""}`; }).join("")}</div></div>` : "";
    el.innerHTML = `<p class="q-kicker">Nouveau mot · ${n} / ${tot}</p>
      <div class="flash open">
        <div class="fl-front"><span class="fl-hz" lang="zh-CN">${w.h}</span>${py(w.p, lvl)}</div>
        <span class="fl-f">${esc(w.f)}</span>
      </div>
      <div class="center">${sayBtn(w.tts, "Écouter le mot")}</div>${parts}`;
    setTimeout(() => speak(w.tts), 200);
  };
}
function scrCharIntro(c, ctx) {
  return el => {
    el.innerHTML = `<p class="q-kicker">${ctx ? `Le caractère ${c} de ${ctx}` : "Nouveau caractère"}</p>${charCardHTML(c, { noUses: true })}`;
    bindCard(el);
  };
}
// Quiz « assemble les pièces »
function buildMCQ(c, pool) {
  const ch = parseChar(c);
  const others = shuffle(pool.filter(x => x !== c)).concat(shuffle(CHAR_LIST.filter(x => x !== c && !pool.includes(x)))).slice(0, 3);
  return scrMCQ({
    kicker: "Quel caractère est formé de ces pièces ?",
    prompt: `<div class="comps quiz">${ch.comps.map((k, i) => `<div class="comp ${COMP_COLORS[i % 4]}"><span class="comp-g" lang="zh-CN">${esc(k.g)}</span><span class="comp-m">${esc(k.m)}</span></div>${i < ch.comps.length - 1 ? '<span class="comp-plus">+</span>' : ""}`).join("")}</div>`,
    options: shuffle([c, ...others]).map(x => ({ html: `<span lang="zh-CN" class="o-hz">${x}</span><span class="small muted">${esc(parseChar(x).f.split(/[;(]/)[0])}</span>`, ok: x === c, say: x })),
    answer: `<span lang="zh-CN">${c}</span> ${py(ch.p, "A1", "show")} · ${esc(ch.f)}`
  });
}
const buildable = c => { const ch = parseChar(c); return ch && ch.comps.length >= 2 && ch.comps.every(k => k.g.length <= 2); };

// Fiche en surimpression
function openChar(c) {
  const m = $("#charSheet"); if (!m) return;
  $("#charBody").innerHTML = charCardHTML(c);
  m.hidden = false; bindCard($("#charBody"));
  S.chars[c] = S.chars[c] || Date.now(); save();
}
function closeChar() { const m = $("#charSheet"); if (m) m.hidden = true; }

// Vue « Caractères » de l'onglet Mots
function viewChars() {
  const n = Object.keys(S.chars).length;
  return `<p class="muted small">${n} caractère${n > 1 ? "s" : ""} découvert${n > 1 ? "s" : ""} sur ${CHAR_LIST.length}. Touche un caractère pour voir sa fiche : forme ancienne, pièces, histoire et ordre des traits.</p>
  ${LEVELS.map(L => `<h3 class="sec-h"><span class="lvl-tag">${L.id}</span> ${L.name}</h3>
    <div class="cgrid2">${CHAR_LIST.filter(c => unitById(CHAR_FIRST[c].u).lvl === L.id).map(c => {
      const ch = parseChar(c), seen = !!S.chars[c];
      return `<button type="button" class="ctile${seen ? " seen" : ""}" data-char="${c}"><span lang="zh-CN">${c}</span><span class="ct-p">${colorize(ch.p)}</span></button>`;
    }).join("")}</div>`).join("")}`;
}

init();
</script>
