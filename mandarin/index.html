// --- étapes ---
function startStep(u, k) {
  const step = STEPS.find(s => s.k === k);
  const title = `${u.hz} · ${step.n}`;
  const done = (extra) => { S.done[u.id + ":" + k] = true; markActivity(); save(); return extra; };
  const sealIfComplete = r => { if (unitDone(u) && k !== "defi") r.text = (r.text || "") + " Unité complète : sceau obtenu !"; return r; };
  let screens = [], onDone;

  if (k === "sons") {
    const p = u.pron;
    screens.push(scrInfo(`<p class="q-kicker">Prononciation</p><h2 class="l-h">${esc(p.title)}</h2><p>${p.text}</p>
      <div class="pron-ex">${p.ex.map(e => `<button class="pex" data-say="${esc(e[3] || e[0])}"><span class="pex-hz" lang="zh-CN">${e[0]}</span>${py(e[1], "A1", "show")}<span class="small muted">${esc(e[2])}</span></button>`).join("")}</div>
      <p class="muted small">Touche chaque exemple, écoute, puis répète à voix haute. C'est en le disant que ça rentre.</p>`));
    shuffle(p.ex).slice(0, 2).forEach(e => {
      const others = shuffle(p.ex.filter(x => x !== e).map(x => x[1]));
      const opts = shuffle([e[1], ...tonedVariants(e[1], 1), ...others].filter((v, i, a) => a.indexOf(v) === i).slice(0, 4));
      if (!opts.includes(e[1])) opts[0] = e[1];
      screens.push(scrMCQ({ kicker: "Écoute : quel pinyin entends-tu ?", prompt: `<button class="big-say" data-say="${esc(e[3] || e[0])}" aria-label="Réécouter">${ICON.sound}</button>`,
        options: shuffle(opts).map(o => ({ html: py(o, "A1", "show"), ok: o === e[1] })), auto: e[3] || e[0], answer: `<span lang="zh-CN">${e[0]}</span> ${py(e[1], "A1", "show")}` }));
    });
    onDone = () => sealIfComplete(done({ title: "Oreille affûtée", text: "Pense à répéter les exemples à voix haute, même seul." }));
  }

  if (k === "mots") {
    const ws = ALLW.filter(w => w.u === u.id);
    ws.forEach((w, i) => screens.push(scrFlash(w, u.lvl, i + 1, ws.length)));
    shuffle(ws).slice(0, 4).forEach((w, i) => screens.push(wordMCQ(w, ["hz2f", "au2f", "f2hz", "hz2f"][i])));
    onDone = () => { ws.forEach(w => srsAdd(w.h)); return sealIfComplete(done({ title: `${ws.length} mots ajoutés`, text: "Ils reviendront dans tes révisions demain, puis de plus en plus espacés." })); };
  }

  if (k === "gram") {
    const g = u.gram;
    screens.push(scrInfo(`<p class="q-kicker">Grammaire</p><h2 class="l-h">${esc(g.title)}</h2>${g.patterns.map(patternHTML).join("")}<p>${g.text}</p>${exList(g.ex, u.lvl)}`));
    g.order.forEach(o => screens.push(scrOrder(o, u.lvl)));
    onDone = () => sealIfComplete(done({ title: "Structure en poche", text: "Essaie de fabriquer une phrase à toi avec cette structure et envoie-la à un ami." }));
  }

  if (k === "dlg") {
    screens.push(scrDialogue(u));
    const q = u.dlg.q; const right = q.opts[0];
    screens.push(scrMCQ({ kicker: "As-tu compris ?", prompt: `<div class="qp-f">${esc(q.q)}</div>`, options: shuffle(q.opts).map(o => ({ html: esc(o), ok: o === right })), answer: esc(right) }));
    screens.push(el => { el.innerHTML = `<p class="q-kicker">À toi de jouer</p><h2 class="l-h">Prends la place de Tom</h2><p class="muted small">Réécoute chaque réplique de Tom et répète-la à voix haute, en imitant la mélodie.</p>${dialogueHTML(u.dlg, u.lvl)}`; bindDialogue(el, u.dlg); el.querySelectorAll(".line:not(.me)").forEach(x => x.classList.add("dim")); });
    onDone = () => sealIfComplete(done({ title: "Scène jouée", text: "Ce dialogue utilise ce que tu viens d'apprendre : relis-le dans quelques jours, il te paraîtra facile." }));
  }

  if (k === "cult") {
    const c = u.cult;
    screens.push(scrInfo(`<p class="q-kicker">Culture</p><h2 class="l-h">${esc(c.title)}</h2>
      <div class="cult-word"><button class="pex" data-say="${esc(c.hz)}"><span class="pex-hz" lang="zh-CN">${c.hz}</span>${py(c.py, "A1", "show")}<span class="small muted">${esc(c.fr)}</span></button></div>
      <div class="prose">${c.text}</div><aside class="fact"><b>Le saviez-vous ?</b> ${c.fact}</aside>`));
    onDone = () => sealIfComplete(done({ title: "Bonne lecture", text: "Parles-en à tes amis : ils auront sûrement leur propre version de l'histoire." }));
  }

  if (k === "defi") {
    const ws = shuffle(ALLW.filter(w => w.u === u.id));
    ["hz2f", "f2hz", "au2f", "hz2f", "f2hz"].forEach((t, i) => screens.push(wordMCQ(ws[i % ws.length], t, { onAnswer: ok => srsAnswer(ws[i % ws.length].h, ok) })));
    const tw = ws.find(w => w.p.replace(/[^a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, "").length > 1 && tonedVariants(w.p, 3).length === 3) || ws[5];
    screens.push(wordMCQ(tw, "tone"));
    u.gram.order.forEach(o => screens.push(scrOrder(o, u.lvl)));
    screens.unshift(scrInfo(`<p class="q-kicker">Défi de l'unité</p><h2 class="l-h">Gagne le sceau <span lang="zh-CN">${u.hz[0]}</span></h2><p>${screens.length} questions sur les mots, les tons et la grammaire de l'unité. Il faut <b>${screens.length - 2} bonnes réponses</b> pour obtenir le sceau.</p><p class="muted small">Pas de stress : tu peux recommencer autant de fois que tu veux.</p>`));
    const need = screens.length - 3;
    onDone = (score, total) => {
      if (score >= need) {
        S.done[u.id + ":defi"] = true; markActivity(); save();
        return unitDone(u) ? { seal: u.hz[0], title: "Sceau obtenu !", text: `L'unité « ${u.title} » est complète. ${UNITS.indexOf(u) < UNITS.length - 1 ? "La suivante t'attend." : "Tu as terminé tout le parcours !"}` }
          : { seal: u.hz[0], title: "Défi réussi !", text: "Termine les autres étapes de l'unité pour valider le sceau." };
      }
      markActivity();
      return { ok: false, title: "Presque !", text: `Il fallait ${need} bonnes réponses. Revois les mots de l'unité, puis retente le défi.` };
    };
  }
  startLesson({ title, screens, onDone });
}

// --- révision ---
function startReview() {
  let list = dueWords().slice(0, 10), practice = false;
  if (!list.length) { practice = true; list = shuffle(Object.keys(S.words).filter(h => WMAP[h])).slice(0, 8); }
  if (!list.length) return;
  const screens = []; const requeued = new Set();
  const mk = h => wordMCQ(WMAP[h], pick(["hz2f", "f2hz", "au2f", "hz2f", "tone"]), {
    onAnswer: ok => {
      if (!practice || !ok) srsAnswer(h, ok);
      if (!ok && !requeued.has(h)) { requeued.add(h); L.screens.push(mk(h)); }
    }
  });
  list.forEach(h => screens.push(mk(h)));
  startLesson({ title: practice ? "Entraînement libre" : "Révision", screens, onDone: (s, t) => {
    markActivity();
    const left = dueWords().length;
    return { title: practice ? "Entraînement terminé" : "Révision terminée", text: left ? `Encore ${left} mot${left > 1 ? "s" : ""} à revoir : tu peux relancer une révision.` : "Tout est à jour. Les prochains mots reviendront au bon moment." };
  } });
}

// ---------- réglages ----------
function renderSettings() {
  const st = S.settings;
  const vtxt = !("speechSynthesis" in window) ? "Ce navigateur ne propose pas de synthèse vocale : l'application fonctionne, mais sans le son."
    : VOICE ? `Voix chinoise utilisée : ${esc(VOICE.name)}. C'est une voix de synthèse : bonne pour les tons, moins naturelle qu'un locuteur natif.`
    : voiceChecked ? "Aucune voix chinoise n'a été trouvée sur cet appareil. Sur ordinateur, tu peux en ajouter une dans les réglages de langue du système (chinois simplifié). Sur iPhone et Android, elle est généralement déjà installée."
    : "Recherche des voix disponibles…";
  $("#setBody").innerHTML = `
    <div class="set-group"><h3>Pinyin</h3>
      <div class="seg wide" role="group">${[["auto", "Selon le niveau"], ["show", "Toujours"], ["hide", "Masqué"]].map(([k, n]) => `<button type="button" class="${st.pinyin === k ? "on" : ""}" data-pinyin="${k}">${n}</button>`).join("")}</div>
      <p class="small muted">« Selon le niveau » : visible en A1, estompé en A2, masqué en B1 (touche le texte flou pour le révéler). Cela t'habitue peu à peu à lire les caractères.</p></div>
    <div class="set-group"><h3>Couleurs des tons</h3>
      <label class="switch"><input type="checkbox" id="sTones" ${st.tones ? "checked" : ""}> <span>Colorer le pinyin selon le ton</span></label>
      <div class="legend"><span class="t1">1</span><span class="t2">2</span><span class="t3">3</span><span class="t4">4</span><span class="t5">neutre</span></div></div>
    <div class="set-group"><h3>Voix</h3>
      <div class="seg wide" role="group">${[[0.6, "Très lente"], [0.8, "Lente"], [1, "Normale"]].map(([k, n]) => `<button type="button" class="${st.rate === k ? "on" : ""}" data-rate="${k}">${n}</button>`).join("")}</div>
      <p class="small muted">${vtxt}</p>
      <button class="btn ghost sm" data-say="你好，很高兴认识你！">${ICON.sound} Tester la voix</button></div>
    <div class="set-group"><h3>Progression</h3>
      <p class="small muted">Ta progression est enregistrée dans ce navigateur, sur cet appareil uniquement. Si tu changes d'appareil ou effaces les données du navigateur, elle repart de zéro.</p>
      <button class="btn danger sm" id="resetBtn">Réinitialiser ma progression</button></div>`;
  $("#setBody").querySelectorAll("[data-pinyin]").forEach(b => b.onclick = () => { S.settings.pinyin = b.dataset.pinyin; save(); renderSettings(); render(); });
  $("#setBody").querySelectorAll("[data-rate]").forEach(b => b.onclick = () => { S.settings.rate = +b.dataset.rate; save(); renderSettings(); speak("你好"); });
  $("#sTones").onchange = e => { S.settings.tones = e.target.checked; save(); render(); };
  const rb = $("#resetBtn"); let armed = false;
  rb.onclick = () => {
    if (!armed) { armed = true; rb.textContent = "Confirmer : tout effacer"; rb.classList.add("armed"); return; }
    const keep = S.settings; S = JSON.parse(JSON.stringify(DEFAULT)); S.settings = keep; save(); closeSettings(); render(); toast("Progression réinitialisée.");
  };
}
function openSettings() { renderSettings(); $("#settings").hidden = false; }
function closeSettings() { $("#settings").hidden = true; }

// ---------- démarrage ----------
function init() {
  $("#gear").innerHTML = ICON.gear;
  $("#lClose").innerHTML = ICON.close;
  $("#setClose").innerHTML = ICON.close;
  $("#gear").onclick = openSettings;
  $("#setClose").onclick = closeSettings;
  $("#settings").onclick = e => { if (e.target.id === "settings") closeSettings(); };
  $("#lClose").onclick = closeLesson;
  $("#lNext").onclick = nextScreen;
  $("#brand").onclick = () => go("parcours");
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if (!$("#settings").hidden) closeSettings(); else if (L) closeLesson(); }
    if (e.key === "Enter" && L && !$("#lNext").disabled && !e.target.closest("button, input")) nextScreen();
  });
  const h = (location.hash || "").slice(1);
  if (TABS.some(t => t.k === h)) VIEW.tab = h;
  render();
}
init();
</script>
