/* ═══════════════════════════════════════════════════════════════════
   LE BRIEF — ce que l'app propose, et pourquoi.
   Règle du jeu : aucune suggestion générique. Chacune cite un chiffre
   que l'app a vraiment enregistré (une série, un écart, une heure) —
   sinon ce n'est qu'un conseil de plus, et un conseil de plus ne fait
   rien faire à personne.
   Deuxième règle : pour ce qui dort, proposer la sortie autant que la
   reprise. Une case qu'on ne coche jamais vide la fraction de son
   sens, et un registre qui culpabilise finit par se fermer.
   ═══════════════════════════════════════════════════════════════════ */
function lastDone(id){ const d=stOf(id).days; return d.length?d[d.length-1]:null; }
function gapDays(id){
  const l=lastDone(id); if(!l) return 9999;
  return Math.round((Date.parse(today()+"T12:00:00")-Date.parse(l+"T12:00:00"))/864e5);
}
function typicalMin(id){
  const v=Object.values(stOf(id).min||{}).filter(x=>x>0).sort((a,b)=>a-b);
  return v.length?Math.round(v[Math.floor(v.length/2)]):0;    // la médiane, pas la moyenne : une grosse séance ne doit pas fixer la norme
}
function minsUntil(hhmm){
  const p=String(hhmm).split(":"), n=new Date();
  return (+p[0]*60 + +p[1]) - (n.getHours()*60+n.getMinutes());
}
function fmtIn(m){ return m<0 ? "il y a "+fmtMin(-m) : m<60 ? "dans "+m+" min" : "dans "+fmtMin(m); }
function agDoneR(id){ agDone(id); closeOv(); render(); }
function agPushTodayR(id){ agPushToday(id); closeOv(); render(); toast("Reporté à aujourd'hui"); }

function briefAll(){
  const t=today(), B=agBuckets(), H=new Date().getHours(), out=[], pris={};
  const add=o=>out.push(o);

  /* semaine d'échéance : la prochaine tâche du programme passe devant tout */
  { const E=ech(), P=echPlan(), dn=echDoneList(), i=dn.indexOf(false);
    if(E&&P.length&&i>=0){ const x=P[i], left=P.filter((_,k)=>!dn[k]).length;
      add({k:"ech", score:120, e:E.e, t:E.nom+" J-"+dDiff(t,E.date)+" : "+x[1],
        w:x[0]+" min. "+(left>1?"Encore "+(left-1)+" autre"+(left>2?"s":"")+" tâche"+(left>2?"s":"")+" aujourd'hui. ":"Dernière tâche du jour. ")+"Jusqu'à l'examen, l'IELTS passe avant tout le reste.",
        a:(x[2]?[{l:"↗ Commencer", c:"go", f:"echGo('"+x[2]+"')"}]:[]).concat([{l:"✓ Fait", c:"ok", f:"echTog("+i+");closeOv()"}])}); } }

  /* un trou entre deux événements : le meilleur moment pour un focus */
  { const nx=calNext(), cn=calNow()[0];
    if(!cn&&nx){ const m=Math.round((nx.s-Date.now())/60000);
      if(m>=30&&m<=240){ const c=catsActives().find(c=>!catDone(c.id)), p=c&&catPicksSafe(c.id)[0];
        add({k:"trou", score:95, e:"⏳", t:fmtMin(m)+" avant "+nx.t,
          w:(p?"Le créneau parfait pour "+p.name+". ":"")+"Un focus maintenant, et ce trou devient du temps gagné au lieu de temps de scroll.",
          a:[{l:"🎯 Focus", c:"go", f:"closeOv();"+(p?"fSel.id='"+p.id+"';":"")+"openFocus()"}]}); } } }

  if(S.run){
    const mins=Math.round((Date.now()-S.run.t0)/60000);
    if(mins>=120){
      const a=S.apps.find(x=>x.id===S.run.id);
      add({k:"chrono", score:200, e:"⏱", t:"Le chrono tourne depuis "+fmtMin(mins),
        w:"Sur "+(a?a.name:"une app")+". Tu l'as sans doute oublié : arrête-le, sinon la séance enregistrée n'aura plus rien à voir avec ce que tu as fait.",
        a:[{l:"✓ Arrêter maintenant", c:"ok", f:"stopTimer();closeOv();render()"}]});
    }
  }

  B.now.filter(x=>x.t).forEach(it=>{
    const m=minsUntil(it.t);
    if(m>240||m<-90) return;
    add({k:"rdv:"+it.id, score:150-Math.max(0,m)/8, e:"📍", t:it.txt,
      w:(m>=0 ? "À "+it.t+" — "+fmtIn(m)+"." : "C'était à "+it.t+".")+
        (it.note?" Tu as noté de quoi préparer." : ""),
      a:[{l:"Ouvrir", c:"", f:"agEdit('"+it.id+"')"},
         {l:"✓ C'est fait", c:"ok", f:"agDoneR('"+it.id+"')"}]});
  });

  /* Les dossiers qui manquent : c'est ça, la journée. Le choix de l'app tient
     compte de la rotation, donc le brief ne reproche jamais une série cassée
     quand c'est la règle elle-même qui demandait de tourner.
     Trois au plus : la liste du dessous montre déjà les cinq. */
  const ACT=catsActives();
  ACT.filter(c=>!catDone(c.id))
    .sort((a,b)=>catStreak(b.id)-catStreak(a.id)).slice(0,3)
    .forEach(c=>{
      const picks=catPicksSafe(c.id);
      if(!picks.length) return;
      const p=picks[0], str=catStreak(c.id), typ=typicalMin(p.id);
      const repos=appsOfCat(c.id).filter(a=>!doneToday(a.id)&&atRest(a.id));
      pris[p.id]=1;
      add({k:"cat:"+c.id, score:75+Math.min(str,20), e:c.e, t:c.nom+" — "+p.emoji+" "+p.name,
        w:(str>0?str+" jours d'affilée sur ce dossier. ":"")+
          (repos.length?repos.map(a=>a.name).join(" et ")+(repos.length>1?" se reposent":" se repose")+" aujourd'hui. ":"")+
          (picks.length>1?picks.length+" au choix. ":"")+
          (typ?"Compte "+fmtMin(typ)+".":"Lance le chrono, il comptera."),
        a:[{l:"▶ "+p.name, c:"go", f:"startTimer('"+p.id+"');closeOv()"},

    });

      a:[{l:"＋ "+cands[0].n, c:"go", f:"addQuick('"+escJs(cands[0].n)+"','"+cands[0].e+"','"+BASE+cands[0].u+"')"},
         {l:"Toutes mes apps", c:"", f:"closeOv();openLauncher()"}]});

  const jamais=S.apps.filter(a=>catOf(a)&&a.spec!=="lecture"&&aSortir(a));

  const dem=agAll().filter(x=>!x.done&&x.d===dayShift(t,1)).sort((a,b)=>(a.t||"99").localeCompare(b.t||"99"));
  if(dem.length>=2){
    add({k:"demain", score:28, e:"📅", t:"Demain : "+dem.length+" choses"+(dem[0].t?", dès "+dem[0].t:""),
      w:"La première est « "+dem[0].txt+" ». Si quelque chose doit être prêt avant, c'est ce soir que ça se prépare.",
      a:[{l:"Voir l'agenda", c:"", f:"closeOv();agSheet()"}]});
  }

  const bouclee = ACT.length ? !ACT.some(c=>!catDone(c.id))
                             : (S.apps.length && !S.apps.some(a=>!doneToday(a.id)));
  if(bouclee){
    const tot=S.apps.reduce((s,a)=>s+todayMin(a.id),0);
    const n=ACT.length||S.apps.length;
    add({k:"boucle", score:58, e:"🎉", t:"Journée bouclée — "+n+"/"+n+(ACT.length?" dossiers":""),
      w:(tot?fmtMin(tot)+" de pratique aujourd'hui. ":"")+"Tu peux fermer l'app sans arrière-pensée.",
      a: jHas(t)?[]:[{l:"Écrire ma journée", c:"go", f:"closeOv();openJournal()"}]});
  }

  return out.sort((a,b)=>b.score-a.score);
}

function weekStats(){

    out.push({d,min,any});
  }

}
function weekMin(offset){
  let s=0;
  for(let k=0;k<7;k++){ const d=dayShift(today(),-(k+offset));
    S.apps.forEach(a=>s+=Math.round(stOf(a.id).min[d]||0)); }
  return s;
}

/* ═══════════════════════════════════════════════════════════════════
   L'AGENDA — ce qui est prévu, ce qui traîne.
   Remplace la note partagée : une ligne tapée au kilomètre, la date et
   l'heure sont comprises toutes seules. « 5 oct 20h psy campus » donne
   une tâche au 5 octobre à 20:00 ; « postuler Dior » tombe sans date.
   Le pari : tant que noter coûte plus cher qu'une ligne dans Notes,
   l'agenda perd. Donc un seul champ, jamais de formulaire pour capturer.
   ═══════════════════════════════════════════════════════════════════ */
function agAll(){ if(!Array.isArray(S.agenda)) S.agenda=[]; return S.agenda; }
function agTombs(){ if(!S.tomb) S.tomb={}; return S.tomb; }
function agGet(id){ return agAll().find(x=>x.id===id); }
function agId(){ return "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function pad2(n){ return String(n).padStart(2,"0"); }
function agTouch(it){ it.mod=Date.now(); }

/* ---- comprendre ce qui est tapé ---- */
const AG_MOIS={janvier:1,janv:1,jan:1,fevrier:2,fevr:2,fev:2,mars:3,avril:4,avr:4,mai:5,juin:6,
  juillet:7,juil:7,aout:8,septembre:9,sept:9,sep:9,octobre:10,oct:10,novembre:11,nov:11,decembre:12,dec:12};
/* abréviations volontairement limitées : « jeu », « mer », « mar » sont des mots
   français courants, on ne veut pas dater « finir le jeu » un jeudi. */
const AG_JOURS={dimanche:0,lundi:1,mardi:2,mercredi:3,jeudi:4,vendredi:5,samedi:6,lun:1,ven:5,sam:6,dim:0};
const AG_MRE=Object.keys(AG_MOIS).sort((a,b)=>b.length-a.length).join("|");
const AG_JRE=Object.keys(AG_JOURS).sort((a,b)=>b.length-a.length).join("|");

/* accents retirés SANS changer la longueur : les positions trouvées sur cette
   version « à plat » servent à découper la chaîne d'origine. */
function agFlat(s){
  return s.toLowerCase()
    .replace(/[àâä]/g,"a").replace(/[éèêë]/g,"e").replace(/[îï]/g,"i")
    .replace(/[ôö]/g,"o").replace(/[ûüù]/g,"u").replace(/ç/g,"c").replace(/[’‘]/g,"'");
}
function agMake(day,mo,y){
  const now=new Date(), Y=y||now.getFullYear();
  const iso=Y+"-"+pad2(mo)+"-"+pad2(day);
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d)||d.getDate()!==day||d.getMonth()+1!==mo) return null;   // 31 février, non.
  /* pas d'année écrite : une date déjà bien passée parle de l'an prochain */
  if(!y && iso<dayShift(today(),-45)) return (Y+1)+"-"+pad2(mo)+"-"+pad2(day);
  return iso;
}
function agParse(raw){
  const src=String(raw||"").trim(), f=agFlat(src);
  const cuts=[]; let d=null,t=null,t2=null,star=0;
  const free=(i,j)=>!cuts.some(c=>i<c[1]&&j>c[0]);
  function scan(re,fn){
    re.lastIndex=0; let m;
    while((m=re.exec(f))!==null){
      const i=m.index, j=i+m[0].length;
      if(m[0].length===0) break;
      if(free(i,j) && fn(m)!==false) cuts.push([i,j]);
      if(!re.global) break;
    }
  }
  scan(/(^\s*!+\s*)|(\s*!+\s*$)/g, ()=>{ star=1; return true; });
  /* créneau : « 4:30-6:00 », « 16h30 à 18h », « 20h-22h » */
  scan(/\b(\d{1,2})\s*[h:]\s*(\d{2})?\s*(?:-|–|—|a\b|jusqu'a\b)\s*(\d{1,2})\s*[h:]?\s*(\d{2})?\b/g, m=>{
    const h1=+m[1], n1=+(m[2]||0), h2=+m[3], n2=+(m[4]||0);
    if(h1>23||h2>23||n1>59||n2>59) return false;
    t=pad2(h1)+":"+pad2(n1); t2=pad2(h2)+":"+pad2(n2); return true;
  });
  /* heure simple : « 20h », « 20h30 », « 9:15 » */
  scan(/\b(\d{1,2})\s*h\s*(\d{2})?\b|\b(\d{1,2}):(\d{2})\b/g, m=>{
    if(t) return false;
    const h=+(m[1]!=null?m[1]:m[3]), n=+((m[1]!=null?m[2]:m[4])||0);
    if(h>23||n>59) return false;
    t=pad2(h)+":"+pad2(n); return true;
  });
  scan(new RegExp("\\b(\\d{1,2})\\s*(?:er)?\\s*("+AG_MRE+")\\.?\\b","g"), m=>{
    if(d) return false;
    const r=agMake(+m[1],AG_MOIS[m[2]]); if(!r) return false; d=r; return true;
  });
  scan(/\b(\d{1,2})[/.](\d{1,2})(?:[/.](\d{2,4}))?\b/g, m=>{
    if(d) return false;
    const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):null;
    const r=agMake(+m[1],+m[2],y); if(!r) return false; d=r; return true;
  });
  scan(/\b(aujourd'hui|auj|ce soir|ce matin|cet aprem|apres-demain|apres demain|demain)\b/g, m=>{
    if(d) return false;
    const w=m[1];
    d = /apres/.test(w) ? dayShift(today(),2) : /demain/.test(w) ? dayShift(today(),1) : today();
    return true;
  });
  scan(new RegExp("\\b("+AG_JRE+")\\.?(\\s+prochain)?\\b","g"), m=>{
    if(d) return false;
    const want=AG_JOURS[m[1]], cur=new Date(today()+"T12:00:00").getDay();
    let add=(want-cur+7)%7;
    if(m[2]&&add===0) add=7;            // « lundi prochain », un lundi : la semaine d'après
    d=dayShift(today(),add); return true;
  });
  let out="", last=0;
  cuts.sort((a,b)=>a[0]-b[0]).forEach(c=>{ if(c[0]>=last) out+=src.slice(last,c[0]); last=Math.max(last,c[1]); });
  out+=src.slice(last);
  out=out.replace(/\s{2,}/g," ").replace(/^[\s,;:·\-–—]+|[\s,;:·\-–—]+$/g,"").trim();
  return {txt:out||src, d, t, t2, star};
}

/* ---- le modèle ---- */
function agAdd(raw){
  const p=agParse(raw); if(!p.txt) return null;
  const it={id:agId(), txt:p.txt, d:p.d, t:p.t, t2:p.t2, note:"", star:p.star, done:null,
            c:Date.now(), mod:Date.now()};
  agAll().push(it); save(); return it;
}
function agDel(id){
  const it=agGet(id); if(!it) return;
  if(!confirm("Supprimer « "+it.txt+" » ?")) return;
  S.agenda=agAll().filter(x=>x.id!==id);
  agTombs()[id]=Date.now();            // la pierre tombale empêche l'autre appareil de la ressusciter
  save(); closeOv(); render();
}
function agDone(id){
  const it=agGet(id); if(!it) return;
  it.done=it.done?null:today(); agTouch(it); save();
}
function agStar(id){ const it=agGet(id); if(!it) return; it.star=it.star?0:1; agTouch(it); save(); closeOv(); render(); }
/* En retard → on tranche : urgent (aujourd'hui, en tête) ou pas urgent (plus de date, plus d'alerte). */
function agUrgent(id){ const it=agGet(id); if(!it) return; it.d=today(); it.star=1; agTouch(it); save(); }
function agLater(id){ const it=agGet(id); if(!it) return; it.d=null; it.t=null; it.t2=null; agTouch(it); save(); }
function agPushToday(id){ const it=agGet(id); if(!it) return; it.d=today(); agTouch(it); save(); }
function agSort(l){ return l.slice().sort((a,b)=>
  (b.star||0)-(a.star||0) || (a.d||"9999").localeCompare(b.d||"9999") ||
  (a.t||"99:99").localeCompare(b.t||"99:99") || (a.c||0)-(b.c||0)); }
function agBuckets(){
  const t=today(), open=agAll().filter(x=>!x.done);
  return {
    late : agSort(open.filter(x=>x.d&&x.d<t)),
    now  : agSort(open.filter(x=>x.d===t)),
    soon : agSort(open.filter(x=>x.d&&x.d>t)),
    inbox: agSort(open.filter(x=>!x.d)),
    done : agAll().filter(x=>x.done).sort((a,b)=>(b.mod||0)-(a.mod||0))
  };
}
function agDL(d,long){
  const t=today();
  if(d===t) return "aujourd'hui";
  if(d===dayShift(t,1)) return "demain";
  if(d===dayShift(t,-1)) return "hier";
  const dt=new Date(d+"T12:00:00");
  const diff=Math.round((Date.parse(d+"T12:00:00")-Date.parse(t+"T12:00:00"))/864e5);
  if(diff>1&&diff<7) return dt.toLocaleDateString("fr-FR",{weekday:"long"});
  return dt.toLocaleDateString("fr-FR", long?{weekday:"long",day:"numeric",month:"long"}:{weekday:"short",day:"numeric",month:"short"});
}

/* ---- une ligne ---- */
function agRowHtml(it,withDate){
  const t=today(), late=!it.done&&it.d&&it.d<t;
  const bits=[];
  if(it.t) bits.push(`<span class="agt">${it.t}${it.t2?" → "+it.t2:""}</span>`);
  if(withDate&&it.d&&it.d!==t) bits.push(`<span class="agd ${late?"late":""}">${agDL(it.d)}</span>`);
  if(late&&!withDate) bits.push(`<span class="agd late">${agDL(it.d)}</span>`);
  if(it.note) bits.push(`<span>📝</span>`);
  return `<div class="agrow ${it.done?"ok":""}" data-id="${it.id}">
    <div class="agchk ${it.done?"on":""}" data-act="chk" role="checkbox" aria-checked="${!!it.done}"></div>
    <div class="agmain" data-act="open">
      <b>${it.star?'<span class="agst">★</span> ':""}${esc(it.txt)}</b>
      ${bits.length?`<i>${bits.join("")}</i>`:""}
    </div>
    ${late?`<div class="agtri"><button class="agurg" data-act="urg">🔥 Urgent</button><button class="agpush" data-act="later">Pas urgent</button></div>`:""}
  </div>`;
}

/* ---- la carte d'accueil ---- */
function agCardHtml(){
  const B=agBuckets(), n=B.late.length+B.now.length+B.soon.length+B.inbox.length;
  /* Le gros de ce qu'il note n'a pas de date. Si la carte ne montrait que le
     daté, la pile en attente deviendrait invisible — donc on complète avec
     elle (les étoilées d'abord, agSort s'en charge). */
  let shown=[...B.late.slice(0,3), ...B.now];
  if(shown.length<4) shown=shown.concat(B.inbox.slice(0,4-shown.length));
  if(shown.length>5) shown=shown.slice(0,5);
  let body;
  if(shown.length){ body=shown.map(it=>agRowHtml(it,false)).join(""); }
  else{
    const nxt=B.soon[0];
    body=`<div class="agempty">${ nxt
      ? `Rien aujourd'hui. Ensuite : <b>${esc(nxt.txt)}</b> — ${agDL(nxt.d)}${nxt.t?" "+nxt.t:""}.`
      : `Rien de prévu. Note ce que tu as en tête ↓` }</div>`;
  }
  const sub=[];
  if(B.now.length) sub.push(B.now.length+" aujourd'hui");
  if(B.soon.length) sub.push(B.soon.length+" à venir");
  if(B.inbox.length) sub.push(B.inbox.length+" sans date");
  return `<div class="agcard ${B.late.length?"urge":""}" id="agCard">
    <div class="aghead">
      <div class="ic">🗓</div>
      <div><b>L'agenda</b><small>${sub.join(" · ")||"rien en attente"}</small></div>
      ${B.late.length?`<span class="agbad">${B.late.length} en retard</span>`:""}
    </div>
    ${rvDue()?`<button class="rvnudge" onclick="rvStart()">🧹 Trier tes ${B.inbox.length} tâches sans date · 1 min</button>`:""}
    <div id="agList">${body}</div>
    ${n?`<button class="agmore" data-act="all">⋯ tout voir (${n})</button>`:""}
    <form class="agform" id="agForm"><input id="agIn" placeholder="5 oct 20h psy · demain 9h BCG · postuler Dior"
      autocomplete="off" autocorrect="off" enterkeyhint="done" aria-label="Noter quelque chose"><button type="submit" aria-label="Ajouter">＋</button></form>
    <div class="aghint" id="agHint"></div>
  </div>`;
}

/* ---- saisie ---- */
function agPreview(sfx){
  sfx=sfx||"";
  const el=document.getElementById("agIn"+sfx), h=document.getElementById("agHint"+sfx);
  if(!el||!h) return;
  const v=el.value.trim();
  if(!v){ h.innerHTML=""; return; }
  const p=agParse(v);
  if(!p.d&&!p.t){ h.innerHTML="sans date — ça ira dans la liste d'attente"; return; }
  h.innerHTML="→ <b>"+esc(p.txt)+"</b> · "+(p.d?agDL(p.d):"sans date")+(p.t?" à "+p.t+(p.t2?"–"+p.t2:""):"");
}
function agSubmit(e,sfx){
  e.preventDefault(); sfx=sfx||"";
  const el=document.getElementById("agIn"+sfx); if(!el) return;
  const v=el.value.trim(); if(!v) return;
  const it=agAdd(v); el.value=""; agPreview(sfx);
  if(sfx){ agSheet(); setTimeout(()=>{ const e2=document.getElementById("agIn2"); if(e2) e2.focus(); },0); }
  else { agRepaint(); const e2=document.getElementById("agIn"); if(e2) e2.focus(); }
  if(it&&it.d) toast("🗓 "+agDL(it.d)+(it.t?" à "+it.t:""));
}
function agRepaint(){
  const c=document.getElementById("agCard");
  if(!c){ render(); return; }
  c.outerHTML=agCardHtml(); agBind();
}
function agRowAct(ev,repaint){
  const row=ev.target.closest("[data-id]"); if(!row) return;
  const act=(ev.target.closest("[data-act]")||{}).dataset;
  const id=row.dataset.id;
  if(!act) return;
  if(act.act==="chk"){ agDone(id); repaint(); }
  else if(act.act==="push"){ agPushToday(id); repaint(); toast("Reporté à aujourd'hui"); }
  else if(act.act==="urg"){ agUrgent(id); repaint(); toast("🔥 Urgent : en tête, pour aujourd'hui"); }
  else if(act.act==="later"){ agLater(id); repaint(); toast("Rangé dans « Sans date »"); }
  else if(act.act==="open"){ agEdit(id); }
}
function agBind(){
  const f=document.getElementById("agForm");
  if(f){ f.addEventListener("submit",e=>agSubmit(e)); }
  const i=document.getElementById("agIn");
  if(i){ i.addEventListener("input",()=>agPreview()); }
  const l=document.getElementById("agList");
  if(l){ l.addEventListener("click",e=>agRowAct(e,agRepaint)); }
  const m=document.querySelector('#agCard [data-act="all"]');
  if(m){ m.addEventListener("click",agSheet); }
}

/* ---- la vue complète ---- */
function agSheet(){
  const B=agBuckets();
  const rows=a=>a.map(it=>agRowHtml(it,true)).join("");
  let body="";
  if(B.late.length)  body+=`<div class="aggrp red">En retard <i>${B.late.length}</i></div>`+rows(B.late);
  if(B.now.length)   body+=`<div class="aggrp">Aujourd'hui <i>${B.now.length}</i></div>`+rows(B.now);
  const byDay={}; B.soon.forEach(it=>{ (byDay[it.d]=byDay[it.d]||[]).push(it); });
  Object.keys(byDay).sort().forEach(d=>{
    body+=`<div class="aggrp">${agDL(d,true)} <i>${byDay[d].length}</i></div>`+rows(byDay[d]); });
  if(B.inbox.length) body+=`<div class="aggrp">Sans date <i>${B.inbox.length}</i><button class="rvbtn" onclick="rvStart()">🧹 Trier</button></div>`+rows(B.inbox);
  if(B.done.length)  body+=`<div class="aggrp grey">Fait <i>${B.done.length}</i></div>`+rows(B.done.slice(0,25));
  if(!body) body=`<div class="agempty">Rien pour l'instant. Écris une ligne en bas : <b>5 oct 20h psy</b>, <b>demain 9h BCG</b>, ou juste <b>postuler Dior</b>.</div>`;
  sheet(`<h3>🗓 L'agenda</h3>
    ${agSegHtml("liste")}
    <div id="agBody">${body}</div>
    <form class="agform" id="agForm2" style="margin-top:17px"><input id="agIn2"
      placeholder="Noter quelque chose…" autocomplete="off" autocorrect="off" enterkeyhint="done"><button type="submit">＋</button></form>
    <div class="aghint" id="agHint2"></div>
    <button class="btn ghost" style="margin-top:15px" onclick="closeOv();render()">Fermer</button>`);
  agSegBind();
  document.getElementById("agForm2").addEventListener("submit",e=>agSubmit(e,"2"));
  document.getElementById("agIn2").addEventListener("input",()=>agPreview("2"));
  document.getElementById("agBody").addEventListener("click",e=>agRowAct(e,agSheet));
}

/* ═══════════════════════════════════════════════════════════════════
   LE TRI DE LA SEMAINE — les tâches sans date, une par une :
   garder, dater, faite ou supprimer. Proposé tous les 7 jours dès 3 tâches.
   ═══════════════════════════════════════════════════════════════════ */
let RV=null;
function rvDue(){
  const n=agBuckets().inbox.length; if(n<3) return false;
  return !S.lastReview || Date.now()-S.lastReview>=7*864e5;
}
function rvStart(){ RV={ids:agBuckets().inbox.map(x=>x.id), i:0, k:{keep:0,date:0,done:0,del:0}}; rvShow(); }
function rvShow(){
  while(RV.i<RV.ids.length && !agGet(RV.ids[RV.i])) RV.i++;
  if(RV.i>=RV.ids.length) return rvEnd();
  const it=agGet(RV.ids[RV.i]), n=RV.ids.length;
  sheet(`<h3>🧹 Le tri de la semaine</h3>
    <div class="rvprog"><i style="width:${Math.round(100*RV.i/n)}%"></i></div>
    <div class="cr2" style="margin:6px 2px 0">${RV.i+1} sur ${n} · ajoutée ${agDL(new Date(it.c||Date.now()).toISOString().slice(0,10))}</div>
    <div class="rvcard"><b>${esc(it.txt)}</b>${it.note?`<small>📝 ${esc(it.note)}</small>`:""}</div>
    <div class="rvgrid">
      <button onclick="rvDate(0)">Aujourd'hui</button>
      <button onclick="rvDate(1)">Demain</button>
      <button onclick="rvDate(7)">Dans 1 semaine</button>
      <button onclick="document.getElementById('rvD').showPicker?document.getElementById('rvD').showPicker():document.getElementById('rvD').focus()">📅 Choisir…</button>
    </div>
    <input type="date" id="rvD" class="rvdate" onchange="rvDate(null,this.value)">
    <button class="btn" onclick="rvAct('keep')">Garder sans date</button>
    <button class="btn ghost" onclick="rvAct('done')">✓ C'est déjà fait</button>
    <button class="btn danger" onclick="rvAct('del')">🗑 Supprimer</button>
    <button class="btn ghost" onclick="rvStop()">Arrêter le tri</button>`);
}
function rvDate(n,v){
  const it=agGet(RV.ids[RV.i]); if(!it) return rvNext();
  it.d=v||dayShift(today(),n); agTouch(it); save(); RV.k.date++;
  toast("🗓 "+agDL(it.d)); rvNext();
}
function rvAct(a){
  const it=agGet(RV.ids[RV.i]);
  if(it){
    if(a==="done"){ it.done=today(); agTouch(it); save(); }
    if(a==="del"){ S.agenda=agAll().filter(x=>x.id!==it.id); agTombs()[it.id]=Date.now(); save(); toast("Supprimée"); }
    RV.k[a]++;
  }
  rvNext();
}
function rvNext(){ RV.i++; rvShow(); }
function rvStop(){ S.lastReview=Date.now(); save0(); RV=null; closeOv(); render(); }
function rvEnd(){
  const k=RV.k; S.lastReview=Date.now(); save0();
  sheet(`<h3>✨ Tri terminé</h3>
    <div class="cstats">
      <div><b>${k.keep}</b><small>gardées</small></div>
      <div class="hot"><b>${k.date}</b><small>datées</small></div>
      <div class="good"><b>${k.done}</b><small>déjà faites</small></div>
      <div><b>${k.del}</b><small>supprimées</small></div>
    </div>
    <div class="synote" style="margin-top:0">Prochain tri proposé dans 7 jours.</div>
    <button class="btn" onclick="RV=null;closeOv();render()">Fermer</button>`);
}

/* ═══════════════════════════════════════════════════════════════════
   LE CALENDRIER — le mois d'un coup d'œil.
   Il réunit ce que l'app sait d'un jour : les dossiers servis (les
   points), ce qui était prévu (la pastille orange), la journée écrite
   (le ✎). Un mois de régularité se lit alors sans rien ouvrir.
   ═══════════════════════════════════════════════════════════════════ */
let calYM=null;
function calInit(){ if(!calYM) calYM=today().slice(0,7); }
function calShift(n){
  const p=calYM.split("-"), d=new Date(+p[0], +p[1]-1+n, 1);
  calYM=d.getFullYear()+"-"+pad2(d.getMonth()+1);
  calSheet();
}
function calGoToday(){ calYM=today().slice(0,7); calSheet(); }
function calData(ym){
  const map={}, get=d=>(map[d]=map[d]||{cats:{},min:0,ag:0,j:0});
  S.apps.forEach(a=>{
    const st=stOf(a.id);
    st.days.forEach(d=>{ if(d.slice(0,7)===ym&&catOf(a)) get(d).cats[catOf(a)]=1; });
    Object.keys(st.min||{}).forEach(d=>{ if(d.slice(0,7)===ym) get(d).min+=Math.round(st.min[d]||0); });
  });
  agAll().forEach(it=>{ if(it.d&&it.d.slice(0,7)===ym) get(it.d).ag++; });
  Object.keys(jAll()).forEach(d=>{ if(d.slice(0,7)===ym&&jHas(d)) get(d).j=1; });
  return map;
}
function agSegHtml(cur){
  return `<div class="jseg" id="agSeg">
    <div data-v="liste" class="${cur==="liste"?"on":""}">📋 La liste</div>
    <div data-v="cal" class="${cur==="cal"?"on":""}">🗓 Le calendrier</div>
  </div>`;
}
function agSegBind(){
  const s=document.getElementById("agSeg");
  if(s) s.addEventListener("click",ev=>{
    const el=ev.target.closest("[data-v]"); if(!el) return;
    if(el.dataset.v==="cal") calSheet(); else agSheet();
  });
}
function calSheet(){
  calInit();
  const ym=calYM, p=ym.split("-"), y=+p[0], mo=+p[1];
  const D=calData(ym), AC=catsActives(), t=today();
  const first=new Date(y,mo-1,1);
  const debut=(first.getDay()+6)%7;                 // la semaine commence lundi
  const n=new Date(y,mo,0).getDate();
  const cells=[];
  for(let i=0;i<debut;i++) cells.push(`<div class="cday out"></div>`);
  for(let d=1;d<=n;d++){
    const iso=ym+"-"+pad2(d), e=D[iso]||{cats:{},min:0,ag:0,j:0};
    const faits=AC.filter(c=>e.cats[c.id]).length;
    cells.push(`<div class="cday ${AC.length&&faits===AC.length?"full":""} ${iso===t?"now":""}" data-d="${iso}">
      <b>${d}</b>
      ${e.ag?`<span class="cag"></span>`:""}
      ${e.j?`<span class="cj">✎</span>`:""}
      <div class="cdt">${AC.map(c=>`<i class="${e.cats[c.id]?"on":""}"></i>`).join("")}</div>
    </div>`);
  }
  const jours=AC.length?Object.keys(D).filter(d=>AC.every(c=>D[d].cats[c.id])).length:0;
  const min=Object.keys(D).reduce((s,d)=>s+D[d].min,0);
  const ecrits=Object.keys(D).filter(d=>D[d].j).length;
  sheet(`<h3>🗓 L'agenda</h3>
    ${agSegHtml("cal")}
    <div class="calnav">
      <button onclick="calShift(-1)" aria-label="Mois précédent">‹</button>
      <b>${first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</b>
      ${ym!==t.slice(0,7)?`<button class="now" onclick="calGoToday()">Aujourd'hui</button>`:""}
      <button onclick="calShift(1)" aria-label="Mois suivant">›</button>
    </div>
    <div class="caldow">${["L","M","M","J","V","S","D"].map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="calgrid" id="calGrid">${cells.join("")}</div>
    <div class="calfoot">
      <div><b>${jours}</b><span>jour${jours>1?"s":""} plein${jours>1?"s":""}</span></div>
      <div><b>${fmtMin(min)}</b><span>de pratique</span></div>
      <div><b>${ecrits}</b><span>journée${ecrits>1?"s":""} écrite${ecrits>1?"s":""}</span></div>
    </div>
    <div class="callg">Les points sous chaque jour sont tes ${AC.length||"—"} dossiers.
      Pastille orange en haut : quelque chose à l'agenda. <b>✎</b> : journée écrite.
      Touche un jour pour l'ouvrir.</div>
    <button class="btn ghost" style="margin-top:16px" onclick="closeOv();render()">Fermer</button>`);
  agSegBind();
  const g=document.getElementById("calGrid");
  if(g) g.addEventListener("click",ev=>{
    const el=ev.target.closest("[data-d]"); if(!el) return;
    calDay(el.dataset.d);
  });
}
function calDay(d){
  const items=agSort(agAll().filter(x=>x.d===d));
  const pointe=S.apps.filter(a=>stOf(a.id).days.includes(d));
  const min=S.apps.reduce((s,a)=>s+Math.round(stOf(a.id).min[d]||0),0);
  const e=jGet(d), AC=catsActives();
  sheet(`<h3>${jDateLabel(d,true)}</h3>
    ${AC.length?`<div class="agpills" style="margin:-4px 0 15px">${AC.map(c=>
      `<span class="${catDoneDay(c.id,d)?"on":""}">${c.e} ${c.nom}</span>`).join("")}</div>`:""}
    ${items.length?`<div class="aggrp">À l'agenda <i>${items.length}</i></div>
      <div id="calDayAg">${items.map(it=>agRowHtml(it,false)).join("")}</div>`:""}
    ${pointe.length?`<div class="aggrp">Pointé <i>${pointe.length}</i></div>
      <div style="margin-top:10px">${pointe.map(a=>{
        const m=Math.round(stOf(a.id).min[d]||0);
        return `<span class="daychip">${a.emoji} ${esc(a.name)}${m?` <small>${fmtMin(m)}</small>`:""}</span>`;
      }).join("")}</div>${min?`<div class="syline" style="margin-top:6px">${fmtMin(min)} au total ce jour-là.</div>`:""}`:""}
    ${jHas(d)?`<div class="aggrp">La journée écrite</div>
      <div class="jprev" style="-webkit-line-clamp:14;margin-top:11px">${esc(e.txt)}</div>
      <button class="btn ghost" style="margin-top:11px" onclick="openJournal('${d}')">Ouvrir le journal</button>`:""}
    ${!items.length&&!pointe.length&&!jHas(d)?`<div class="agempty">Rien ce jour-là.</div>`:""}
    <form class="agform" id="calForm" style="margin-top:17px"><input id="calIn"
      placeholder="Noter quelque chose ce jour-là…" autocomplete="off" enterkeyhint="done"><button type="submit">＋</button></form>
    <button class="btn ghost" style="margin-top:15px" onclick="calSheet()">← Le calendrier</button>`);
  const ag=document.getElementById("calDayAg");
  if(ag) ag.addEventListener("click",ev=>agRowAct(ev,()=>calDay(d)));
  const f=document.getElementById("calForm");
  if(f) f.addEventListener("submit",ev=>{
    ev.preventDefault();
    const el=document.getElementById("calIn"), v=el.value.trim();
    if(!v) return;
    /* le jour ouvert sert de date par défaut — sauf si la phrase en donne une */
    const q=agParse(v);
    agAll().push({id:agId(), txt:q.txt, d:q.d||d, t:q.t, t2:q.t2, note:"", star:q.star,
                  done:null, c:Date.now(), mod:Date.now()});
    save(); calDay(d); toast("Noté");
  });
}

/* ---- ce que l'agenda dit à Claude ---- */
function agExportLines(){
  const B=agBuckets(), L=[], line=it=>
    "  • "+(it.star?"★ ":"")+it.txt+(it.t?"  ["+it.t+(it.t2?"–"+it.t2:"")+"]":"")+
    (it.note?"\n      ↳ "+it.note.replace(/\n+/g," / "):"");
  if(!B.late.length&&!B.now.length&&!B.soon.length&&!B.inbox.length) return L;
  L.push("════════════════════════════════════════");
  L.push("◆ L'AGENDA (au "+today()+")");
  L.push("");
  if(B.late.length){ L.push("EN RETARD :"); B.late.forEach(it=>L.push(line(it)+"   (prévu "+it.d+")")); L.push(""); }
  if(B.now.length){ L.push("AUJOURD'HUI :"); B.now.forEach(it=>L.push(line(it))); L.push(""); }
  const soon=B.soon.filter(it=>it.d<=dayShift(today(),14));
  if(soon.length){
    L.push("LES 14 PROCHAINS JOURS :");
    let cur="";
    soon.forEach(it=>{ if(it.d!==cur){ cur=it.d; L.push("  "+agDL(it.d,true)+" ("+it.d+")"); } L.push("  "+line(it)); });
    L.push("");
  }
  if(B.inbox.length){ L.push("SANS DATE, EN ATTENTE :"); B.inbox.forEach(it=>L.push(line(it))); L.push(""); }
  return L;
}
function agSave(id){
  const it=agGet(id); if(!it) return;
  const txt=document.getElementById("eT").value.trim();
  if(!txt) return toast("Il faut un texte.");
  it.txt=txt;
  it.d=document.getElementById("eD").value||null;
  it.t=document.getElementById("eH").value||null;
  if(!it.t) it.t2=null;
  it.note=document.getElementById("eN").value;
  agTouch(it); save(); closeOv(); render(); toast("Enregistré");
}

/* ═══════════════════════════════════════════════════════════════════
   MA JOURNÉE — le journal du jour, et son export.
   Ajouté le 2026-09-20 à la demande de Thomas : « une partie my day où
   je raconte ce que j'ai fait et que tu pourrais reprendre après ».
   Deux principes :
   ① zéro friction — on tape, ça s'enregistre tout seul, pas de bouton ;
   ② l'export ne contient pas QUE le texte : il y joint ce que l'app a
      enregistré de son côté (apps cochées, minutes). Le texte dit
      l'intention et le vécu, les chiffres disent ce qui s'est passé.
      Les deux ensemble valent dix fois le texte seul.
   Le journal vit dans la même clé `pointage_v1` : LE COFFRE le sauvegarde
   et le transfère déjà, sans rien y changer.
   ═══════════════════════════════════════════════════════════════════ */
const J_TAGS=[
  {id:"ok",     lbl:"✅ ça a marché"},
  {id:"bloque", lbl:"🧱 bloqué"},
  {id:"claude", lbl:"❓ pour Claude"},
  {id:"idee",   lbl:"💡 idée"},
  {id:"rien",   lbl:"😮‍💨 journée vide"},
];
/* des relances qui tournent : le pire ennemi d'un journal, c'est la page blanche */
const J_PROMPTS=[
  "Qu'est-ce que tu as VRAIMENT fait aujourd'hui ?",
  "Qu'est-ce qui a coincé, et à quel moment précis ?",
  "Une chose que tu as comprise aujourd'hui ?",
  "Qu'est-ce que tu as évité aujourd'hui ? Pourquoi ?",
  "Si demain tu ne fais qu'une chose, ce sera quoi ?",
  "Qu'est-ce qui t'a pris plus de temps que prévu ?",
  "Sur quoi tu veux que Claude revienne ?",
];
function jAll(){ if(!S.journal) S.journal={}; return S.journal; }
function jGet(d){ return jAll()[d] || {txt:"", tags:[]}; }
function jHas(d){ const e=jAll()[d]; return !!(e && (e.txt||"").trim()); }
function jDays(){ return Object.keys(jAll()).filter(jHas).sort().reverse(); }
function jSet(d, txt, tags){
  const A=jAll();
  const e=A[d] || {txt:"", tags:[]};
  if(txt!=null) e.txt=txt;
  if(tags!=null) e.tags=tags;
  e.ts=Date.now();
  if(!(e.txt||"").trim() && !(e.tags||[]).length) delete A[d]; else A[d]=e;
  save();
}
function jPrompt(){ return J_PROMPTS[ Math.floor(Date.parse(today())/864e5) % J_PROMPTS.length ]; }
function jDateLabel(iso, long){

function jStreak(){
  const has=new Set(jDays());
  let anchor = has.has(today()) ? today() : (has.has(dayShift(today(),-1)) ? dayShift(today(),-1) : null);
  if(!anchor) return 0;
  let n=0, d=anchor;
  while(has.has(d)){ n++; d=dayShift(d,-1); }
  return n;
}

/* ═══════════════════════════════════════════════════════════════════
   LES CANDIDATURES — le compteur du stage de janvier.
   Chaque +1 est une ligne du tableau : le chiffre et le suivi ne peuvent
   donc jamais se contredire. Une ligne porte son heure de modif (`mod`)
   pour que la synchro tranche entre deux appareils.
   ═══════════════════════════════════════════════════════════════════ */
const C_ST=[
  {id:"envoyee",  l:"Envoyée",   e:"📤"},
  {id:"relance",  l:"Relancée",  e:"🔁"},
  {id:"entretien",l:"Entretien", e:"🗣️"},
  {id:"refus",    l:"Refus",     e:"✕"},
  {id:"offre",    l:"Offre",     e:"🎉"}
];
function cAll(){ if(!S.cands) S.cands=[]; return S.cands; }
function cStatut(id){ return C_ST.find(x=>x.id===id)||C_ST[0]; }
function cSorted(){ return cAll().slice().sort((a,b)=>(b.d||"").localeCompare(a.d||"")||(b.mod||0)-(a.mod||0)); }
function cAge(c){ return Math.round((Date.parse(today()+"T12:00:00")-Date.parse((c.d||today())+"T12:00:00"))/864e5); }
const C_OBJ=5;   // minimum de candidatures par jour
function cOn(d){ return cAll().filter(c=>c.d===d).length; }
function cToday(){ return cOn(today()); }
function cStreak(){
  /* jours d'affilée à 5 ou plus ; aujourd'hui ne casse pas la série tant qu'il n'est pas fini */
  let d=today(); if(cOn(d)<C_OBJ) d=dayShift(d,-1);
  let n=0; while(cOn(d)>=C_OBJ){ n++; d=dayShift(d,-1); }
  return n;
}
/* À relancer : envoyée ou déjà relancée, et 7 jours sans nouvelles depuis le dernier geste. */
const C_REL=7;
function cDepuis(c){ const ref=c.rel||c.d||today(); return Math.round((Date.parse(today()+"T12:00:00")-Date.parse(ref+"T12:00:00"))/864e5); }
function cARelancer(c){ return (c.st==="envoyee"||c.st==="relance")&&cDepuis(c)>=C_REL; }
function cProchaine(c){ return (c.st==="envoyee"||c.st==="relance")?C_REL-cDepuis(c):null; }
function cRelance(id){
  const c=cAll().find(x=>x.id===id); if(!c) return;
  c.st="relance"; c.rel=today(); c.nrel=(c.nrel||0)+1; c.mod=Date.now();
  save(); render();
  if(document.getElementById("cLs")) cList();
  toast("🔁 Relance notée · prochaine le "+cDate(dayShift(today(),C_REL)));
}
function cDate(d){ if(!d) return ""; const x=new Date(d+"T12:00:00"); return x.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
function cRow(c){
  const s=cStatut(c.st), rel=cARelancer(c);
  return `<tr onclick="cEdit('${c.id}')">
    <td><b>${esc(c.ent||"Sans nom")}</b>${c.poste?`<small>${esc(c.poste)}</small>`:""}</td>
    <td class="cd">${cDate(c.d)}</td>
    <td>${rel?`<button class="crel" onclick="event.stopPropagation();cRelance('${c.id}')">🔁 J'ai relancé</button>`:`<span class="cst ${c.st||"envoyee"}">${s.e+" "+s.l}</span>`}</td>
  </tr>`;
}
function cTable(list){
  if(!list.length) return `<div class="cvide">Aucune candidature encore. Le premier ＋1 est le plus dur.</div>`;
  return `<table class="ctab"><thead><tr><th>Entreprise</th><th>Date</th><th>Statut</th></tr></thead>
    <tbody>${list.map(cRow).join("")}</tbody></table>`;
}
function candCardHtml(){

  const sem=A.filter(c=>c.d&&c.d>dayShift(t,-7)).length;

/* ---- les statistiques ---- */
function cStage(){ return S.stageDate||"2027-01-04"; }
function cJours(){ return Math.round((Date.parse(cStage()+"T12:00:00")-Date.parse(today()+"T12:00:00"))/864e5); }
function cPct(a,b){ return b?Math.round(100*a/b)+" %":"—"; }
function cStatsSheet(){
  const A=cAll(), n=A.length, t=today();
  const k=id=>A.filter(c=>(c.st||"envoyee")===id).length;
  const rep=k("entretien")+k("offre")+k("refus"), ent=k("entretien")+k("offre");
  const sem7=A.filter(c=>c.d&&c.d>dayShift(t,-7)).length;
  let jours5=0; for(let i=0;i<14;i++){ if(cOn(dayShift(t,-i))>=C_OBJ) jours5++; }
  /* 8 dernières semaines (lundi → dimanche) */
  const lun=d=>{ const x=new Date(d+"T12:00:00"); const w=(x.getDay()+6)%7; return dayShift(d,-w); };
  const l0=lun(t), sems=[];
  for(let i=7;i>=0;i--){ const deb=dayShift(l0,-7*i), fin=dayShift(deb,6);
    sems.push({deb, k:A.filter(c=>c.d&&c.d>=deb&&c.d<=fin).length}); }
  const max=Math.max(C_OBJ*7,...sems.map(x=>x.k));
  const j=cJours();
  const reste=j>0?j*C_OBJ:0;
  sheet(`<h3>📊 Statistiques</h3>
    <div class="ccount">
      <div><b>${j>0?"J-"+j:j===0?"Jour J":"Démarré"}</b><small>avant le stage · ${cDate(cStage())} ${cStage().slice(0,4)}</small></div>
      <button class="crel" onclick="cStageEdit()">✎ Date</button>
    </div>

    <div class="cstats">
      <div><b>${cPct(rep,n)}</b><small>taux de réponse</small></div>

      <div><b>${(sem7/7).toFixed(1).replace(".",",")}</b><small>par jour (7 j) · obj. ${C_OBJ}</small></div>
      <div class="${jours5>=10?"good":"hot"}"><b>${jours5}/14</b><small>jours à ${C_OBJ}+</small></div>
    </div>
    <div class="civt" style="color:var(--muted);margin:4px 2px 8px">Candidatures par semaine · le trait = objectif (${C_OBJ*7})</div>
    <div class="cweeks">${sems.map((x,i)=>`<div class="cw ${i===7?"now":""}">
      <div class="cwb"><i style="height:${Math.round(100*x.k/max)}%"></i><em style="bottom:${Math.round(100*C_OBJ*7/max)}%"></em></div>
      <b>${x.k}</b><small>${cDate(x.deb).replace(/\.$/,"")}</small></div>`).join("")}</div>
    <div class="synote">Réponses : ${k("entretien")} entretien${k("entretien")>1?"s":""}, ${k("offre")} offre${k("offre")>1?"s":""}, ${k("refus")} refus, sur ${n} candidature${n>1?"s":""}.
      Le taux ne compte que ce que tu as noté : pense à mettre à jour les statuts.</div>
    <button class="btn ghost" onclick="cAllSheet()">← Retour au suivi</button>`);
  document.getElementById("sheet").classList.add("wide");
}

/* ---- l'export : le texte PLUS ce que l'app a vraiment enregistré ---- */
function jAppsOf(d){
  const out=[];
  S.apps.forEach(a=>{
    const st=stOf(a.id), coche=st.days.includes(d), min=Math.round(st.min[d]||0);
    if(coche||min) out.push({nom:a.name, emoji:a.emoji, coche, min});
  });
  return out;
}
function buildJournalExport(nDays){
  const L=[], t=today();
  const jours = nDays==null ? jDays().slice() :
    Array.from({length:nDays},(_,k)=>dayShift(t,-k));
  const gardés = jours.filter(d=>jHas(d) || jAppsOf(d).length);
  L.push("MA JOURNÉE — LE POINTAGE (Thomas)");
  L.push("Export du "+t+" · "+(nDays==null?"toutes mes journées écrites ("+jDays().length+")":nDays===1?"aujourd'hui":"les "+nDays+" derniers jours"));
  L.push("");
  L.push("Comment lire : pour chaque jour, d'abord ce que Thomas a écrit, puis");
  L.push("ce que l'app a enregistré de son côté (apps pointées, minutes). Les deux");
  L.push("ne disent pas la même chose — le texte dit le vécu, les chiffres disent");
  L.push("ce qui s'est réellement passé. Les écarts entre les deux sont le plus");
  L.push("intéressant. Les jours marqués « ❓ pour Claude » attendent une réponse.");
  L.push("");
  agExportLines().forEach(x=>L.push(x));
  if(!gardés.length){ L.push("(aucune journée écrite sur cette période)"); return L.join("\n"); }
  gardés.forEach(d=>{
    const e=jGet(d), apps=jAppsOf(d);
    const tg=(e.tags||[]).map(id=>{const T=J_TAGS.find(x=>x.id===id);return T?T.lbl:id;});
    L.push("════════════════════════════════════════");
    L.push("◆ "+jDateLabel(d,true)+" ("+d+")"+(tg.length?"   ["+tg.join(" · ")+"]":""));
    L.push("");
    L.push((e.txt||"").trim() || "(rien écrit ce jour-là)");
    L.push("");
    if(apps.length){
      const tot=apps.reduce((s,a)=>s+a.min,0);
      L.push("  Pointé : "+apps.map(a=>a.emoji+" "+a.nom+(a.min?" ("+fmtMin(a.min)+")":"")).join(" · "));
      L.push("  → "+apps.filter(a=>a.coche).length+"/"+S.apps.length+" apps"+(tot?" · "+fmtMin(tot)+" au total":" · aucun chrono"));
    } else {
      L.push("  Pointé : rien ce jour-là.");
    }
    L.push("");
  });
  L.push("════════════════════════════════════════");
  L.push("— fin de l'export —");
  return L.join("\n");
}

/* ═══════════════════════════════════════════════════════════════════
   LE LIEN — le tel et l'ordi qui regardent le même registre.
   Pas de serveur à tenir : les deux appareils lisent et écrivent un
   gist privé sur ton compte GitHub. Le jeton reste dans CE navigateur
   (clé à part, jamais incluse dans LE COFFRE) et ne part que vers
   api.github.com.
   Le vrai travail n'est pas le transport, c'est la FUSION : deux
   appareils modifient hors-ligne, et personne ne doit rien perdre.
   D'où, pour chaque donnée, une règle qui converge toute seule —
   réunion des coches arbitrée par l'heure du geste, maximum des
   minutes, plus récent gagnant pour le journal et l'agenda, pierres
   tombales pour les suppressions.
   ═══════════════════════════════════════════════════════════════════ */
const TOKKEY="pointage_gh_token";
const GFILE="pointage-sync.json";
const SY={state:"idle", busy:false};
function ghTok(){ try{ return localStorage.getItem(TOKKEY)||""; }catch(e){ return ""; } }
function syncCfg(){ if(!S.sync) S.sync={}; return S.sync; }
function syncOn(){ return !!ghTok() && !!syncCfg().gist; }
function syncDevice(){
  const u=navigator.userAgent;
  return /iPhone/.test(u)?"iPhone":/iPad/.test(u)?"iPad":/Android/.test(u)?"Android"
       :/Macintosh|Mac OS/.test(u)?"Mac":/Windows/.test(u)?"Windows":"appareil";
}
async function gh(path,opt){
  opt=opt||{};
  const r=await fetch(path.startsWith("http")?path:"https://api.github.com"+path,{
    ...opt,
    headers:{Authorization:"Bearer "+ghTok(), Accept:"application/vnd.github+json",
             "X-GitHub-Api-Version":"2022-11-28", ...(opt.headers||{})}});
  if(!r.ok){ const e=new Error("GitHub "+r.status); e.status=r.status; throw e; }
  return r;
}
function syncErr(e){
  if(e&&e.status===401) return "Jeton refusé — il a expiré ou a été révoqué. Recolles-en un neuf.";
  if(e&&e.status===404) return "Le coffre en ligne est introuvable. Relie cet appareil.";
  if(e&&(e.status===403||e.status===429)) return "GitHub te freine un instant. Ça repartira tout seul.";
  return "Pas de réseau — la synchro reprendra d'elle-même.";
}

/* ---- la charge utile : le registre, rien d'autre ----
   on laisse dehors ce qui n'a de sens que sur cet appareil-ci :
   le chrono en cours, le thème, le lien lui-même. */
function syncPayload(){
  return {v:1, ts:Date.now(), dev:syncDevice(), apps:S.apps, appsMod:S.appsMod||0, st:S.st,
          chk:S.chk||{}, journal:S.journal||{}, agenda:agAll(), tomb:agTombs(), cands:cAll(), cadre:cad(),
          doms:doms(), domsMod:S.domsMod||0};
}
/* Deux appareils arrivent au même contenu mais pas au même ordre de clés ni de
   tâches. Sans mise à plat, chacun croirait l'autre différent et republierait
   sans fin. On compare — et on publie — une forme canonique. */
function canon(v){
  if(Array.isArray(v)) return v.map(canon);
  if(v&&typeof v==="object"){ const o={}; Object.keys(v).sort().forEach(k=>o[k]=canon(v[k])); return o; }
  return v;
}
function syncStrip(p){
  const q={...p, agenda:(p.agenda||[]).slice().sort((a,b)=>String(a.id).localeCompare(String(b.id))),
    cands:(p.cands||[]).slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)))};
  delete q.ts; delete q.dev;
  return JSON.stringify(canon(q));
}

function syncMerge(R){
  if(!R||R.v!==1) return false;
  let ch=false;
  /* La liste des apps est un tout (son ORDRE est un choix) : le classement le plus
     récent l'emporte, et chacun y rajoute ensuite ce que l'autre n'a jamais vu. */
  const T0=agTombs(), vivant=a=>!T0["app:"+a.id];
  if((R.appsMod||0)>(S.appsMod||0)){
    const mine=S.apps, dedans={};
    (R.apps||[]).forEach(a=>dedans[a.id]=1);
    S.apps=(R.apps||[]).filter(vivant).concat(mine.filter(a=>!dedans[a.id]));
    S.appsMod=R.appsMod; ch=true;
  }else{
    const has={}; S.apps.forEach(a=>has[a.id]=1);
    (R.apps||[]).forEach(a=>{ if(!has[a.id]&&vivant(a)){ S.apps.push(a); ch=true; } });
  }
  S.apps.forEach(a=>{ if(!S.st[a.id]) S.st[a.id]={days:[],min:{}}; });
  /* les domaines : un tout, comme la liste des apps ; le plus récent l'emporte */
  if(Array.isArray(R.doms)&&R.doms.length&&(R.domsMod||0)>(S.domsMod||0)){ S.doms=R.doms; S.domsMod=R.domsMod; ch=true; }

  Object.keys(R.st||{}).forEach(id=>{
    if(T0["app:"+id]) return;                        // app supprimée ici : on ne rapatrie pas son historique
    const r=R.st[id]||{}, l=stOf(id);
    (r.days||[]).forEach(d=>{
      if(l.days.includes(d)) return;
      const c=(S.chk||{})[id+"|"+d];
      if(c&&!c.v&&(c.t||0)>(R.ts||0)) return;   // décoché ici depuis que l'autre a publié : on ne le remet pas
      l.days.push(d); ch=true;
    });
    l.days.sort();
    Object.keys(r.min||{}).forEach(d=>{
      const v=Math.max(l.min[d]||0, r.min[d]||0);        // jamais la somme : une fusion rejouée doublerait le temps
      if(v!==(l.min[d]||0)){ l.min[d]=v; ch=true; }
    });
  });
  /* l'arbitrage des coches : le geste le plus récent l'emporte, et c'est lui
     qui décide si le jour reste dans la liste — y compris pour le décocher. */
  const C=S.chk=S.chk||{};
  Object.keys(R.chk||{}).forEach(k=>{
    const r=R.chk[k], l=C[k];
    if(r&&(!l||(r.t||0)>(l.t||0))){ C[k]=r; ch=true; }
  });
  Object.keys(C).forEach(k=>{
    const p=k.split("|"), st=S.st[p[0]]; if(!st||!p[1]) return;
    const inside=st.days.includes(p[1]);
    if(C[k].v&&!inside){ st.days.push(p[1]); st.days.sort(); ch=true; }
    if(!C[k].v&&inside){ st.days=st.days.filter(x=>x!==p[1]); ch=true; }
  });

  const J=jAll();
  Object.keys(R.journal||{}).forEach(d=>{
    const r=R.journal[d], l=J[d];
    if(r&&(!l||(r.ts||0)>(l.ts||0))){ J[d]=r; ch=true; }
  });

  const T=agTombs();
  Object.keys(R.tomb||{}).forEach(k=>{ if((R.tomb[k]||0)>(T[k]||0)){ T[k]=R.tomb[k]; ch=true; } });
  const A=agAll(), at={}; A.forEach((x,i)=>at[x.id]=i);
  (R.agenda||[]).forEach(r=>{
    if(!r||!r.id) return;
    if((T[r.id]||0)>=(r.mod||0)) return;                  // supprimée après cette version-là
    const i=at[r.id];
    if(i==null){ A.push(r); ch=true; }
    else if((r.mod||0)>(A[i].mod||0)){ A[i]=r; ch=true; }
  });
  const before=A.length;
  S.agenda=A.filter(x=>!((T[x.id]||0)>=(x.mod||0)));
  if(S.agenda.length!==before) ch=true;

  /* les candidatures : même règle que l'agenda — la version la plus récente
     l'emporte, et une suppression plus récente qu'une version la fait taire. */
  const CA=cAll(), ci={}; CA.forEach((x,i)=>ci[x.id]=i);
  (R.cands||[]).forEach(r=>{
    if(!r||!r.id) return;
    if((T["cand:"+r.id]||0)>=(r.mod||0)) return;
    const i=ci[r.id];
    if(i==null){ CA.push(r); ch=true; }
    else if((r.mod||0)>(CA[i].mod||0)){ CA[i]=r; ch=true; }
  });
  const cb=CA.length;
  S.cands=CA.filter(x=>!((T["cand:"+x.id]||0)>=(x.mod||0)));
  if(S.cands.length!==cb) ch=true;
  if(cadMerge(R.cadre)) ch=true;
  if(accMerge(R.cadre)) ch=true;
  return ch;
}

async function syncPull(){
  const r=await gh("/gists/"+syncCfg().gist);
  const j=await r.json();
  const f=j.files&&j.files[GFILE];
  if(!f) return null;
  let txt=f.content;
  if(f.truncated||txt==null){ txt=await (await fetch(f.raw_url)).text(); }
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
async function syncPush(p){
  const content=JSON.stringify({...canon(p), ts:p.ts, dev:p.dev}, null, 1);
  await gh("/gists/"+syncCfg().gist,{method:"PATCH",
    body:JSON.stringify({files:{[GFILE]:{content}}})});
}
async function syncFind(){
  const l=await (await gh("/gists?per_page=100")).json();
  const g=(l||[]).find(x=>x.files&&x.files[GFILE]);
  if(g){ syncCfg().url=g.html_url; return g.id; }
  return null;
}
async function syncCreate(){
  const j=await (await gh("/gists",{method:"POST",body:JSON.stringify({
    description:"Le Pointage — registre synchronisé (privé, ne pas partager)",
    public:false, files:{[GFILE]:{content:JSON.stringify(syncPayload())}}})})).json();
  syncCfg().url=j.html_url; return j.id;
}

let syncT=null;
function syncSoon(ms){ if(!syncOn()) return; clearTimeout(syncT); syncT=setTimeout(()=>syncNow(true), ms==null?4000:ms); }
async function syncNow(silent){
  if(!syncOn()||SY.busy) return;
  SY.busy=true; syncSetState("work");
  try{
    const R=await syncPull();
    let ch=R?syncMerge(R):false;
    const mine=syncPayload();
    if(!R || syncStrip(R)!==syncStrip(mine)) await syncPush(mine);
    try{ if(window.AppsSync){ const a=await AppsSync.run(); if(a&&a.changed) ch=true; } }catch(e){}
    try{ await coachPush(); }catch(e){}
    syncCfg().last=Date.now(); syncCfg().peer=(R&&R.dev)||syncCfg().peer;
    save0();
    syncSetState("ok");
    if(ch) render();
    if(!silent) toast("✅ À jour sur tous tes appareils");
  }catch(e){
    syncSetState(e&&e.status===401?"err":"off");
    if(!silent) toast(syncErr(e));
  }finally{ SY.busy=false; }
}
function syncSetState(s){
  SY.state=s;
  const d=document.getElementById("syDot");
  if(d) d.className="sydot "+(syncOn()?s:"none");
}
function syncDotHtml(){
  const cl=syncOn()?SY.state:"none";
  return `<button class="sydot ${cl}" id="syDot" onclick="syncOpen()" aria-label="Lien entre appareils">${syncOn()?"☁":"🔗"}</button>`;
}
function syncAgo(){
  const t=syncCfg().last; if(!t) return "jamais";
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return "à l'instant";
  if(m<60) return "il y a "+m+" min";
  const h=Math.round(m/60); if(h<24) return "il y a "+h+" h";
  return "le "+new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
}

function syncOpen(){
  if(!syncOn()) return syncSetup();
  const st={ok:"à jour",work:"en cours…",off:"hors ligne",err:"jeton refusé",idle:"en attente"}[SY.state]||"";
  sheet(`<h3>☁ Mes appareils</h3>
    <p class="syline">Ce <b>${syncDevice()}</b> partage son registre avec tes autres appareils :
      état <b>${st}</b>, dernier échange <b>${syncAgo()}</b>${syncCfg().peer&&syncCfg().peer!==syncDevice()?` · en face : <b>${esc(syncCfg().peer)}</b>`:""}.</p>
    <div class="synote">Ce qui voyage : tes apps du jour, les coches, le temps, le journal et l'agenda.
      Ce qui reste ici : le chrono en cours et le thème.<br>
      <b>Ton jeton ne quitte jamais cet appareil</b> — et LE COFFRE ne l'embarque pas dans ses exports.</div>
    <button class="btn" onclick="syncNow()">⟳ Synchroniser maintenant</button>
    <button class="btn ghost" onclick="coachLinkCopy()">🔗 Copier mon lien coach</button>
    <div class="ksub" style="text-align:left">Le coach du soir lit ce lien tout seul à 22 h : plus besoin d'envoyer le bilan. Tes séances FORGE et tes cases IELTS passent aussi d'un appareil à l'autre.</div>
    ${syncCfg().url?`<button class="btn ghost" onclick="window.open('${syncCfg().url}','_blank','noopener')">↗ Voir le coffre en ligne</button>`:""}
    <button class="btn ghost" onclick="closeOv();render()">Fermer</button>
    <button class="btn danger" onclick="syncUnlink()">Délier cet appareil</button>`);
}
function syncSetup(){
  sheet(`<h3>🔗 Lier mes appareils</h3>
    <p class="syline">Le tel et l'ordi écriront dans le même registre, rangé dans un
      <b>gist privé</b> de ton compte GitHub. Trois minutes, une seule fois par appareil.</p>
    <div class="systep"><div class="n">1</div><div>Sur ton ordi, ouvre
      <a href="https://github.com/settings/tokens/new?scopes=gist&description=Le%20Pointage" target="_blank" rel="noopener">cette page GitHub</a>.
      La case <b>gist</b> est déjà cochée — n'en coche aucune autre.
      Mets <b>Expiration : No expiration</b>, sinon la synchro s'arrêtera le jour venu.</div></div>
    <div class="systep"><div class="n">2</div><div>Clique <b>Generate token</b>, copie la ligne qui commence par
      <span style="font-family:var(--mono)">ghp_…</span>, et colle-la ici.</div></div>
    <div class="systep"><div class="n">3</div><div>Sur l'autre appareil, reviens ici et colle <b>le même jeton</b> :

    <div class="fld" style="margin-top:15px"><label>Le jeton</label>
      <input id="syTok" placeholder="ghp_…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <button class="btn" onclick="syncLink()">Lier cet appareil</button>
    <button class="btn ghost" onclick="closeOv()">Plus tard</button>
    <div class="synote">Ce jeton ne donne accès <b>qu'à tes gists</b>, rien d'autre de ton compte.
      Il reste dans le stockage de ce navigateur. Tu peux le révoquer quand tu veux depuis GitHub,
      et <b>Délier cet appareil</b> l'efface d'ici.</div>`);
}
async function syncLink(){
  const el=document.getElementById("syTok"), tk=(el?el.value:"").trim();
  if(!tk) return toast("Colle d'abord le jeton.");
  try{ localStorage.setItem(TOKKEY,tk); }catch(e){ return toast("Stockage refusé par le navigateur."); }
  toast("Connexion à GitHub…");
  try{
    let id=await syncFind();
    if(!id) id=await syncCreate();
    syncCfg().gist=id; save0();
    await syncNow(true);
    closeOv(); render(); toast("🔗 Appareil lié — tout est partagé");
  }catch(e){
    localStorage.removeItem(TOKKEY);
    toast(syncErr(e));
  }
}
function syncUnlink(){
  if(!confirm("Délier cet appareil ?\n\nTes données restent ici, et restent dans le gist. Seul le jeton est effacé.")) return;
  try{ localStorage.removeItem(TOKKEY); }catch(e){}
  delete syncCfg().gist; save0(); closeOv(); render(); toast("Appareil délié");
}
/* l'historique des gestes de coche ne sert qu'à arbitrer : au-delà de 4 mois, inutile */
function chkPrune(){
  if(!S.chk) return;

/* ═══════════════════════════════════════════════════════════════════
   LA SAUVEGARDE — un fichier à garder au chaud.
   L'import FUSIONNE (même règle que la synchro) : il ajoute et met à jour,
   il n'efface jamais rien de ce qui est ici. Le Coffre, lui, remplace tout.
   ═══════════════════════════════════════════════════════════════════ */
function bkAgo(){
  const t=S.lastExport; if(!t) return null;
  return Math.floor((Date.now()-t)/864e5);
}
function bkNeeded(){
  const vide=!cAll().length&&!agAll().length&&!S.apps.some(a=>stOf(a.id).days.length);

}

}
function bkSheet(){
  const a=bkAgo();
  sheet(`<h3>💾 Sauvegarde</h3>

    ${syncOn()?"":`<button class="btn ghost" onclick="syncSetup()">🔗 Activer la synchro entre appareils</button>`}
    <button class="btn ghost" onclick="closeOv();render()">Fermer</button>`);
}
function bkExport(){
  const data={...syncPayload(), pointage:1};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download="pointage-sauvegarde-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();

}
function bkImport(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let R; try{ R=JSON.parse(r.result); }catch(e){ return toast("Fichier illisible."); }
    if(R&&R.coffre&&R.data&&R.data[KEY]){ try{ R=JSON.parse(R.data[KEY]); R={v:1,ts:0,...syncPayloadOf(R)}; }catch(e){} }
    if(!R||R.v!==1) return toast("Ce n'est pas une sauvegarde du Pointage.");
    const avant=cAll().length+agAll().length;
    const ch=syncMerge(R);
    save(); closeOv(); render();
    const apres=cAll().length+agAll().length;
    toast(ch?"✅ Importé"+(apres>avant?" · "+(apres-avant)+" élément"+(apres-avant>1?"s":"")+" ajouté"+(apres-avant>1?"s":""):""):"Rien de nouveau dans ce fichier");
  };
  r.readAsText(f);
}
/* un fichier du Coffre contient l'état brut : on le remet au format de la synchro */
function syncPayloadOf(x){
  return {apps:x.apps||[], appsMod:x.appsMod||0, st:x.st||{}, chk:x.chk||{}, journal:x.journal||{},
          agenda:x.agenda||[], tomb:x.tomb||{}, cands:x.cands||[], cadre:x.cadre||null};
}

/* ═══════════════════════════════════════════════════════════════════
   LE CADRE — le Pointage comme système anti-addiction.
   • La porte : Instagram se mérite. Le 1er ticket du jour s'ouvre quand
     les priorités sont faites ; chaque ticket suivant coûte un effort utile
     deux fois plus long que le précédent ; plafond par jour. Le Pointage
     ne peut rien bloquer seul : le plafond dur, c'est Temps d'écran.
   • Le coffre : le code Temps d'écran, inventé ici, montré une fois,
     rendu seulement après un délai d'attente. Il ne quitte jamais cet
     appareil (ni synchro, ni Coffre).
   • Anti-abandon : chaîne avec jokers, « jamais deux fois », jour minimum,
     et des règles qu'on durcit tout de suite mais qu'on n'assouplit qu'en 48 h.
   ═══════════════════════════════════════════════════════════════════ */
const PORTE_WEB="https://www.instagram.com/";
const PORTE_URL="https://niclaeysthomas-ctrl.github.io/pointage/#porte";
const SC_NAME="Porte Instagram";
const DELAI_H=48;
const CF_DEF={tmin:10, cap:3, base:20, prio:1, sc:0};
const INTENTS=[{id:"msg",e:"💬",l:"Messages"},{id:"post",e:"📸",l:"Publier"},{id:"precis",e:"🎯",l:"Un truc précis"},{id:"scroll",e:"🌀",l:"Juste scroller"}];
function intLbl(id){ const x=INTENTS.find(i=>i.id===id); return x?x.e+" "+x.l:(id==="urgence"?"🆘 Urgence":""); }

function cad(){
  if(!S.cadre) S.cadre={};
  const C=S.cadre;
  if(!C.conf) C.conf={...CF_DEF};
  Object.keys(CF_DEF).forEach(k=>{ if(C.conf[k]==null) C.conf[k]=CF_DEF[k]; });
  if(!Array.isArray(C.pend)) C.pend=[];
  if(!C.log) C.log={};
  if(!Array.isArray(C.passe)) C.passe=[];
  if(!C.minDay) C.minDay={};
  if(!C.ren) C.ren={};
  if(C.why==null) C.why="";
  if(!C.start) C.start=today();
  if(!C.mod) C.mod=0;
  return C;
}
function cadTouch(){ cad().mod=Date.now(); }
function cadPrune(){ const C=cad(), lim=dayShift(today(),-60);
  ["log","minDay","ren","focus","demain","rit","fs","auto","jp"].forEach(k=>Object.keys(C[k]||{}).forEach(d=>{ if(d<lim) delete C[k][d]; }));
  Object.keys(C.bilans||{}).forEach(w=>{ if(w<dayShift(today(),-200)) delete C.bilans[w]; });
  C.passe=C.passe.filter(t=>t>Date.now()-60*864e5); }

/* ---- les règles : durcir = tout de suite ; assouplir = dans 48 h ---- */
const CF_LOOSE={tmin:(a,b)=>b>a, cap:(a,b)=>b>a, base:(a,b)=>b<a, prio:(a,b)=>b<a};
function fmtCf(k,v){ return k==="tmin"||k==="base"?v+" min":k==="cap"?String(v):k==="prio"?(v?"exigées":"non exigées"):(v?"oui":"non"); }
function fmtLeft(at){ const m=Math.max(0,Math.ceil((at-Date.now())/60000)); const h=Math.floor(m/60);
  return h>=24?Math.floor(h/24)+" j "+(h%24)+" h":h?h+" h "+pad2(m%60):m+" min"; }
function cfSet(k,v){
  const C=cad(), cur=C.conf[k];
  C.pend=C.pend.filter(p=>p.k!==k);                      // une nouvelle demande remplace l'ancienne
  if(v!==cur){
    if(CF_LOOSE[k]&&CF_LOOSE[k](cur,v)){ C.pend.push({k,v,at:Date.now()+DELAI_H*36e5}); toast("⏳ Assouplissement programmé : effectif dans 48 h"); }
    else { C.conf[k]=v; toast("✓ Appliqué tout de suite"); }
  }
  cadTouch(); save();
}
function cfStep(k,delta,min,max){
  const C=cad(), p=C.pend.find(x=>x.k===k), from=p?p.v:C.conf[k];
  cfSet(k,Math.max(min,Math.min(max,from+delta))); openCadre(true);
}
function cfCancel(k){ const C=cad(); C.pend=C.pend.filter(p=>p.k!==k); cadTouch(); save(); toast("Assouplissement annulé 💪"); }
function cfApply(){
  const C=cad(), now=Date.now(); let ch=false;
  C.pend=C.pend.filter(p=>{ if(p.at<=now){ C.conf[p.k]=p.v; ch=true; return false; } return true; });
  if(ch){ cadTouch(); save(); }
}

/* ---- l'effort utile : chronos du Pointage, candidatures, séances FORGE ---- */
function forgeMin(d){
  try{ const F=JSON.parse(localStorage.getItem("forge_v2")||"null"); if(!F) return null;
    let m=0; ["workoutLog","mobLog","boxeLog"].forEach(k=>(F[k]||[]).forEach(x=>{ if(x.date===d) m+=(+x.dur||0); }));
    return m; }catch(e){ return null; }
}
function isForgeApp(a){ return /\/forge\/?$/.test(a.url||""); }
function effTotal(){
  const t=today(), fm=forgeMin(t);
  let m=0;
  S.apps.forEach(a=>{ if(fm!=null&&isForgeApp(a)) return; m+=stOf(a.id).min[t]||0; });
  if(S.run){ const a=S.apps.find(x=>x.id===S.run.id); if(a&&!(fm!=null&&isForgeApp(a))) m+=(Date.now()-S.run.t0)/60000; }
  return m+cToday()*10+(fm||0);
}

/* ---- la porte ---- */
function pLog(d){ return cad().log[d||today()]||[]; }
function pTickets(){ return pLog().filter(x=>!x.passe); }
function pActive(){ const l=pLog(); const x=l[l.length-1]; if(!x) return null;
  const end=x.t+x.min*60000; return Date.now()<end?{...x,left:Math.ceil((end-Date.now())/60000)}:null; }
function prioOk(){ const AC=catsActives(); return AC.every(c=>catDone(c.id)); }
function pCost(k){ return k<=1?0:cad().conf.base*Math.pow(2,k-2); }
function pEffSince(){ const tk=pTickets(), last=tk[tk.length-1]; return Math.max(0,effTotal()-(last?(last.eff||0):0)); }
function pState(){
  const C=cad(), n=pTickets().length, k=n+1, act=pActive(), fo=focusOn();
  if(fo) return {s:"focus",n,left:Math.ceil((fo.start+fo.dur*60000-Date.now())/60000)};
  const co=coursNow(); if(co) return {s:"cours",n,co};
  if(act) return {s:"open",act,n};
  if(n>=C.conf.cap) return {s:"closed",n};
  if(k===1&&C.conf.prio&&!prioOk()) return {s:"prio",k,n};
  const cost=pCost(k), have=Math.floor(pEffSince());
  if(have<cost) return {s:"effort",k,n,cost,have};
  return {s:"ready",k,n,cost};
}

  }

function passeDispo(){ const lim=Date.now()-7*864e5; return !cad().passe.some(t=>t>lim); }

/* ---- la chaîne : un jour compte quand les priorités sont faites ----
   Un raté isolé est couvert par un joker (2 par mois). Deux ratés de suite
   cassent la chaîne : c'est la règle « jamais deux fois ». On ne compte qu'à
   partir du jour où le cadre est arrivé, pour ne punir aucun passé. */
function dayOk(d){
  if(S.domSince&&d<S.domSince) return !!(S.okAvant||{})[d];   // le passé garde son verdict
  const AC=unitsOn(d); return AC.length>0&&AC.every(c=>catDoneDay(c.id,d)); }
function chaine(){
  const C=cad(), t=today(); let d=C.start, n=0, prevMiss=false; const used={};
  while(d<t){
    if(dayOk(d)){ n++; prevMiss=false; }
    else { const m=d.slice(0,7);
      if(!prevMiss&&(used[m]||0)<2){ used[m]=(used[m]||0)+1; }
      else n=0;
      prevMiss=true; }
    d=dayShift(d,1);
  }
  const ok=dayOk(t), y=dayShift(t,-1);
  return {n:n+(ok?1:0), left:Math.max(0,2-(used[t.slice(0,7)]||0)), todayOk:ok, yMiss:C.start<=y&&!dayOk(y)};
}
function minDispo(){ const C=cad(), lim=dayShift(today(),-6); return Object.keys(C.minDay).filter(d=>d>=lim).length<2; }
function setMinDay(){
  const C=cad(), t=today(); if(C.minDay[t]) return;
  if(!minDispo()) return toast("Déjà 2 jours minimum cette semaine : aujourd'hui, version normale.");
  C.minDay[t]=1; save(); render(); toast("😮‍💨 Jour minimum : 5 min par priorité, c'est gagné");
}
function banHtml(){
  const C=cad(), t=today(), ch=chaine(), why=C.why.trim();

/* ---- le coffre à code Temps d'écran (local, jamais synchronisé) ---- */
const EKEY="pointage_ecran";
const XK=[23,5,41,17];
function encC(c){ return btoa(String(c).split("").map((ch,i)=>String.fromCharCode(ch.charCodeAt(0)^XK[i%4])).join("")); }
function decC(s){ try{ return atob(s).split("").map((ch,i)=>String.fromCharCode(ch.charCodeAt(0)^XK[i%4])).join(""); }catch(e){ return ""; } }
function ecrGet(){ let E; try{ E=JSON.parse(localStorage.getItem(EKEY)||"null")||{}; }catch(e){ E={}; }
  if(!E.delay) E.delay=DELAI_H;
  if(E.pend&&E.pend.at<=Date.now()){ E.delay=E.pend.v; delete E.pend; ecrPut(E); }
  return E; }
function ecrPut(E){ try{ localStorage.setItem(EKEY,JSON.stringify(E)); }catch(e){} }
function rnd4(){ const a=new Uint32Array(1); crypto.getRandomValues(a); return String(a[0]%10000).padStart(4,"0"); }
function newCode(){ let c; do{ c=rnd4(); }while(/^(\d)\1{3}$/.test(c)||"0123456789".includes(c)||"9876543210".includes(c)||/^(19|20)\d\d$/.test(c)); return c; }
function dlTxt(h){ return h>=168?"7 jours":h+" h"; }
function ecrNew(reset){
  const E=ecrGet();
  if(reset&&E.c&&!confirm("Le code actuel sera oublié.\n\nContinue seulement si tu as déjà réinitialisé le code Temps d'écran via Apple (« Code oublié ? »).")) return;
  E.draft=newCode(); delete E.show; delete E.req; ecrPut(E); openCadre(true);
}
function ecrHide(){ const E=ecrGet(); if(!E.draft) return; E.c=encC(E.draft); delete E.draft; E.set=Date.now(); delete E.show; delete E.req; ecrPut(E);
  toast("🔒 Code caché. Il n'existe plus que dans le coffre."); openCadre(true); }
function ecrReq(){ const E=ecrGet(), why=cad().why.trim();
  if(!confirm("Demander le code ?\n\nIl sera disponible dans "+dlTxt(E.delay)+". Tu pourras annuler d'ici là."+(why?"\n\nTon pourquoi : « "+why+" »":""))) return;
  E.req=Date.now(); ecrPut(E); openCadre(true); }
function ecrCancel(){ const E=ecrGet(); delete E.req; E.cancel=(E.cancel||0)+1; ecrPut(E); toast("💪 Demande annulée. L'envie est passée."); openCadre(true); }
function ecrShow(){ const E=ecrGet(); if(!E.req||Date.now()<E.req+E.delay*36e5) return; E.show=1; E.reveals=(E.reveals||0)+1; ecrPut(E); openCadre(true); }
function ecrRehide(){ const E=ecrGet(); delete E.show; delete E.req; ecrPut(E); toast("🔒 Recaché"); openCadre(true); }
function ecrDelay(v){ const E=ecrGet(); delete E.pend;
  if(v>=E.delay){ E.delay=v; toast("✓ Délai allongé tout de suite"); }
  else { E.pend={v,at:Date.now()+DELAI_H*36e5}; toast("⏳ Délai raccourci dans 48 h"); }
  ecrPut(E); openCadre(true); }
function coffreHtml(){
  const E=ecrGet(), now=Date.now(), dl=E.delay;
  let h=`<p>Personne autour de toi pour garder ton code ? Le coffre le garde. Il l'invente, te le montre une seule fois, puis ne le rend qu'après <b>${dlTxt(dl)}</b> d'attente.</p>`;
  if(E.draft) h+=`<div class="kcode">${E.draft}</div>
    <ol class="kguide"><li>Réglages › Temps d'écran › <b>Verrouiller les réglages de Temps d'écran</b> (ou « Modifier le code »).</li>
    <li>Tape ce code, deux fois. Ne le note nulle part.</li><li>Reviens ici et touche le bouton : il disparaît.</li></ol>
    <button class="btn" onclick="ecrHide()">✓ C'est fait, cache-le</button><button class="btn ghost" onclick="ecrNew()">Un autre code</button>`;
  else if(!E.c) h+=`<button class="btn" onclick="ecrNew()">🎲 Créer mon code</button>`;
  else if(E.show) h+=`<div class="kcode">${decC(E.c)}</div><button class="btn" onclick="ecrRehide()">🔒 Recacher</button>`;
  else if(E.req){ const at=E.req+dl*36e5;
    if(now<at) h+=`<div class="kbig" style="font-size:18px">⏳ Disponible dans ${fmtLeft(at)}</div>
      <div class="ksub">Si l'envie est passée d'ici là, annule : c'est exactement à ça que sert le délai.</div>
      <button class="btn ghost" onclick="ecrCancel()">Annuler la demande 💪</button>`;
    else h+=`<button class="btn" onclick="ecrShow()">👁️ Afficher le code</button><button class="btn ghost" onclick="ecrCancel()">Finalement non, il reste caché</button>`; }
  else{ const j=Math.floor((now-(E.set||now))/864e5);
    h+=`<div class="kstp"><div class="kl">🔒 Code caché<small>depuis ${j?j+" jour"+(j>1?"s":""):"aujourd'hui"} · ${E.cancel||0} demande${(E.cancel||0)>1?"s":""} annulée${(E.cancel||0)>1?"s":""}</small></div></div>
      <button class="btn ghost" onclick="ecrReq()">Demander le code (${dlTxt(dl)} d'attente)</button>
      <button class="klink" onclick="ecrNew(true)">J'ai dû réinitialiser via Apple : créer un nouveau code</button>`; }
  h+=`<div class="kstp"><div class="kl">Délai d'attente${E.pend?`<small class="pend">⏳ → ${dlTxt(E.pend.v)} dans ${fmtLeft(E.pend.at)}</small>`:"<small>allonger : tout de suite · raccourcir : dans 48 h</small>"}</div>
    <select onchange="ecrDelay(+this.value)">${[24,48,168].map(v=>`<option value="${v}" ${v===dl?"selected":""}>${dlTxt(v)}</option>`).join("")}</select></div>
    <p class="kp" style="margin-top:10px">Honnêtement : c'est un frein, pas une prison. Apple permet de réinitialiser le code avec le mot de passe de ton compte Apple (« Code oublié ? »). Et le code ne vit que dans ce navigateur, sur cet appareil : si tu effaces les données de Safari, il disparaît, et tu passeras par la réinitialisation Apple.</p>`;
  return h;
}

/* ---- la synchro du cadre : réglages = le plus récent gagne ; journaux = union ---- */
function cadMerge(Rc){
  if(!Rc) return false;
  const C=cad(); let ch=false;
  if((Rc.mod||0)>(C.mod||0)){ C.conf={...CF_DEF,...(Rc.conf||{})}; C.pend=(Rc.pend||[]).slice(); C.why=Rc.why||""; C.mod=Rc.mod; ch=true; }
  Object.keys(Rc.log||{}).forEach(d=>{ const L=C.log[d]=C.log[d]||[], seen=new Set(L.map(x=>x.t));
    (Rc.log[d]||[]).forEach(e=>{ if(e&&!seen.has(e.t)){ L.push(e); ch=true; } }); L.sort((a,b)=>a.t-b.t); });
  (Rc.passe||[]).forEach(x=>{ if(!C.passe.includes(x)){ C.passe.push(x); ch=true; } });
  Object.keys(Rc.minDay||{}).forEach(d=>{ if(!C.minDay[d]){ C.minDay[d]=1; ch=true; } });
  Object.keys(Rc.ren||{}).forEach(d=>{ const v=Math.max(C.ren[d]||0,Rc.ren[d]||0); if(v!==(C.ren[d]||0)){ C.ren[d]=v; ch=true; } });
  if(Rc.start&&Rc.start<C.start){ C.start=Rc.start; ch=true; }
  return ch;
}

/* ═══════════════════════════════════════════════════════════════════
   L'ACCUEIL — le Pointage comme écran d'accueil du téléphone.
   • Une barre d'actions rapides : focus, tâche, candidature, FORGE, journal.
   • La chose du jour : posée le matin, rappelée toute la journée.
   • Trois rituels courts : le matin (2 min), la fermeture du soir (3 min),
     le bilan du dimanche (5 min). Chacun arrive au bon moment.
   • Le focus : une seule chose, téléphone posé ; le chrono compte comme
     effort utile et la porte d'Instagram reste fermée jusqu'à la fin.
   • FORGE : la séance du jour (un jour sur deux) remonte dans le brief.
   ═══════════════════════════════════════════════════════════════════ */
function acc(){ const C=cad();
  ["focus","demain","rit","bilans","fs"].forEach(k=>{ if(!C[k]) C[k]={}; });
  return C; }
function dDiff(a,b){ return Math.round((Date.parse(b+"T12:00:00")-Date.parse(a+"T12:00:00"))/864e5); }
function weekStart(d){ d=d||today(); const x=new Date(d+"T12:00:00"); return dayShift(d,-((x.getDay()+6)%7)); }
function isSunday(){ return new Date(today()+"T12:00:00").getDay()===0; }
function hm(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

/* ---- FORGE : lu directement dans son stockage (même domaine) ---- */
function forgeData(){ try{ return JSON.parse(localStorage.getItem("forge_v2")||"null"); }catch(e){ return null; } }
function forgeUrl(){ const a=S.apps.find(isForgeApp); return a&&a.url?a.url:BASE+"forge/"; }
function forgePlan(){
  const F=forgeData(); if(!F) return null;
  const t=today(), log=(F.workoutLog||[]).filter(w=>w.cali||w.libre), L=log[log.length-1], LL=(F.workoutLog||[]).filter(w=>w.cali).pop();
  const done=!!(L&&L.date===t);
  let info;
  if(!L||dDiff(L.date,t)>=2) info={k:"cali",t:LL?(LL.cali==="A"?"B":"A"):"A"};
  else if(L.date===t) info={k:"cali",t:L.cali||(LL&&LL.cali==="A"?"B":"A"),libre:L.libre?L.nom:null};
  else info={k:"off"};
  return {k:info.k, t:info.t, done, libre:info.libre||null};
}
function forgeTxt(p){ if(!p) return null;
  if(p.k==="cali"&&p.libre) return p.libre+" ✓";
  if(p.k==="cali") return (p.t==="A"?"🛫 Séance A — planche":"🤸 Séance B — HSPU")+(p.done?" ✓":"");
  return "🥊 Récup : boxe ou souplesse"; }
function forgeOpen(){ window.open(forgeUrl(),"_blank","noopener"); }
function forgeWeek(ws){ const F=forgeData(); if(!F) return null; const we=dayShift(ws,6);
  const inW=x=>x.date>=ws&&x.date<=we;
  return {cali:(F.workoutLog||[]).filter(w=>w.cali&&inW(w)).length, boxe:(F.boxeLog||[]).filter(inW).length, soup:(F.mobLog||[]).filter(inW).length}; }

  let el=document.getElementById("fov");
  if(!el){ el=document.createElement("div"); el.id="fov"; el.className="fov"; document.body.appendChild(el); }
  const a=S.apps.find(x=>x.id===F.id)||{emoji:"🎯",name:"Focus"};
  const paint=()=>{ const end=F.start+F.dur*60000, left=Math.max(0,end-Date.now());
    if(left<=0){ focusEnd(true); return; }
    const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
    el.innerHTML=`<div class="fe">${a.emoji}</div><div class="fn">${esc(a.name)}</div>
      <div class="ft">${m}:${pad2(s)}</div>
      <div class="fbar"><i style="width:${Math.round((1-left/(F.dur*60000))*100)}%"></i></div>
      <div class="fs">Pose ton téléphone. Une seule chose jusqu'à la fin.<br>Instagram attend : la porte est fermée pendant le focus.</div>
      <button onclick="focusStop()">Arrêter le focus</button>`; };
  paint(); clearInterval(fT); fT=setInterval(paint,1000);
}
function focusStop(){ if(!confirm("Arrêter le focus maintenant ?\n\nLe temps déjà passé reste compté.")) return; focusEnd(false); }
function focusEnd(complete){
  const F=S.focusRun; clearInterval(fT); const el=document.getElementById("fov"); if(el) el.remove();
  if(!F) return;
  S.focusRun=null;
  if(S.run&&S.run.id===F.id){ if(complete) S.run.t0=Math.max(S.run.t0,Date.now()-F.dur*60000-(F.start-F.t0)); stopTimer(true); }
  const C=acc(), t=today(); C.fs[t]=(C.fs[t]||0)+(complete?1:0);
  save(); render();
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
  toast(complete?"🎯 Focus terminé : "+F.dur+" min. Bravo.":"Focus arrêté — le temps passé est compté.");
  const fm=complete?F.dur:Math.round((Date.now()-F.start)/60000), fa=S.apps.find(x=>x.id===F.id);
  if(fm>=5) setTimeout(()=>openWork({sujet:fa?fa.name:"", min:fm}),500);
}
function focusResume(){ const F=S.focusRun; if(!F) return; if(Date.now()>=F.start+F.dur*60000) focusEnd(true); else focusShow(); }

function accMerge(Rc){

    ["m","s","tel"].forEach(x=>{ if(b[x]&&!a[x]){ a[x]=b[x]; ch=true; } }); });
  Object.keys(Rc.bilans||{}).forEach(w=>{ const b=Rc.bilans[w]; if(b&&(!C.bilans[w]||(b.t||0)>(C.bilans[w].t||0))){ C.bilans[w]=b; ch=true; } });
  Object.keys(Rc.jp||{}).forEach(d=>{ const a=(acc().jp=acc().jp||{})[d]=(acc().jp[d]||{}); Object.keys(Rc.jp[d]||{}).forEach(k=>{ if(!a[k]){ a[k]=Rc.jp[d][k]; ch=true; } }); });
  Object.keys(Rc.sos||{}).forEach(d=>{ const A=acc(); if(!A.sos) A.sos={}; const L=A.sos[d]=A.sos[d]||[], seen=new Set(L.map(x=>x.at)); (Rc.sos[d]||[]).forEach(x=>{ if(!seen.has(x.at)){ L.push(x); ch=true; } }); });
  if(Array.isArray(Rc.work)){ const W=wAll(), ids=new Set(W.map(x=>x.id)); Rc.work.forEach(x=>{ if(x&&!ids.has(x.id)){ W.push(x); ch=true; } }); }
  Object.keys(Rc.fs||{}).forEach(d=>{ const v=Math.max(C.fs[d]||0,Rc.fs[d]||0); if(v!==(C.fs[d]||0)){ C.fs[d]=v; ch=true; } });
  if(lireMerge(Rc.lire)) ch=true;
  return ch;
}

/* ═══════════════════════════════════════════════════════════════════
   LE SYSTÈME — le Pointage au centre du téléphone.
   • L'agenda de l'iPhone arrive ici par un raccourci (#cal=…) : ce qui se
     passe maintenant, ce qui vient ensuite, les cours, les trous à exploiter.
     Pendant un cours, la porte d'Instagram est fermée.
   • Les outils : les apps utiles du téléphone (Doctolib, Calendrier…),
     lancées d'ici. Les autres n'ont pas leur place sur l'accueil.
   • Envoyer à Claude : tout le contexte en un geste, sans API — partage
     vers l'app Claude, copie, ou mail à soi-même (que Claude lit via Gmail).
   • Les rituels s'ouvrent seuls au premier passage du matin et du soir.
   ═══════════════════════════════════════════════════════════════════ */
const POINTAGE_URL="https://niclaeysthomas-ctrl.github.io/pointage/";

/* ---- l'agenda de l'iPhone ---- */
const COURS_RE=/\b(cours|td|tp|cm|amphi|partiel|exam|examen|colle|conf[ée]rence|s[ée]minaire|lecture|class)\b/i;
function calGet(){ if(!S.cal||!Array.isArray(S.cal.ev)) S.cal={at:0,ev:[]}; return S.cal; }
function isCours(e){ const L=S.calCours; if(Array.isArray(L)&&L.length) return L.includes(e.c); return COURS_RE.test(e.t||"")||/escp|école|ecole|univ|cours/i.test(e.c||""); }
function calImport(raw){
  const ev=[];
  String(raw||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(l=>{
    const p=l.split("|").map(x=>x.trim()); if(p.length<2) return;
    const t=p[0], s=p[1], e=p[2], loc=p[3], c=p[4];
    const dOnly=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||"");
    const ts=Date.parse(dOnly(s)?s+"T00:00:00":s); if(isNaN(ts)) return;
    let te=e?Date.parse(dOnly(e)?e+"T23:59:00":e):NaN; if(isNaN(te)) te=ts+36e5;
    ev.push({t:t||"(sans titre)", s:ts, e:te, l:loc||"", c:c||"", ad:(dOnly(s)||te-ts>=23*36e5)?1:0});
  });
  ev.sort((a,b)=>a.s-b.s);
  S.cal={at:Date.now(), ev}; save0();
  return ev.length;
}
function dayBounds(ms){ const d=new Date(ms); d.setHours(0,0,0,0); return [d.getTime(), d.getTime()+864e5]; }
function calDay(ms){ const [a,b]=dayBounds(ms); return calGet().ev.filter(e=>e.e>a&&e.s<b); }
function calToday(){ return calDay(Date.now()); }
function calNow(){ const n=Date.now(); return calGet().ev.filter(e=>!e.ad&&e.s<=n&&e.e>n); }
function calNext(){ const n=Date.now(); return calGet().ev.filter(e=>!e.ad&&e.s>n)[0]||null; }
function coursNow(){ return calNow().find(isCours)||null; }
function hhmmOf(ms){ const d=new Date(ms); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function memeJour(a,b){ return new Date(a).toDateString()===new Date(b).toDateString(); }
function calStale(){ const C=calGet(); return C.at&&Date.now()-C.at>21*864e5; }
function calDayLbl(ms){ const n=Date.now(); if(memeJour(ms,n)) return "Aujourd'hui"; if(memeJour(ms,n+864e5)) return "Demain";
  return new Date(ms).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"}); }
function calHtml(){
  const C=calGet();
  if(!C.at) return `<div class="kcal" onclick="calPaste()"><div class="kcalh"><b>🎓 Mes prochains cours</b><span>importer ›</span></div>
    <div class="kcalrow"><span>📋</span><div><i>Pas encore importés</i><b>Touche ici et colle le texte de tes cours</b></div></div></div>`;
  const n=Date.now(), fut=C.ev.filter(e=>!e.ad&&e.e>n), now=fut.find(e=>e.s<=n), next=fut.filter(e=>e.s>n).slice(0,4);
  let h=`<div class="kcalh"><b>🎓 Mes prochains cours</b><span>tout voir ›</span></div>`;
  if(now) h+=`<div class="kcalrow now"><span>${isCours(now)?"🎓":"📍"}</span><div><i>En ce moment · jusqu'à ${hhmmOf(now.e)}</i><b>${esc(now.t)}</b>${now.l?`<small>${esc(now.l)}</small>`:""}</div></div>`;
  next.forEach((e,k)=>{ const m=Math.round((e.s-n)/60000);
    h+=`<div class="kcalrow ${k===0&&!now?"now":""} ${memeJour(e.s,n+864e5)?"dem":""}"><span>${isCours(e)?"🎓":"🕐"}</span><div><i>${calDayLbl(e.s)} · ${hhmmOf(e.s)}–${hhmmOf(e.e)}${k===0&&m<36*60?" · "+fmtIn(m):""}</i><b>${esc(e.t)}</b>${e.l?`<small>${esc(e.l)}</small>`:""}</div></div>`; });
  if(!now&&!next.length) h+=`<div class="kcalrow"><span>📅</span><div><i>Agenda</i><b>Aucun cours à venir dans l'agenda importé</b></div></div>`;
  if(calStale()) h+=`<div class="kcalstale">Agenda importé il y a ${Math.round((n-C.at)/864e5)} jours : pense à le réimporter.</div>`;
  return `<div class="kcal" onclick="openCal()">${h}</div>`;
}

      ${calCals.map((c,i)=>`<div class="kcheck ${L.includes(c)?"on":""}" onclick="calTog(${i})"><span class="kb">✓</span>${esc(c)}</div>`).join("")}</div>`:""}
