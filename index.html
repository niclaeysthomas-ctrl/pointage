    cursor:pointer;font-size:12.5px;flex:none}
  .kladder{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.6;text-align:center}
  .klink{display:block;width:100%;background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:700;padding:12px 0 0;
    cursor:pointer;text-decoration:underline;font-family:inherit}
  .kwhy{margin-top:14px;padding:13px 15px;border-radius:14px;background:var(--card2);font-size:14px;line-height:1.55;font-style:italic;
    white-space:pre-wrap;overflow-wrap:anywhere}
  .kwhy b{display:block;font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .kcount{font-family:var(--disp);font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent);
    line-height:1;margin:10px 0}
  .kban{border-radius:16px;padding:13px 15px;margin:4px 0 12px;font-size:13.5px;line-height:1.5;background:var(--accent-soft);
    border-left:4px solid var(--accent)}
  .kban b{font-weight:800}
  .kban.min{background:var(--good-soft);border-left-color:var(--good)}
  .kban i{display:block;margin-top:6px;opacity:.85;overflow-wrap:anywhere}
  .kban button{margin-top:9px;border:none;background:var(--card);color:var(--ink);font-weight:800;border-radius:11px;padding:9px 12px;
    cursor:pointer;font-size:13px;font-family:inherit}
  .ksec{margin-top:22px}
  .ksec>h4{font-family:var(--disp);font-size:16px;font-weight:800;margin-bottom:4px}
  .ksec>p,.ksec p.kp{color:var(--muted);font-size:12.5px;line-height:1.55;margin-bottom:8px}
  .ksec p b{color:var(--ink)}
  .kstp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .kstp .kl{flex:1;min-width:0;font-weight:700;font-size:14px}
  .kstp .kl small{display:block;color:var(--muted);font-weight:600;font-size:11.5px;margin-top:2px;line-height:1.4}
  .kstp .kl small.pend{color:var(--accent)}
  .kstp .kl small.pend a{color:var(--accent);font-weight:800}
  .kstp .kv{font-family:var(--disp);font-weight:800;font-size:16px;min-width:58px;text-align:center;flex:none}
  .kstp button{min-width:36px;height:36px;border-radius:11px;border:none;background:var(--card2);color:var(--ink);font-size:17px;
    font-weight:800;cursor:pointer;flex:none;font-family:inherit;padding:0 10px}
  .kstp button.t{font-size:13px}
  .kstp select{background:var(--card2);border:none;border-radius:11px;color:var(--ink);font-weight:800;font-size:14px;padding:9px 10px;font-family:inherit}
  .kcode{font-family:var(--mono);font-size:46px;font-weight:800;letter-spacing:.3em;text-align:center;margin:12px 0;padding:14px 0 14px .3em;
    border-radius:16px;background:var(--card2)}
  .kguide{margin:6px 0 0 18px;font-size:13px;line-height:1.6}
  .kguide li{margin-bottom:9px}
  .kguide code{font-family:var(--mono);font-size:11.5px;background:var(--card2);padding:1px 5px;border-radius:6px;overflow-wrap:anywhere}
  .ksec details{border-radius:13px;background:var(--card2);padding:11px 13px;margin-top:8px}
  .ksec summary{font-weight:800;font-size:14px;cursor:pointer}
  .ksec details[open] summary{margin-bottom:6px}
  .ksec textarea{width:100%;min-height:90px;background:var(--card2);border:2px solid transparent;border-radius:13px;color:var(--ink);
    padding:12px;font-size:15px;font-family:inherit;line-height:1.5;resize:vertical}
  .ksec textarea:focus{outline:none;border-color:var(--accent)}
  .khist{width:100%;border-collapse:collapse;font-size:12.5px}
  .khist td,.khist th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
  .khist th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .khist td:first-child,.khist th:first-child{text-align:left}

  /* ---- L'ACCUEIL : dock, rituels, chose du jour, focus ---- */
  .kdock{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:14px 0 2px}
  .kdock button{border:none;background:var(--card);box-shadow:var(--shadow-sm);border-radius:14px;padding:9px 0 8px;cursor:pointer;
    color:var(--ink);font-family:inherit;font-size:10px;font-weight:750;display:flex;flex-direction:column;align-items:center;gap:4px;
    white-space:nowrap;overflow:hidden}
  .kdock button span{font-size:20px;line-height:1}
  .kdock button:active{transform:scale(.94)}
  .krit{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:18px;padding:14px 16px;margin:14px 0 0;
    cursor:pointer;text-align:left;font-family:inherit;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent2));
    box-shadow:0 8px 22px var(--accent-soft)}
  .krit:active{transform:scale(.98)}
  .krit.soir{background:linear-gradient(120deg,#4b3fb5,#6c5ce7);box-shadow:0 8px 22px rgba(108,92,231,.25)}
  .krit.bilan{background:linear-gradient(120deg,#0f9b6c,#12b76a);box-shadow:0 8px 22px var(--good-soft)}
  .krit .ke{font-size:26px;flex:none}
  .krit b{display:block;font-family:var(--disp);font-size:16px;font-weight:800}
  .krit small{display:block;font-size:12.5px;opacity:.92;font-weight:600;margin-top:1px}
  .krit .kgo{margin-left:auto;font-size:22px;font-weight:800;flex:none}
  .kfocusd{display:flex;gap:11px;align-items:center;background:var(--card);border-radius:15px;padding:11px 14px;margin:12px 0 0;
    box-shadow:var(--shadow-sm);font-size:14px;cursor:pointer;line-height:1.35}
  .kfocusd b{font-weight:800;overflow-wrap:anywhere}
  .kfocusd i{font-style:normal;color:var(--accent);font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;display:block}
  .kcheck{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;font-weight:700;font-size:14px}
  .kcheck .kb{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;font-size:13px;flex:none}
  .kcheck.on .kb{background:var(--good);border-color:var(--good);color:#fff}
  .kstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
  .kstat div{background:var(--card2);border-radius:13px;padding:10px 4px;text-align:center}
  .kstat b{display:block;font-family:var(--disp);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .kstat small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px;line-height:1.25}
  .fov{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:30px 24px calc(30px + env(safe-area-inset-bottom));text-align:center}
  .fov .fe{font-size:46px}
  .fov .fn{font-family:var(--disp);font-size:20px;font-weight:800;margin-top:6px}
  .fov .ft{font-family:var(--disp);font-size:84px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:18px 0 4px}
  .fov .fs{color:var(--muted);font-size:14px;line-height:1.55;max-width:340px}
  .fov .fbar{width:min(320px,90%);height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:14px 0 18px}
  .fov .fbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .fov button{margin-top:28px;border:none;background:var(--card2);color:var(--muted);font-weight:800;border-radius:13px;padding:12px 20px;cursor:pointer;font-family:inherit}

  /* ---- LE SYSTÈME : agenda, outils, envoi à Claude ---- */
  .kcal{background:var(--card);border-radius:18px;padding:3px 15px;margin:12px 0 0;box-shadow:var(--shadow-sm);cursor:pointer}
  .kcalrow{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .kcalrow:last-child{border-bottom:none}
  .kcalrow>span{font-size:20px;flex:none;width:26px;text-align:center;line-height:1.3}
  .kcalrow i{display:block;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .kcalrow.now i{color:var(--accent)}
  .kcalrow b{display:block;font-weight:800;font-size:14.5px;overflow-wrap:anywhere;line-height:1.3}
  .kcalrow small{display:block;color:var(--muted);font-size:12px;font-weight:600}
  .kcalh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px}
  .kcalh b{font-family:var(--disp);font-size:15px;font-weight:800}
  .kcalh span{font-size:12px;color:var(--muted);font-weight:700}
  .kcalstale{font-size:11.5px;color:var(--accent);font-weight:700;padding:0 0 10px}
  .kday{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:16px 0 0}
  .kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;margin-top:14px}
  .kgrid button{border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;
    color:var(--ink);font-size:11px;font-weight:700;position:relative;line-height:1.2;text-align:center}
  .kgrid button span{width:58px;height:58px;border-radius:17px;background:var(--card2);display:grid;place-items:center;font-size:28px;box-shadow:var(--shadow-sm)}
  .kgrid button:active span{transform:scale(.92)}
  .kgrid button em{position:absolute;top:-6px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-style:normal;
    font-size:12px;font-weight:800;display:grid;place-items:center}
  .kpre{white-space:pre-wrap;font-family:var(--mono);font-size:11px;line-height:1.5;max-height:260px;overflow:auto;background:var(--card2);
    border-radius:12px;padding:10px;margin-top:8px;overflow-wrap:anywhere}

  /* ---- L'ÉCHÉANCE : la date qui commande la semaine ---- */
  .kech{background:linear-gradient(135deg,#1c2a4a,#24365e);color:#fff;border-radius:20px;padding:15px 16px 6px;margin:14px 0 0;box-shadow:0 10px 26px rgba(28,42,74,.28)}
  .kech .kh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .kech .kh>span{font-size:26px}
  .kech .kh b{display:block;font-family:var(--disp);font-size:17px;font-weight:800}
  .kech .kh small{display:block;font-size:12px;opacity:.75;font-weight:600}
  .kech .kj{margin-left:auto;font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:-.02em}
  .kech .kcheck{border-bottom-color:rgba(255,255,255,.12);font-size:13.5px;line-height:1.4;align-items:flex-start}
  .kech .kcheck:last-child{border-bottom:none}
  .kech .kcheck .kb{border-color:rgba(255,255,255,.35);margin-top:1px}
  .kech .kcheck.on{opacity:.6}
  .kech .kcheck.on .kb{background:#34d17f;border-color:#34d17f}
  .kech .kfoot{font-size:11.5px;opacity:.7;padding:4px 0 10px}
  .kech .kgo2{flex:none;border:none;background:rgba(255,255,255,.14);color:#fff;font-weight:800;border-radius:9px;width:32px;height:30px;cursor:pointer;font-size:14px}

  /* ---- le coach et le carnet de travail ---- */
  .ktip,.kwork{background:var(--card);border-radius:18px;padding:12px 15px 14px;margin:12px 0 0;box-shadow:var(--shadow-sm)}
  .ktip-h{display:flex;justify-content:space-between;align-items:center}
  .ktip-h b{font-family:var(--disp);font-size:14.5px;font-weight:800}
  .ktip-h button{border:none;background:none;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
  .ktip-b{display:flex;gap:11px;margin-top:8px;align-items:flex-start}
  .ktip-b>span{font-size:24px;line-height:1.1}
  .ktip-b b{display:block;font-size:14.5px;font-weight:800;line-height:1.35}
  .ktip-b small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:3px}
  .kwork-n{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}
  .kwork-n b{font-family:var(--disp);font-size:26px;font-weight:800;white-space:nowrap}
  .kwork-n span{color:var(--muted);font-size:12.5px;font-weight:600}
  .kwork-r{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
  .kwork-r b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kwork-r span{color:var(--muted);flex:none;letter-spacing:.05em}

  /* ---- la proposition de journée ---- */
  .kjp{background:var(--card);border-radius:18px;padding:12px 14px 10px;margin:12px 0 0;box-shadow:var(--shadow-sm)}
  .kjp-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .kjp-h b{font-family:var(--disp);font-size:15px;font-weight:800}
  .kjp-t{display:flex;background:var(--card2);border-radius:10px;padding:3px}
  .kjp-t button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:800;color:var(--muted);padding:5px 9px;border-radius:8px;cursor:pointer}
  .kjp-t button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
  .kjp-s{font-size:12px;color:var(--muted);font-weight:600;margin:4px 0 6px}
  .kjp-r{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .kjp-tm{width:42px;flex:none;font-family:var(--mono);font-size:12px;font-weight:700;line-height:1.25;color:var(--ink)}
  .kjp-tm small{color:var(--faint);font-weight:600}
  .kjp-e{font-size:19px;width:24px;text-align:center;flex:none}
  .kjp-n{flex:1;min-width:0;cursor:pointer}
  .kjp-n b{display:block;font-size:13.5px;font-weight:750;line-height:1.3}
  .kjp-n small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.35}
  .kjp-c{width:30px;height:30px;flex:none;border-radius:9px;border:2px solid var(--line2);background:none;color:#fff;font-weight:800;cursor:pointer}
  .kjp-r.done .kjp-c{background:var(--good);border-color:var(--good)}
  .kjp-r.done .kjp-n b{text-decoration:line-through;opacity:.6}
  .kjp-r.passe{opacity:.55}
  .kjp-r.now{background:var(--accent-soft);margin:0 -14px;padding-left:14px;padding-right:14px}
  .kjp-r.cours{background:color-mix(in srgb,#3b82f6 12%,transparent);margin:0 -14px;padding-left:14px;padding-right:14px;border-left:4px solid #3b82f6}
  .kjp-r.cours .kjp-n b{color:#3b82f6}
  .kjp-r.fix .kjp-n b{font-weight:650;color:var(--muted)}
  .kjp-x{font-size:12px;color:var(--muted);padding:8px 0 2px;border-top:1px solid var(--line);line-height:1.5}
  .kcalrow.dem i{color:#3b82f6}
  .kcalrow.dem b{color:#3b82f6}

  /* ---- SOS anti-scroll ---- */
  .ksosbtn{display:flex;justify-content:space-between;align-items:center;width:100%;border:none;background:#e5484d;color:#fff;font:inherit;font-size:14px;font-weight:800;border-radius:14px;padding:11px 15px;cursor:pointer;margin:12px 0 0;box-shadow:var(--shadow-sm)}
  .ksosbtn span{font-size:12px;opacity:.85}
  .ksos-eb{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#e5484d;margin-bottom:4px}
  .ksos-best{font-size:10.5px;font-weight:800;color:var(--good);border:1px solid var(--good);border-radius:999px;padding:1px 6px;margin-left:4px}
  .ksos-t{font-family:var(--mono);font-size:58px;font-weight:800;text-align:center;margin:14px 0 6px}
  .ksos-t.over{color:var(--good)}
  .kjp-k{color:var(--good);font-weight:800}

  /* ---- le coach de bout en bout ---- */
  .kco{background:var(--card);border-radius:18px;padding:13px 15px 12px;margin:12px 0 0;box-shadow:var(--shadow-sm);border:2px solid var(--ink)}
  .kco-h{display:flex;justify-content:space-between;align-items:center}
  .kco-h b{font-family:var(--disp);font-size:15px;font-weight:800}
  .kco-h span{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted)}
  .kco-h em{color:#e5484d;font-style:normal}
  .kco-say{font-size:14px;line-height:1.5;font-weight:650;margin:8px 0 10px;font-style:italic}
  .kco-now{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:14px;padding:11px 12px}
  .kco-now.cours{background:color-mix(in srgb,#3b82f6 14%,transparent)}
  .kco-now>span{font-size:28px}
  .kco-now i{display:block;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
  .kco-now b{display:block;font-size:16px;font-weight:800;line-height:1.3}
  .kco-now small{display:block;font-size:12px;color:var(--muted);font-weight:600;line-height:1.4}
  .kco-b{display:flex;gap:8px;margin-top:9px}
  .kco-b .btn{flex:1}
  .kco-next{font-size:12.5px;color:var(--muted);font-weight:650;margin-top:9px}
  .kco-tip{font-size:12px;color:var(--muted);line-height:1.45;margin-top:9px;cursor:pointer}

  /* ═══════════ LOOK « OPAL » : nuit profonde, aurore violette, gemmes ═══════════ */
  :root{
    --bg:#f5f4fb; --bg2:#eceaf7; --card:#ffffff; --card2:#f3f1fb; --line:#e7e4f3; --line2:#dcd8ee;
    --ink:#17152b; --muted:#6b6886; --faint:#a19eb9;
    --accent:#6d5cff; --accent2:#3fa2ff; --accent-soft:rgba(109,92,255,.12);
    --good:#10b981; --good-ink:#fff; --good-soft:rgba(16,185,129,.12); --bad:#f43f5e;
    --gem:linear-gradient(135deg,#8b5cf6 0%,#6d5cff 40%,#3fa2ff 100%);
    --gem-soft:linear-gradient(135deg,rgba(139,92,246,.16),rgba(63,162,255,.12));
    --shadow:0 1px 2px rgba(40,30,90,.05),0 12px 32px rgba(60,40,140,.08); --shadow-sm:0 1px 2px rgba(40,30,90,.06);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#07070e; --bg2:#0d0c18; --card:#12111f; --card2:#1b1a2c; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --ink:#f3f1ff; --muted:#a3a0c2; --faint:#666385;
    --accent:#8b7bff; --accent2:#4fb3ff; --accent-soft:rgba(139,123,255,.16);
    --good:#3ee6a6; --good-ink:#04150e; --good-soft:rgba(62,230,166,.14); --bad:#ff5c7a;
    --gem:linear-gradient(135deg,#a78bfa 0%,#7c6cff 45%,#4fb3ff 100%);
    --gem-soft:linear-gradient(135deg,rgba(167,139,250,.18),rgba(79,179,255,.10));
    --shadow:0 0 0 1px rgba(255,255,255,.05),0 20px 50px rgba(0,0,0,.45); --shadow-sm:0 0 0 1px rgba(255,255,255,.04);
  }}
  :root[data-theme="dark"]{
    --bg:#07070e; --bg2:#0d0c18; --card:#12111f; --card2:#1b1a2c; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --ink:#f3f1ff; --muted:#a3a0c2; --faint:#666385;
    --accent:#8b7bff; --accent2:#4fb3ff; --accent-soft:rgba(139,123,255,.16);
    --good:#3ee6a6; --good-ink:#04150e; --good-soft:rgba(62,230,166,.14); --bad:#ff5c7a;
    --gem:linear-gradient(135deg,#a78bfa 0%,#7c6cff 45%,#4fb3ff 100%);
    --gem-soft:linear-gradient(135deg,rgba(167,139,250,.18),rgba(79,179,255,.10));
    --shadow:0 0 0 1px rgba(255,255,255,.05),0 20px 50px rgba(0,0,0,.45); --shadow-sm:0 0 0 1px rgba(255,255,255,.04);
  }
  :root[data-theme="light"]{
    --bg:#f5f4fb; --bg2:#eceaf7; --card:#ffffff; --card2:#f3f1fb; --line:#e7e4f3; --line2:#dcd8ee;
    --ink:#17152b; --muted:#6b6886; --faint:#a19eb9;
    --accent:#6d5cff; --accent2:#3fa2ff; --accent-soft:rgba(109,92,255,.12);
    --good:#10b981; --good-ink:#fff; --good-soft:rgba(16,185,129,.12); --bad:#f43f5e;
  }
  body{background:
      radial-gradient(60% 34% at 85% -4%, rgba(124,108,255,.30), transparent 70%),
      radial-gradient(50% 30% at 8% 0%, rgba(79,179,255,.18), transparent 70%),
      radial-gradient(40% 24% at 50% 100%, rgba(167,139,250,.10), transparent 70%),
      var(--bg);
    background-attachment:fixed}
  /* cartes : bord fin, coins doux, comme Opal */
  .summary,.kcal,.kjp,.kco,.ktip,.kwork,.kfocusd,.agcard,.jcard,.ccard,.krit,.kech,.kdock{border:1px solid var(--line);border-radius:22px}
  /* en-tête : plus de chevauchement */
  header{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px;padding:22px 2px 10px}
  header .brand{position:static;grid-column:2;grid-row:1}
  header>.eyebrow{grid-column:1;grid-row:1}
  header>.today{grid-column:1 / -1;grid-row:2;margin-top:6px}
  .eyebrow{color:var(--accent)} .eyebrow::before{background:var(--gem)}
  .today{background:linear-gradient(180deg,var(--ink) 30%,color-mix(in srgb,var(--ink) 70%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tgl{border:1px solid var(--line)}
  .rule{display:none}
  /* boutons et barres : la gemme */
  .btn:not(.ghost){background:var(--gem);box-shadow:0 8px 24px -10px rgba(109,92,255,.7)}
  .btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
  .kprog,.segbar i{background:var(--card2)}
  .kech{background:radial-gradient(120% 140% at 100% 0%,rgba(79,179,255,.35),transparent 55%),linear-gradient(135deg,#241a5e,#3a2d9c 55%,#2a4fb0);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px -28px rgba(80,70,220,.8)}
  .kprog i{background:linear-gradient(90deg,#a78bfa,#6d5cff 45%,#3fa2ff 80%,#3ee6a6)}
  /* le coach : bord en dégradé lumineux */
  .kco{border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--gem) border-box;
    box-shadow:0 0 0 1px rgba(124,108,255,.08),0 24px 60px -24px rgba(124,108,255,.55)}
  .kco-now{background:var(--gem-soft);border:1px solid var(--line)}
  .kco-now i{color:var(--accent)}
  .kco-say{font-style:normal;color:var(--ink);opacity:.92}
  /* SOS : rouge corail doux, pas d'alarme criarde */
  .ksosbtn{background:linear-gradient(135deg,#ff5c7a,#ff7a59);box-shadow:0 10px 30px -14px rgba(255,92,122,.8)}
  /* cours : bleu électrique */
  .kjp-r.cours{background:linear-gradient(90deg,rgba(79,179,255,.14),transparent);border-left-color:#4fb3ff}
  .kjp-r.cours .kjp-n b,.kcalrow.dem i,.kcalrow.dem b{color:#4fb3ff}
  .kjp-r.done .kjp-c{background:var(--good);border-color:var(--good);color:var(--good-ink)}
  .kjp-t{background:var(--card2);border:1px solid var(--line)}
  /* feuilles (pop-ups) */
  .sheet{border:1px solid var(--line);border-bottom:none}
  #ov{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  /* ═══════════ ORDINATEUR : un vrai tableau de bord sur deux colonnes ═══════════ */
  .cols{display:block}
  @media (min-width:980px){
    #app{max-width:1180px;padding:10px 32px 48px}
    header{padding:30px 4px 18px}
    .today{font-size:40px}
    .cols{display:grid;grid-template-columns:minmax(380px,440px) 1fr;gap:28px;align-items:start}
    .col-l>:first-child{margin-top:12px}
    .col-r>:first-child{margin-top:12px}
    .sheet{border-radius:26px;margin-bottom:4vh}
    #ov{align-items:center}
  }
  @media (min-width:1380px){
    #app{max-width:1360px}
    .cols{grid-template-columns:440px 1fr}
  }
  @media (max-width:420px){ header .brand .mk{display:none} header>.eyebrow{font-size:10px;letter-spacing:.12em;white-space:nowrap} header>.eyebrow::before{display:none} }

  /* ═══════════ LOOK OPAL, 2e passe ═══════════ */
  .applist .row{border:1px solid var(--line);margin-bottom:12px}
  .applist .row .start{background:var(--gem);color:#fff;box-shadow:0 8px 22px -12px rgba(109,92,255,.8)}
  .applist .row .open{background:var(--card2);border:1px solid var(--line);color:var(--ink)}
  .applist .row .iconchip{border:1px solid var(--line)}
  .heat i.on{background:var(--gem)}
  .kgem{font-family:var(--mono);font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;cursor:pointer;
    background:var(--gem-soft);border:1px solid rgba(139,123,255,.35);color:var(--ink);white-space:nowrap}
  .kban.min button{margin-left:6px;border:1px solid var(--line2);background:transparent;color:inherit;font:inherit;font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;cursor:pointer}
  .kjp-x{padding:9px 0 2px;border-top:1px solid var(--line)}
  .kjp-x summary{cursor:pointer;font-size:12.5px;font-weight:750;color:var(--muted);list-style:none}
  .kjp-x summary::-webkit-details-marker{display:none}
  .kjp-xl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .kjp-xl span{font-size:12px;font-weight:650;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
  .kjp-r{transition:background .15s}
  .kjp-r.now{background:var(--gem-soft)}
  .kjp-c{transition:transform .12s} .kjp-c:active{transform:scale(.88)}
  .cgo{border:1px solid rgba(139,123,255,.3)!important}
  .only-desk{display:none}
  @media (min-width:980px){
    .only-desk{display:block} .only-mob{display:none}
    .applist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
    .applist>.cathead,.applist>.cvide,.applist>.catrows,.applist>div:not(.appgrp):not(.row){grid-column:1/-1;margin:14px 0 -2px}
    .applist>.catrows{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .applist .appgrp>.cathead{margin-top:6px}
    .applist .row{margin-bottom:0}
    .kdock{display:grid;grid-template-columns:repeat(6,1fr)}
  }
  .cjx{white-space:nowrap}

  /* ---- points ---- */
  .kpts{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:13px 15px 11px;margin:12px 0 0;cursor:pointer;
    background:radial-gradient(120% 120% at 100% 0%,rgba(62,230,166,.10),transparent 55%),var(--card)}
  .kpts-h{display:flex;justify-content:space-between;align-items:center}
  .kpts-h b{font-family:var(--disp);font-size:15px;font-weight:800}
  .kpts-g{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--gem-soft);border:1px solid rgba(139,123,255,.3)}
  .kpts-n{display:flex;align-items:baseline;gap:8px;margin-top:6px}
  .kpts-n b{font-family:var(--disp);font-size:34px;font-weight:800;letter-spacing:-.02em;background:var(--gem);-webkit-background-clip:text;background-clip:text;color:transparent}
  .kpts-n span{font-size:12.5px;color:var(--muted);font-weight:650}
  .kpts-w{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:62px}
  .kpts-w div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
  .kpts-w i{display:block;width:100%;max-width:26px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
  .kpts-w i.ok{background:linear-gradient(180deg,#3ee6a6,#2bb57f)}
  .kpts-w i.t{background:var(--gem);border-color:transparent}
  .kpts-w small{font-size:10px;color:var(--faint);font-weight:700;text-transform:uppercase}
  .kpts-f{font-size:12px;color:var(--muted);font-weight:650;margin-top:8px}
  .kpts-pos{color:var(--good);font-family:var(--mono)} .kpts-neg{color:var(--bad);font-family:var(--mono)}
  .kgem.pts{background:linear-gradient(135deg,rgba(62,230,166,.18),rgba(79,179,255,.12));border-color:rgba(62,230,166,.35)}

  /* ═══════════ ONGLETS ═══════════ */
  #app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .ktabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;
    display:flex;gap:2px;padding:6px;border-radius:24px;width:min(520px,calc(100% - 20px));
    background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--line2);box-shadow:0 18px 50px -12px rgba(0,0,0,.45)}
  .ktabs button{flex:1;position:relative;border:none;background:none;color:var(--muted);font:inherit;cursor:pointer;border-radius:18px;
    padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .15s,color .15s}
  .ktabs .ke{font-size:19px;line-height:1;filter:grayscale(.6);opacity:.8}
  .ktabs .kl{font-size:10.5px;font-weight:750;letter-spacing:.01em}
  .ktabs button.on{background:var(--gem-soft);color:var(--ink)}
  .ktabs button.on .ke{filter:none;opacity:1}
  .ktabs i{position:absolute;top:3px;right:calc(50% - 22px);font-style:normal;font-size:9.5px;font-weight:800;font-family:var(--mono);
    background:var(--gem);color:#fff;border-radius:999px;padding:1px 5px;min-width:16px;text-align:center}
  .kchain{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:13px 15px 11px;margin:12px 0 0;cursor:pointer}
  .kchain-d{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin:10px 0 2px}
  .kchain-d i{height:22px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
  .kchain-d i.ok{background:linear-gradient(180deg,#3ee6a6,#2bb57f);border-color:transparent}
  .kchain-d i.t{outline:2px solid var(--accent);outline-offset:1px}
  .kprog-grid{margin-top:12px}
  .ktips{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-top:12px}
  .ktips b{font-family:var(--disp);font-size:15px}
  .ktips p{font-size:13.5px;line-height:1.7;color:var(--muted);margin-top:8px}
  .ktabnote{font-size:12.5px;color:var(--faint);margin:12px 4px 0;line-height:1.5}
  @media (min-width:980px){
    #app{display:flex;flex-direction:column}
    #app>header{order:-2}
    .ktabs{order:-1;position:sticky;top:12px;bottom:auto;left:auto;transform:none;align-self:flex-start;width:auto;padding:5px;border-radius:18px;margin:2px 0 6px}
    .ktabs button{flex-direction:row;gap:7px;padding:8px 14px}
    .ktabs .ke{font-size:16px}
    .ktabs .kl{font-size:13px}
    .ktabs i{position:static;margin-left:2px}
    #app{padding-bottom:48px}
  }
  /* ─── 📖 LIRE ─── */
  .klire{background:var(--card);border-radius:22px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
  .klire .kpts-g{cursor:pointer}
  .klire-ok{font-size:12.5px;color:var(--good);font-weight:700;margin:8px 0 0}
  .klire-lec{display:block;width:100%;text-align:left;border:none;cursor:pointer;margin-top:10px;padding:14px 15px;border-radius:16px;
    background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--card2);color:var(--ink);font-family:inherit}
  .klire-lec i{display:block;font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .klire-lec b{display:block;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:19px;line-height:1.25;margin:5px 0 3px}
  .klire-lec small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
  .klire-bar{display:block;height:4px;border-radius:4px;background:var(--line2);margin-top:10px;overflow:hidden}
  .klire-bar em{display:block;height:100%;background:var(--accent)}
  .klire-row{display:flex;gap:8px;margin-top:10px}
  .klire-row button{flex:1;border:none;border-radius:13px;padding:12px 10px;background:var(--card2);color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .klire-row button:first-child{flex:1.6}
  .klire-row button small{color:var(--muted);font-weight:600}
  .klire-row button.on{background:var(--good-soft);color:var(--good)}
  .klire-go{border:none;background:var(--accent);color:#fff;border-radius:50%;width:34px;height:34px;font-size:13px;cursor:pointer;flex:0 0 auto}
  .klire-aeon{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:8px;border:none;background:transparent;color:var(--ink);
    font-weight:700;font-size:13.5px;padding:8px 2px 0;cursor:pointer;font-family:inherit}
  .klire-aeon small{color:var(--muted);font-weight:600}
  .lr-aeon{display:block;text-decoration:none;color:var(--ink);background:var(--card);border-radius:16px;padding:13px 15px;margin:0 0 10px;box-shadow:var(--shadow-sm)}
  .lr-aeon i{display:block;font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .lr-aeon b{display:block;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:17px;line-height:1.3;margin:5px 0 4px}
  .lr-aeon small{display:block;color:var(--muted);font-size:13px;line-height:1.45}
  .lr-aeon em{display:block;margin-top:4px;font-style:normal;font-weight:600}
  .ksec .lr-aeon{background:var(--card2);box-shadow:none}
  .lr-aeonw{margin:0 0 12px}.lr-aeonw .lr-aeon{margin:0;border-radius:16px 16px 0 0}
  .lr-retb{display:block;width:100%;border:none;border-radius:0 0 16px 16px;padding:10px;background:var(--card2);color:var(--accent);font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;border-top:1px solid var(--line)}
  .ksec .lr-retb{background:var(--card);}
  .lr-retb.on{color:var(--good)}
  .lr-ret{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 14px;box-shadow:var(--shadow-sm)}
  .lr-ret b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:800}
  .lr-ret textarea{width:100%;min-height:110px;border:2px solid transparent;border-radius:12px;background:var(--card2);color:var(--ink);padding:12px;font-family:inherit;font-size:16px;line-height:1.5;resize:vertical}
  .lr-ret textarea:focus{outline:none;border-color:var(--accent);background:var(--card)}
  .lr-ret small{display:block;margin-top:6px;color:var(--muted);font-size:12px}
  #lire{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;--lfs:16px}
  #lire.on{display:block}
  .lr-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .lr-top button{border:none;background:var(--card);color:var(--ink);border-radius:12px;min-width:40px;height:38px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:var(--shadow-sm)}
  .lr-t{flex:1;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .lr-prog{position:sticky;top:calc(env(safe-area-inset-top) + 54px);z-index:2;height:3px;background:var(--line)}
  .lr-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .lr-art,.lr-livre{max-width:640px;margin:0 auto;padding:22px 20px calc(env(safe-area-inset-bottom) + 40px)}
  .lr-art h1,.lr-livre h1{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:calc(var(--lfs) * 1.75);line-height:1.15;margin:10px 0 8px;font-weight:700}
  .lr-sous{color:var(--muted);font-size:calc(var(--lfs) * .95);line-height:1.45;margin:0 0 18px}
  .lr-note{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 0 24px;font-size:calc(var(--lfs) * .88);line-height:1.5;color:var(--muted);font-style:italic;
    box-shadow:inset 3px 0 0 var(--accent),var(--shadow-sm)}
  .lr-note b,.lr-q b,.lr-plus b{display:block;font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:800}
  .lr-corps{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:var(--lfs);line-height:1.68;color:var(--ink)}
  .lr-corps p{margin:0 0 1em}
  .lr-corps h4{font-family:var(--disp);font-size:calc(var(--lfs) * 1.08);margin:1.7em 0 .55em;color:var(--ink)}
  .lr-corps em{font-style:italic}
  .lr-q{background:var(--accent-soft);border-radius:16px;padding:16px;margin:26px 0 14px;font-size:calc(var(--lfs) * .98);line-height:1.55}
  .lr-plus{font-size:calc(var(--lfs) * .85);line-height:1.55;color:var(--muted);margin:0 0 20px}
  .lr-livre{text-align:center;padding-top:40px}
  .lr-clock{font-family:var(--mono);font-size:56px;font-weight:700;margin:26px 0 10px;font-variant-numeric:tabular-nums;color:var(--accent)}

  /* ═══════════ LOOK « NUIT » (26/10, 2e passe) : gris neutre, le blanc pour seul accent ═══════════
     Zéro couleur : seuls les emojis colorent. « Fait » = blanc plein ; le reste en gris.
     Aucune boîte teintée : les cartes se distinguent par leur fond et un trait fin.
     Le sombre est le thème par défaut ; le clair (☀) inverse le tout. */
  :root,:root[data-theme="dark"]{
    --bg:#0F1014; --bg2:#131418; --card:#17181D; --card2:#1F2026; --line:#26272E; --line2:#34353D;
    --ink:#F2F0EA; --muted:#A3A1A8; --faint:#77757D;
    --accent:#F2F0EA; --accent2:#FFFFFF; --accent-soft:rgba(242,240,234,.06);
    --good:#F2F0EA; --good-ink:#0F1014; --good-soft:rgba(242,240,234,.06); --bad:#D9D6CE;
    --gem:#F2F0EA; --gem-soft:rgba(242,240,234,.06);
    --cours:#C9C7CF; --on-accent:#0F1014;
    --shadow:none; --shadow-sm:none;
    --disp:'Inter Tight',-apple-system,system-ui,sans-serif; --sans:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --serif:Newsreader,Georgia,'Iowan Old Style',serif;
  }
  :root[data-theme="light"]{
    --bg:#F4F3EF; --bg2:#ECEBE6; --card:#FFFFFF; --card2:#F4F3EF; --line:#E3E1DA; --line2:#D2CFC7;
    --ink:#16161A; --muted:#5E5C64; --faint:#8C8A92;
    --accent:#16161A; --accent2:#000000; --accent-soft:rgba(22,22,26,.05);
    --good:#16161A; --good-ink:#FFFFFF; --good-soft:rgba(22,22,26,.05); --bad:#3A3A40;
    --gem:#16161A; --gem-soft:rgba(22,22,26,.05);
    --cours:#4A4950; --on-accent:#FFFFFF;
  }
  body{background:var(--bg);background-attachment:scroll}
  .today{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink);font-family:var(--serif);font-weight:500;
    font-size:32px;letter-spacing:-.01em;text-transform:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .eyebrow{color:var(--muted);text-transform:capitalize;letter-spacing:.06em;font-size:12px;font-weight:600}
  .eyebrow::before{display:none}
  .sosmini{font:600 13px var(--sans);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);
    border-radius:999px;height:38px;padding:0 14px;cursor:pointer;white-space:nowrap;letter-spacing:0}
  .btn,.btn:not(.ghost){background:var(--accent);color:var(--on-accent);box-shadow:none;font-weight:700}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
  .btn:disabled{opacity:.4}
  .kco{background:var(--card);border:1px solid var(--line2);box-shadow:none}
  .kco-now{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  .kech{background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:none}
  .kprog i{background:var(--accent)}
  .ksosbtn{display:none}
  .kjp-r.cours{background:linear-gradient(90deg,color-mix(in srgb,var(--cours) 14%,transparent),transparent);border-left-color:var(--cours)}
  .kjp-r.cours .kjp-n b,.kcalrow.dem i,.kcalrow.dem b{color:var(--cours)}
  .kpts{background:var(--card)}
  .kpts-n b{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--accent)}
  .kpts-w i.ok,.kchain-d i.ok{background:var(--accent);border-color:transparent}
  .kgem,.kgem.pts{background:var(--card);border:1px solid var(--line2);color:var(--ink)}
  .ktabs i,.applist .row .start{color:var(--on-accent)}
  .ktabs{background:color-mix(in srgb,var(--bg2) 90%,transparent);box-shadow:0 18px 50px -16px rgba(0,0,0,.6)}
  .ktabs button.on{background:var(--accent-soft);color:var(--accent)}
  .ktabs .ke{filter:none;opacity:1;width:22px;height:22px;display:block}
  .ktabs .ke svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ktabs .ke svg circle[r="1.3"]{fill:currentColor}
  .klire-lec b,.lr-aeon b,.lr-art h1,.lr-livre h1,.lr-corps{font-family:var(--serif)}
  .klire-lec{background:var(--card2);border:1px solid var(--line)}
  @media (min-width:980px){ .ktabs .ke{width:18px;height:18px} .ktabs .ke svg{width:18px;height:18px} }

  /* la barre de la journée */
  .dbar{margin:14px 0 0;padding:14px 16px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
  .dbar-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .dbar-h a{text-transform:none;letter-spacing:0;color:var(--faint);text-decoration:none;font-weight:600}
  .dbar.tout .dbar-h span{color:var(--accent)}
  .dbar-m{display:grid;gap:6px;margin-top:10px}
  .dbar-m button{border:none;background:none;padding:0;cursor:pointer;text-align:left;color:var(--muted);font:600 12px var(--sans);min-height:44px;display:flex;flex-direction:column;gap:7px}
  .dbar-m i{display:block;height:6px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
  .dbar-m button.on{color:var(--accent)} .dbar-m button.on i{background:var(--accent);border-color:transparent}
  .dbar-m span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* les domaines */
  .dom{margin:14px 0 0;padding:6px 16px 8px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
  .dom-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 4px}
  .dom-n{border:none;background:none;padding:6px 0;color:var(--ink);font:700 16px var(--sans);cursor:pointer;text-align:left}
  .dcpt{font-size:12px;font-weight:600;color:var(--accent)} .dhors{font-size:12px;font-weight:600;color:var(--faint)}
  .drow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
  .dchk{width:26px;height:26px;flex:none;border-radius:8px;border:1.5px solid var(--line2);background:transparent;cursor:pointer;position:relative}
  .dchk.on{background:var(--accent);border-color:var(--accent)}
  .dchk.on::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .dchk.live{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .dnom{flex:1;min-width:0;border:none;background:none;padding:8px 0;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--sans)}
  .dnom b{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dnom em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:5px;padding:1px 5px}
  .dnom small{display:block;font-size:12px;color:var(--muted);margin-top:2px;min-height:15px}
  .drow.done .dnom b{color:var(--muted)}
  .dact{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;font-size:13px}
  .dadd{display:block;width:100%;border:none;border-top:1px solid var(--line);background:none;color:var(--faint);font:600 13px var(--sans);text-align:left;padding:12px 0 6px;cursor:pointer;min-height:44px}
  .dadd:hover{color:var(--accent)}
  .dpied{display:flex;gap:8px;margin:14px 0 0}
  .dpied button{flex:1;height:46px;border-radius:14px;border:1px solid var(--line2);background:transparent;color:var(--ink);font:600 14px var(--sans);cursor:pointer}
  .dtog{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin:4px 0 12px;cursor:pointer}
  .dtog input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
  .dtog b{display:block;font-size:14px} .dtog small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
  details.ktips summary{cursor:pointer;list-style:none} details.ktips summary::-webkit-details-marker{display:none}
  details.ktips summary b::after{content:" ›";color:var(--faint)} details.ktips[open] summary b::after{content:" ⌄"}

  /* progrès */
  .dmin{margin:14px 0 0;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
  .dmin-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .dmin-h b{font-size:15px} .dmin-h span{font-size:12px;color:var(--muted)}
  .dmin-r{display:grid;grid-template-columns:132px minmax(0,1fr) 54px;align-items:center;gap:10px;padding:6px 0;font-size:13px}
  .dmin-r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dmin-r div{height:8px;border-radius:4px;background:var(--card2)} .dmin-r i{display:block;height:8px;border-radius:4px;background:var(--accent)}
  .dmin-r b{text-align:right;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .dliens{margin:14px 0 0;border-radius:20px;background:var(--card);border:1px solid var(--line);padding:4px 16px}
  .dliens button{display:flex;align-items:center;gap:12px;width:100%;height:52px;border:none;border-top:1px solid var(--line);background:none;color:var(--ink);font:500 15px var(--sans);cursor:pointer;text-align:left}
  .dliens button:first-child{border-top:none} .dliens i{margin-left:auto;font-style:normal;color:var(--faint)}

  /* le cahier */
  .cahier{max-width:640px}
  .cahseg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:8px 0 4px}
  .cahseg button{flex:1;height:38px;border:none;border-radius:10px;background:none;color:var(--muted);font:600 13.5px var(--sans);cursor:pointer}
  .cahseg button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
  .cahecrire{margin:14px 0 0;padding:16px 18px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
  .cahecrire label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.4}
  .cahecrire textarea{display:block;width:100%;min-height:130px;margin-top:10px;border:none;background:transparent;resize:vertical;color:var(--ink);
    font:400 17px/1.6 var(--serif);outline:none;padding:0}
  .cahecrire-f{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:6px}
  .cahecrire-f a{color:var(--accent);text-decoration:none;font-weight:600}
  .cahbloc{margin:14px 0 0;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
  .cahbloc-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .cahbloc-h b{font-size:15px} .cahbloc-h span,.cahbloc-h a{font-size:12px;color:var(--muted);text-decoration:none;font-weight:600}
  .cahbloc p{font-size:13px;color:var(--muted);line-height:1.5;margin:4px 0 10px}
  .txliste{margin-top:6px}
  .txrow{display:block;width:100%;text-align:left;border:none;border-top:1px solid var(--line);background:none;padding:12px 0;cursor:pointer;color:var(--ink);font-family:var(--sans)}
  .txliste .txrow:first-child,.cahbloc .krows .txrow:first-child{border-top:none}
  .txrow span{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--faint)}
  .txrow em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:5px;padding:1px 6px}
  .txrow b{display:block;font:500 17px/1.3 var(--serif);margin-top:5px}
  .txrow small{display:block;font-size:13px;color:var(--muted);line-height:1.45;margin-top:3px}
  .txzone{display:block;width:100%;min-height:42vh;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink);
    font:400 17px/1.65 var(--serif);padding:14px;resize:vertical;box-sizing:border-box}
  .txzone:focus{outline:none;border-color:var(--accent)}
  .col-r>:first-child{margin-top:14px}

  /* 2e passe : Maintenant épuré, plus rien de teinté, l'ordinateur pensé */
  .kco{border:1px solid var(--line);background:var(--card);padding:18px 18px 14px;border-radius:20px;margin:6px 0 0}
  .kco-now,.kco-now.cours{background:none;border:none;padding:0;gap:14px;align-items:flex-start}
  .kco-now>span{font-size:30px;line-height:1.1}
  .kco-now i{color:var(--muted);font-size:11px;letter-spacing:.12em;font-weight:600}
  .kco-now b{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:4px;line-height:1.2}
  .kco-now small{font-size:13.5px;color:var(--muted);font-weight:500;margin-top:4px}
  .kco-b{margin-top:16px}
  .kco-pied{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--faint);margin-top:12px;font-weight:500}
  .kco-lien{display:block;border:none;background:none;color:var(--muted);font:500 12.5px var(--sans);padding:8px 0 0;cursor:pointer;text-align:left}
  .dbar-n{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .dbar-n button{border:1px solid var(--line2);background:none;color:var(--ink);font:600 12px var(--sans);border-radius:999px;padding:3px 10px;margin-left:4px;cursor:pointer}
  .kban,.kban.min{background:var(--card);border:1px solid var(--line);border-left:1px solid var(--line);color:var(--ink)}
  .sheet .kban{margin:0 0 14px}
  .sosmini{color:var(--muted);background:transparent;border-color:var(--line2)}
  .kjp-r.now{background:var(--accent-soft)}
  .kjp-r.done .kjp-c{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .kjp-r.done .kjp-n b{color:var(--faint)}
  .kech{border-color:var(--line2)}
  .dnom em,.txrow em{color:var(--muted);border-color:var(--line2)}
  .dcpt{color:var(--ink)}
  .dbar.tout .dbar-h span{color:var(--ink)}
  .ktabs button.on{background:var(--card2);color:var(--ink)}
  .ktabs i{background:var(--ink);color:var(--bg)}
  /* tout ce qui pose du texte sur l'accent : le texte prend la couleur du fond */
  .ractions .start,.sa button.go,.agurg,.agform button,.cplus,.cgo,.crel,.kcheck.on .kb,.klire-go,.applist .row .start{color:var(--on-accent);box-shadow:none}
  .krit,.krit.soir,.krit.bilan{color:var(--ink);background:var(--card);border:1px solid var(--line2);box-shadow:none}
  .kech,.kech .kgo2{color:var(--ink)} .kech a{color:var(--ink)!important}
  /* Maintenant se lit de haut en bas, même sur ordinateur : une seule colonne centrée */
  @media (min-width:980px){ .cols.une{display:block;max-width:760px} .cols.une .col-r>:first-child{margin-top:14px} }
  @media (min-width:980px){
    #app{max-width:1120px}
    header{grid-template-columns:1fr auto;padding:28px 4px 14px}
    header>.today{grid-column:1;grid-row:2;justify-content:flex-start;gap:18px;font-size:38px}
    header .brand{grid-row:1 / span 2;align-self:center}
    .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px}
    .ktabs{width:100%;justify-content:flex-start;background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;
      box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0 0 8px;margin:0 0 8px;top:0;
      position:sticky;z-index:40;background:var(--bg)}
    .ktabs button{flex:0 0 auto;border-radius:10px;padding:8px 14px}
    .kco{margin-top:12px}
  }
  .cahier .jcard,.cahier .klire{margin-top:14px}
  @media (min-width:980px){ .col-r>:first-child{margin-top:12px} }

  /* ═══════════ LE MONDE DU JOUR + LA TYPOGRAPHIE DE LA VOÛTE (26/10, tour 2) ═══════════
     Verdict de Thomas sur La Voûte : « j'aime beaucoup surtout le style police d'écriture, j'ai envie que tu utilises ce style
     PARTOUT sur l'app ». Donc : Georgia partout, les titres en capitales espacées, les petites lignes en mono espacé. */
  .monde{position:relative;height:60vh;min-height:400px;max-height:640px;margin:6px -15px 0;overflow:hidden;background:#16171C}
  .monde-enluminure{height:62vh;min-height:470px;max-height:720px}
  @media (min-width:980px){ .monde-enluminure{height:720px} }
  .monde::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg))}
  @media (min-width:980px){ .monde{margin:12px 0 0;border-radius:20px;border:1px solid var(--line);height:560px} .monde::after{display:none} }
  .dpied-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
  .dcoche{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:4px;padding:4px 10px 4px 6px;min-height:48px}
  .dcoche-b{width:30px;height:30px;flex:none;border:1.5px solid var(--c);border-radius:3px;background:transparent;cursor:pointer;position:relative}
  .dcoche.on .dcoche-b{background:var(--c)}
  .dcoche.on .dcoche-b i{position:absolute;left:10px;top:5px;width:6px;height:12px;border:solid #16171C;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .dcoche-n{flex:1;min-width:0;border:none;background:none;color:var(--ink);text-align:left;cursor:pointer;padding:8px 0;
    font:500 12px Georgia,'Times New Roman',serif;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dcoche.on .dcoche-n{color:var(--c)}
  .dbar{margin-top:10px}

  :root,:root[data-theme="dark"],:root[data-theme="light"]{
    --serif:Georgia,'Times New Roman',serif; --sans:Georgia,'Times New Roman',serif; --disp:Georgia,'Times New Roman',serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
  body{font-family:Georgia,'Times New Roman',serif}
  /* les titres : capitales espacées */
  .today{font-family:Georgia,serif;font-weight:500;font-size:22px;letter-spacing:.2em;text-transform:uppercase}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
  .dom-n,.dbar-h span,.dmin-h b,.cahbloc-h b,.kjp-h b,.kpts-h b,.ktip-h b,.kwork .ktip-h b,.kcalh b,.agcard b:first-child,.ccard .chead b,
  .sheet h3,details.ktips summary b,.dliens button{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.16em;font-weight:500}
  .dom-n,.kjp-h b,.kpts-h b{font-size:13px} .sheet h3{font-size:16px} .dliens button{font-size:12.5px}
  .dbar-h span{font-size:11.5px}
  /* les petites lignes : mono espacé */
  .dnom small,.dcpt,.dhors,.kco-pied,.kco-lien,.dbar-h a,.cahbloc-h span,.txrow span,.dmin-h span,.kjp-s,.kco-now i,.kpts-f,.kchain .kpts-f{font-family:var(--mono);letter-spacing:.06em}
  .kco-now i{letter-spacing:.14em}
  /* les boutons : comme celui de La Voûte, un cadre fin, des capitales espacées */
  .btn,.btn:not(.ghost),.dpied button,.cahseg button,.sosmini{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.14em;font-weight:500;border-radius:3px}
  .btn{font-size:13px}
  .ktabs .kl{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.12em;font-size:9.5px;font-weight:500}
  .dom,.dbar,.kco,.dmin,.dliens,.cahbloc,.cahecrire,.kjp,.agcard,.kcal,.ccard,.kwork,.ktips,.kpts,.kchain{border-radius:6px}
  .dnom b,.kco-now b,.txrow b{font-family:Georgia,serif;letter-spacing:.02em}

  /* le Livre des jours */
  .livre{margin:14px 0 0;padding:12px 12px 10px;border-radius:6px;background:var(--card);border:1px solid var(--line)}
  .livre-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 10px}
  .livre-h b{font:500 13px Georgia,serif;letter-spacing:.16em;text-transform:uppercase}
  .livre-h span{font:11px var(--mono);letter-spacing:.06em;color:var(--muted)}
  .livre-page{position:relative;height:520px;border-radius:3px;overflow:hidden;background:#cfc8b8}
  .livre-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .livre-nav span{font:500 12px Georgia,serif;letter-spacing:.14em;text-transform:uppercase;text-align:center;flex:1}
  .livre-nav button{width:44px;height:44px;border:1px solid var(--line2);border-radius:3px;background:none;color:var(--ink);font:20px Georgia,serif;cursor:pointer}
  .livre-nav button:disabled{opacity:.3;cursor:default}
  .livre-frise{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:10px}
  .livre-frise button{height:26px;border:1px solid var(--line2);border-radius:2px;background:none;padding:0;cursor:pointer;position:relative;overflow:hidden}
  .livre-frise i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*100%);background:var(--muted);opacity:.5}
  .livre-frise button.or{border-color:#C9A44A}
  .livre-frise button.or i{background:linear-gradient(180deg,#F0D78A,#B8862E);opacity:1}
  .livre-frise button.sel{outline:2px solid var(--ink);outline-offset:1px}
</style>
</head>

const CATALOGUE=[
  {grp:"Mon entraînement", items:[

const CAT_DEFAUT={

const CAT_PAR_ID={n990:"anglais",cumbre:"espagnol",closing:"closing"};

function normName(x){ return String(x||"").toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
const CAT_PAR_NOM={};
Object.keys(CAT_DEFAUT).forEach(c=>CAT_DEFAUT[c].forEach(n=>{ CAT_PAR_NOM[normName(n)]=c; }));

const HUES=["#ff6a45","#f5a524","#12b76a","#3b82f6","#a855f7","#ec4899","#14b8a6","#f97316","#6366f1","#84cc16"];
function appColor(i){ return HUES[i%HUES.length]; }
function today(){ return new Date().toISOString().slice(0,10); }
function dayShift(iso,n){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function load(){
  let s; try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s||!s.apps){ s={day:today(), apps:DEFAULT_APPS.slice(), st:{}, run:null}; }
  s.apps.forEach(a=>{ if(!s.st[a.id]) s.st[a.id]={days:[],min:{}}; });
  /* Une app suivie sans lien affichait « ✎ Lien » au lieu de « ↗ Ouvrir ».
     On rétablit l'URL depuis le catalogue, par id puis par nom. On ne rajoute
     ni ne retire jamais d'app : la liste du jour reste son choix. */
  try{
    const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
    const cat=[]; CATALOGUE.forEach(g=>g.items.forEach(it=>cat.push(it)));
    const parDefaut={}; DEFAULT_APPS.forEach(a=>parDefaut[a.id]=a.url);
    let repare=0;
    s.apps.forEach(a=>{
      if(a.url) return;
      let u=parDefaut[a.id];
      if(!u){ const m=cat.find(it=>norm(it.n)===norm(a.name)); if(m) u=BASE+m.u; }
      if(u){ a.url=u; repare++; }
    });
    if(repare){
      /* on écrit avec `s` : la globale S n'est pas encore assignée à ce stade */
      localStorage.setItem(KEY,JSON.stringify(s));
      setTimeout(()=>toast(repare+" lien"+(repare>1?"s":"")+" rétabli"+(repare>1?"s":"")),600);
    }
  }catch(e){}
  /* Rangement initial dans les dossiers. `cat` absent = jamais rangée ; `cat:""`
     = rangée nulle part, et c'est un choix. On ne repasse donc jamais dessus. */
  try{
    let range=0;
    s.apps.forEach(a=>{
      if(a.cat!==undefined) return;
      a.cat = CAT_PAR_ID[a.id] || CAT_PAR_NOM[normName(a.name)] || "";
      range++;
    });
    if(range) localStorage.setItem(KEY,JSON.stringify(s));
  }catch(e){}
  /* Passage « cap sur le stage » (une seule fois par appareil) : 990, CUMBRE et
     LE CLOSING passent devant, chacune dans son dossier ; tout le reste glisse
     dans « Le reste ». Rien n'est supprimé, aucun historique ne bouge. */
  try{
    if(s.mig!=="stage1"){
      const nu=x=>String(x||"").replace(/\/$/,"");
      const devant=[];
      PRIO.forEach(p=>{
        let a=s.apps.find(x=>CAT_PAR_ID[x.id]===p.cat||normName(x.name)===normName(p.name)||(x.url&&nu(x.url)===nu(p.url)));
        if(!a){ const nid="p_"+p.cat; a={id:nid,name:p.name,emoji:p.emoji,url:p.url,since:Date.now()}; s.apps.push(a); }
        if(!s.st[a.id]) s.st[a.id]={days:[],min:{}};
        a.cat=p.cat; devant.push(a);
      });
      s.apps.forEach(a=>{ if(!devant.includes(a)) a.cat=""; });
      s.apps=devant.concat(s.apps.filter(a=>!devant.includes(a)));
      s.mig="stage1"; s.appsMod=Date.now();
      localStorage.setItem(KEY,JSON.stringify(s));
    }
  }catch(e){}
  if(!s.cands) s.cands=[];
  return s;
}

/* save() écrit ET prévient la synchro. save0() écrit sans la relancer :

function save0(){ localStorage.setItem(KEY,JSON.stringify(S)); }

function stOf(id){ if(!S.st[id]) S.st[id]={days:[],min:{}}; return S.st[id]; }
/* Une coche n'est qu'une date dans un tableau : impossible de savoir, entre deux
   appareils, qui a coché ou décoché en dernier. On note donc l'heure de chaque
   geste à part — c'est ce qui permet à la fusion de trancher sans rien perdre. */
function setCheck(id,d,v){ if(!S.chk) S.chk={}; S.chk[id+"|"+d]={t:Date.now(),v:v?1:0}; }

/* ═══════════════════════════════════════════════════════════════════
   LES DOMAINES (26/10)
   Un domaine range des apps : Langues, Lecture et pensée, Carrière…
   Ce qui compte dans la journée, c'est chaque app marquée « compte »
   (a.prio) : elle devient une priorité. Les anciens dossiers (a.cat) ne
   sont plus lus, mais on ne les efface pas : une vieille version de l'app
   ouverte ailleurs continue de les comprendre.
   Une app archivée (a.arch) garde tout son historique ; elle sort de la vue.
   L'histoire est figée au passage : chaque jour d'avant garde le verdict
   qu'il avait (S.okAvant). Changer de règle ne casse jamais la chaîne.
   ═══════════════════════════════════════════════════════════════════ */
const DOMS0=[
  {id:"langues",  nom:"Langues",           e:"🗣️"},
  {id:"lecture",  nom:"Lecture et pensée", e:"📖"},
  {id:"carriere", nom:"Carrière",          e:"💼"},
  {id:"corps",    nom:"Corps",             e:"🥊"},
  {id:"creation", nom:"Création",          e:"🎸"},
  {id:"autres",   nom:"Autres",            e:"📦"}
];
const DOM_PAR_NOM={"990":"langues",cumbre:"langues",mandarin:"langues",miftah:"langues",sputnik:"langues",lisek:"langues",
  leclosing:"carriere",loffensive:"carriere",leface:"carriere",lefaceaface:"carriere",
  forge:"corps",topspin:"corps",shred:"creation",pianodojo:"creation",lacle:"creation",sideman:"creation",
  cortex:"lecture",larene:"lecture"};
const ARCHIVE_PAR_NOM={miftah:1,bestiaire:1};
function doms(){ if(!Array.isArray(S.doms)||!S.doms.length) S.doms=DOMS0.map(x=>({...x}));
  if(!S.doms.some(d=>d.id==="autres")) S.doms.push({...DOMS0[DOMS0.length-1]});   // le refuge de toute app sans domaine
  return S.doms; }
function domDef(id){ return doms().find(d=>d.id===id)||null; }
function domOf(a){ return a&&a.dom&&domDef(a.dom)?a.dom:"autres"; }
function vivante(a){ return !!a&&!a.arch; }
function compte(a){ return vivante(a)&&!!a.prio; }
/* l'ancien dossier d'une app, lu comme avant : sert à figer l'histoire */
function dayOkV1(d){
  const AC=CATS0.filter(c=>S.apps.some(a=>a.cat===c.id));
  return AC.length>0&&AC.every(c=>S.apps.some(a=>a.cat===c.id&&stOf(a.id).days.includes(d)));
}
function lecDays(){ const L=lir(), s=new Set(); Object.values(L.lus||{}).forEach(d=>d&&s.add(d)); (L.ses||[]).forEach(x=>x&&x.d&&s.add(x.d)); return s; }
function domMigrate(){
  if(S.mig2==="doms1") return;
  const t=today();
  /* 1. figer l'histoire, jour par jour */
  const ok={}, vus=new Set();
  S.apps.forEach(a=>stOf(a.id).days.forEach(d=>{ if(d<t) vus.add(d); }));
  vus.forEach(d=>{ if(dayOkV1(d)) ok[d]=1; });
  S.okAvant=ok; S.domSince=t;
  /* 2. les domaines par défaut */
  doms();
  /* 3. ranger chaque app ; une seule priorité par ancien dossier */
  const pris={};
  S.apps.forEach(a=>{
    const k=normName(a.name);
    if(a.dom===undefined) a.dom = a.cat==="anglais"||a.cat==="espagnol" ? "langues" : a.cat==="closing" ? "carriere" : (DOM_PAR_NOM[k]||"autres");
    if(a.cat&&CATS0.some(c=>c.id===a.cat)&&!pris[a.cat]){ pris[a.cat]=1; a.prio=1; }
    if(ARCHIVE_PAR_NOM[k]){ a.arch=1; a.prio=0; }
  });
  /* 4. la lecture du jour devient une priorité, avec son passé */
  if(!S.apps.some(a=>a.id==="lecture")){
    S.apps.push({id:"lecture",name:"Lecture du jour",emoji:"📖",url:"",cat:"",dom:"lecture",prio:1,spec:"lecture",since:Date.now()});
    const st=stOf("lecture"); lecDays().forEach(d=>{ if(!st.days.includes(d)) st.days.push(d); }); st.days.sort();
  }
  S.tab="maintenant";
  S.mig2="doms1"; S.appsMod=Date.now(); S.domsMod=Date.now();
  save0();
}

/* Les priorités : une par app qui compte, dans l'ordre des domaines. */
function rebuildCats(){
  const ord={}; doms().forEach((d,i)=>ord[d.id]=i);
  const L=S.apps.map((a,i)=>[a,i]).filter(([a])=>compte(a))
    .sort((x,y)=>(ord[domOf(x[0])]-ord[domOf(y[0])])||(x[1]-y[1]));
  CATS=L.map(([a])=>({id:a.id, nom:a.spec==="lecture"?"Lecture":a.name, e:a.emoji, rot:0, since:a.prioSince||""}));
}

/* ─── les dossiers (désormais : les priorités) ─── */
function catDef(cid){ return CATS.filter(c=>c.id===cid)[0]||null; }
function appsOfCat(cid){ return S.apps.filter(a=>catOf(a)===cid); }

function catDaysSet(cid){
  const s=new Set(); appsOfCat(cid).forEach(a=>stOf(a.id).days.forEach(d=>s.add(d))); return s;
}
function catStreak(cid){
  const D=catDaysSet(cid), t=today();
  let d=D.has(t)?t:(D.has(dayShift(t,-1))?dayShift(t,-1):null);
  if(!d) return 0;
  let n=0; while(D.has(d)){ n++; d=dayShift(d,-1); }
  return n;
}
/* La rotation : faite hier ET avant-hier, elle se repose aujourd'hui. On ne
   l'interdit jamais — on la grise et on propose autre chose. Une règle qui
   bloque se contourne ; une règle qui se voit se suit. */
function atRest(id){
  const a=S.apps.filter(x=>x.id===id)[0];
  if(!a||!catOf(a)) return false;
  const c=catDef(catOf(a));
  if(!c||!c.rot) return false;
  const st=stOf(id), t=today();
  return st.days.includes(dayShift(t,-1))&&st.days.includes(dayShift(t,-2));
}
function brokeRot(id){ return doneToday(id)&&atRest(id); }
function inARow(id){
  const st=stOf(id); let d=today(), n=0;
  if(!st.days.includes(d)) d=dayShift(d,-1);
  while(st.days.includes(d)){ n++; d=dayShift(d,-1); }
  return n;
}
/* Les candidates du jour : ni déjà faites, ni au repos, la plus délaissée devant. */
function catPicks(cid){
  return appsOfCat(cid).filter(a=>!doneToday(a.id)&&!atRest(a.id))
    .sort((x,y)=>gapDays(y.id)-gapDays(x.id));
}
function jamaisPointee(id){ return stOf(id).days.length===0; }
/* Une app ajoutée hier n'a pas « jamais servi » : elle n'a pas encore eu sa chance.
   Sans cette semaine de grâce, le brief proposerait de sortir ce qu'il vient de
   faire ajouter. Les apps d'avant ce champ n'ont pas de `since` : elles ont eu
   tout le temps du monde. */
function neuve(a){ return !!(a&&a.since)&&(Date.now()-a.since)<7*864e5; }
function aSortir(a){ return jamaisPointee(a.id)&&!neuve(a); }

/* --- calculs --- */
function doneToday(id){ return stOf(id).days.includes(today()); }
function todayMin(id){ return Math.round(stOf(id).min[today()]||0); }
function totalMin(id){ const m=stOf(id).min; return Math.round(Object.values(m).reduce((a,b)=>a+b,0)); }
function checks(id){ return stOf(id).days.length; }
function streak(id){
  const days=new Set(stOf(id).days);
  let anchor = days.has(today()) ? today() : (days.has(dayShift(today(),-1)) ? dayShift(today(),-1) : null);
  if(!anchor) return 0;
  let n=0, d=anchor;
  while(days.has(d)){ n++; d=dayShift(d,-1); }
  return n;
}
function fmtMin(m){ if(m<60) return m+" min"; const h=Math.floor(m/60); return h+"h"+String(m%60).padStart(2,"0"); }

  const st=stOf(id), t=today();

  if(i>=0){ st.days.splice(i,1); setCheck(id,t,0); } else { st.days.push(t); st.days.sort(); setCheck(id,t,1); }

function startTimer(id){ if(S.run){ stopTimer(true); } S.run={id, t0:Date.now()}; save(); render(); }

  const id=S.run.id, st=stOf(id), t=today(); S.run=null;
  if(mins>=0.1) st.min[t]=(st.min[t]||0)+Math.round(mins*10)/10;
  if(!st.days.includes(t)){ st.days.push(t); st.days.sort(); setCheck(id,t,1); } // terminer = fait
  save(); render();
  if(!silent) toast("⏱️ Séance de "+fmtMin(Math.max(1,Math.round(mins)))+" enregistrée");
}

/* ─── la barre de la journée : une marche par priorité ─── */
/* ═══════════════════════════════════════════════════════════════════
   LE MONDE DU JOUR (26/10, atelier tour 2)
   Une pièce vivante de l'atelier (atelier/pieces/…) est posée en grand en
   haut de Maintenant, avec atelier/bibliotheque/monter.js. Elle reçoit les
   vraies données (tes priorités, tes 28 derniers jours, ta chaîne) et ce sont

   la dernière déclenche le seuil. Le bloc est gardé d'un rendu à l'autre

let MONDE=null, MONDE_BLOC=null, MONDE_CLE="", MONDE_SEUIL=null, MONDE_RECIT="";
document.addEventListener("visibilitychange",()=>{ if(document.hidden||!MONDE) return;

/* La pièce : L'Enluminure (5/5 au tour 2) quand il y a quatre priorités — elle a quatre lettrines ;
   sinon Les Crêtes en couleur (4/5), qui s'adaptent à n'importe quel nombre. */
function mondePiece(n){
  if(n===4&&typeof etude_enluminure==="function") return {id:"enluminure", fab:etude_enluminure, donnees:etude_enluminure_DONNEES};
  return {id:"cretes", fab:etude_cretesc, donnees:etude_cretesc_DONNEES};
}
function mondeSlotHtml(){ return typeof monterPiece==="function"&&typeof etude_cretesc==="function"?`<div id="mondeSlot"></div>`:""; }
/* ─── LE RÉCIT DU JOUR (27/10) : les paragraphes de la page racontent ta vraie journée ───
   Chaque paragraphe commence par la lettre de sa lettrine (la pièce la retire du texte et l'enlumine).
   Le texte est celui du jour d (aujourd'hui, ou un jour passé pour le Livre des jours) : minutes réelles,
   série réelle, lecture lue ce jour-là, candidatures envoyées. Fait ou pas fait : le ton change. */
const RANG=["","première","deuxième","troisième","quatrième","cinquième","sixième","septième","huitième","neuvième","dixième","onzième","douzième","treizième","quatorzième","quinzième","seizième","dix-septième","dix-huitième","dix-neuvième","vingtième"];
function rangFr(n){ return RANG[n]||(n+"e"); }
function serieAu(cid,d){ let n=0, x=d; while(catDoneDay(cid,x)){ n++; x=dayShift(x,-1); } return n; }
function minDu(cid,d){ return Math.round(appsOfCat(cid).reduce((a,x)=>a+(stOf(x.id).min[d]||0),0)); }
function lectureDu(d){ try{ const L=lir(), id=Object.keys(L.lus||{}).find(k=>L.lus[k]===d); const a=id?lecs().find(x=>x.id===id):null;
  if(a) return {titre:a.titre, lue:true}; if(d===today()){ const n=lecDuJour(); return n?{titre:n.titre, lue:false}:null; } }catch(e){} return null; }
/* aujourd'hui : un texte qui ne change pas quand on coche (la page n'est pas refaite à chaque coche) :
   le but du jour et la série jusqu'à hier. Les jours passés racontent ce qui a été fait. */
function recitAuj(c){
  const d=today(), k=normName(c.nom), sr=serieAu(c.id,dayShift(d,-1)), s=sr?` ; ${sr} jour${sr>1?"s":""} de suite jusqu'à hier`:"";
  if(k==="990") return `Neuf cent nonante points, c'est la mesure de l'épreuve des Anglois. Vingt minutes d'oreille tendue ce jour, et les mots manqués notés en marge${s}.`;
  if(k==="cumbre") return `Cumbre veut dire la cime, en la langue d'Espagne. Une marche à gravir ce jour : lire à voix haute, conjuguer, retenir trois mots${sr?` ; ${sr} marche${sr>1?"s":""} déjà sous les pieds`:""}.`;
  if(k==="lecture"){ const l=lectureDu(d); return `Lecture d'un seul texte des philosophes${l?` : « ${l.titre} »`:""}, lu deux fois, la seconde plume en main, et la phrase qui demeure copiée au cahier${s}.`; }
  if(k==="leclosing") return `Fusions et acquisitions sont le métier du Closing : peser une maison de commerce, lire ses comptes, mener la négociation jusqu'au sceau${s}.`;
  const nom=c.nom.charAt(0).toUpperCase()+c.nom.slice(1);
  return `${nom} : l'ouvrage du jour, fait avec soin, noté le soir${s}.`;
}
function recitDu(c,d){
  if(d===today()) return recitAuj(c);
  const k=normName(c.nom), fait=catDoneDay(c.id,d), m=minDu(c.id,d), sr=fait?serieAu(c.id,d):serieAu(c.id,dayShift(d,-1)), passe=d<today();
  const duree=m?(m+" minutes"):"une séance";
  if(k==="990") return fait
    ? `Neuf cent nonante points, c'est la mesure de l'épreuve des Anglois. Ce jour, ${duree} d'anglais, la ${rangFr(sr)} journée de suite : l'escholier a tendu l'oreille et répondu au maître sans hâte.`
    : `Neuf cent nonante points, c'est la mesure de l'épreuve des Anglois. ${passe?"Ce jour-là, l'anglais est resté muet":"L'anglais attend encore son heure"}${sr?` ; la série de ${sr} jour${sr>1?"s":""} ${passe?"s'est arrêtée là":"tient à ce fil"}`:""}.`;
  if(k==="cumbre") return fait
    ? `Cumbre veut dire la cime, en la langue d'Espagne. Ce jour, ${duree} d'espagnol : la marche ${sr>1?"n° "+sr:"première"} est gravie, et l'épreuve du DELE est plus proche d'autant.`
    : `Cumbre veut dire la cime, en la langue d'Espagne. ${passe?"Ce jour-là, nulle marche ne fut gravie":"La marche du jour n'est pas encore gravie"}${sr?` ; ${sr} marche${sr>1?"s":""} déjà sous les pieds`:""}.`;
  if(k==="lecture"){ const l=lectureDu(d);
    return fait
      ? `Lecture du jour${l?` : « ${l.titre} »`:""}, lue deux fois, la seconde plume en main${sr>1?`, ${sr} jours que le lecteur ne manque pas sa page`:""}. La phrase qui demeure est copiée au cahier.`
      : `Lecture d'un seul texte des philosophes${l?` : « ${l.titre} »`:""}, ${passe?"resté fermé ce jour-là":"qui attend son lecteur"}. Deux lectures, la seconde plume en main, et une ligne au cahier.`; }
  if(k==="leclosing"){ const n=cOn(d);
    return fait
      ? `Fusions et acquisitions sont le métier du Closing. Ce jour, ${duree} à peser maisons et dettes${n?`, et ${n} lettre${n>1?"s":""} de candidature parti${n>1?"es":"e"} au courrier`:""} : rien laissé au hasard.`
      : `Fusions et acquisitions sont le métier du Closing : peser une maison de commerce, lire ses comptes, mener la négociation jusqu'au sceau. ${passe?"Ce jour-là, le comptoir resta clos":"Le comptoir attend"}${n?`, mais ${n} candidature${n>1?"s":""} partie${n>1?"s":""}`:""}.`; }
  const nom=c.nom.charAt(0).toUpperCase()+c.nom.slice(1);
  return fait ? `${nom} : ${duree} ce jour, la ${rangFr(sr)} journée de suite. L'ouvrage avance d'un pas, et le pas est noté.`
    : `${nom} : ${passe?"rien ce jour-là":"l'ouvrage du jour attend encore"}${sr?` ; ${sr} jour${sr>1?"s":""} de suite ${passe?"avant":"jusqu'ici"}`:""}.`;
}
function mondeRecit(d){ const AC=unitsOn(d); const textes=AC.map(c=>recitDu(c,d)); return {textes, lettres:textes.map(x=>x.charAt(0).toUpperCase())}; }
function mondeDonnees(){
  const t=today(), AC=unitsOn(t), ch=chaine();
  const jours=[]; for(let k=28;k>=1;k--){ const d=dayShift(t,-k); jours.push(AC.map((c,i)=>catDoneDay(c.id,d)?i:-1).filter(i=>i>=0)); }
  /* une page neuve chaque jour : la graine vient de la date ; la date et le folio (le jour de l'année) sont les vrais */
  const dt=new Date(t+"T12:00:00"), jan=new Date(dt.getFullYear(),0,1), quant=Math.floor((dt-jan)/864e5)+1;
  const RC=mondeRecit(t);
  return { priorites:AC.map(c=>({nom:c.nom, min:minDu(c.id,t)||20, serie:catStreak(c.id), domaine:((domDef(domOf(appsOfCat(c.id)[0]))||{}).nom)||""})), jours,
    textes:RC.textes, lettres:RC.lettres,
    graine:Number(t.replace(/-/g,""))%100003, jour:dt.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}), folio:"f. "+quant+" r°",
    chaine:Math.max(0,ch.n-(ch.todayOk?1:0)), aujourdhui:AC.map((c,i)=>catDone(c.id)?i:-1).filter(i=>i>=0) };
}
function mondePoser(){
  const slot=document.getElementById("mondeSlot"); if(!slot) return;
  try{
    const AC=unitsOn(today()), PC=mondePiece(AC.length), cle=today()+"|"+PC.id+"|"+AC.map(c=>c.id).join(",");
    if(!AC.length){ slot.remove(); return; }
    if(!MONDE||cle!==MONDE_CLE){
      if(MONDE) MONDE.arreter();
      MONDE_BLOC=document.createElement("div"); MONDE_BLOC.className="monde monde-"+PC.id; MONDE_CLE=cle;
      slot.replaceWith(MONDE_BLOC);
      const D=mondeDonnees(); MONDE_RECIT=JSON.stringify(D.textes);
      MONDE=PC.id==="enluminure"?monterPiece(MONDE_BLOC, ()=>etude_enluminure(D)):monterPiece(MONDE_BLOC, PC.fab, {donnees:PC.donnees, avec:D});
      if(PC.id==="enluminure") MONDE.piece.etat(D.aujourdhui,false);
      if(D.aujourdhui.length===AC.length) MONDE.piece.etat(D.aujourdhui,true);   // déjà bouclée en ouvrant : l'état final, sans rejouer
      return;
    }
    slot.replaceWith(MONDE_BLOC);
    mondeSync();
  }catch(e){ console.error(e); slot.remove(); }
}
/* tes coches → la pièce : ce qui vient d'être fait se lève (animé), ce qui est décoché redescend */
function mondeSync(){
  if(!MONDE) return;
  const AC=unitsOn(today()), P=MONDE.piece, ont=P.faits();
  const faits=AC.map((c,i)=>catDone(c.id)?i:-1).filter(i=>i>=0);
  faits.filter(i=>!ont.includes(i)).forEach(i=>P.faire?P.faire(i):MONDE.geste(i));
  ont.filter(i=>!faits.includes(i)).forEach(i=>P.retirer(i));
  clearTimeout(MONDE_SEUIL);
  if(faits.length===AC.length&&!P.boucle()) MONDE_SEUIL=setTimeout(()=>{ if(MONDE&&!MONDE.piece.boucle()) MONDE.piece.boucler(); },2600);
}

/* ═══════════════════════════════════════════════════════════════════
   LE LIVRE DES JOURS (27/10) — dans Progrès
   Chaque jour passé a sa page enluminée : la même pièce que Maintenant,
   rejouée avec les données de CE jour-là (sa graine, sa date, son folio,
   ses priorités faites, son récit). Un jour plein est doré et sa miniature
   peinte ; un jour manqué reste au crayon. On feuillette avec ‹ ›, ou on
   touche un jour dans la frise des 28 derniers jours.

let LIVRE=null, LIVRE_BLOC=null, LIVRE_CLE="", LIVRE_J=null;
function livreDispo(){ return typeof monterPiece==="function"&&typeof etude_enluminure==="function"&&unitsOn(today()).length===4; }
function livreJour(){ if(!LIVRE_J) LIVRE_J=dayShift(today(),-1); return LIVRE_J; }
function livreDonnees(d){
  const AC=unitsOn(d), dt=new Date(d+"T12:00:00"), jan=new Date(dt.getFullYear(),0,1), quant=Math.floor((dt-jan)/864e5)+1, RC=mondeRecit(d);
  let n=0, x=dayShift(d,-1); while(dayOk(x)&&n<400){ n++; x=dayShift(x,-1); }
  return { priorites:AC.map(c=>({nom:c.nom, min:minDu(c.id,d)||20, serie:serieAu(c.id,d), domaine:((domDef(domOf(appsOfCat(c.id)[0]))||{}).nom)||""})),
    graine:Number(d.replace(/-/g,""))%100003, jour:dt.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}), folio:"f. "+quant+" r°",
    chaine:n, textes:RC.textes, lettres:RC.lettres, faits:AC.map((c,i)=>catDoneDay(c.id,d)?i:-1).filter(i=>i>=0) };
}
function livreHtml(){
  if(!livreDispo()) return "";
  const d=livreJour(), t=today(), AC=unitsOn(d), f=AC.filter(c=>catDoneDay(c.id,d)).length;
  const lbl=new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});

    return `<button class="${dayOk(x)?"or":n?"part":""} ${x===d?"sel":""}" onclick="livreAller('${x}')" aria-label="${x} : ${n} sur ${N}"><i style="--p:${n/N}"></i></button>`; }).join("");
  return `<section class="livre">

function livreAller(d){ if(d>=today()) return; LIVRE_J=d; render(); }
function livrePoser(){

function visibleNow(a){ return !doneToday(a.id) || (S.run&&S.run.id===a.id); }

    const liste=appsOfCat(c.id).filter(visibleNow);
    if(!liste.length) return;
    out+=`<div class="appgrp">`+catHeadHtml(c)+liste.map(a=>appRowHtml(a,idx[a.id])).join("")+`</div>`;
  });
  if(part==="prio") return out;
  const orphelines=S.apps.filter(a=>!catOf(a));
  const restantes=orphelines.filter(visibleNow);
  /* « Le reste » n'est plus plié : toutes les apps restent sous les yeux et
     cochables. Elles ne comptent toujours pas dans la journée — les trois
     priorités du stage passent devant. */
  if(restantes.length){
    out+=`<div class="cathead reste">
      <span class="ce">📦</span><span class="cn">Le reste</span>
      <span class="cs todo">${restantes.length} app${restantes.length>1?"s":""} · hors compte</span></div>`+
      `<div class="catrows">`+restantes.map(a=>appRowHtml(a,idx[a.id])).join("")+`</div>`;
  }
  const faites=S.apps.filter(a=>!visibleNow(a));
  if(!out && faites.length && part!=="reste") out+=`<div class="cvide" style="text-align:center;padding:18px 0 4px">Tout est fait pour aujourd'hui 🎉</div>`;
  if(faites.length){
    out+=`<div class="cathead fait" onclick="toggleFait()" style="cursor:pointer">
      <span class="ce">✅</span><span class="cn">Fait aujourd'hui</span>
      <span class="cs ok">${faites.length} app${faites.length>1?"s":""} ${S.faitOuvert?"▾":"▸"}</span></div>`+
      (S.faitOuvert?faites.map(a=>appRowHtml(a,idx[a.id])).join(""):"");
  }
  return out;
}
