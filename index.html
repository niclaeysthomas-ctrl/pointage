<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pointage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Le Pointage</title>
<style>
  /* ---- Thème CLAIR par défaut : lumineux, coloré, vivant ---- */
  :root{
    --bg:#eef1f6; --bg2:#e6eaf1; --card:#ffffff; --card2:#f4f6fa; --line:#e6e9ef; --line2:#dbe0ea;
    --ink:#1c2230; --muted:#697086; --faint:#9aa2b4;
    --accent:#ff6a45; --accent2:#ff8a5c; --accent-soft:rgba(255,106,69,.12);
    --good:#12b76a; --good-ink:#ffffff; --good-soft:rgba(18,183,106,.13);
    --bad:#f0455f;
    --shadow:0 1px 2px rgba(28,40,70,.05), 0 10px 26px rgba(28,40,70,.07);
    --shadow-sm:0 1px 2px rgba(28,40,70,.06);
    --disp:ui-rounded,'SF Pro Rounded','Nunito',-apple-system,system-ui,sans-serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --r:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --bg2:#141821; --card:#1b2029; --card2:#232935; --line:#2a3140; --line2:#333c4d;
      --ink:#eef2f8; --muted:#98a2b5; --faint:#616c80;
      --accent:#ff7d5c; --accent2:#ff9670; --accent-soft:rgba(255,125,92,.16);
      --good:#34d17f; --good-ink:#06210f; --good-soft:rgba(52,209,127,.16);
      --bad:#ff5c74;
      --shadow:none; --shadow-sm:none;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef1f6; --bg2:#e6eaf1; --card:#ffffff; --card2:#f4f6fa; --line:#e6e9ef; --line2:#dbe0ea;
    --ink:#1c2230; --muted:#697086; --faint:#9aa2b4;
    --accent:#ff6a45; --accent2:#ff8a5c; --accent-soft:rgba(255,106,69,.12);
    --good:#12b76a; --good-ink:#ffffff; --good-soft:rgba(18,183,106,.13); --bad:#f0455f;
    --shadow:0 1px 2px rgba(28,40,70,.05), 0 10px 26px rgba(28,40,70,.07); --shadow-sm:0 1px 2px rgba(28,40,70,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0f1218; --bg2:#141821; --card:#1b2029; --card2:#232935; --line:#2a3140; --line2:#333c4d;
    --ink:#eef2f8; --muted:#98a2b5; --faint:#616c80;
    --accent:#ff7d5c; --accent2:#ff9670; --accent-soft:rgba(255,125,92,.16);
    --good:#34d17f; --good-ink:#06210f; --good-soft:rgba(52,209,127,.16); --bad:#ff5c74;
    --shadow:none; --shadow-sm:none;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:
      radial-gradient(90% 40% at 100% 0%, var(--accent-soft), transparent 55%),
      radial-gradient(80% 40% at 0% 4%, var(--good-soft), transparent 55%),
      var(--bg);
    color:var(--ink);font-family:var(--sans);overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  }
  #app{max-width:540px;margin:0 auto;padding:8px 15px calc(34px + env(safe-area-inset-bottom))}

  /* ---- masthead ---- */
  header{padding:20px 4px 12px;position:relative}
  .eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent)}
  .eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--accent)}
  .today{font-family:var(--disp);font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.02em;
    margin-top:7px;text-wrap:balance;text-transform:capitalize}
  .brand{position:absolute;top:18px;right:2px;display:flex;align-items:center;gap:10px}
  .brand .mk{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--muted)}
  .tgl{width:38px;height:38px;border-radius:50%;border:none;background:var(--card);box-shadow:var(--shadow-sm);
    color:var(--muted);font-size:16px;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
  .tgl:active{transform:scale(.9)}

  /* ---- résumé du jour ---- */
  .summary{background:var(--card);border-radius:22px;padding:18px 20px;margin:6px 0 16px;box-shadow:var(--shadow)}
  .sumhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .frac{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .frac small{font-size:17px;color:var(--muted);font-weight:700}
  .sumline{font-family:var(--disp);font-size:15px;color:var(--ink);font-weight:700;text-align:right;max-width:56%;line-height:1.25}
  .segbar{display:flex;gap:6px;margin-top:16px}
  .segbar i{height:10px;flex:1;border-radius:99px;background:var(--card2);transition:.4s cubic-bezier(.2,.8,.2,1)}
  .segbar i.on{background:linear-gradient(90deg,var(--good),#3ddc8b);box-shadow:0 2px 8px var(--good-soft)}
  .sumfoot{margin-top:14px;font-size:12.5px;color:var(--muted);font-weight:600;
    display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sumfoot b{color:var(--ink);font-variant-numeric:tabular-nums}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--line2)}

  /* ---- chrono en cours ---- */
  .run{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:15px 18px;border-radius:20px;
    background:linear-gradient(120deg,var(--good-soft),transparent),var(--card);
    box-shadow:var(--shadow);border:2px solid var(--good)}
  .run .clock{font-family:var(--disp);font-variant-numeric:tabular-nums;font-size:29px;font-weight:800;color:var(--good);letter-spacing:-.01em}
  .run .t{flex:1;min-width:0}.run .t b{font-size:15.5px;font-weight:750;display:block}
  .run .t small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
  .run button{background:var(--good);border:none;color:var(--good-ink);font-weight:800;border-radius:13px;padding:12px 18px;font-size:14px;cursor:pointer;box-shadow:0 4px 12px var(--good-soft)}

  /* ---- cartes d'app (chacune sa couleur) ---- */
  .row{position:relative;background:var(--card);border-radius:20px;padding:16px 16px 15px;margin-bottom:12px;
    box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;border:1.5px solid transparent}
  .row.done{border-color:color-mix(in srgb,var(--good) 40%,transparent);
    background:linear-gradient(120deg,var(--good-soft),transparent 45%),var(--card)}
  .rtop{display:flex;align-items:center;gap:13px}
  .iconchip{width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;font-size:25px;
    cursor:pointer;background:color-mix(in srgb,var(--c) 18%,var(--card));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 32%,transparent)}
  .iconchip:active{transform:scale(.94)}
  .nm{flex:1;min-width:0;cursor:pointer}
  .nm b{font-family:var(--disp);font-size:17.5px;font-weight:750;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-weight:600;font-variant-numeric:tabular-nums}
  .flame{color:var(--accent);font-weight:800}
  .chk{width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:2.5px solid var(--line2);background:var(--card2);
    display:grid;place-items:center;font-size:20px;color:transparent;cursor:pointer;
    transition:transform .18s cubic-bezier(.2,1.4,.4,1),background .2s,border-color .2s}
  .chk::after{content:"✓";font-weight:900;opacity:0;transform:scale(.3);transition:.22s cubic-bezier(.2,1.5,.4,1)}
  .chk.on{background:linear-gradient(135deg,var(--good),#39d488);border-color:transparent;color:var(--good-ink);box-shadow:0 5px 14px var(--good-soft)}
  .chk.on::after{opacity:1;transform:scale(1)}
  .chk:active{transform:scale(.86)}
  .chk.live{border-color:var(--good);border-style:dashed;animation:breathe 1.7s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 var(--good-soft)}50%{box-shadow:0 0 0 7px var(--good-soft)}}
  .ractions{display:flex;gap:9px;margin-top:14px}
  .ractions button{flex:1;border:none;border-radius:13px;padding:11px 4px;font-size:13.5px;font-weight:750;cursor:pointer;transition:transform .12s,filter .15s;display:flex;align-items:center;justify-content:center;gap:5px}
  .ractions button:active{transform:scale(.97)}
  .ractions .start{background:var(--accent);color:#fff;box-shadow:0 4px 12px var(--accent-soft)}
  .ractions .start:active{filter:brightness(.95)}
  .ractions .fin{background:var(--good);color:var(--good-ink);box-shadow:0 4px 12px var(--good-soft)}
  .ractions .open{background:var(--card2);color:var(--ink)}
  .heat{display:flex;gap:5px;margin-top:14px;align-items:center}
  .heat i{width:100%;max-width:24px;height:7px;border-radius:4px;background:var(--card2)}
  .heat i.on{background:var(--c);opacity:.85}
  .heat .lbl{margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}

  /* ---- pied ---- */
  .fabrow{display:flex;gap:10px;margin-top:18px}
  .fabrow.b{margin-top:10px}
  .catgrp{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    margin:18px 0 2px;display:flex;align-items:center;gap:8px}
  .catgrp::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--accent)}
  .catgrp:first-of-type{margin-top:4px}
  .catrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .catrow .e{font-size:21px;width:27px;text-align:center;flex:none}
  .catrow .n{flex:1;min-width:0;font-weight:750;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .catrow .n i{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--faint);margin-top:1px}
  .catrow button{background:var(--card2);border:none;color:var(--ink);border-radius:10px;height:36px;
    padding:0 12px;font-size:13px;font-weight:750;cursor:pointer;flex:none}
  .catrow button.add{background:var(--accent-soft);color:var(--accent)}
  .catrow button.has{background:transparent;color:var(--faint);cursor:default}
  .fabrow button{flex:1;background:var(--card);border:none;box-shadow:var(--shadow-sm);color:var(--ink);border-radius:15px;
    padding:14px;font-size:13.5px;font-weight:750;cursor:pointer;transition:transform .12s}
  .fabrow button:active{transform:scale(.97)}
  .hint{color:var(--muted);font-size:12.5px;text-align:center;margin-top:20px;line-height:1.65;font-weight:500}

  /* ---- feuille modale ---- */
  #ov{position:fixed;inset:0;background:rgba(15,20,30,.45);backdrop-filter:blur(5px);z-index:50;display:none;align-items:flex-end}
  #ov.on{display:flex}
  .sheet{background:var(--card);border-radius:26px 26px 0 0;width:100%;max-width:540px;margin:0 auto;
    padding:10px 20px calc(26px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;box-shadow:0 -18px 60px rgba(0,0,0,.3)}
  .sheet::before{content:"";display:block;width:40px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 18px}
  .sheet h3{font-family:var(--disp);font-size:21px;font-weight:800;margin-bottom:16px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700}
  .fld input{width:100%;background:var(--card2);border:2px solid transparent;border-radius:13px;color:var(--ink);padding:13px;font-size:16px;font-family:inherit}
  .fld input:focus{outline:none;border-color:var(--accent);background:var(--card)}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;margin-top:9px}
  .btn.ghost{background:var(--card2);color:var(--ink)}
  .btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bad) 40%,transparent)}
  .editrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .editrow .e{font-size:22px;width:28px;text-align:center}
  .editrow .en{flex:1;font-weight:700;font-size:15px}
  .editrow button{background:var(--card2);border:none;color:var(--ink);border-radius:11px;width:38px;height:38px;font-size:16px;cursor:pointer}

  #toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--card);padding:13px 22px;border-radius:14px;font-weight:750;font-size:14px;opacity:0;
    transition:.25s;pointer-events:none;z-index:60;max-width:90%;box-shadow:0 12px 34px rgba(0,0,0,.3)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}


  /* ---- MA JOURNÉE (journal du jour + export) ---- */
  .jcard{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);
    border:1.5px solid transparent;cursor:pointer;transition:transform .15s}
  .jcard:active{transform:scale(.99)}
  .jcard.filled{border-color:color-mix(in srgb,var(--accent) 35%,transparent);
    background:linear-gradient(120deg,var(--accent-soft),transparent 45%),var(--card)}
  .jhead{display:flex;align-items:center;gap:10px}
  .jhead .ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:var(--accent-soft)}
  .jhead b{font-family:var(--disp);font-size:16.5px;font-weight:750;letter-spacing:-.01em;display:block}
  .jhead small{color:var(--muted);font-size:12px;font-weight:600}
  .jhead .go{margin-left:auto;color:var(--faint);font-size:18px;font-weight:800}
  .jprev{margin-top:11px;font-size:13.5px;line-height:1.55;color:var(--ink);opacity:.82;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
  .jtagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .jtag{font-size:11px;font-weight:800;padding:5px 9px;border-radius:99px;background:var(--card2);color:var(--muted);
    border:1.5px solid transparent;cursor:pointer;user-select:none}
  .jtag.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
  .jtag.ro{cursor:default}
  #jTxt{width:100%;min-height:210px;background:var(--card2);border:2px solid transparent;border-radius:14px;
    color:var(--ink);padding:14px;font-size:16px;font-family:inherit;line-height:1.6;resize:vertical}
  #jTxt:focus{outline:none;border-color:var(--accent);background:var(--card)}
  .jsave{font-size:11.5px;color:var(--muted);font-weight:700;text-align:right;margin-top:6px;min-height:16px}
  .jsave.ok{color:var(--good)}
  .jday{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .jday .d{font-size:12px;font-weight:800;color:var(--accent);width:62px;flex:none;text-transform:capitalize}
  .jday .p{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jday .n{flex:none;color:var(--faint);font-size:11px;font-weight:700}
  .jbox{background:var(--card2);border-radius:14px;padding:13px;font-family:var(--mono);font-size:11.5px;
    line-height:1.55;white-space:pre-wrap;max-height:260px;overflow-y:auto;color:var(--ink);margin-bottom:12px}
  .jseg{display:flex;gap:7px;margin-bottom:13px}
  .jseg div{flex:1;text-align:center;background:var(--card2);border-radius:11px;padding:10px 4px;font-size:12.5px;
    font-weight:750;cursor:pointer;border:1.5px solid transparent}
  .jseg div.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}

  /* ---- LES DOSSIERS : une app de chaque par jour ---- */
  .cathead{display:flex;align-items:center;gap:9px;margin:22px 0 9px;padding:0 2px}
  .cathead:first-of-type{margin-top:6px}
  .cathead .ce{font-size:16px;flex:none}
  .cathead .cn{font-family:var(--disp);font-size:12px;font-weight:800;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink)}
  .cathead .cf{font-size:11px;font-weight:800;color:var(--accent);flex:none}
  .cathead .cs{margin-left:auto;font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;flex:none}
  .cathead .cs.todo{background:var(--card2);color:var(--muted)}
  .cathead .cs.ok{background:var(--good-soft);color:var(--good)}
  .cathead .cs.warn{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .row.rest{opacity:.5}
  .row.rest .iconchip{filter:grayscale(1)}
  .restbadge{font-size:10.5px;font-weight:800;color:var(--muted);background:var(--card2);
    padding:4px 8px;border-radius:7px;white-space:nowrap}

  /* ---- LE CALENDRIER ---- */
  .calnav{display:flex;align-items:center;gap:10px;margin:-6px 0 12px}
  .calnav b{font-family:var(--disp);font-size:17px;font-weight:800;flex:1;text-transform:capitalize;letter-spacing:-.01em}
  .calnav button{border:none;background:var(--card2);color:var(--ink);width:36px;height:36px;border-radius:11px;
    font-size:15px;font-weight:800;cursor:pointer;flex:none}
  .calnav button.now{width:auto;padding:0 12px;font-size:12.5px;background:var(--accent-soft);color:var(--accent)}
  .caldow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
  .caldow span{text-align:center;font-size:10px;font-weight:800;color:var(--faint);text-transform:uppercase}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cday{aspect-ratio:1/1.12;border-radius:11px;background:var(--card2);padding:5px 3px 4px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;
    position:relative;border:1.5px solid transparent;transition:transform .12s}
  .cday:active{transform:scale(.94)}
  .cday.out{background:transparent;cursor:default;opacity:.25}
  .cday.full{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 32%,transparent)}
  .cday.now{border-color:var(--accent)}
  .cday b{font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1}
  .cday.now b{color:var(--accent);font-weight:850}
  .cday .cdt{display:flex;gap:2px;margin-top:auto}
  .cday .cdt i{width:4px;height:4px;border-radius:50%;background:var(--line2)}
  .cday .cdt i.on{background:var(--good)}
  .cday .cag{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .cday .cj{position:absolute;bottom:3px;right:4px;font-size:8px;color:var(--faint)}
  .calfoot{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
  .calfoot div{flex:1;min-width:84px;background:var(--card2);border-radius:13px;padding:11px 10px}
  .calfoot b{display:block;font-family:var(--disp);font-size:19px;font-weight:800;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums}
  .calfoot span{font-size:11px;color:var(--muted);font-weight:700}
  .callg{font-size:11px;color:var(--faint);font-weight:650;margin-top:12px;line-height:1.6}
  .daychip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:10px;
    padding:7px 11px;font-size:12.5px;font-weight:700;margin:0 6px 6px 0}
  .daychip small{color:var(--muted);font-weight:650}

  /* ---- LE BRIEF : ce que l'app te propose, maintenant ---- */
  .sugg{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .sugg.first{margin-top:0;padding-top:0;border-top:none}
  .st{display:flex;gap:11px;align-items:flex-start}
  .st .se{font-size:21px;line-height:1.15;flex:none;width:26px;text-align:center}
  .st .sb{flex:1;min-width:0}
  .st .sb b{display:block;font-size:14.5px;font-weight:750;line-height:1.35;letter-spacing:-.01em}
  .st .sb i{display:block;font-style:normal;font-size:12.5px;color:var(--muted);font-weight:600;

    font-size:12px;font-weight:800;display:grid;place-items:center}

    background:var(--card2);color:var(--muted)}

  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

<body>
<div id="app"></div>
<div id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
const KEY="pointage_v1";
const DEFAULT_APPS=[
  {id:"shred",   name:"SHRED",       emoji:"🎸", url:"https://niclaeysthomas-ctrl.github.io/shred/"},
  {id:"piano",   name:"Piano Dojo",  emoji:"🎹", url:"https://niclaeysthomas-ctrl.github.io/piano-dojo/"},
  {id:"n990",    name:"990",         emoji:"🇬🇧", url:"https://niclaeysthomas-ctrl.github.io/990/"},
  {id:"cumbre",  name:"CUMBRE",      emoji:"🇪🇸", url:"https://niclaeysthomas-ctrl.github.io/cumbre/"},
  {id:"miftah",  name:"MIFTAH",      emoji:"🇲🇦", url:"https://niclaeysthomas-ctrl.github.io/miftah/"},
  {id:"closing", name:"LE CLOSING",  emoji:"💼", url:"https://niclaeysthomas-ctrl.github.io/closing/"},
  {id:"bestia",  name:"BESTIAIRE",   emoji:"🦁", url:"https://niclaeysthomas-ctrl.github.io/bestiaire/"}
];
const BASE="https://niclaeysthomas-ctrl.github.io/";
const CATALOGUE=[
  {grp:"Mon entraînement", items:[
    {n:"SHRED",        e:"🎸", u:"shred/",     d:"guitare"},
    {n:"Piano Dojo",   e:"🎹", u:"piano-dojo/",d:"piano"},
    {n:"LA CLÉ",       e:"🎼", u:"lacle/",     d:"théorie & impro"},
    {n:"990",          e:"🇬🇧", u:"990/",       d:"anglais · TOEIC"},
    {n:"CUMBRE",       e:"🇪🇸", u:"cumbre/",    d:"espagnol · DELE"},
    {n:"MIFTAH",       e:"🇲🇦", u:"miftah/",    d:"darija & fuṣḥā"},
    {n:"SPUTNIK",      e:"🇷🇺", u:"sputnik/",   d:"russe"},
    {n:"L'ARÈNE",      e:"⚔️", u:"arene/",     d:"débat"},
    {n:"LE FACE-À-FACE",e:"🎭", u:"faceaface/", d:"conversations difficiles"},
    {n:"CORTEX",       e:"🧠", u:"cortex/",    d:"pensée & décision"},
    {n:"FORGE",        e:"🥊", u:"forge/",     d:"corps & souplesse"},
    {n:"LE CLOSING",   e:"💼", u:"closing/",   d:"finance & M&A"},
    {n:"L'OFFENSIVE",  e:"🎯", u:"offensive/", d:"candidatures"},
    {n:"LE SAS",       e:"🚪", u:"lesas/",     d:"cockpit du jour"}]},
  {grp:"Ce que j'ai offert", items:[
    {n:"BESTIAIRE",    e:"🦁", u:"bestiaire/", d:"zoologie · ton neveu"},
    {n:"PRISME",       e:"🔬", u:"prisme/",    d:"sciences"},
    {n:"TOPSPIN",      e:"🏓", u:"topspin/",   d:"tennis de table"},
    {n:"SIDEMAN",      e:"🎷", u:"sideman/",   d:"piano jazz · Simon"},
    {n:"MORSE PHOQUE", e:"📡", u:"morse/",     d:"code morse"},
    {n:"LISEK",        e:"🦊", u:"lisek/",     d:"polonais"}]},
  {grp:"Outils", items:[
    {n:"L'ÉCHÉANCIER", e:"📅", u:"echeancier/",d:"argent & échéances"},
    {n:"LUTÈCE",       e:"🕯️", u:"lutece/",    d:"carto souterraine"}]}
];
/* ─── LES DOSSIERS ───
   Une app de chaque par jour. Pour les langues et la musique, jamais la même
   trois jours de suite : `rot` marque les dossiers où la rotation s'impose. */
const CATS=[
  {id:"langue",   nom:"Langues",   e:"🗣️", rot:1},
  {id:"musique",  nom:"Musique",   e:"🎵", rot:1},
  {id:"reflexion",nom:"Réflexion", e:"🧠", rot:0},
  {id:"closing",  nom:"Closing",   e:"💼", rot:0},
  {id:"sport",    nom:"Sport",     e:"🥊", rot:0}
];
const CAT_DEFAUT={
  langue:["990","CUMBRE","MIFTAH","SPUTNIK","LISEK"],
  musique:["SHRED","Piano Dojo","LA CLÉ","SIDEMAN"],
  reflexion:["CORTEX","L'ARÈNE","LE FACE-À-FACE","PRISME","BESTIAIRE","MORSE PHOQUE","LUTÈCE"],
  closing:["LE CLOSING","L'OFFENSIVE","L'ÉCHÉANCIER"],
  sport:["FORGE","TOPSPIN"]
};
const CAT_PAR_ID={n990:"langue",cumbre:"langue",miftah:"langue",sputnik:"langue",lisek:"langue",
  shred:"musique",piano:"musique",lacle:"musique",sideman:"musique",
  cortex:"reflexion",arene:"reflexion",faceaface:"reflexion",prisme:"reflexion",
  bestia:"reflexion",bestiaire:"reflexion",morse:"reflexion",lutece:"reflexion",
  closing:"closing",offensive:"closing",echeancier:"closing",
  forge:"sport",topspin:"sport"};
function normName(x){ return String(x||"").toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
const CAT_PAR_NOM={};
Object.keys(CAT_DEFAUT).forEach(c=>CAT_DEFAUT[c].forEach(n=>{ CAT_PAR_NOM[normName(n)]=c; }));

const HUES=["#ff6a45","#f5a524","#12b76a","#3b82f6","#a855f7","#ec4899","#14b8a6","#f97316","#6366f1","#84cc16"];
function appColor(i){ return HUES[i%HUES.length]; }
function today(){ return new Date().toISOString().slice(0,10); }
function dayShift(iso,n){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function load(){
  let s; try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s||!s.apps){ s={day:today(), apps:DEFAULT_APPS.slice(), st:{}, run:null}; }
  s.apps.forEach(a=>{ if(!s.st[a.id]) s.st[a.id]={days:[],min:{}}; });
  /* Une app suivie sans lien affichait « ✎ Lien » au lieu de « ↗ Ouvrir ».
     On rétablit l'URL depuis le catalogue, par id puis par nom. On ne rajoute
     ni ne retire jamais d'app : la liste du jour reste son choix. */
  try{
    const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
    const cat=[]; CATALOGUE.forEach(g=>g.items.forEach(it=>cat.push(it)));
    const parDefaut={}; DEFAULT_APPS.forEach(a=>parDefaut[a.id]=a.url);
    let repare=0;
    s.apps.forEach(a=>{
      if(a.url) return;
      let u=parDefaut[a.id];
      if(!u){ const m=cat.find(it=>norm(it.n)===norm(a.name)); if(m) u=BASE+m.u; }
      if(u){ a.url=u; repare++; }
    });
    if(repare){
      /* on écrit avec `s` : la globale S n'est pas encore assignée à ce stade */
      localStorage.setItem(KEY,JSON.stringify(s));
      setTimeout(()=>toast(repare+" lien"+(repare>1?"s":"")+" rétabli"+(repare>1?"s":"")),600);
    }
  }catch(e){}
  /* Rangement initial dans les dossiers. `cat` absent = jamais rangée ; `cat:""`
     = rangée nulle part, et c'est un choix. On ne repasse donc jamais dessus. */
  try{
    let range=0;
    s.apps.forEach(a=>{
      if(a.cat!==undefined) return;
      a.cat = CAT_PAR_ID[a.id] || CAT_PAR_NOM[normName(a.name)] || "";
      range++;
    });
    if(range) localStorage.setItem(KEY,JSON.stringify(s));
  }catch(e){}
  return s;
}
let S=load();
/* save() écrit ET prévient la synchro. save0() écrit sans la relancer :
   c'est ce qu'utilise la synchro elle-même, sinon elle se rappellerait en boucle. */
function save0(){ localStorage.setItem(KEY,JSON.stringify(S)); }
function save(){ save0(); syncSoon(); }
function stOf(id){ if(!S.st[id]) S.st[id]={days:[],min:{}}; return S.st[id]; }
/* Une coche n'est qu'une date dans un tableau : impossible de savoir, entre deux
   appareils, qui a coché ou décoché en dernier. On note donc l'heure de chaque
   geste à part — c'est ce qui permet à la fusion de trancher sans rien perdre. */
function setCheck(id,d,v){ if(!S.chk) S.chk={}; S.chk[id+"|"+d]={t:Date.now(),v:v?1:0}; }

/* ─── les dossiers ─── */
function catDef(cid){ return CATS.filter(c=>c.id===cid)[0]||null; }
function appsOfCat(cid){ return S.apps.filter(a=>a.cat===cid); }
function catsActives(){ return CATS.filter(c=>appsOfCat(c.id).length); }
function catDoneDay(cid,d){ return S.apps.some(a=>a.cat===cid&&stOf(a.id).days.includes(d)); }
function catDone(cid){ return catDoneDay(cid,today()); }
function catAppDone(cid){ return appsOfCat(cid).filter(a=>doneToday(a.id)); }
function catDaysSet(cid){
  const s=new Set(); appsOfCat(cid).forEach(a=>stOf(a.id).days.forEach(d=>s.add(d))); return s;
}
function catStreak(cid){
  const D=catDaysSet(cid), t=today();
  let d=D.has(t)?t:(D.has(dayShift(t,-1))?dayShift(t,-1):null);
  if(!d) return 0;
  let n=0; while(D.has(d)){ n++; d=dayShift(d,-1); }
  return n;
}
/* La rotation : faite hier ET avant-hier, elle se repose aujourd'hui. On ne
   l'interdit jamais — on la grise et on propose autre chose. Une règle qui
   bloque se contourne ; une règle qui se voit se suit. */
function atRest(id){
  const a=S.apps.filter(x=>x.id===id)[0];
  if(!a||!a.cat) return false;
  const c=catDef(a.cat);
  if(!c||!c.rot) return false;
  const st=stOf(id), t=today();
  return st.days.includes(dayShift(t,-1))&&st.days.includes(dayShift(t,-2));
}
function brokeRot(id){ return doneToday(id)&&atRest(id); }
function inARow(id){
  const st=stOf(id); let d=today(), n=0;
  if(!st.days.includes(d)) d=dayShift(d,-1);
  while(st.days.includes(d)){ n++; d=dayShift(d,-1); }
  return n;
}
/* Les candidates du jour : ni déjà faites, ni au repos, la plus délaissée devant. */
function catPicks(cid){
  return appsOfCat(cid).filter(a=>!doneToday(a.id)&&!atRest(a.id))
    .sort((x,y)=>gapDays(y.id)-gapDays(x.id));
}
function jamaisPointee(id){ return stOf(id).days.length===0; }
/* Une app ajoutée hier n'a pas « jamais servi » : elle n'a pas encore eu sa chance.
   Sans cette semaine de grâce, le brief proposerait de sortir ce qu'il vient de
   faire ajouter. Les apps d'avant ce champ n'ont pas de `since` : elles ont eu
   tout le temps du monde. */
function neuve(a){ return !!(a&&a.since)&&(Date.now()-a.since)<7*864e5; }
function aSortir(a){ return jamaisPointee(a.id)&&!neuve(a); }

/* --- thème --- */
function applyTheme(){ if(S.theme){ document.documentElement.dataset.theme=S.theme; } else { delete document.documentElement.dataset.theme; } }
function currentDark(){ if(S.theme) return S.theme==="dark"; return matchMedia("(prefers-color-scheme: dark)").matches; }
function toggleTheme(){ S.theme=currentDark()?"light":"dark"; save(); applyTheme(); render(); }

/* --- calculs --- */
function doneToday(id){ return stOf(id).days.includes(today()); }
function todayMin(id){ return Math.round(stOf(id).min[today()]||0); }
function totalMin(id){ const m=stOf(id).min; return Math.round(Object.values(m).reduce((a,b)=>a+b,0)); }
function checks(id){ return stOf(id).days.length; }
function streak(id){
  const days=new Set(stOf(id).days);
  let anchor = days.has(today()) ? today() : (days.has(dayShift(today(),-1)) ? dayShift(today(),-1) : null);
  if(!anchor) return 0;
  let n=0, d=anchor;
  while(days.has(d)){ n++; d=dayShift(d,-1); }
  return n;
}
function fmtMin(m){ if(m<60) return m+" min"; const h=Math.floor(m/60); return h+"h"+String(m%60).padStart(2,"0"); }

/* --- actions --- */
function toggle(id){
  const st=stOf(id), t=today();
  const i=st.days.indexOf(t);
  if(i>=0){ st.days.splice(i,1); setCheck(id,t,0); } else { st.days.push(t); st.days.sort(); setCheck(id,t,1); }
  save(); render();
}
function startTimer(id){ if(S.run){ stopTimer(true); } S.run={id, t0:Date.now()}; save(); render(); }
function stopTimer(silent){
  if(!S.run) return;
  const mins=(Date.now()-S.run.t0)/60000;
  const id=S.run.id, st=stOf(id), t=today(); S.run=null;
  if(mins>=0.1) st.min[t]=(st.min[t]||0)+Math.round(mins*10)/10;
  if(!st.days.includes(t)){ st.days.push(t); st.days.sort(); setCheck(id,t,1); } // terminer = fait
  save(); render();
  if(!silent) toast("⏱️ Séance de "+fmtMin(Math.max(1,Math.round(mins)))+" enregistrée");
}
/* la case à cocher : si le chrono tourne pour cette app, cocher = terminer (arrête + enregistre) */
function onCheck(id){ if(S.run && S.run.id===id){ stopTimer(); } else { toggle(id); } }
function openById(id){
  const a=S.apps.find(x=>x.id===id);
  if(a&&a.url){ window.open(a.url,"_blank","noopener"); }
  else if(a){ editApp(id); }
}

/* --- rendu --- */
let tick=null;
function render(){
  const t=today();
  /* La journée ne se compte plus en apps cochées mais en dossiers servis :
     une app de chaque, c'est ça la journée pleine. */
  const AC=catsActives();
  const manque=AC.filter(c=>!catDone(c.id));
  const total=AC.length, done=total-manque.length;
  const totMin=S.apps.reduce((s,a)=>s+todayMin(a.id),0);
  const totChecks=S.apps.reduce((s,a)=>s+checks(a.id),0);
  const dateStr=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const allDone=total&&done===total;
  const nomsManque=manque.map(c=>c.nom).join(", ");

  let runHtml="";
  if(S.run){
    const a=S.apps.find(x=>x.id===S.run.id);
    runHtml=`<div class="run">
      <div class="clock" id="clk">00:00</div>
      <div class="t"><b>${a?a.emoji+" "+esc(a.name):"Chrono"}</b><small>séance en cours</small></div>
      <button onclick="stopTimer()">✓ Terminer</button></div>`;
  }

  /* on ne casse pas une saisie en cours : l'agenda s'écrit dans un champ qui vit
     dans le HTML qu'on remplace, et une synchro peut déclencher un rendu. */
  const ae=document.activeElement;
  const keep = ae && ae.id==="agIn" ? {v:ae.value, s:ae.selectionStart} : null;

  document.getElementById("app").innerHTML=`
    <header>
      <div class="brand">
        <span class="mk">Le Pointage</span>
        ${syncDotHtml()}
        <button class="tgl" onclick="toggleTheme()" aria-label="Changer de thème">${currentDark()?"☀":"☾"}</button>
      </div>
      <div class="eyebrow">Registre du jour</div>
      <div class="today">${dateStr}</div>
    </header>
    <div class="rule"></div>

    <div class="summary">
      <div class="sumhead">
        <div class="frac">${done}<small>/${total}</small></div>
        <div class="sumline">${allDone?"Journée bouclée ! 🎉":done?"Reste "+esc(nomsManque)+".":"Une app de chaque dossier ✨"}</div>
      </div>
      <div class="segbar">${AC.map(c=>`<i class="${catDone(c.id)?"on":""}"></i>`).join("")}</div>
      <div class="sumfoot"><span>⏱ <b>${fmtMin(totMin)}</b> aujourd'hui</span><span class="dot"></span><span>✓ <b>${totChecks}</b> coches en tout</span></div>
      ${briefHeadHtml()}
    </div>
    ${runHtml}
    ${agCardHtml()}
    ${jCardHtml()}

    ${appListHtml()}

    <div class="fabrow">
      <button onclick="editApp('')">＋ Ajouter</button>
      <button onclick="openManage()">✎ Modifier</button>
      <button onclick="openStats()">📊 Bilan</button>
    </div>
    <div class="fabrow b">
      <button onclick="openLauncher()">🚀 Toutes mes apps</button>
      <button onclick="syncOpen()">🔗 Appareils</button>
      <button onclick="location.href='coffre.html'">🔐 Coffre</button>
    </div>
    <div class="hint">Une app de chaque dossier par jour.<br>En langues et en musique, jamais la même trois jours de suite : la troisième se grise, une autre prend le relais.</div>
  `;
  agBind();
  if(keep){
    const el=document.getElementById("agIn");
    if(el){ el.value=keep.v; el.focus(); try{ el.setSelectionRange(keep.s,keep.s); }catch(e){} agPreview(); }
  }
  clearInterval(tick);
  if(S.run){ tick=setInterval(updClock,1000); updClock(); }
}
function catPicksSafe(cid){
  const p=catPicks(cid);
  if(p.length) return p;                 // si tout se repose, la règle cède : la journée passe avant
  return appsOfCat(cid).filter(a=>!doneToday(a.id)).sort((x,y)=>gapDays(y.id)-gapDays(x.id));
}
function catHeadHtml(c){
  const fait=catAppDone(c.id), str=catStreak(c.id), picks=catPicks(c.id);
  let cls="todo", txt;
  if(fait.length){
    cls="ok";
    txt="✓ "+fait[0].name+(fait.length>1?" +"+(fait.length-1):"");
    if(fait.some(a=>brokeRot(a.id))){ cls="warn"; txt="⚠ 3e d'affilée"; }
  }else if(!picks.length && appsOfCat(c.id).length){
    cls="warn"; txt="tout au repos";
  }else{
    txt=picks.length+" au choix";
  }
  return `<div class="cathead">
    <span class="ce">${c.e}</span><span class="cn">${c.nom}</span>
    ${str>0?`<span class="cf">🔥 ${str} j</span>`:""}
    <span class="cs ${cls}">${esc(txt)}</span>
  </div>`;
}
function appRowHtml(a,ai){
  const t=today(), on=doneToday(a.id), running=S.run&&S.run.id===a.id;
  const str=streak(a.id), repos=!on&&atRest(a.id), casse=brokeRot(a.id);
  const last7=Array.from({length:7},(_,k)=>stOf(a.id).days.includes(dayShift(t,-(6-k))));
  return `<div class="row ${on?"done":""} ${repos?"rest":""}" style="--c:${appColor(ai)}">
    <div class="rtop">
      <div class="iconchip" onclick="openById('${a.id}')">${a.emoji}</div>
      <div class="nm" onclick="openById('${a.id}')">
        <b>${esc(a.name)}</b>
        <div class="meta">${str>0?`<span class="flame">🔥 ${str} j</span>`:""}<span>✓ ${checks(a.id)}</span><span>⏱ ${fmtMin(totalMin(a.id))}</span>${todayMin(a.id)?`<span style="color:var(--good)">+${todayMin(a.id)} min</span>`:""}${
          repos?`<span class="restbadge">au repos · ${inARow(a.id)} j d'affilée</span>`:""}${
          casse?`<span class="restbadge">⚠ 3e jour d'affilée</span>`:""}</div>
      </div>
      <div class="chk ${on?"on":""} ${running?"live":""}" onclick="onCheck('${a.id}')" role="checkbox" aria-checked="${on}"></div>
    </div>
    <div class="ractions">
      <button class="${running?"fin":"start"}" onclick="${running?"stopTimer()":`startTimer('${a.id}')`}">${running?"✓ Terminer":"▶ Commencer"}</button>
      ${a.url?`<button class="open" onclick="openById('${a.id}')">↗ Ouvrir</button>`:`<button class="open" onclick="editApp('${a.id}')">✎ Lien</button>`}
    </div>
    <div class="heat">${last7.map(d=>`<i class="${d?"on":""}"></i>`).join("")}<span class="lbl">7 j</span></div>
  </div>`;
}
function appListHtml(){
  let i=0, out="";
  CATS.forEach(c=>{
    const liste=appsOfCat(c.id);
    if(!liste.length) return;
    out+=catHeadHtml(c)+liste.map(a=>appRowHtml(a,i++)).join("");
  });
  const orphelines=S.apps.filter(a=>!a.cat||!catDef(a.cat));
  if(orphelines.length){
    out+=`<div class="cathead"><span class="ce">📦</span><span class="cn">Hors dossier</span>
      <span class="cs todo">hors compte</span></div>`+orphelines.map(a=>appRowHtml(a,i++)).join("");
  }
  return out;
}
function updClock(){
  if(!S.run){ clearInterval(tick); return; }
  const s=Math.floor((Date.now()-S.run.t0)/1000);
  const el=document.getElementById("clk");
  if(el) el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function esc(x){ return String(x==null?"":x).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }
/* Pour une chaîne posée DANS un onclick="…('ici')" : l'apostrophe de L'ARÈNE
   ou L'OFFENSIVE cassait l'appel. On échappe pour JS, puis pour l'attribut. */
function escJs(x){ return esc(String(x==null?"":x).replace(/\\/g,"\\\\").replace(/'/g,"\\'")); }

/* --- reset quotidien --- */
function rollDay(){ const t=today(); if(S.day!==t){ S.day=t; save(); } }

/* --- édition d'une app --- */
let editCat="";
function editApp(id){
  const a=id?S.apps.find(x=>x.id===id):{name:"",emoji:"⭐",url:"",cat:""};
  editCat=a.cat||"";
  sheet(`
    <h3>${id?"Modifier l'app":"Ajouter une app"}</h3>
    <div class="fld"><label>Emoji</label><input id="fE" value="${esc(a.emoji)}" maxlength="4"></div>
    <div class="fld"><label>Nom</label><input id="fN" value="${esc(a.name)}" placeholder="Ex : SHRED"></div>
    <div class="fld"><label>Dossier</label>
      <div class="agpills" id="fC" style="margin-top:0">
        ${CATS.map(c=>`<span data-c="${c.id}" class="${editCat===c.id?"on":""}">${c.e} ${c.nom}</span>`).join("")}
        <span data-c="" class="${editCat?"":"on"}">hors dossier</span>
      </div></div>
    <div class="fld"><label>Lien (facultatif)</label><input id="fU" value="${esc(a.url)}" placeholder="https://…" inputmode="url"></div>
    <button class="btn" onclick="saveApp('${id}')">Enregistrer</button>
    ${id?`<button class="btn danger" onclick="delApp('${id}')">Supprimer cette app</button>`:""}
    <button class="btn ghost" onclick="closeOv()">Annuler</button>
  `);
  const pc=document.getElementById("fC");
  if(pc) pc.addEventListener("click",ev=>{
    const el=ev.target.closest("[data-c]"); if(!el) return;
    editCat=el.dataset.c;
    Array.prototype.forEach.call(ev.currentTarget.children,x=>x.classList.remove("on"));
    el.classList.add("on");
  });
}
function saveApp(id){
  const name=document.getElementById("fN").value.trim();
  const emoji=document.getElementById("fE").value.trim()||"⭐";
  const url=document.getElementById("fU").value.trim();
  if(!name) return toast("Donne-lui un nom.");
  if(id){ const a=S.apps.find(x=>x.id===id); a.name=name; a.emoji=emoji; a.url=url; a.cat=editCat; }
  else{ const nid="x"+Date.now().toString(36); S.apps.push({id:nid,name,emoji,url,cat:editCat,since:Date.now()}); S.st[nid]={days:[],min:{}}; }
  S.appsMod=Date.now();
  save(); closeOv(); render();
}

/* ---- le ménage : ce qui n'a jamais servi ---- */
function openCleanup(){
  const jamais=S.apps.filter(aSortir);
  const vieilles=S.apps.filter(a=>!jamaisPointee(a.id)&&gapDays(a.id)>=30);
  if(!jamais.length&&!vieilles.length){
    return sheet(`<h3>🧹 Faire le ménage</h3>
      <p class="syline">Rien à sortir : toutes tes apps ont servi récemment.</p>
      <button class="btn ghost" onclick="closeOv();render()">Fermer</button>`);
  }
  const ligne=a=>`<div class="editrow">
    <div class="e">${a.emoji}</div>
    <div class="en">${esc(a.name)}<div style="color:var(--muted);font-size:12px;font-weight:600;margin-top:2px">
      ${jamaisPointee(a.id)?"jamais cochée":"rien depuis "+gapDays(a.id)+" jours"}${a.cat&&catDef(a.cat)?" · "+catDef(a.cat).nom:""}</div></div>
    <button onclick="sortirApp('${a.id}')">Sortir</button></div>`;
  sheet(`<h3>🧹 Faire le ménage</h3>
    <p class="syline">Une case qu'on ne coche jamais finit par vider la fraction de son sens.
      Sortir une app la retire du registre du jour — <b>son historique part avec elle</b>, et tu
      peux toujours la reprendre depuis « Toutes mes apps ».</p>
    ${jamais.length?`<div class="aggrp red">Jamais cochées <i>${jamais.length}</i></div>${jamais.map(ligne).join("")}
      <button class="btn danger" onclick="sortirToutes()">Sortir les ${jamais.length} d'un coup</button>`:""}
    ${vieilles.length?`<div class="aggrp grey">Plus rien depuis un mois <i>${vieilles.length}</i></div>${vieilles.map(ligne).join("")}`:""}
    <button class="btn ghost" style="margin-top:14px" onclick="closeOv();render()">Fermer</button>`);
}
function sortirApp(id){
  const a=S.apps.find(x=>x.id===id); if(!a) return;
  S.apps=S.apps.filter(x=>x.id!==id); delete S.st[id];
  agTombs()["app:"+id]=Date.now(); S.appsMod=Date.now();
  if(S.run&&S.run.id===id) S.run=null;
  save(); openCleanup(); toast(a.name+" sortie du registre");
}
function sortirToutes(){
  const jamais=S.apps.filter(aSortir);
  if(!jamais.length) return;
  if(!confirm("Sortir "+jamais.length+" app"+(jamais.length>1?"s":"")+" jamais cochée"+(jamais.length>1?"s":"")+" du registre ?")) return;
  jamais.forEach(a=>{
    S.apps=S.apps.filter(x=>x.id!==a.id); delete S.st[a.id];
    agTombs()["app:"+a.id]=Date.now();
    if(S.run&&S.run.id===a.id) S.run=null;
  });
  S.appsMod=Date.now(); save(); openCleanup(); render();
  toast(jamais.length+" apps sorties du registre");
}
function delApp(id){
  if(!confirm("Supprimer cette app et son historique ?")) return;
  S.apps=S.apps.filter(x=>x.id!==id); delete S.st[id];
  agTombs()["app:"+id]=Date.now();      // sinon l'autre appareil la remet à la prochaine synchro
  S.appsMod=Date.now();
  if(S.run&&S.run.id===id) S.run=null;
  save(); closeOv(); render();
}
function openManage(){
  const jamais=S.apps.filter(aSortir).length;
  sheet(`
    <h3>Réorganiser la liste</h3>
    <p class="syline" style="margin:-10px 0 4px">Le <b>✎</b> ouvre l'app : c'est là qu'on change son dossier.</p>
    ${S.apps.map((a,i)=>`<div class="editrow">
      <div class="e">${a.emoji}</div>
      <div class="en">${esc(a.name)}<div style="color:var(--faint);font-size:11.5px;font-weight:650;margin-top:2px">
        ${a.cat&&catDef(a.cat)?catDef(a.cat).e+" "+catDef(a.cat).nom:"hors dossier"}</div></div>
      <button onclick="move('${a.id}',-1)" ${i===0?"disabled style=opacity:.3":""}>↑</button>
      <button onclick="move('${a.id}',1)" ${i===S.apps.length-1?"disabled style=opacity:.3":""}>↓</button>
      <button onclick="closeOv();editApp('${a.id}')">✎</button>
    </div>`).join("")}
    <button class="btn ghost" style="margin-top:14px" onclick="openCleanup()">🧹 Faire le ménage${jamais?" ("+jamais+" jamais cochée"+(jamais>1?"s":"")+")":""}</button>
    <button class="btn ghost" onclick="closeOv()">Fermer</button>
  `);
}
function move(id,dir){
  const i=S.apps.findIndex(x=>x.id===id), j=i+dir;
  if(j<0||j>=S.apps.length) return;
  [S.apps[i],S.apps[j]]=[S.apps[j],S.apps[i]];
  S.appsMod=Date.now();
  save(); openManage();
}
function inList(url){ return S.apps.some(a=>(a.url||"").replace(/\/$/,"")===url.replace(/\/$/,"")); }
function openLauncher(){
  const html=CATALOGUE.map(g=>`<div class="catgrp">${g.grp}</div>`+g.items.map(it=>{
    const url=BASE+it.u, dedans=inList(url);
    return `<div class="catrow">
      <div class="e">${it.e}</div>
      <div class="n">${esc(it.n)}<i>${esc(it.d)}</i></div>
      ${dedans?`<button class="has" title="déjà dans ton registre">✓ suivie</button>`
              :`<button class="add" onclick="addFromCat('${escJs(it.n)}','${it.e}','${url}')">＋ suivre</button>`}
      <button onclick="window.open('${url}','_blank')">↗</button>
    </div>`;
  }).join("")).join("");
  sheet(`<h3>🚀 Toutes mes apps</h3>
    <p style="color:var(--muted);font-size:12.5px;line-height:1.55;margin:-10px 0 4px">
      <b style="color:var(--ink)">↗</b> ouvre l'app. <b style="color:var(--ink)">＋ suivre</b> l'ajoute à ton registre du jour —
      n'y mets que ce que tu veux vraiment pointer tous les jours, sinon la fraction ne veut plus rien dire.</p>
    ${html}
    <button class="btn ghost" style="margin-top:18px" onclick="closeOv()">Fermer</button>`);
}
function addFromCat(name,emoji,url){

  S.apps.push({id:nid,name,emoji,url,cat:CAT_PAR_NOM[normName(name)]||"",since:Date.now()});
  S.st[nid]={days:[],min:{}}; S.appsMod=Date.now();

}
function addQuick(name,emoji,url){

  S.apps.push({id:nid,name,emoji,url,cat:CAT_PAR_NOM[normName(name)]||"",since:Date.now()});
  S.st[nid]={days:[],min:{}}; S.appsMod=Date.now();

}
function openStats(){
  const rows=S.apps.slice().sort((a,b)=>totalMin(b.id)-totalMin(a.id)).map(a=>`
    <div class="editrow">
      <div class="e">${a.emoji}</div>

    ${rows}
    <button class="btn ghost" onclick="closeOv()">Fermer</button>

  `);
}
function wipe(){ if(confirm("Effacer TOUT l'historique (coches et temps) ? Irréversible.")){ const th=S.theme; localStorage.removeItem(KEY); S=load(); S.theme=th; save(); closeOv(); render(); } }


/* ═══════════════════════════════════════════════════════════════════
   LE BRIEF — ce que l'app propose, et pourquoi.
   Règle du jeu : aucune suggestion générique. Chacune cite un chiffre
   que l'app a vraiment enregistré (une série, un écart, une heure) —
   sinon ce n'est qu'un conseil de plus, et un conseil de plus ne fait
   rien faire à personne.
   Deuxième règle : pour ce qui dort, proposer la sortie autant que la
   reprise. Une case qu'on ne coche jamais vide la fraction de son
   sens, et un registre qui culpabilise finit par se fermer.
   ═══════════════════════════════════════════════════════════════════ */
function lastDone(id){ const d=stOf(id).days; return d.length?d[d.length-1]:null; }
function gapDays(id){
  const l=lastDone(id); if(!l) return 9999;
  return Math.round((Date.parse(today()+"T12:00:00")-Date.parse(l+"T12:00:00"))/864e5);
}
function typicalMin(id){
  const v=Object.values(stOf(id).min||{}).filter(x=>x>0).sort((a,b)=>a-b);
  return v.length?Math.round(v[Math.floor(v.length/2)]):0;    // la médiane, pas la moyenne : une grosse séance ne doit pas fixer la norme
}
function minsUntil(hhmm){
  const p=String(hhmm).split(":"), n=new Date();
  return (+p[0]*60 + +p[1]) - (n.getHours()*60+n.getMinutes());
}
function fmtIn(m){ return m<0 ? "il y a "+fmtMin(-m) : m<60 ? "dans "+m+" min" : "dans "+fmtMin(m); }
function agDoneR(id){ agDone(id); closeOv(); render(); }
function agPushTodayR(id){ agPushToday(id); closeOv(); render(); toast("Reporté à aujourd'hui"); }

function briefAll(){
  const t=today(), B=agBuckets(), H=new Date().getHours(), out=[], pris={};
  const add=o=>out.push(o);

  if(S.run){
    const mins=Math.round((Date.now()-S.run.t0)/60000);
    if(mins>=120){
      const a=S.apps.find(x=>x.id===S.run.id);
      add({k:"chrono", score:200, e:"⏱", t:"Le chrono tourne depuis "+fmtMin(mins),
        w:"Sur "+(a?a.name:"une app")+". Tu l'as sans doute oublié : arrête-le, sinon la séance enregistrée n'aura plus rien à voir avec ce que tu as fait.",
        a:[{l:"✓ Arrêter maintenant", c:"ok", f:"stopTimer();closeOv();render()"}]});
    }
  }

  B.now.filter(x=>x.t).forEach(it=>{
    const m=minsUntil(it.t);
    if(m>240||m<-90) return;
    add({k:"rdv:"+it.id, score:150-Math.max(0,m)/8, e:"📍", t:it.txt,
      w:(m>=0 ? "À "+it.t+" — "+fmtIn(m)+"." : "C'était à "+it.t+".")+
        (it.note?" Tu as noté de quoi préparer." : ""),
      a:[{l:"Ouvrir", c:"", f:"agEdit('"+it.id+"')"},
         {l:"✓ C'est fait", c:"ok", f:"agDoneR('"+it.id+"')"}]});
  });

  /* Les dossiers qui manquent : c'est ça, la journée. Le choix de l'app tient
     compte de la rotation, donc le brief ne reproche jamais une série cassée
     quand c'est la règle elle-même qui demandait de tourner.
     Trois au plus : la liste du dessous montre déjà les cinq. */
  const ACT=catsActives();
  ACT.filter(c=>!catDone(c.id))
    .sort((a,b)=>catStreak(b.id)-catStreak(a.id)).slice(0,3)
    .forEach(c=>{
      const picks=catPicksSafe(c.id);
      if(!picks.length) return;
      const p=picks[0], str=catStreak(c.id), typ=typicalMin(p.id);
      const repos=appsOfCat(c.id).filter(a=>!doneToday(a.id)&&atRest(a.id));
      pris[p.id]=1;
      add({k:"cat:"+c.id, score:75+Math.min(str,20), e:c.e, t:c.nom+" — "+p.emoji+" "+p.name,
        w:(str>0?str+" jours d'affilée sur ce dossier. ":"")+
          (repos.length?repos.map(a=>a.name).join(" et ")+(repos.length>1?" se reposent":" se repose")+" aujourd'hui. ":"")+
          (picks.length>1?picks.length+" au choix. ":"")+
          (typ?"Compte "+fmtMin(typ)+".":"Lance le chrono, il comptera."),
        a:[{l:"▶ "+p.name, c:"go", f:"startTimer('"+p.id+"');closeOv()"},
           {l:"✓ Fait", c:"ok", f:"onCheck('"+p.id+"');closeOv()"}]});
    });

  if(B.late.length){
    const p=B.late[0];
    add({k:"retard", score:66, e:"⚠️", t:B.late.length+" chose"+(B.late.length>1?"s":"")+" en retard",
      w:"La plus ancienne : « "+p.txt+" », prévue "+agDL(p.d).replace(/\.$/,"")+".",
      a:[{l:"Voir l'agenda", c:"", f:"closeOv();agSheet()"},
         {l:"→ Aujourd'hui", c:"go", f:"agPushTodayR('"+p.id+"')"}]});
  }

  if(H>=19 && !jHas(t)){
    add({k:"journal", score:62, e:"🌙", t:"Écris ta journée",
      w:jPrompt()+" Trois lignes suffisent — et c'est ce que tu me colleras plus tard.",
      a:[{l:"Ouvrir le journal", c:"go", f:"closeOv();openJournal()"}]});
  }

  const dort=B.inbox.filter(x=>x.c&&(Date.now()-x.c)>7*864e5).sort((a,b)=>a.c-b.c)[0];
  if(dort){
    add({k:"inbox", score:46, e:"🕰", t:"« "+dort.txt+" » attend depuis "+Math.round((Date.now()-dort.c)/864e5)+" jours",
      w:"Sans date, une tâche ne se fait jamais : elle se relit. Donne-lui un jour — ou raye-la, c'est une réponse aussi.",
      a:[{l:"Lui donner un jour", c:"go", f:"agEdit('"+dort.id+"')"},
         {l:"✓ Fait", c:"ok", f:"agDoneR('"+dort.id+"')"}]});
  }

  /* Une seule app endormie à la fois : la plus ancienne. */
  const endormies=S.apps.filter(a=>!pris[a.id]&&gapDays(a.id)>=12&&gapDays(a.id)<9000)
    .sort((a,b)=>gapDays(b.id)-gapDays(a.id));
  if(endormies.length){
    const a=endormies[0], g=gapDays(a.id);
    pris[a.id]=1;
    add({k:"dort:"+a.id, score:40, e:"💤", t:a.name+" dort depuis "+g+" jours",
      w:"Soit tu t'y remets aujourd'hui, soit tu la sors du registre. Les deux valent mieux qu'une case qui reste vide tous les soirs."+
        (endormies.length>1?" ("+(endormies.length-1)+" autre"+(endormies.length>2?"s":"")+" dans le même cas.)":""),
      a:[{l:"▶ S'y remettre", c:"go", f:"startTimer('"+a.id+"');closeOv()"},
         {l:"La sortir", c:"", f:"closeOv();editApp('"+a.id+"')"}]});
  }

  /* Sans aucun dossier rangé, on retombe sur l'ancienne logique : une app à faire. */
  const reste=S.apps.filter(a=>!doneToday(a.id)&&!pris[a.id]);
  if(!ACT.length && reste.length){
    const p=reste.slice().sort((a,b)=>gapDays(b.id)-gapDays(a.id))[0];
    const typ=typicalMin(p.id), g=gapDays(p.id);
    add({k:"quete", score:34, e:p.emoji, t:"Commencer par "+p.name,
      w:(g>9000 ? "Jamais pointée encore — c'est l'occasion. " : g>1 ? "Pas touché depuis "+g+" jours. " : "")+
        (typ ? "Compte "+fmtMin(typ)+", c'est ton rythme habituel." : "Lance le chrono, il fera le compte tout seul."),
      a:[{l:"▶ Commencer", c:"go", f:"startTimer('"+p.id+"');closeOv()"},
         {l:"↗ Ouvrir", c:"", f:"openById('"+p.id+"')"}]});
  }

  /* Un dossier vide, c'est une journée qui ne pourra jamais être pleine.
     Le lanceur contient sûrement de quoi le remplir. */
  CATS.filter(c=>!appsOfCat(c.id).length).forEach(c=>{
    const cands=[];
    CATALOGUE.forEach(g=>g.items.forEach(x=>{
      if(CAT_PAR_NOM[normName(x.n)]===c.id && !inList(BASE+x.u)) cands.push(x);
    }));
    if(!cands.length) return;
    add({k:"vide:"+c.id, score:44, e:c.e, t:"Rien dans "+c.nom,
      w:"Ce dossier est vide : ta journée se compte sur "+ACT.length+" dossiers au lieu de "+CATS.length+". "+
        cands.map(x=>x.n).join(" et ")+" "+(cands.length>1?"attendent":"attend")+" dans le lanceur.",
      a:[{l:"＋ "+cands[0].n, c:"go", f:"addQuick('"+escJs(cands[0].n)+"','"+cands[0].e+"','"+BASE+cands[0].u+"')"},
         {l:"Toutes mes apps", c:"", f:"closeOv();openLauncher()"}]});
  });

  const jamais=S.apps.filter(aSortir);
  if(jamais.length>=2){
    add({k:"menage", score:26, e:"🧹", t:jamais.length+" apps n'ont jamais été cochées",
      w:jamais.slice(0,3).map(a=>a.name).join(", ")+(jamais.length>3?"…":"")+
        ". Elles allongent le registre sans rien y ajouter — les sortir rend la fraction honnête.",
      a:[{l:"Faire le ménage", c:"", f:"closeOv();openCleanup()"}]});
  }

  const dem=agAll().filter(x=>!x.done&&x.d===dayShift(t,1)).sort((a,b)=>(a.t||"99").localeCompare(b.t||"99"));
  if(dem.length>=2){
    add({k:"demain", score:28, e:"📅", t:"Demain : "+dem.length+" choses"+(dem[0].t?", dès "+dem[0].t:""),
      w:"La première est « "+dem[0].txt+" ». Si quelque chose doit être prêt avant, c'est ce soir que ça se prépare.",
      a:[{l:"Voir l'agenda", c:"", f:"closeOv();agSheet()"}]});
  }

  const bouclee = ACT.length ? !ACT.some(c=>!catDone(c.id))
                             : (S.apps.length && !S.apps.some(a=>!doneToday(a.id)));
  if(bouclee){
    const tot=S.apps.reduce((s,a)=>s+todayMin(a.id),0);
    const n=ACT.length||S.apps.length;
    add({k:"boucle", score:58, e:"🎉", t:"Journée bouclée — "+n+"/"+n+(ACT.length?" dossiers":""),
      w:(tot?fmtMin(tot)+" de pratique aujourd'hui. ":"")+"Tu peux fermer l'app sans arrière-pensée.",
      a: jHas(t)?[]:[{l:"Écrire ma journée", c:"go", f:"closeOv();openJournal()"}]});
  }

  return out.sort((a,b)=>b.score-a.score);
}

function suggHtml(s,first){
  return `<div class="sugg ${first?"first":""}">
    <div class="st"><div class="se">${s.e}</div>
      <div class="sb"><b>${esc(s.t)}</b><i>${esc(s.w)}</i></div></div>
    ${s.a&&s.a.length?`<div class="sa">${s.a.map(x=>
      `<button class="${x.c||""}" onclick="${x.f}">${esc(x.l)}</button>`).join("")}</div>`:""}
  </div>`;
}
function briefHeadHtml(){
  const L=briefAll();
  if(!L.length) return `<button class="briefmore" onclick="openBrief()">⋯ le brief du jour</button>`;
  const n=L.length-1;
  return suggHtml(L[0]) +
    `<button class="briefmore" onclick="openBrief()">⋯ ${n>0?n+" autre"+(n>1?"s":"")+" suggestion"+(n>1?"s":"")+" · ":""}le brief du jour</button>`;
}

function weekStats(){
  const t=today(), out=[];
  for(let k=6;k>=0;k--){
    const d=dayShift(t,-k); let min=0, any=false;
    S.apps.forEach(a=>{ const st=stOf(a.id); min+=Math.round(st.min[d]||0); if(st.days.includes(d)) any=true; });
    out.push({d,min,any});
  }
  return out;
}
function weekMin(offset){
  let s=0;
  for(let k=0;k<7;k++){ const d=dayShift(today(),-(k+offset));
    S.apps.forEach(a=>s+=Math.round(stOf(a.id).min[d]||0)); }
  return s;
}
function openBrief(){
  const L=briefAll(), W=weekStats(), B=agBuckets(), t=today();
  const total=S.apps.length, done=S.apps.filter(a=>doneToday(a.id)).length;
  const max=Math.max(1, ...W.map(x=>x.min));
  const cette=weekMin(0), avant=weekMin(7);
  const jours=W.filter(x=>x.any).length;
  const now=new Date();
  const attend=[...B.late, ...B.now];

  const delta = avant ? Math.round((cette-avant)/avant*100) : null;
  const deltaTxt = delta===null ? "" :
    `<span class="bdelta ${delta>=0?"up":"down"}">${delta>=0?"+":""}${delta}%</span> vs la semaine d'avant`;

  sheet(`<h3>📋 Le brief</h3>
    <div class="bhead">${now.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})} ·
      ${String(now.getHours()).padStart(2,"0")}h${String(now.getMinutes()).padStart(2,"0")} ·
      ${done}/${total} pointé${done>1?"s":""}</div>

    ${L.length?L.slice(0,7).map((s,i)=>suggHtml(s,i===0)).join(""):
      `<div class="agempty">Rien à signaler. C'est plutôt bon signe.</div>`}

    ${attend.length?`<div class="aggrp">Ce qui t'attend <i>${attend.length}</i></div>
      <div id="briefAg">${attend.map(it=>agRowHtml(it,true)).join("")}</div>`:""}

    <div class="aggrp">Ton rythme <i>7 jours</i></div>
    <div class="spark">${W.map(x=>
      `<i class="${x.min?"on":""} ${x.d===t?"today":""}" style="height:${Math.max(3,Math.round(x.min/max*44))}px"></i>`).join("")}</div>
    <div class="sparkl">${W.map(x=>
      `<span>${new Date(x.d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"narrow"})}</span>`).join("")}</div>
    <div class="btot"><b>${fmtMin(cette)}</b> cette semaine · <b>${jours}</b> j/7 pointés ${deltaTxt}</div>

    <button class="btn ghost" style="margin-top:18px" onclick="closeOv();render()">Fermer</button>`);
  const ag=document.getElementById("briefAg");
  if(ag) ag.addEventListener("click",e=>agRowAct(e,openBrief));
}

/* ═══════════════════════════════════════════════════════════════════
   L'AGENDA — ce qui est prévu, ce qui traîne.
   Remplace la note partagée : une ligne tapée au kilomètre, la date et
   l'heure sont comprises toutes seules. « 5 oct 20h psy campus » donne
   une tâche au 5 octobre à 20:00 ; « postuler Dior » tombe sans date.
   Le pari : tant que noter coûte plus cher qu'une ligne dans Notes,
   l'agenda perd. Donc un seul champ, jamais de formulaire pour capturer.
   ═══════════════════════════════════════════════════════════════════ */
function agAll(){ if(!Array.isArray(S.agenda)) S.agenda=[]; return S.agenda; }
function agTombs(){ if(!S.tomb) S.tomb={}; return S.tomb; }
function agGet(id){ return agAll().find(x=>x.id===id); }
function agId(){ return "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function pad2(n){ return String(n).padStart(2,"0"); }
function agTouch(it){ it.mod=Date.now(); }

/* ---- comprendre ce qui est tapé ---- */
const AG_MOIS={janvier:1,janv:1,jan:1,fevrier:2,fevr:2,fev:2,mars:3,avril:4,avr:4,mai:5,juin:6,
  juillet:7,juil:7,aout:8,septembre:9,sept:9,sep:9,octobre:10,oct:10,novembre:11,nov:11,decembre:12,dec:12};
/* abréviations volontairement limitées : « jeu », « mer », « mar » sont des mots
   français courants, on ne veut pas dater « finir le jeu » un jeudi. */
const AG_JOURS={dimanche:0,lundi:1,mardi:2,mercredi:3,jeudi:4,vendredi:5,samedi:6,lun:1,ven:5,sam:6,dim:0};
const AG_MRE=Object.keys(AG_MOIS).sort((a,b)=>b.length-a.length).join("|");
const AG_JRE=Object.keys(AG_JOURS).sort((a,b)=>b.length-a.length).join("|");

/* accents retirés SANS changer la longueur : les positions trouvées sur cette
   version « à plat » servent à découper la chaîne d'origine. */
function agFlat(s){
  return s.toLowerCase()
    .replace(/[àâä]/g,"a").replace(/[éèêë]/g,"e").replace(/[îï]/g,"i")
    .replace(/[ôö]/g,"o").replace(/[ûüù]/g,"u").replace(/ç/g,"c").replace(/[’‘]/g,"'");
}
function agMake(day,mo,y){
  const now=new Date(), Y=y||now.getFullYear();
  const iso=Y+"-"+pad2(mo)+"-"+pad2(day);
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d)||d.getDate()!==day||d.getMonth()+1!==mo) return null;   // 31 février, non.
  /* pas d'année écrite : une date déjà bien passée parle de l'an prochain */
  if(!y && iso<dayShift(today(),-45)) return (Y+1)+"-"+pad2(mo)+"-"+pad2(day);
  return iso;
}
function agParse(raw){
  const src=String(raw||"").trim(), f=agFlat(src);
  const cuts=[]; let d=null,t=null,t2=null,star=0;
  const free=(i,j)=>!cuts.some(c=>i<c[1]&&j>c[0]);
  function scan(re,fn){
    re.lastIndex=0; let m;
    while((m=re.exec(f))!==null){
      const i=m.index, j=i+m[0].length;
      if(m[0].length===0) break;
      if(free(i,j) && fn(m)!==false) cuts.push([i,j]);
      if(!re.global) break;
    }
  }
  scan(/(^\s*!+\s*)|(\s*!+\s*$)/g, ()=>{ star=1; return true; });
  /* créneau : « 4:30-6:00 », « 16h30 à 18h », « 20h-22h » */
  scan(/\b(\d{1,2})\s*[h:]\s*(\d{2})?\s*(?:-|–|—|a\b|jusqu'a\b)\s*(\d{1,2})\s*[h:]?\s*(\d{2})?\b/g, m=>{
    const h1=+m[1], n1=+(m[2]||0), h2=+m[3], n2=+(m[4]||0);
    if(h1>23||h2>23||n1>59||n2>59) return false;
    t=pad2(h1)+":"+pad2(n1); t2=pad2(h2)+":"+pad2(n2); return true;
  });
  /* heure simple : « 20h », « 20h30 », « 9:15 » */
  scan(/\b(\d{1,2})\s*h\s*(\d{2})?\b|\b(\d{1,2}):(\d{2})\b/g, m=>{
    if(t) return false;
    const h=+(m[1]!=null?m[1]:m[3]), n=+((m[1]!=null?m[2]:m[4])||0);
    if(h>23||n>59) return false;
    t=pad2(h)+":"+pad2(n); return true;
  });
  scan(new RegExp("\\b(\\d{1,2})\\s*(?:er)?\\s*("+AG_MRE+")\\.?\\b","g"), m=>{
    if(d) return false;
    const r=agMake(+m[1],AG_MOIS[m[2]]); if(!r) return false; d=r; return true;
  });
  scan(/\b(\d{1,2})[/.](\d{1,2})(?:[/.](\d{2,4}))?\b/g, m=>{
    if(d) return false;
    const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):null;
    const r=agMake(+m[1],+m[2],y); if(!r) return false; d=r; return true;
  });
  scan(/\b(aujourd'hui|auj|ce soir|ce matin|cet aprem|apres-demain|apres demain|demain)\b/g, m=>{
    if(d) return false;
    const w=m[1];
    d = /apres/.test(w) ? dayShift(today(),2) : /demain/.test(w) ? dayShift(today(),1) : today();
    return true;
  });
  scan(new RegExp("\\b("+AG_JRE+")\\.?(\\s+prochain)?\\b","g"), m=>{
    if(d) return false;
    const want=AG_JOURS[m[1]], cur=new Date(today()+"T12:00:00").getDay();
    let add=(want-cur+7)%7;
    if(m[2]&&add===0) add=7;            // « lundi prochain », un lundi : la semaine d'après
    d=dayShift(today(),add); return true;
  });
  let out="", last=0;
  cuts.sort((a,b)=>a[0]-b[0]).forEach(c=>{ if(c[0]>=last) out+=src.slice(last,c[0]); last=Math.max(last,c[1]); });
  out+=src.slice(last);
  out=out.replace(/\s{2,}/g," ").replace(/^[\s,;:·\-–—]+|[\s,;:·\-–—]+$/g,"").trim();
  return {txt:out||src, d, t, t2, star};
}

/* ---- le modèle ---- */
function agAdd(raw){
  const p=agParse(raw); if(!p.txt) return null;
  const it={id:agId(), txt:p.txt, d:p.d, t:p.t, t2:p.t2, note:"", star:p.star, done:null,
            c:Date.now(), mod:Date.now()};
  agAll().push(it); save(); return it;
}
function agDel(id){
  const it=agGet(id); if(!it) return;
  if(!confirm("Supprimer « "+it.txt+" » ?")) return;
  S.agenda=agAll().filter(x=>x.id!==id);
  agTombs()[id]=Date.now();            // la pierre tombale empêche l'autre appareil de la ressusciter
  save(); closeOv(); render();
}
function agDone(id){
  const it=agGet(id); if(!it) return;
  it.done=it.done?null:today(); agTouch(it); save();
}
function agStar(id){ const it=agGet(id); if(!it) return; it.star=it.star?0:1; agTouch(it); save(); closeOv(); render(); }
function agPushToday(id){ const it=agGet(id); if(!it) return; it.d=today(); agTouch(it); save(); }
function agSort(l){ return l.slice().sort((a,b)=>
  (b.star||0)-(a.star||0) || (a.d||"9999").localeCompare(b.d||"9999") ||
  (a.t||"99:99").localeCompare(b.t||"99:99") || (a.c||0)-(b.c||0)); }
function agBuckets(){
  const t=today(), open=agAll().filter(x=>!x.done);
  return {
    late : agSort(open.filter(x=>x.d&&x.d<t)),
    now  : agSort(open.filter(x=>x.d===t)),
    soon : agSort(open.filter(x=>x.d&&x.d>t)),
    inbox: agSort(open.filter(x=>!x.d)),
    done : agAll().filter(x=>x.done).sort((a,b)=>(b.mod||0)-(a.mod||0))
  };
}
function agDL(d,long){
  const t=today();
  if(d===t) return "aujourd'hui";
  if(d===dayShift(t,1)) return "demain";
  if(d===dayShift(t,-1)) return "hier";
  const dt=new Date(d+"T12:00:00");
  const diff=Math.round((Date.parse(d+"T12:00:00")-Date.parse(t+"T12:00:00"))/864e5);
  if(diff>1&&diff<7) return dt.toLocaleDateString("fr-FR",{weekday:"long"});
  return dt.toLocaleDateString("fr-FR", long?{weekday:"long",day:"numeric",month:"long"}:{weekday:"short",day:"numeric",month:"short"});
}

/* ---- une ligne ---- */
function agRowHtml(it,withDate){
  const t=today(), late=!it.done&&it.d&&it.d<t;
  const bits=[];
  if(it.t) bits.push(`<span class="agt">${it.t}${it.t2?" → "+it.t2:""}</span>`);
  if(withDate&&it.d&&it.d!==t) bits.push(`<span class="agd ${late?"late":""}">${agDL(it.d)}</span>`);
  if(late&&!withDate) bits.push(`<span class="agd late">${agDL(it.d)}</span>`);
  if(it.note) bits.push(`<span>📝</span>`);
  return `<div class="agrow ${it.done?"ok":""}" data-id="${it.id}">
    <div class="agchk ${it.done?"on":""}" data-act="chk" role="checkbox" aria-checked="${!!it.done}"></div>
    <div class="agmain" data-act="open">
      <b>${it.star?'<span class="agst">★</span> ':""}${esc(it.txt)}</b>
      ${bits.length?`<i>${bits.join("")}</i>`:""}
    </div>
    ${late?`<button class="agpush" data-act="push">→ auj.</button>`:""}
  </div>`;
}

/* ---- la carte d'accueil ---- */
function agCardHtml(){
  const B=agBuckets(), n=B.late.length+B.now.length+B.soon.length+B.inbox.length;
  /* Le gros de ce qu'il note n'a pas de date. Si la carte ne montrait que le
     daté, la pile en attente deviendrait invisible — donc on complète avec
     elle (les étoilées d'abord, agSort s'en charge). */
  let shown=[...B.late.slice(0,3), ...B.now];
  if(shown.length<4) shown=shown.concat(B.inbox.slice(0,4-shown.length));
  if(shown.length>5) shown=shown.slice(0,5);
  let body;
  if(shown.length){ body=shown.map(it=>agRowHtml(it,false)).join(""); }
  else{
    const nxt=B.soon[0];
    body=`<div class="agempty">${ nxt
      ? `Rien aujourd'hui. Ensuite : <b>${esc(nxt.txt)}</b> — ${agDL(nxt.d)}${nxt.t?" "+nxt.t:""}.`
      : `Rien de prévu. Note ce que tu as en tête ↓` }</div>`;
  }
  const sub=[];
  if(B.now.length) sub.push(B.now.length+" aujourd'hui");
  if(B.soon.length) sub.push(B.soon.length+" à venir");
  if(B.inbox.length) sub.push(B.inbox.length+" sans date");
  return `<div class="agcard ${B.late.length?"urge":""}" id="agCard">
    <div class="aghead">
      <div class="ic">🗓</div>
      <div><b>L'agenda</b><small>${sub.join(" · ")||"rien en attente"}</small></div>
      ${B.late.length?`<span class="agbad">${B.late.length} en retard</span>`:""}
    </div>
    <div id="agList">${body}</div>
    ${n?`<button class="agmore" data-act="all">⋯ tout voir (${n})</button>`:""}
    <form class="agform" id="agForm"><input id="agIn" placeholder="5 oct 20h psy · demain 9h BCG · postuler Dior"
      autocomplete="off" autocorrect="off" enterkeyhint="done" aria-label="Noter quelque chose"><button type="submit" aria-label="Ajouter">＋</button></form>
    <div class="aghint" id="agHint"></div>
  </div>`;
}

/* ---- saisie ---- */
function agPreview(sfx){
  sfx=sfx||"";
  const el=document.getElementById("agIn"+sfx), h=document.getElementById("agHint"+sfx);
  if(!el||!h) return;
  const v=el.value.trim();
  if(!v){ h.innerHTML=""; return; }
  const p=agParse(v);
  if(!p.d&&!p.t){ h.innerHTML="sans date — ça ira dans la liste d'attente"; return; }
  h.innerHTML="→ <b>"+esc(p.txt)+"</b> · "+(p.d?agDL(p.d):"sans date")+(p.t?" à "+p.t+(p.t2?"–"+p.t2:""):"");
}
function agSubmit(e,sfx){
  e.preventDefault(); sfx=sfx||"";
  const el=document.getElementById("agIn"+sfx); if(!el) return;
  const v=el.value.trim(); if(!v) return;
  const it=agAdd(v); el.value=""; agPreview(sfx);
  if(sfx){ agSheet(); setTimeout(()=>{ const e2=document.getElementById("agIn2"); if(e2) e2.focus(); },0); }
  else { agRepaint(); const e2=document.getElementById("agIn"); if(e2) e2.focus(); }
  if(it&&it.d) toast("🗓 "+agDL(it.d)+(it.t?" à "+it.t:""));
}
function agRepaint(){
  const c=document.getElementById("agCard");
  if(!c){ render(); return; }
  c.outerHTML=agCardHtml(); agBind();
}
function agRowAct(ev,repaint){
  const row=ev.target.closest("[data-id]"); if(!row) return;
  const act=(ev.target.closest("[data-act]")||{}).dataset;
  const id=row.dataset.id;
  if(!act) return;
  if(act.act==="chk"){ agDone(id); repaint(); }
  else if(act.act==="push"){ agPushToday(id); repaint(); toast("Reporté à aujourd'hui"); }
  else if(act.act==="open"){ agEdit(id); }
}
function agBind(){
  const f=document.getElementById("agForm");
  if(f){ f.addEventListener("submit",e=>agSubmit(e)); }
  const i=document.getElementById("agIn");
  if(i){ i.addEventListener("input",()=>agPreview()); }
  const l=document.getElementById("agList");
  if(l){ l.addEventListener("click",e=>agRowAct(e,agRepaint)); }
  const m=document.querySelector('#agCard [data-act="all"]');
  if(m){ m.addEventListener("click",agSheet); }
}

/* ---- la vue complète ---- */
function agSheet(){
  const B=agBuckets();
  const rows=a=>a.map(it=>agRowHtml(it,true)).join("");
  let body="";
  if(B.late.length)  body+=`<div class="aggrp red">En retard <i>${B.late.length}</i></div>`+rows(B.late);
  if(B.now.length)   body+=`<div class="aggrp">Aujourd'hui <i>${B.now.length}</i></div>`+rows(B.now);
  const byDay={}; B.soon.forEach(it=>{ (byDay[it.d]=byDay[it.d]||[]).push(it); });
  Object.keys(byDay).sort().forEach(d=>{
    body+=`<div class="aggrp">${agDL(d,true)} <i>${byDay[d].length}</i></div>`+rows(byDay[d]); });
  if(B.inbox.length) body+=`<div class="aggrp">Sans date <i>${B.inbox.length}</i></div>`+rows(B.inbox);
  if(B.done.length)  body+=`<div class="aggrp grey">Fait <i>${B.done.length}</i></div>`+rows(B.done.slice(0,25));
  if(!body) body=`<div class="agempty">Rien pour l'instant. Écris une ligne en bas : <b>5 oct 20h psy</b>, <b>demain 9h BCG</b>, ou juste <b>postuler Dior</b>.</div>`;
  sheet(`<h3>🗓 L'agenda</h3>
    ${agSegHtml("liste")}
    <div id="agBody">${body}</div>

      placeholder="Noter quelque chose…" autocomplete="off" autocorrect="off" enterkeyhint="done"><button type="submit">＋</button></form>
    <div class="aghint" id="agHint2"></div>

  agSegBind();
  document.getElementById("agForm2").addEventListener("submit",e=>agSubmit(e,"2"));
  document.getElementById("agIn2").addEventListener("input",()=>agPreview("2"));
  document.getElementById("agBody").addEventListener("click",e=>agRowAct(e,agSheet));
}

/* ═══════════════════════════════════════════════════════════════════
   LE CALENDRIER — le mois d'un coup d'œil.
   Il réunit ce que l'app sait d'un jour : les dossiers servis (les
   points), ce qui était prévu (la pastille orange), la journée écrite
   (le ✎). Un mois de régularité se lit alors sans rien ouvrir.
   ═══════════════════════════════════════════════════════════════════ */
let calYM=null;
function calInit(){ if(!calYM) calYM=today().slice(0,7); }
function calShift(n){
  const p=calYM.split("-"), d=new Date(+p[0], +p[1]-1+n, 1);
  calYM=d.getFullYear()+"-"+pad2(d.getMonth()+1);
  calSheet();
}
function calGoToday(){ calYM=today().slice(0,7); calSheet(); }
function calData(ym){
  const map={}, get=d=>(map[d]=map[d]||{cats:{},min:0,ag:0,j:0});
  S.apps.forEach(a=>{
    const st=stOf(a.id);
    st.days.forEach(d=>{ if(d.slice(0,7)===ym&&a.cat) get(d).cats[a.cat]=1; });
    Object.keys(st.min||{}).forEach(d=>{ if(d.slice(0,7)===ym) get(d).min+=Math.round(st.min[d]||0); });
  });
  agAll().forEach(it=>{ if(it.d&&it.d.slice(0,7)===ym) get(it.d).ag++; });
  Object.keys(jAll()).forEach(d=>{ if(d.slice(0,7)===ym&&jHas(d)) get(d).j=1; });
  return map;
}
function agSegHtml(cur){
  return `<div class="jseg" id="agSeg">
    <div data-v="liste" class="${cur==="liste"?"on":""}">📋 La liste</div>
    <div data-v="cal" class="${cur==="cal"?"on":""}">🗓 Le calendrier</div>
  </div>`;
}
function agSegBind(){
  const s=document.getElementById("agSeg");
  if(s) s.addEventListener("click",ev=>{
    const el=ev.target.closest("[data-v]"); if(!el) return;
    if(el.dataset.v==="cal") calSheet(); else agSheet();
  });
}
function calSheet(){
  calInit();
  const ym=calYM, p=ym.split("-"), y=+p[0], mo=+p[1];
  const D=calData(ym), AC=catsActives(), t=today();
  const first=new Date(y,mo-1,1);
  const debut=(first.getDay()+6)%7;                 // la semaine commence lundi
  const n=new Date(y,mo,0).getDate();
  const cells=[];
  for(let i=0;i<debut;i++) cells.push(`<div class="cday out"></div>`);
  for(let d=1;d<=n;d++){
    const iso=ym+"-"+pad2(d), e=D[iso]||{cats:{},min:0,ag:0,j:0};
    const faits=AC.filter(c=>e.cats[c.id]).length;
    cells.push(`<div class="cday ${AC.length&&faits===AC.length?"full":""} ${iso===t?"now":""}" data-d="${iso}">
      <b>${d}</b>
      ${e.ag?`<span class="cag"></span>`:""}
      ${e.j?`<span class="cj">✎</span>`:""}
      <div class="cdt">${AC.map(c=>`<i class="${e.cats[c.id]?"on":""}"></i>`).join("")}</div>
    </div>`);
  }
  const jours=AC.length?Object.keys(D).filter(d=>AC.every(c=>D[d].cats[c.id])).length:0;
  const min=Object.keys(D).reduce((s,d)=>s+D[d].min,0);
  const ecrits=Object.keys(D).filter(d=>D[d].j).length;
  sheet(`<h3>🗓 L'agenda</h3>
    ${agSegHtml("cal")}
    <div class="calnav">
      <button onclick="calShift(-1)" aria-label="Mois précédent">‹</button>
      <b>${first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</b>
      ${ym!==t.slice(0,7)?`<button class="now" onclick="calGoToday()">Aujourd'hui</button>`:""}
      <button onclick="calShift(1)" aria-label="Mois suivant">›</button>
    </div>
    <div class="caldow">${["L","M","M","J","V","S","D"].map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="calgrid" id="calGrid">${cells.join("")}</div>
    <div class="calfoot">
      <div><b>${jours}</b><span>jour${jours>1?"s":""} plein${jours>1?"s":""}</span></div>
      <div><b>${fmtMin(min)}</b><span>de pratique</span></div>
      <div><b>${ecrits}</b><span>journée${ecrits>1?"s":""} écrite${ecrits>1?"s":""}</span></div>
    </div>
    <div class="callg">Les points sous chaque jour sont tes ${AC.length||"—"} dossiers.
      Pastille orange en haut : quelque chose à l'agenda. <b>✎</b> : journée écrite.
      Touche un jour pour l'ouvrir.</div>
    <button class="btn ghost" style="margin-top:16px" onclick="closeOv();render()">Fermer</button>`);
  agSegBind();
  const g=document.getElementById("calGrid");
  if(g) g.addEventListener("click",ev=>{
    const el=ev.target.closest("[data-d]"); if(!el) return;
    calDay(el.dataset.d);
  });
}
function calDay(d){
  const items=agSort(agAll().filter(x=>x.d===d));
  const pointe=S.apps.filter(a=>stOf(a.id).days.includes(d));
  const min=S.apps.reduce((s,a)=>s+Math.round(stOf(a.id).min[d]||0),0);
  const e=jGet(d), AC=catsActives();
  sheet(`<h3>${jDateLabel(d,true)}</h3>
    ${AC.length?`<div class="agpills" style="margin:-4px 0 15px">${AC.map(c=>
      `<span class="${catDoneDay(c.id,d)?"on":""}">${c.e} ${c.nom}</span>`).join("")}</div>`:""}
    ${items.length?`<div class="aggrp">À l'agenda <i>${items.length}</i></div>
      <div id="calDayAg">${items.map(it=>agRowHtml(it,false)).join("")}</div>`:""}
    ${pointe.length?`<div class="aggrp">Pointé <i>${pointe.length}</i></div>
      <div style="margin-top:10px">${pointe.map(a=>{
        const m=Math.round(stOf(a.id).min[d]||0);
        return `<span class="daychip">${a.emoji} ${esc(a.name)}${m?` <small>${fmtMin(m)}</small>`:""}</span>`;
      }).join("")}</div>${min?`<div class="syline" style="margin-top:6px">${fmtMin(min)} au total ce jour-là.</div>`:""}`:""}
    ${jHas(d)?`<div class="aggrp">La journée écrite</div>
      <div class="jprev" style="-webkit-line-clamp:14;margin-top:11px">${esc(e.txt)}</div>
      <button class="btn ghost" style="margin-top:11px" onclick="openJournal('${d}')">Ouvrir le journal</button>`:""}
    ${!items.length&&!pointe.length&&!jHas(d)?`<div class="agempty">Rien ce jour-là.</div>`:""}
    <form class="agform" id="calForm" style="margin-top:17px"><input id="calIn"
      placeholder="Noter quelque chose ce jour-là…" autocomplete="off" enterkeyhint="done"><button type="submit">＋</button></form>
    <button class="btn ghost" style="margin-top:15px" onclick="calSheet()">← Le calendrier</button>`);
  const ag=document.getElementById("calDayAg");
  if(ag) ag.addEventListener("click",ev=>agRowAct(ev,()=>calDay(d)));
  const f=document.getElementById("calForm");
  if(f) f.addEventListener("submit",ev=>{
    ev.preventDefault();
    const el=document.getElementById("calIn"), v=el.value.trim();
    if(!v) return;
    /* le jour ouvert sert de date par défaut — sauf si la phrase en donne une */
    const q=agParse(v);
    agAll().push({id:agId(), txt:q.txt, d:q.d||d, t:q.t, t2:q.t2, note:"", star:q.star,
                  done:null, c:Date.now(), mod:Date.now()});
    save(); calDay(d); toast("Noté");
  });
}
