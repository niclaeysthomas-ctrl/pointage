<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15120c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pointage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Le Pointage</title>
<style>
  :root{
    --paper:#15120c; --card:#201a12; --card2:#2a2117; --line:#39301f; --line2:#4a3f28;
    --ink:#f1e9db; --muted:#a99d88; --faint:#6f6552;
    --brass:#e0a94b; --brass-dim:#b98a35; --brass-soft:rgba(224,169,75,.13);
    --jade:#63b587; --jade-ink:#06170d; --jade-soft:rgba(99,181,135,.14);
    --brick:#d97a68;
    --serif:'Iowan Old Style','Palatino Linotype','Palatino','Georgia',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --r:16px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --paper:#f3ecdd; --card:#fdf9f0; --card2:#efe7d5; --line:#e2d8c2; --line2:#d3c6ac;
      --ink:#2b2418; --muted:#7c7360; --faint:#a99e86;
      --brass:#9e7016; --brass-dim:#b58529; --brass-soft:rgba(158,112,22,.11);
      --jade:#2f8659; --jade-ink:#ffffff; --jade-soft:rgba(47,134,89,.12);
      --brick:#b24a38;
    }
  }
  :root[data-theme="dark"]{
    --paper:#15120c; --card:#201a12; --card2:#2a2117; --line:#39301f; --line2:#4a3f28;
    --ink:#f1e9db; --muted:#a99d88; --faint:#6f6552;
    --brass:#e0a94b; --brass-dim:#b98a35; --brass-soft:rgba(224,169,75,.13);
    --jade:#63b587; --jade-ink:#06170d; --jade-soft:rgba(99,181,135,.14); --brick:#d97a68;
  }
  :root[data-theme="light"]{
    --paper:#f3ecdd; --card:#fdf9f0; --card2:#efe7d5; --line:#e2d8c2; --line2:#d3c6ac;
    --ink:#2b2418; --muted:#7c7360; --faint:#a99e86;
    --brass:#9e7016; --brass-dim:#b58529; --brass-soft:rgba(158,112,22,.11);
    --jade:#2f8659; --jade-ink:#ffffff; --jade-soft:rgba(47,134,89,.12); --brick:#b24a38;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, color-mix(in srgb,var(--brass) 8%, transparent), transparent 60%),
      var(--paper);
    color:var(--ink);font-family:var(--sans);overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  }
  #app{max-width:540px;margin:0 auto;padding:8px 16px calc(34px + env(safe-area-inset-bottom))}

  /* ---- masthead : une page par jour ---- */
  header{padding:20px 4px 14px;position:relative}
  .eyebrow{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--brass);font-family:var(--sans)}
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--brass);opacity:.6}
  .today{font-family:var(--serif);font-size:33px;line-height:1.04;font-weight:700;letter-spacing:-.01em;
    margin-top:8px;text-wrap:balance;text-transform:capitalize}
  .brand{position:absolute;top:20px;right:2px;display:flex;align-items:center;gap:10px}
  .brand .mk{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);letter-spacing:.02em}
  .tgl{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--card);
    color:var(--muted);font-size:15px;cursor:pointer;display:grid;place-items:center}
  .tgl:active{transform:scale(.92)}
  .rule{height:1px;background:linear-gradient(90deg,var(--line2),transparent);margin:2px 4px 16px}

  /* ---- résumé du jour ---- */
  .summary{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;
    box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 4%,transparent)}
  .sumhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .frac{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .frac small{font-size:16px;color:var(--muted);font-weight:400}
  .sumline{font-size:13.5px;color:var(--ink);font-weight:600;text-align:right;max-width:58%}
  .segbar{display:flex;gap:5px;margin-top:14px}
  .segbar i{height:8px;flex:1;border-radius:99px;background:var(--card2);border:1px solid var(--line2);transition:.35s}
  .segbar i.on{background:var(--jade);border-color:var(--jade)}
  .sumfoot{margin-top:12px;font-size:12px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums;
    display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}

  /* ---- chrono en cours ---- */
  .run{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:14px 16px;border-radius:var(--r);
    background:var(--jade-soft);border:1px solid color-mix(in srgb,var(--jade) 45%,var(--line))}
  .run .clock{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;color:var(--jade);letter-spacing:.01em}
  .run .t{flex:1;min-width:0}.run .t b{font-size:15px;display:block}
  .run .t small{color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
  .run button{background:var(--brick);border:none;color:#fff;font-weight:800;border-radius:11px;padding:11px 16px;font-size:13.5px;cursor:pointer}

  /* ---- registre des apps ---- */
  .row{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 16px 14px;margin-bottom:10px;overflow:hidden;transition:border-color .25s,background .25s}
  .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.25s}
  .row.done{background:linear-gradient(100deg,var(--jade-soft),var(--card) 42%)}
  .row.done::before{background:var(--jade)}
  .rtop{display:flex;align-items:center;gap:13px}
  .emoji{font-size:23px;flex:0 0 auto;width:28px;text-align:center;cursor:pointer;line-height:1}
  .nm{flex:1;min-width:0;cursor:pointer}
  .nm b{font-size:16.5px;font-weight:650;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:var(--muted);font-size:12px;margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    font-family:var(--mono);font-variant-numeric:tabular-nums}
  .flame{color:var(--brass);font-family:var(--sans);font-weight:700}
  /* le tampon de présence */
  .chk{width:38px;height:38px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line2);background:var(--card2);
    display:grid;place-items:center;font-size:18px;color:var(--faint);cursor:pointer;transition:transform .18s,background .2s,border-color .2s,color .2s}
  .chk::after{content:"✓";opacity:0;transform:scale(.4);transition:.2s}
  .chk.on{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
  .chk.on::after{opacity:1;transform:scale(1)}
  .chk:active{transform:scale(.88)}
  .ractions{display:flex;gap:8px;margin-top:13px}
  .ractions button{flex:1;background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:11px;
    padding:9px 4px;font-size:12.5px;font-weight:650;cursor:pointer;transition:.15s}
  .ractions button:active{background:var(--card2)}
  .ractions button.timer.fin{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:750}
  .chk.live{border-color:var(--jade);border-style:dashed;animation:breathe 1.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 var(--jade-soft)}50%{box-shadow:0 0 0 5px var(--jade-soft)}}
  .heat{display:flex;gap:4px;margin-top:12px;align-items:center}
  .heat i{width:100%;max-width:22px;height:6px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
  .heat i.on{background:var(--jade);border-color:var(--jade);opacity:.9}
  .heat .lbl{margin-left:auto;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}

  /* ---- pied ---- */
  .fabrow{display:flex;gap:9px;margin-top:16px}
  .fabrow button{flex:1;background:var(--card);border:1px solid var(--line2);color:var(--ink);border-radius:13px;
    padding:13px;font-size:13px;font-weight:650;cursor:pointer}
  .fabrow button:active{background:var(--card2)}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:18px;line-height:1.6;font-family:var(--serif);font-style:italic}

  /* ---- feuille modale ---- */
  #ov{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 55%,rgba(0,0,0,.6));backdrop-filter:blur(4px);
    z-index:50;display:none;align-items:flex-end}
  #ov.on{display:flex}
  .sheet{background:var(--card);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;width:100%;max-width:540px;
    margin:0 auto;padding:10px 18px calc(26px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;
    box-shadow:0 -18px 50px rgba(0,0,0,.28)}
  .sheet::before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 16px}
  .sheet h3{font-family:var(--serif);font-size:20px;font-weight:700;margin-bottom:14px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .fld input{width:100%;background:var(--paper);border:1px solid var(--line2);border-radius:12px;color:var(--ink);
    padding:13px;font-size:16px;font-family:inherit}
  .fld input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
  .btn{display:block;width:100%;border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:750;cursor:pointer;
    background:var(--brass);color:#1c1405;margin-top:8px}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
  .btn.danger{background:transparent;color:var(--brick);border:1px solid color-mix(in srgb,var(--brick) 45%,var(--line))}
  .editrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .editrow .e{font-size:21px;width:26px;text-align:center}
  .editrow .en{flex:1;font-weight:600;font-size:15px}
  .editrow button{background:var(--paper);border:1px solid var(--line2);color:var(--ink);border-radius:10px;width:36px;height:36px;font-size:15px;cursor:pointer}

  #toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:13px;font-weight:700;font-size:14px;opacity:0;
    transition:.25s;pointer-events:none;z-index:60;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
const KEY="pointage_v1";
const DEFAULT_APPS=[
  {id:"shred",   name:"SHRED",       emoji:"🎸", url:"https://niclaeysthomas-ctrl.github.io/shred/"},
  {id:"piano",   name:"Piano Dojo",  emoji:"🎹", url:"https://niclaeysthomas-ctrl.github.io/piano-dojo/"},
  {id:"n990",    name:"990",         emoji:"🇬🇧", url:"https://niclaeysthomas-ctrl.github.io/990/"},
  {id:"cumbre",  name:"CUMBRE",      emoji:"🇪🇸", url:"https://niclaeysthomas-ctrl.github.io/cumbre/"},
  {id:"miftah",  name:"MIFTAH",      emoji:"🇲🇦", url:"https://niclaeysthomas-ctrl.github.io/miftah/"},
  {id:"closing", name:"LE CLOSING",  emoji:"💼", url:"https://niclaeysthomas-ctrl.github.io/closing/"},
  {id:"bestia",  name:"BESTIAIRE",   emoji:"🦁", url:"https://niclaeysthomas-ctrl.github.io/bestiaire/"}
];
function today(){ return new Date().toISOString().slice(0,10); }
function dayShift(iso,n){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function load(){
  let s; try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s||!s.apps){ s={day:today(), apps:DEFAULT_APPS.slice(), st:{}, run:null}; }
  s.apps.forEach(a=>{ if(!s.st[a.id]) s.st[a.id]={days:[],min:{}}; });
  return s;
}
let S=load();
function save(){ localStorage.setItem(KEY,JSON.stringify(S)); }
function stOf(id){ if(!S.st[id]) S.st[id]={days:[],min:{}}; return S.st[id]; }

/* --- thème --- */
function applyTheme(){ if(S.theme){ document.documentElement.dataset.theme=S.theme; } else { delete document.documentElement.dataset.theme; } }
function currentDark(){ if(S.theme) return S.theme==="dark"; return matchMedia("(prefers-color-scheme: dark)").matches; }
function toggleTheme(){ S.theme=currentDark()?"light":"dark"; save(); applyTheme(); render(); }

/* --- calculs --- */
function doneToday(id){ return stOf(id).days.includes(today()); }
function todayMin(id){ return Math.round(stOf(id).min[today()]||0); }
function totalMin(id){ const m=stOf(id).min; return Math.round(Object.values(m).reduce((a,b)=>a+b,0)); }
function checks(id){ return stOf(id).days.length; }
function streak(id){
  const days=new Set(stOf(id).days);
  let anchor = days.has(today()) ? today() : (days.has(dayShift(today(),-1)) ? dayShift(today(),-1) : null);
  if(!anchor) return 0;
  let n=0, d=anchor;
  while(days.has(d)){ n++; d=dayShift(d,-1); }
  return n;
}
function fmtMin(m){ if(m<60) return m+" min"; const h=Math.floor(m/60); return h+"h"+String(m%60).padStart(2,"0"); }

/* --- actions --- */
function toggle(id){
  const st=stOf(id), t=today();
  const i=st.days.indexOf(t);
  if(i>=0){ st.days.splice(i,1); } else { st.days.push(t); st.days.sort(); }
  save(); render();
}
function startTimer(id){ if(S.run){ stopTimer(true); } S.run={id, t0:Date.now()}; save(); render(); }
function stopTimer(silent){
  if(!S.run) return;
  const mins=(Date.now()-S.run.t0)/60000;
  const id=S.run.id, st=stOf(id), t=today(); S.run=null;
  if(mins>=0.1) st.min[t]=(st.min[t]||0)+Math.round(mins*10)/10;
  if(!st.days.includes(t)){ st.days.push(t); st.days.sort(); } // terminer = fait
  save(); render();
  if(!silent) toast("⏱️ Séance de "+fmtMin(Math.max(1,Math.round(mins)))+" enregistrée");
}
/* la case à cocher : si le chrono tourne pour cette app, cocher = terminer (arrête + enregistre) */
function onCheck(id){ if(S.run && S.run.id===id){ stopTimer(); } else { toggle(id); } }
function openById(id){
  const a=S.apps.find(x=>x.id===id);
  if(a&&a.url){ window.open(a.url,"_blank","noopener"); }
  else if(a){ editApp(id); }
}

/* --- rendu --- */
let tick=null;
function render(){
  const t=today();
  const total=S.apps.length;
  const done=S.apps.filter(a=>doneToday(a.id)).length;
  const totMin=S.apps.reduce((s,a)=>s+todayMin(a.id),0);
  const totChecks=S.apps.reduce((s,a)=>s+checks(a.id),0);
  const dateStr=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const allDone=total&&done===total;

  let runHtml="";
  if(S.run){
    const a=S.apps.find(x=>x.id===S.run.id);
    runHtml=`<div class="run">
      <div class="clock" id="clk">00:00</div>
      <div class="t"><b>${a?a.emoji+" "+esc(a.name):"Chrono"}</b><small>séance en cours</small></div>
      <button onclick="stopTimer()">✓ Terminer</button></div>`;
  }

  document.getElementById("app").innerHTML=`
    <header>
      <div class="brand">
        <span class="mk">Le Pointage</span>
        <button class="tgl" onclick="toggleTheme()" aria-label="Changer de thème">${currentDark()?"☀":"☾"}</button>
      </div>
      <div class="eyebrow">Registre du jour</div>
      <div class="today">${dateStr}</div>
    </header>
    <div class="rule"></div>

    <div class="summary">
      <div class="sumhead">
        <div class="frac">${done}<small>/${total}</small></div>
        <div class="sumline">${allDone?"Journée complète. 🔥":done?"Belle lancée — encore "+(total-done)+".":"Tout est à faire."}</div>
      </div>
      <div class="segbar">${S.apps.map(a=>`<i class="${doneToday(a.id)?"on":""}"></i>`).join("")}</div>
      <div class="sumfoot"><span>⏱ ${fmtMin(totMin)} aujourd'hui</span><span class="dot"></span><span>✓ ${totChecks} coches en tout</span></div>
    </div>
    ${runHtml}

    ${S.apps.map(a=>{
      const on=doneToday(a.id), running=S.run&&S.run.id===a.id;
      const str=streak(a.id);
      const last7=Array.from({length:7},(_,k)=>stOf(a.id).days.includes(dayShift(t,-(6-k))));
      return `<div class="row ${on?"done":""}">
        <div class="rtop">
          <div class="emoji" onclick="openById('${a.id}')">${a.emoji}</div>
          <div class="nm" onclick="openById('${a.id}')">
            <b>${esc(a.name)}</b>
            <div class="meta">${str>0?`<span class="flame">🔥 ${str} j</span>`:""}<span>✓ ${checks(a.id)}</span><span>⏱ ${fmtMin(totalMin(a.id))}</span>${todayMin(a.id)?`<span style="color:var(--jade)">+${todayMin(a.id)} min</span>`:""}</div>
          </div>
          <div class="chk ${on?"on":""} ${running?"live":""}" onclick="onCheck('${a.id}')" role="checkbox" aria-checked="${on}"></div>
        </div>
        <div class="ractions">
          <button class="timer ${running?"fin":""}" onclick="${running?"stopTimer()":`startTimer('${a.id}')`}">${running?"✓ Terminer":"▶ Commencer"}</button>
          ${a.url?`<button onclick="openById('${a.id}')">↗ Ouvrir</button>`:`<button onclick="editApp('${a.id}')">✎ Lien</button>`}
        </div>
        <div class="heat">${last7.map(d=>`<i class="${d?"on":""}"></i>`).join("")}<span class="lbl">7 j</span></div>
      </div>`;
    }).join("")}

    <div class="fabrow">
      <button onclick="editApp('')">＋ Ajouter</button>
      <button onclick="openManage()">✎ Modifier</button>
      <button onclick="openStats()">📊 Bilan</button>
    </div>
    <div class="hint">Commence le chrono, coche quand tu as fini : le temps s'enregistre tout seul.<br>Les cases se vident chaque matin ; les coches et le temps ne s'oublient jamais.</div>
  `;
  clearInterval(tick);
  if(S.run){ tick=setInterval(updClock,1000); updClock(); }
}
function updClock(){
  if(!S.run){ clearInterval(tick); return; }
  const s=Math.floor((Date.now()-S.run.t0)/1000);
  const el=document.getElementById("clk");
  if(el) el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function esc(x){ return String(x==null?"":x).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }

/* --- reset quotidien --- */
function rollDay(){ const t=today(); if(S.day!==t){ S.day=t; save(); } }

/* --- édition d'une app --- */
function editApp(id){
  const a=id?S.apps.find(x=>x.id===id):{name:"",emoji:"⭐",url:""};
  sheet(`
    <h3>${id?"Modifier l'app":"Ajouter une app"}</h3>
    <div class="fld"><label>Emoji</label><input id="fE" value="${esc(a.emoji)}" maxlength="4"></div>
    <div class="fld"><label>Nom</label><input id="fN" value="${esc(a.name)}" placeholder="Ex : SHRED"></div>
    <div class="fld"><label>Lien (facultatif)</label><input id="fU" value="${esc(a.url)}" placeholder="https://…" inputmode="url"></div>
    <button class="btn" onclick="saveApp('${id}')">Enregistrer</button>
    ${id?`<button class="btn danger" onclick="delApp('${id}')">Supprimer cette app</button>`:""}
    <button class="btn ghost" onclick="closeOv()">Annuler</button>
  `);
}
function saveApp(id){
  const name=document.getElementById("fN").value.trim();
  const emoji=document.getElementById("fE").value.trim()||"⭐";
  const url=document.getElementById("fU").value.trim();
  if(!name) return toast("Donne-lui un nom.");
  if(id){ const a=S.apps.find(x=>x.id===id); a.name=name; a.emoji=emoji; a.url=url; }
  else{ const nid="x"+Date.now().toString(36); S.apps.push({id:nid,name,emoji,url}); S.st[nid]={days:[],min:{}}; }
  save(); closeOv(); render();
}
function delApp(id){
  if(!confirm("Supprimer cette app et son historique ?")) return;
  S.apps=S.apps.filter(x=>x.id!==id); delete S.st[id];
  if(S.run&&S.run.id===id) S.run=null;
  save(); closeOv(); render();
}
function openManage(){
  sheet(`
    <h3>Réorganiser la liste</h3>
    ${S.apps.map((a,i)=>`<div class="editrow">
      <div class="e">${a.emoji}</div><div class="en">${esc(a.name)}</div>
      <button onclick="move('${a.id}',-1)" ${i===0?"disabled style=opacity:.3":""}>↑</button>
      <button onclick="move('${a.id}',1)" ${i===S.apps.length-1?"disabled style=opacity:.3":""}>↓</button>
      <button onclick="closeOv();editApp('${a.id}')">✎</button>
    </div>`).join("")}
    <button class="btn ghost" onclick="closeOv()">Fermer</button>
  `);
}
function move(id,dir){
  const i=S.apps.findIndex(x=>x.id===id), j=i+dir;
  if(j<0||j>=S.apps.length) return;
  [S.apps[i],S.apps[j]]=[S.apps[j],S.apps[i]];
  save(); openManage();
}
function openStats(){
  const rows=S.apps.slice().sort((a,b)=>totalMin(b.id)-totalMin(a.id)).map(a=>`
    <div class="editrow">
      <div class="e">${a.emoji}</div>
      <div class="en">${esc(a.name)}<div style="color:var(--muted);font-size:12px;font-family:var(--mono);font-weight:400;margin-top:2px">
        ✓ ${checks(a.id)} fois · 🔥 ${streak(a.id)} j · ⏱ ${fmtMin(totalMin(a.id))}</div></div>
    </div>`).join("");
  const totC=S.apps.reduce((s,a)=>s+checks(a.id),0), totT=S.apps.reduce((s,a)=>s+totalMin(a.id),0);
  sheet(`
    <h3>Le bilan de toujours</h3>
    <div class="fld" style="color:var(--muted);font-size:13.5px;font-family:var(--serif);font-style:italic">${totC} coches · ${fmtMin(totT)} de pratique cumulée.</div>
    ${rows}
    <button class="btn ghost" onclick="closeOv()">Fermer</button>
    <button class="btn danger" onclick="wipe()">Tout réinitialiser</button>
  `);
}
function wipe(){ if(confirm("Effacer TOUT l'historique (coches et temps) ? Irréversible.")){ const th=S.theme; localStorage.removeItem(KEY); S=load(); S.theme=th; save(); closeOv(); render(); } }

/* --- overlay & toast --- */
function sheet(html){ document.getElementById("sheet").innerHTML=html; document.getElementById("ov").classList.add("on"); }
function closeOv(){ document.getElementById("ov").classList.remove("on"); }
document.getElementById("ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeOv(); });
let toastT;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }

/* --- init --- */
applyTheme();
rollDay();
render();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ rollDay(); render(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{ if(!S.theme) render(); });
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
