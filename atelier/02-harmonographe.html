<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L'Harmonographe</title>
<style>
/* Le cadre d'une pièce : la toile occupe tout ; le titre discret en haut ; un seul bouton en bas. */
html, body { margin: 0; height: 100%; background: #0F1014; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.titre { position: fixed; left: 16px; top: max(14px, env(safe-area-inset-top)); font: 500 12px/1.3 Georgia, "Times New Roman", serif;
  letter-spacing: .22em; color: rgba(242,240,234,.8); pointer-events: none; text-shadow: 0 0 8px #000; }
.ligne { display: block; margin-top: 5px; font: 500 11px/1.3 ui-monospace, Consolas, monospace; letter-spacing: .12em; color: rgba(242,240,234,.55); }
.retour { position: fixed; right: 14px; top: max(10px, env(safe-area-inset-top)); font: 500 12px Georgia, serif; color: rgba(242,240,234,.6);
  text-decoration: none; padding: 6px 8px; letter-spacing: .1em; }
.bas { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none; }
button { pointer-events: auto; font: 500 14px Georgia, "Times New Roman", serif; letter-spacing: .16em; color: #F2F0EA; background: rgba(15,16,20,.6);
  border: 1px solid rgba(242,240,234,.55); padding: 12px 24px; border-radius: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); min-width: 140px; }
button:active { background: rgba(242,240,234,.18); }
button[hidden] { display: none; }
.erreur { position: fixed; left: 12px; right: 12px; top: 60px; color: #F2B8B0; font: 13px ui-monospace, monospace; white-space: pre-wrap; }
</style></head>
<body>
<canvas id="cv"></canvas>
<div class="titre"><span id="titre"></span><span class="ligne" id="ligne"></span></div>
<a class="retour" href="index.html">← ATELIER</a>
<div class="bas"><button id="geste" type="button"></button></div>
<script>
/* ======================= Atelier du Pointage : outils communs ======================= */
/* Repris de l'« atelier des mondes » d'Eliodor (mêmes noms, pour que ses pièces et les nôtres parlent la même langue),
   avec la palette du Pointage : gris neutre, le blanc pour seul accent (choix de Thomas, 26/10).
   Toute pièce peut appeler ces outils ; aucune ne les redéfinit. Le temps se lit avec maintenant(), jamais Date.now(). */
function graine(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function bruit1(seed){ const R = graine(seed), v = Array.from({length:512}, R); return x => { const i = Math.floor(x), f = x - i, a = v[i & 511], b = v[(i+1) & 511], u = f*f*(3-2*f); return a + (b-a)*u; }; }
function bruit2(seed){ const R = graine(seed), v = Array.from({length:4096}, R);
  const h = (i,j) => v[((i*73856093) ^ (j*19349663)) & 4095];
  return (x,y) => { const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx*fx*(3-2*fx), w = fy*fy*(3-2*fy);
    const a = h(i,j), b = h(i+1,j), c = h(i,j+1), d = h(i+1,j+1); return a + (b-a)*u + (c-a)*w + (a-b-c+d)*u*w; }; }
const mix = (a,b,t) => a.map((x,i) => x + (b[i]-x)*t);
const rgb = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const doux = u => 1 - Math.pow(1 - clamp(u), 3);
const lisse = u => { u = clamp(u); return u*u*(3 - 2*u); };
const maintenant = () => performance.now();
/* La palette du Pointage : un fond gris-noir, des gris, le blanc cassé pour ce qui est fait. */
const FOND = [15,16,20], CARTE = [23,24,29], TRAIT = [52,53,61], GRIS = [119,117,125], GRIS_CLAIR = [163,161,168], BLANC = [242,240,234], BLANC_PUR = [255,253,248];
function toile(w, h, dpr){ const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w*dpr)); c.height = Math.max(1, Math.round(h*dpr)); const x = c.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); return [c, x]; }
function grainTexture(){ const g = document.createElement("canvas"); g.width = g.height = 128; const x = g.getContext("2d"), im = x.createImageData(128,128), R = graine(9);
  for (let i = 0; i < im.data.length; i += 4) { const v = R()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; } x.putImageData(im,0,0); return g; }
const GRAIN = grainTexture();
function passeGrain(ctx, W, H, t, a){ ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = ctx.createPattern(GRAIN, "repeat"); ctx.translate((t*.07)%128, (t*.05)%128); ctx.fillRect(-128, -128, W + 256, H + 256); ctx.restore(); }
function fondu(ctx, W, H, coul, depuis=.82){ const f = ctx.createLinearGradient(0, H*depuis, 0, H); f.addColorStop(0, rgb(coul, 0)); f.addColorStop(1, rgb(coul, 1)); ctx.fillStyle = f; ctx.fillRect(0, H*depuis, W, H*(1-depuis)); }
/* Les données communes à toutes les pièces du premier tour : la journée de Thomas (fictive, mais à sa forme).
   Plus tard, l'app les remplacera par les vraies : priorités du jour, minutes, les 28 derniers jours. */
const JOURNEE = {
  priorites: [
    { nom: "990",        domaine: "Langues",  min: 20, serie: 12 },
    { nom: "CUMBRE",     domaine: "Langues",  min: 20, serie: 11 },
    { nom: "Lecture",    domaine: "Lecture",  min: 12, serie: 9 },
    { nom: "LE CLOSING", domaine: "Carrière", min: 30, serie: 3 }
  ],
  // les 28 derniers jours, du plus ancien à hier : combien de priorités faites (0 à 4)
  jours: [4,4,3,4,2,4,4,4,1,0,4,4,3,4,4,4,4,2,4,4,4,4,3,4,4,4,4,4],
  chaine: 9
};
/* Le bouton dit la prochaine priorité ; le cinquième geste boucle la journée ; ensuite « Encore » relance une variante. */
function libelleGeste(n){ const P = JOURNEE.priorites; return n < 4 ? P[n].nom : n === 4 ? "Boucler" : "Encore"; }
function ligneGeste(n){ const P = JOURNEE.priorites; if (n === 0) return "chaîne · " + JOURNEE.chaine + " jours"; if (n <= 4) return P[n-1].nom + " · " + Math.min(n,4) + " sur 4"; return "journée bouclée · " + (JOURNEE.chaine + 1) + " jours"; }

</script>
<script>
/* ======================= Tour 1, pièce 02 : L'HARMONOGRAPHE (etude_harmonographe) ======================= */
/* Ce qu'on voit : une feuille gris sombre, et une plume blanche qui trace lentement une figure de pendules. Au repos, un seul
   pendule balance la plume : une ellipse qui se resserre. Chaque priorité faite accroche un pendule de plus à la machine ;
   la plume repart du bord et retrace toute la figure, plus riche ; la figure d'avant reste dessous, grisée, comme une couche
   d'encre plus ancienne. On voit les quatre couches de la journée se superposer.
   La loi : l'harmonographe (Blackburn, 1844). La plume suit x(t) = Σ Aᵢ·sin(fᵢt + φᵢ)·e^(−dt), y(t) = Σ Bᵢ·sin(gᵢt + ψᵢ)·e^(−dt) :
   chaque pendule est un oscillateur amorti ; les rapports de fréquences presque entiers (2:3, 3:4…) dessinent les boucles,
   le petit écart à l'entier les fait tourner lentement. Les minutes de chaque priorité désaccordent son pendule.
   La main : la plume fine, l'encre qui s'accumule là où la plume repasse (les nœuds deviennent plus blancs).
   L'usage : « Ta journée ». Une couche par priorité ; la figure finale est unique à chaque journée.
   Le doigt : toucher lève la plume et montre les fréquences ; glisser fait tourner la feuille.
   Le seuil (Boucler) : la feuille se met à tourner sous la plume (harmonographe rotatif) et les quatre pendules tracent
   ensemble, vite, une rosace qui remplit tout l'écran ; la lumière s'accumule dans les croisements. Elle reste.
   Le téléphone : une seule feuille cachée à la taille de l'écran (≤ 1,3 M pixels) ; 600 à 2 400 segments par image. */
const etude_harmonographe_DONNEES = JOURNEE;

function etude_harmonographe(){
  const D = etude_harmonographe_DONNEES;
  let W = 390, H = 760, dpr = 1.5, seed = 1844, papier = null, pctx = null;
  let etape = 0, trace = null, tSeuil = -1e9, rot = 0, rotV = 0, dernier = 0, plumeLevee = -1e9;
  const M = { titre: "L'HARMONOGRAPHE", bouton: libelleGeste(0), ligne: ligneGeste(0), dprMax: 1.5 };
  let P = [];   // les pendules : amplitudes, fréquences, phases

  function pendules(){
    const R = graine(seed), base = [[2, 3], [3, 2], [3, 4], [5, 4], [1, 3], [4, 5]];
    const choix = [0, 1, 2, 3, 4, 5].sort(() => R() - .5);
    P = [{ A: 1, B: 1, f: 1, g: 1.003, p: R() * 6, q: R() * 6 + 1.57 }];   // le pendule du repos : une ellipse
    D.priorites.forEach((pr, i) => { const [a, b] = base[choix[i]], ec = pr.min / 3000;
      P.push({ A: .55 + R() * .4, B: .55 + R() * .4, f: a + ec, g: b - ec * .7, p: R() * 6.28, q: R() * 6.28 }); });
  }
  pendules();

  function point(tau, n, amort, tourne){
    let x = 0, y = 0;
    if (tourne){
      // le rotatif : deux pendules accordés presque juste (l'écart fait tourner les pétales) et la feuille qui tourne
      const a = P[1], c = P[3], fa = Math.round(a.f), fc = Math.round(c.f) || 1;
      x = Math.sin(fa * tau + a.p) + .62 * Math.sin((fc + .004) * tau + c.p);
      y = Math.sin(fa * tau + a.p + 1.5708) + .62 * Math.sin((fc + .004) * tau + c.p + 1.5708 * (fa % 2 ? 1 : -1));
    } else
    for (let i = 0; i <= n; i++){ const p = P[i]; x += p.A * Math.sin(p.f * tau + p.p); y += p.B * Math.sin(p.g * tau + p.q); }
    const e = Math.exp(-amort * tau), s = tourne ? Math.min(W, H) * .29 : Math.min(W, H) * .42 / (1 + n * .55);
    x *= e * s; y *= e * s;
    if (tourne){ const c = Math.cos(tourne * tau), si = Math.sin(tourne * tau); const xx = x * c - y * si; y = x * si + y * c; x = xx; }
    return [x, y];
  }
  // un tracé : n pendules accrochés, de tau 0 à tauFin, en `duree` ms
  function lancer(n, t, duree, tauFin, amort, tourne, alpha, lw){ trace = { n, t0: t, duree, tauFin, amort, tourne, alpha, lw, fait: 0, der: null }; }

  function nouveauPapier(){
    [papier, pctx] = toile(W, H, dpr);
    pctx.fillStyle = rgb(CARTE); pctx.fillRect(0, 0, W, H);
    // le grain du papier, fixé une fois
    const R = graine(seed + 3); pctx.fillStyle = "rgba(255,255,255,.025)";
    for (let k = 0; k < 2600; k++) pctx.fillRect(R() * W, R() * H, 1, 1);
    pctx.translate(W / 2, H / 2);
  }
  function voiler(a){ pctx.save(); pctx.setTransform(dpr, 0, 0, dpr, 0, 0); pctx.fillStyle = rgb(CARTE, a); pctx.fillRect(0, 0, W, H); pctx.restore(); }

  function avancer(t){
    if (!trace) return;
    const u = clamp((t - trace.t0) / trace.duree), cible = lisse(u) * trace.tauFin;
    const pas = trace.tourne ? .012 : .02;
    pctx.save(); pctx.globalCompositeOperation = trace.tourne ? "lighter" : "source-over";
    pctx.strokeStyle = rgb(BLANC, trace.alpha); pctx.lineWidth = trace.lw; pctx.lineJoin = "round";
    pctx.beginPath(); let p = trace.der || point(trace.fait, trace.n, trace.amort, trace.tourne); pctx.moveTo(p[0], p[1]);
    let k = 0; while (trace.fait < cible && k++ < 2400){ trace.fait += pas; p = point(trace.fait, trace.n, trace.amort, trace.tourne); pctx.lineTo(p[0], p[1]); }
    pctx.stroke(); pctx.restore(); trace.der = p;
    if (u >= 1 && trace.fait >= trace.tauFin) trace.fini = true;
  }

  function frame(ctx, t){
    const dt = dernier ? Math.min(.05, (t - dernier) / 1000) : 1 / 60; dernier = t;
    if (!papier) nouveauPapier();
    if (!trace){ lancer(0, t, 9000, 60, .035, 0, .42, .7); }
    if (t - plumeLevee > 1200) avancer(t);
    // le repos : quand le tracé du pendule seul est fini, la plume le reprend en boucle, très pâle (la machine respire)
    if (etape === 0 && trace && trace.fini){ voiler(.08); lancer(0, t, 9000, 60, .035, 0, .3, .7); }
    rot += rotV * dt; rotV *= Math.pow(.05, dt);
    ctx.fillStyle = rgb(FOND); ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(rot);
    if (tSeuil > 0){ const u = lisse((t - tSeuil) / 7000); ctx.scale(1 + .06 * u, 1 + .06 * u); }
    ctx.drawImage(papier, -W / 2, -H / 2, W, H); ctx.restore();
    // la plume : un point blanc et son petit halo, là où elle écrit
    if (trace && !trace.fini && trace.der && t - plumeLevee > 1200){
      const c = Math.cos(rot), s = Math.sin(rot), x = trace.der[0] * c - trace.der[1] * s + W / 2, y = trace.der[0] * s + trace.der[1] * c + H / 2;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 14); g.addColorStop(0, rgb(BLANC_PUR, .5)); g.addColorStop(1, rgb(BLANC_PUR, 0));
      ctx.fillStyle = g; ctx.fillRect(x - 14, y - 14, 28, 28); ctx.fillStyle = rgb(BLANC_PUR); ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill();
    }
    // le repère des pendules, en bas : un trait par pendule accroché, qui balance à sa fréquence
    const n = Math.min(etape, 4);
    for (let i = 0; i <= n; i++){
      const x = W / 2 + (i - n / 2) * 26, a = Math.sin(t / 1000 * P[i].f * 1.6 + P[i].p) * .35;
      ctx.strokeStyle = ctx.fillStyle = rgb(i === n && etape > 0 && etape <= 4 ? BLANC : GRIS, .7); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, H - 118); ctx.lineTo(x + Math.sin(a) * 22, H - 118 + Math.cos(a) * 22); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + Math.sin(a) * 22, H - 118 + Math.cos(a) * 22, 2.5, 0, 7); ctx.fill();
    }
    passeGrain(ctx, W, H, t, .04);
  }

  function geste(){
    const t = maintenant();
    if (etape >= 5){ seed += 11; pendules(); nouveauPapier(); etape = 0; tSeuil = -1e9; trace = null; rot = 0; M.bouton = libelleGeste(0); M.ligne = ligneGeste(0); return; }
    if (trace && !trace.fini && t - trace.t0 < 2500) return;
    if (etape < 4){
      voiler(.62);                                         // la couche d'avant se grise
      lancer(etape + 1, t, 5200, 70 + etape * 12, .028, 0, .55, .75);
    } else {
      voiler(.35); tSeuil = t;
      lancer(4, t, 7500, 260, .006, .021, .22, .55);        // la feuille tourne : la rosace
    }
    etape++; M.bouton = libelleGeste(etape); M.ligne = ligneGeste(etape);
  }
  M.taille = (w, h, d) => { const ch = Math.abs(w - W) > 2 || Math.abs(h - H) > 2; W = w; H = h; dpr = d; if (ch || !papier){ nouveauPapier(); trace = null; } };
  M.frame = frame; M.geste = geste;
  M.tap = () => { plumeLevee = maintenant(); const n = Math.min(etape, 4); M.ligne = P.slice(0, n + 1).map(p => p.f.toFixed(2) + ":" + p.g.toFixed(2)).join("  "); };
  M.glisse = (dx, dy) => { rotV += (dx - dy) * .004; };
  return M;
}
window.ETUDE = etude_harmonographe;

</script>
<script>
/* Le moteur : une image par rafraîchissement, le doigt, le bouton. */
(function(){
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), bouton = document.getElementById("geste");
  const montrerErreur = e => { const p = document.createElement("div"); p.className = "erreur"; p.textContent = "Erreur : " + (e && e.message || e); document.body.appendChild(p); };
  let m; try { m = window.ETUDE(); } catch (e) { montrerErreur(e); return; }
  document.getElementById("titre").textContent = m.titre || "";
  let W = 0, H = 0, D = 1;
  function dimension(){ D = Math.min(window.devicePixelRatio || 1, m.dprMax || 2); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W*D); cv.height = Math.round(H*D); ctx.setTransform(D, 0, 0, D, 0, 0); m.taille(W, H, D); }
  dimension(); addEventListener("resize", dimension);
  let libelle = null, ligne = null, pire = 0, n = 0;
  function boucle(){
    const t0 = performance.now();
    try { ctx.setTransform(D, 0, 0, D, 0, 0); m.frame(ctx, maintenant()); } catch (e) { montrerErreur(e); return; }
    const dt = performance.now() - t0; if (++n > 30) pire = Math.max(pire, dt); window.__PIRE = pire;
    if (m.bouton !== libelle) { libelle = m.bouton; bouton.textContent = libelle || ""; bouton.hidden = !libelle; }
    if ((m.ligne || "") !== ligne) { ligne = m.ligne || ""; document.getElementById("ligne").textContent = ligne; }
    requestAnimationFrame(boucle);
  }
  bouton.onclick = () => { try { m.geste?.(); } catch (e) { montrerErreur(e); } };
  let p0 = null, dernier = null;
  cv.addEventListener("pointerdown", e => { p0 = dernier = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if (!p0) return; const dx = e.clientX - dernier[0], dy = e.clientY - dernier[1]; dernier = [e.clientX, e.clientY];
    if (Math.hypot(e.clientX - p0[0], e.clientY - p0[1]) > 8) m.glisse?.(dx, dy); });
  cv.addEventListener("pointerup", e => { if (p0 && Math.hypot(e.clientX - p0[0], e.clientY - p0[1]) <= 8) m.tap?.(e.clientX, e.clientY); p0 = null; });
  window.__ETUDE = m;
  requestAnimationFrame(boucle);
})();
</script>
</body></html>
