<script>
/* ======================= Atelier du Pointage : outils communs ======================= */
/* Repris de l'« atelier des mondes » d'Eliodor (mêmes noms, pour que ses pièces et les nôtres parlent la même langue),
   avec la palette du Pointage : gris neutre, le blanc pour seul accent (choix de Thomas, 26/10).
   Toute pièce peut appeler ces outils ; aucune ne les redéfinit. Le temps se lit avec maintenant(), jamais Date.now(). */
function graine(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function bruit1(seed){ const R = graine(seed), v = Array.from({length:512}, R); return x => { const i = Math.floor(x), f = x - i, a = v[i & 511], b = v[(i+1) & 511], u = f*f*(3-2*f); return a + (b-a)*u; }; }
function bruit2(seed){ const R = graine(seed), v = Array.from({length:4096}, R);
  const h = (i,j) => v[((i*73856093) ^ (j*19349663)) & 4095];
  return (x,y) => { const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx*fx*(3-2*fx), w = fy*fy*(3-2*fy);
    const a = h(i,j), b = h(i+1,j), c = h(i,j+1), d = h(i+1,j+1); return a + (b-a)*u + (c-a)*w + (a-b-c+d)*u*w; }; }
const mix = (a,b,t) => a.map((x,i) => x + (b[i]-x)*t);
const rgb = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const doux = u => 1 - Math.pow(1 - clamp(u), 3);
const lisse = u => { u = clamp(u); return u*u*(3 - 2*u); };
const maintenant = () => performance.now();
/* La palette du Pointage : un fond gris-noir, des gris, le blanc cassé pour ce qui est fait. */
const FOND = [15,16,20], CARTE = [23,24,29], TRAIT = [52,53,61], GRIS = [119,117,125], GRIS_CLAIR = [163,161,168], BLANC = [242,240,234], BLANC_PUR = [255,253,248];
function toile(w, h, dpr){ const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w*dpr)); c.height = Math.max(1, Math.round(h*dpr)); const x = c.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); return [c, x]; }
function grainTexture(){ const g = document.createElement("canvas"); g.width = g.height = 128; const x = g.getContext("2d"), im = x.createImageData(128,128), R = graine(9);
  for (let i = 0; i < im.data.length; i += 4) { const v = R()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; } x.putImageData(im,0,0); return g; }
const GRAIN = grainTexture();
function passeGrain(ctx, W, H, t, a){ ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = ctx.createPattern(GRAIN, "repeat"); ctx.translate((t*.07)%128, (t*.05)%128); ctx.fillRect(-128, -128, W + 256, H + 256); ctx.restore(); }
function fondu(ctx, W, H, coul, depuis=.82){ const f = ctx.createLinearGradient(0, H*depuis, 0, H); f.addColorStop(0, rgb(coul, 0)); f.addColorStop(1, rgb(coul, 1)); ctx.fillStyle = f; ctx.fillRect(0, H*depuis, W, H*(1-depuis)); }
/* Les données communes à toutes les pièces du premier tour : la journée de Thomas (fictive, mais à sa forme).
   Plus tard, l'app les remplacera par les vraies : priorités du jour, minutes, les 28 derniers jours. */
const JOURNEE = {
  priorites: [
    { nom: "990",        domaine: "Langues",  min: 20, serie: 12 },
    { nom: "CUMBRE",     domaine: "Langues",  min: 20, serie: 11 },
    { nom: "Lecture",    domaine: "Lecture",  min: 12, serie: 9 },
    { nom: "LE CLOSING", domaine: "Carrière", min: 30, serie: 3 }
  ],
  // les 28 derniers jours, du plus ancien à hier : combien de priorités faites (0 à 4)
  jours: [4,4,3,4,2,4,4,4,1,0,4,4,3,4,4,4,4,2,4,4,4,4,3,4,4,4,4,4],
  chaine: 9
};
/* Le bouton dit la prochaine priorité ; le cinquième geste boucle la journée ; ensuite « Encore » relance une variante. */
function libelleGeste(n){ const P = JOURNEE.priorites; return n < 4 ? P[n].nom : n === 4 ? "Boucler" : "Encore"; }
function ligneGeste(n){ const P = JOURNEE.priorites; if (n === 0) return "chaîne · " + JOURNEE.chaine + " jours"; if (n <= 4) return P[n-1].nom + " · " + Math.min(n,4) + " sur 4"; return "journée bouclée · " + (JOURNEE.chaine + 1) + " jours"; }

</script>
<script>
/* ======================= Tour 4, pièce 16 : LA ROSACE (etude_rosace4) ======================= */
/* Ce qu'on voit : la rosace seule, grande, dans le noir de la nef ; chaque verre allumé pose sa tache colorée au sol, nette,
   avec l'ombre de ses plombs (mélange additif) ; la poussière brille dans les faisceaux. Tout ce qui précède le seuil : le tour 3.
   Lois des verres : Voronoï relaxé par Lloyd (S. Lloyd, 1982), 40 itérations sous symétrie dièdre D_N ; au sol, rayons parallèles
   du soleil reposés plan par plan (dalle, marche) par l'homographie H = P·A, exacte ligne à ligne.
   LA LOI DU SEUIL : la réfraction dans un prisme. Au cœur, un cristal (prisme d'angle A = 30°, flint lourd SF10) ; pour 16 longueurs
   d'onde λ (400 à 700 nm), indice de Cauchy (1836) n(λ) = 1,7280 + 0,01342/λ² (λ en µm) ; Snell-Descartes : sin i = n sin r₁,
   r₂ = A − r₁, n sin r₂ = sin e, déviation D = i + e − A ; si n sin r₂ > 1, réflexion totale (la lumière reste piégée) ; Fresnel
   (s et p, deux faces) donne l'intensité. Chaque rayon part du vitrail en 3D (direction du soleil tournée de D vers la base du
   prisme) et touche le premier plan rencontré : dalle, marche, ou le plan de l'œil. Calculés, pas dessinés : l'ordre de naissance
   (le rouge sort d'abord), la largeur de l'éventail, la déviation minimale (24,6° à 550 nm), le point où l'arc tombe.
   La main : vitrail ancien (verre soufflé, grisaille, plombs) ; pierre en albédo ; cristal facetté ; poussière d'or en volume.
   Bleu de Chartres (990), rubis (CUMBRE), jaune d'argent (Lecture), vert émeraude (LE CLOSING). Georgia en capitales, une ligne mono.
   L'usage : « Ta journée ». Chaque priorité allume SON quartier, verre à verre ; sa couleur arrive au sol et son nom s'y couche.
   Le seuil (Boucler, ~9,5 s) : le cœur s'allume, le cristal descend dans l'oculus, piège la lumière (il brille de l'intérieur), puis
   le spectre naît, rouge d'abord. La rosace se met à TOURNER, un tour entier, comme une roue de lumière : toute la projection au sol
   tourne avec elle, noms compris. En tournant, le cristal change d'incidence : l'éventail balaie la nef, plonge dans la pierre, revient,
   fond sur nous (la nef s'emplit de spectre et de poussière d'or au premier plan) ; les 28 médaillons des jours deviennent à leur
   tour des cristaux, leurs nappes de spectre tombent en couronne vers le cœur du sol, d'autant plus vives que le jour a été plein.
   La roue ralentit ; l'arc se pose à la déviation minimale. Reste : « LA JOURNÉE EST BOUCLÉE », l'arc au sol, la couronne de spectre.
   Le doigt : toucher un verre le fait vibrer ; glisser déplace le soleil (taches, arc et couronne suivent : tout est recalculé).
   Le téléphone : le fixe se peint par tranches (≤ 7 ms) ; un seul travail lourd par image (sol, faisceaux, rosace, lueur) ; pendant
   la rotation, la rosace tourne d'un drawImage et le sol est reposé à basse résolution, une image sur deux ou trois. */
const etude_rosace4_DONNEES = Object.assign({
  tons: [
    { nom: "bleu de Chartres", c: [44, 96, 228] },
    { nom: "rubis", c: [216, 30, 50] },
    { nom: "jaune d'argent", c: [250, 186, 44] },
    { nom: "vert émeraude", c: [22, 170, 104] },
  ],
  ordres: [12, 8, 16],     // l'ordre de symétrie, une valeur par relance
  // le cristal du seuil : un prisme de flint lourd (SF10), coefficients de Cauchy (λ en µm)
  prisme: { A: 30, verre: "SF10", cauchyA: 1.7280, cauchyB: 0.01342 },
  mot: "LA JOURNÉE EST BOUCLÉE",
}, JOURNEE);

function etude_rosace4(){
  const DON = etude_rosace4_DONNEES, PR = DON.priorites, TONS = DON.tons.map(t => t.c);
  const PLOMB = [18, 18, 21], BLANC_V = [224, 226, 210], COEUR = [255, 236, 190], NOIR = [8, 6, 14];
  const NUIT = [6, 6, 8];
  let W = 390, H = 760, DPR = 1, seed = 1194, variante = 0, N = DON.ordres[0];
  let cells = [], poussiere = [];
  // la rosace à l'écran
  let R = 170, cx = 195, cy = 230, top = 50;
  // le sol : la caméra de la nef (voir mise()) et les marches
  const HC = 1.25, HM = .08;                 // hauteur du centre de la rosace au-dessus de la dalle haute ; hauteur d'une marche (unités : rayon)
  let F = 180, E = 2, Zc = 2, K0 = .3, yh = 0, yF0 = 0, yLoin = 0, yPres = 0, ZE = [0, 0, Infinity];
  // le soleil (le doigt le déplace)
  let lxM = 0, kM = 1;
  // l'état des priorités
  let fait = [false, false, false, false], tG = [Infinity, Infinity, Infinity, Infinity], tSeuil = Infinity, dernierGeste = -1e9;
  // les calques
  let L = null, Lvieux = null, tVieux = 0, BG = null, ALB = null, LF = null, LFx = null, rayC = null, TEX = null;
  let travaux = [], vib = null, cle = "", roseCle = "", solCle = "", rayCle = "", fsSol = 1, fsL = 1, LFc = {};
  const M = { titre: "LA ROSACE", bouton: libelleGeste(0), ligne: ligneGeste(0), dprMax: 1.5 };

  /* ---------- la géométrie : Voronoï + Lloyd dans un demi-secteur, puis le groupe dièdre ---------- */
  const polaire = (r, a) => [r*Math.cos(a), r*Math.sin(a)];

  function couper(poly, a, b){   // garde le demi-plan plus proche de a que de b (Sutherland-Hodgman)
    const nx = b[0] - a[0], ny = b[1] - a[1], mx = (a[0] + b[0])/2, my = (a[1] + b[1])/2;
    const f = p => (p[0] - mx)*nx + (p[1] - my)*ny, out = [];
    for (let i = 0; i < poly.length; i++){
      const p = poly[i], q = poly[(i + 1) % poly.length], fp = f(p), fq = f(q);
      if (fp <= 0) out.push(p);
      if ((fp <= 0) !== (fq <= 0)){
        const t = fp/(fp - fq);
        out.push([p[0] + (q[0] - p[0])*t, p[1] + (q[1] - p[1])*t]);
      }
    }
    return out;
  }

  function lloyd(n, r0, r1, K, Rn){
    const A = Math.PI/n, S = [], ech = [], G = 30, rr = u => Math.sqrt(r0*r0 + (r1*r1 - r0*r0)*u);
    for (let i = 0; i < K; i++) S.push(polaire(rr(Rn()), A*(.08 + .84*Rn())));
    // échantillons uniformes en aire dans le demi-secteur
    for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) ech.push(polaire(rr((i + Rn())/G), A*(j + Rn())/G));
    for (let it = 0; it < 40; it++){
      const sx = new Float64Array(K), sy = new Float64Array(K), nn = new Float64Array(K);
      for (const p of ech){
        let b = 0, bd = 1e9;
        for (let k = 0; k < K; k++){
          const dx = p[0] - S[k][0], dy = p[1] - S[k][1], d = dx*dx + dy*dy;
          if (d < bd){ bd = d; b = k; }
        }
        sx[b] += p[0]; sy[b] += p[1]; nn[b]++;
      }
      for (let k = 0; k < K; k++) if (nn[k]) S[k] = [sx[k]/nn[k], sy[k]/nn[k]];   // chaque germe va au centroïde de sa cellule
    }
    const dom = [polaire(r0*.985, 0)];
    for (let i = 0; i <= 8; i++) dom.push(polaire(r1, A*i/8));
    dom.push(polaire(r0*.985, A));
    return S.map((s, k) => {
      let p = dom;
      S.forEach((o, j) => { if (j !== k) p = couper(p, s, o); });
      return { p, role: Rn(), motif: Math.floor(Rn()*4), ombre: Rn(), acc: 1 + Math.floor(Rn()*3) };
    });
  }

  function couleur(f, q){
    const T = TONS[q];
    if (f.role < .5) return mix(T, BLANC_PUR, .02 + .16*f.ombre);
    if (f.role < .7) return mix(T, NOIR, .18 + .22*f.ombre);
    if (f.role < .83) return mix(BLANC_V, T, .22);
    return mix(TONS[(q + f.acc) % 4], NOIR, .08*f.ombre);
  }
  const cercle = (x, y, r, n = 18) => Array.from({ length: n }, (_, i) => polaire(r, i/n*2*Math.PI)).map(p => [x + p[0], y + p[1]]);
  const quartier = a => Math.floor((((a + Math.PI/2) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI))/(Math.PI/2) + 1e-9) % 4;

  function geometrie(){
    const Rn = graine(seed);
    cells = [];
    const ajoute = (p, q, o) => {
      let gx = 0, gy = 0;
      p.forEach(v => { gx += v[0]; gy += v[1]; });
      gx /= p.length; gy /= p.length;
      let rad = 0, x0 = 9, y0 = 9, x1 = -9, y1 = -9;
      p.forEach(v => {
        rad = Math.max(rad, Math.hypot(v[0] - gx, v[1] - gy));
        x0 = Math.min(x0, v[0]); y0 = Math.min(y0, v[1]); x1 = Math.max(x1, v[0]); y1 = Math.max(y1, v[1]);
      });
      const path = new Path2D();
      p.forEach((v, i) => i ? path.lineTo(v[0], v[1]) : path.moveTo(v[0], v[1]));
      path.closePath();
      const ang = Math.atan2(gy, gx), prog = ((ang + Math.PI/2 + 2*Math.PI) % (Math.PI/2))/(Math.PI/2);
      cells.push(Object.assign({
        p, q, g: [gx, gy], rad, bb: [x0, y0, x1, y1], path, ang, r: Math.hypot(gx, gy),
        gain: 1, t0: Infinity, cuit: false, l: 0, lf: 0, kind: "v", motif: 0,
        d: .25 + prog*1.55 + Math.hypot(gx, gy)*.45 + Rn()*.5,
      }, o));
    };
    // l'oculus : quatre lobes (un par priorité) et le cœur (aujourd'hui)
    for (let q = 0; q < 4; q++){
      const a = -Math.PI/4 + q*Math.PI/2;
      ajoute(cercle(.112*Math.cos(a), .112*Math.sin(a), .082, 20), q, { col: TONS[q], kind: "lobe", d: .05, motif: 3 });
    }
    ajoute(cercle(0, 0, .052, 16), 4, { col: COEUR, kind: "coeur", d: .2, motif: 2 });
    // deux zones de verres : N secteurs, puis N secteurs plus fins
    const K = { 8: [8, 10], 12: [6, 7], 16: [4, 5] }[N] || [6, 7];
    [[N, .27, .585, K[0]], [N, .615, .852, K[1]]].forEach(([n, r0, r1, k], z) => {
      const Fz = lloyd(n, r0, r1, k, Rn);
      for (let s = 0; s < n; s++) for (const m of [1, -1]){
        const phi = -Math.PI/2 + 2*Math.PI*s/n, co = Math.cos(phi), si = Math.sin(phi);
        Fz.forEach(f => {
          const p = f.p.map(v => { const x = v[0], y = v[1]*m; return [x*co - y*si, x*si + y*co]; });
          let gx = 0, gy = 0;
          p.forEach(v => { gx += v[0]; gy += v[1]; });
          const q = quartier(Math.atan2(gy, gx));
          ajoute(p, q, { col: couleur(f, q), motif: f.motif, zone: z });
        });
      }
    });
    // la couronne des jours : 28 médaillons, sept par quartier
    DON.jours.forEach((n, k) => {
      const a = -Math.PI/2 + (k + .5)*2*Math.PI/DON.jours.length, q = quartier(a), v = n/4;
      ajoute(cercle(.926*Math.cos(a), .926*Math.sin(a), .054, 18), q, {
        col: mix(TONS[q], BLANC_PUR, .08 + .22*v), kind: "jour", jour: k, n,
        gain: .12 + .88*Math.pow(v, 1.3), d: 2.15 + (k % 7)*.17, motif: 2,
      });
    });
    const Rp = graine(seed + 5);
    poussiere = Array.from({ length: 170 }, () => ({
      c: Math.floor(Rp()*cells.length), b: Rp(), v: .00003 + Rp()*.00006, w: Rp()*2 - 1, ph: Rp()*6.3, s: .6 + Rp()*1.1,
    }));
  }

  /* ---------- la mise en page : la rosace en haut, grande ; la lumière au sol dessous ---------- */
  function mise(){
    top = H > 600 ? 52 : Math.max(14, H*.045);
    R = Math.min(W*.46, H*.27);
    cx = W/2;
    cy = top + R;
    const fm = clamp(R*.05, 7.5, 10);
    yLoin = cy + R + fm*3 + 4;                       // le bord lointain de la tache (le bas du vitrail)
    yPres = H - (H > 600 ? 64 : 10);                 // le bord proche (le haut du vitrail, une marche plus bas)
    // la caméra : rapport de perspective rho entre le bord lointain et le bord proche de la tache
    const rho = 1.45, Ybas = HC - 1, Yhaut = HC + 1 + HM;
    K0 = (rho - 1)/(Yhaut - Ybas);
    Zc = 1 + K0*Yhaut;                                // la profondeur du bord proche vaut 1
    // la marche : son nez coupe le tiers lointain de la tache ; fixe dans la nef (le soleil bouge, pas la pierre)
    ZE = [K0*(HC - .2), Infinity, Infinity];
    const hTache = Math.max(40, yPres - yLoin);
    F = Math.min(W*.62, hTache/(HM + .9*(1 - 1/rho)));
    for (let it = 0; it < 4; it++){
      E = Math.max(.9, (hTache/F - HM)/(1 - 1/rho));
      yh = yPres - F*(E + HM);
      // la tache ne doit pas déborder de l'écran : on mesure sa demi-largeur la plus grande
      let large = 0;
      for (let v = -1; v <= 1; v += .05){
        const Y = HC - v, lev = niveau(Y, K0), r = rangee(Y, lev, K0);
        large = Math.max(large, r.s*Math.sqrt(Math.max(0, 1 - v*v)));
      }
      if (large <= W*.485) break;
      F *= W*.485/large;
    }
    yF0 = Math.max(0, Math.floor(yh + F*E/Zc) - 2);   // le pied du mur, perdu dans le noir
  }

  /* ---------- le rayon de soleil : quel plan il touche, et où il tombe à l'écran ---------- */
  function niveau(Y, k){
    for (let i = 0; i < 2; i++){
      const z = k*(Y + i*HM);
      if (z < ZE[i]) return i;
    }
    return 1;
  }
  function rangee(Y, lev, k){   // la ligne du vitrail de hauteur Y, posée sur la marche lev : affine en x
    const drop = Y + lev*HM, z = k*drop, D = Math.max(.2, Zc - z), s = F/D;
    return { y: yh + F*(E + lev*HM)/D, s, xc: cx + s*lxM*(drop - HC) };
  }
  function auSol(u, v){
    const k = K0*kM, Y = HC - v, lev = niveau(Y, k), r = rangee(Y, lev, k);
    return [r.xc + r.s*u, r.y, r.s, lev];
  }

  /* ---------- la texture de pierre (512², calculée par tranches) ---------- */
  function* texture(){
    const T = document.createElement("canvas");
    T.width = T.height = 512;
    const tx = T.getContext("2d"), im = tx.createImageData(512, 512), n = bruit2(seed % 97 + 3), Rn = graine(5);
    yield;
    for (let y0 = 0; y0 < 512; y0 += 12){
      for (let y = y0; y < Math.min(512, y0 + 12); y++) for (let x = 0; x < 512; x++){
        let v = .5*n(x/52, y/52) + .3*n(x/15 + 50, y/15) + .2*n(x/4.5 + 9, y/4.5 + 3) + (Rn() - .5)*.16;
        if (Rn() < .005) v -= .4;                 // les pores de la pierre

  /* ---------- le noir de la nef, le dallage à peine deviné, et l'albédo de la pierre (une fois par taille) ---------- */

    x.fillStyle = g;
    x.fillRect(0, 0, W, H);
    vider(c);
    yield;

    const scr = (X, z, lev) => { const D = Math.max(.2, Zc - z); return [cx + F*X/D, yh + F*(E + lev*HM)/D]; };
    for (let i = 0; i < 1; i++){

    ax.globalAlpha = .38;
    ax.fillStyle = ax.createPattern(TEX, "repeat");
    ax.fillRect(0, 0, aw, ah);
    ax.globalAlpha = 1;
    vider(A);
    yield;

    vider(c);
    yield;

    BG = c;
    LF = null;
    LFc = {};
  }

  /* ---------- le calque « soleil » (verres cuits + lueur + soleil derrière), refait en trois images, en double tampon ---------- */
  function voile(X, src, a0, a1, rad){
    const T = L.tx, Dh = L.tmp.width;
    const gx = L.O + clamp(-lxM*1.4, -.8, .8)*L.S, gy = L.O + clamp(-.25 + (kM - 1)*.9, -.85, .35)*L.S;
    T.globalCompositeOperation = "copy";
    T.drawImage(src, 0, 0, Dh, Dh);
    T.globalCompositeOperation = "destination-in";
    const g = T.createRadialGradient(gx/2, gy/2, 0, gx/2, gy/2, rad/2);
    g.addColorStop(0, `rgba(255,255,255,${a0})`);
    g.addColorStop(1, `rgba(255,255,255,${a1})`);
    T.fillStyle = g;
    T.fillRect(0, 0, Dh, Dh);
    X.globalCompositeOperation = "lighter";
    X.drawImage(L.tmp, 0, 0, L.Dp, L.Dp);
    X.globalCompositeOperation = "source-over";
  }
  function* refaireGlow(cleG, t){
    const pris = cells.filter(c => c.cuit), sr = lisse((t - tSeuil - 300)/2600);
    const G = L.gl2;
    G.setTransform(1, 0, 0, 1, 0, 0);
    G.globalCompositeOperation = "copy";
    G.drawImage(L.bake, 0, 0);
    G.globalCompositeOperation = "source-over";
    vider(L.glow2);
    yield;
    voile(G, L.masque, .08, 0, 1.1*L.S);                                     // un reste de jour derrière le vitrail éteint
    vider(L.glow2);
    yield;
    if (pris.length) voile(G, L.allum, .45 + .15*sr, .05 + .05*sr, 1.3*L.S); // le soleil derrière les verres allumés
    // l'échange des tampons : le nouveau calque devient visible d'un coup
    [L.glow, L.glow2] = [L.glow2, L.glow];
    [L.gl, L.gl2] = [L.gl2, L.gl];
    cells.forEach(c => { c.inGlow = false; });
    pris.forEach(c => { c.inGlow = true; });
    L.cleG = cleG;
    L.tGl = t;
    L.version++;
    roseCle = "";
  }

  /* ---------- le sol : le motif lumineux reposé ligne à ligne par l'homographie ---------- */
  function bandes(X, src, alpha, n){
    const Ds = src.width, Ss = Ds/2.4, Os = Ds/2, k = K0*kM, fs = fsL;
    X.globalAlpha = alpha;
    for (let j = 0; j < n; j++){
      const v0 = -1 + 2*j/n, v1 = -1 + 2*(j + 1)/n, vm = (v0 + v1)/2;
      const lev = niveau(HC - vm, k);
      const a = rangee(HC - v0, lev, k), b = rangee(HC - v1, lev, k);
      const sy0 = Os + v0*Ss, sy1 = Os + v1*Ss, sh = sy1 - sy0;
      const sm = (a.s + b.s)/2, ax = sm/Ss, ay = (b.y - a.y)/sh, c = (b.xc - a.xc)/sh;
      const e = a.xc - ax*Os - c*sy0, f = a.y - ay*sy0;
      X.setTransform(fs*ax, 0, fs*c, fs*ay, fs*e, fs*(f - yF0));
      X.drawImage(src, 0, sy0, Ds, sh, 0, sy0, Ds, sh);
    }
    X.setTransform(1, 0, 0, 1, 0, 0);
    X.globalAlpha = 1;
  }
  function peindreSol(src, sr, S, EV, rapide){
    // en mouvement (la roue tourne), le sol se calcule à plus basse résolution : deux fois moins de pixels
    fsL = rapide ? Math.min(fsSol, .85) : fsSol;
    const aw = Math.ceil(W*fsL), ah = Math.max(2, Math.ceil((H - yF0)*fsL)), kc = aw + "x" + ah;
    if (!LFc[kc]){
      const c = document.createElement("canvas");
      c.width = aw; c.height = ah;
      c.fs = fsL;
      LFc = Object.assign({ [kc]: c }, rapide || !LF ? LFc : {});
    }
    LF = LFc[kc];
    LFx = LF.getContext("2d");
    const X = LFx;
    X.setTransform(1, 0, 0, 1, 0, 0);
    X.globalCompositeOperation = "source-over";
    X.fillStyle = "#000";
    X.fillRect(0, 0, aw, ah);
    // le halo : le même motif, très réduit, reposé au sol ; c'est là que les couleurs voisines s'additionnent
    L.h1x.globalCompositeOperation = "copy";
    L.h1x.drawImage(src, 0, 0, L.h1.width, L.h1.height);
    L.h2x.globalCompositeOperation = "copy";
    L.h2x.drawImage(L.h1, 0, 0, L.h2.width, L.h2.height);
    X.globalCompositeOperation = "lighter";
    const hauteur = Math.abs(yPres - yLoin);
    bandes(X, L.h2, .55 + .35*sr, rapide ? 10 : 20);
    // la tache nette : les verres et l'ombre fine de leurs plombs
    const nb = rapide ? Math.round(clamp(hauteur/4.5, 36, 70)) : Math.round(clamp(hauteur/2.4, 50, 150));
    bandes(X, src, 1, nb);
    // l'arc-en-ciel du cristal se pose sur la même pierre
    if (S && EV) arcAuSol(X, S, EV);
    // la pierre multiplie la lumière : grain, joints, nez des marches ; la contremarche reste noire
    X.globalCompositeOperation = "multiply";
    X.drawImage(ALB, 0, 0, aw, ah);
    X.globalCompositeOperation = "source-over";
    // (au seuil, la lumière s'ajoute à elle-même : c'est fait à l'écran, voir frame, sans recopier le calque sur lui-même)
  }

  /* ---------- le seuil : la roue de lumière et le cristal (Snell-Descartes, Cauchy, Fresnel) ---------- */
  const PRI = DON.prisme, DEG = Math.PI/180, A_P = PRI.A*DEG;
  const LAMBDAS = Array.from({ length: 16 }, (_, k) => 400 + k*20);        // 400 à 700 nm
  const indice = l => PRI.cauchyA + PRI.cauchyB/Math.pow(l/1000, 2);       // Cauchy : n(λ) = A + B/λ²
  function fresnel(a, b, n1, n2){                                          // transmission, lumière non polarisée
    const ca = Math.cos(a), cb = Math.cos(b);
    const rs = (n1*ca - n2*cb)/(n1*ca + n2*cb), rp = (n1*cb - n2*ca)/(n1*cb + n2*ca);
    return 1 - (rs*rs + rp*rp)/2;
  }
  function traverse(n, i){                                                 // Snell-Descartes, deux faces
    const r1 = Math.asin(Math.sin(i)/n), r2 = A_P - r1, s2 = n*Math.sin(r2);
    if (Math.abs(s2) >= 1) return null;                                    // réflexion totale : la lumière reste dans le cristal
    const e = Math.asin(s2);
    return { D: i + e - A_P, T: fresnel(i, r1, 1, n)*fresnel(r2, e, n, 1) };
  }
  const N550 = indice(550), DMIN = 2*Math.asin(N550*Math.sin(A_P/2)) - A_P, IMIN = (DMIN + A_P)/2;
  // la couleur d'une longueur d'onde (approximation de D. Bruton, 1996), un peu adoucie vers le blanc
  function spectre(l){
    let r = 0, g = 0, b = 0;
    if (l < 440){ r = (440 - l)/60; b = 1; }
    else if (l < 490){ g = (l - 440)/50; b = 1; }
    else if (l < 510){ g = 1; b = (510 - l)/20; }
    else if (l < 580){ r = (l - 510)/70; g = 1; }
    else if (l < 645){ r = 1; g = (645 - l)/65; }
    else r = 1;
    const f = l < 420 ? .35 + .65*(l - 400)/20 : l > 680 ? .35 + .65*(700 - l)/20 : 1;
    return [r, g, b].map(v => Math.round(255*Math.pow(v*f, .8)*.92 + 14));
  }
  const COUL_L = LAMBDAS.map(spectre), COUL_C = [0, 2, 4, 6, 8, 10, 12, 15].map(k => rgb(COUL_L[k]));
  // les sprites : un disque doux, blanc, puis colorié une fois par longueur d'onde (et l'or de la poussière)
  function sprite(c, n = 48){
    const s = document.createElement("canvas");
    s.width = s.height = n;
    const x = s.getContext("2d"), g = x.createRadialGradient(n/2, n/2, 0, n/2, n/2, n/2);
    g.addColorStop(0, rgb(c, 1));
    g.addColorStop(.35, rgb(c, .55));
    g.addColorStop(1, rgb(c, 0));
    x.fillStyle = g;
    x.fillRect(0, 0, n, n);
    return s;
  }
  const SPR_L = COUL_L.map(c => sprite(c)), SPR_OR = sprite([255, 214, 140]), SPR_BLANC = sprite([255, 250, 238]);
  const BOKEH = Array.from({ length: 34 }, (_, k) => {
    const Rb = graine(777 + k*13);
    return { x: Rb(), y: Rb(), r: 5 + Math.pow(Rb(), 2)*26, v: .4 + Rb(), ph: Rb()*6.3, l: Rb() < .55 ? -1 : Math.floor(Rb()*16) };
  });

  // le calendrier du seuil (ms après le geste) : la roue tourne de SP0 à SP1, le monde se pose à SFIN
  const SP0 = 1300, SP1 = 8300, SFIN = 9800, PHI0 = 160*DEG;
  const glisseDouce = u => { u = clamp(u); return u < .5 ? 4*u*u*u : 1 - Math.pow(2 - 2*u, 3)/2; };
  function seuilA(t){
    if (!boucle()) return null;
    const T = t - tSeuil, u = glisseDouce((T - SP0)/(SP1 - SP0));
    const th = u >= 1 ? 0 : -2*Math.PI*u;                                   // un tour complet, sens inverse des aiguilles
    // l'incidence sur le cristal : il tourne avec la roue ; piégée au départ, rasante au milieu, minimale à la fin
    const i = u < .55 ? (-14 + 12*lisse((T - 700)/1900) + 88*lisse(u/.55))*DEG
      : 86*DEG + (IMIN - 86*DEG)*lisse((u - .55)/.45);
    return {
      T, u, th, i, phi: PHI0 - th,
      pr: lisse((T - 250)/1100),                                            // le cristal descend dans l'oculus
      fan: lisse((T - 600)/700),
      fin: lisse((T - 8000)/1500),
    };
  }
  // un rayon dévié de D vers la base du prisme (direction phi dans le plan du vitrail), suivi jusqu'au premier plan touché
  function rayon(D, phi, u = 0, v = 0){                                    // (u, v) : le point du vitrail d'où part le rayon
    const k = K0*kM, sl = Math.hypot(lxM, 1, k), sx = lxM/sl, sy = -1/sl, sz = k/sl;
    const bx = Math.cos(phi), by = Math.sin(phi), bs = bx*sx + by*sy;
    const px = bx - bs*sx, py = by - bs*sy, pz = -bs*sz, pl = Math.hypot(px, py, pz) || 1;
    const c = Math.cos(D), s = Math.sin(D);
    const dx = sx*c + px/pl*s, dy = sy*c + py/pl*s, dz = sz*c + pz/pl*s;
    const X0 = u - lxM*HC, Y0 = HC - v;
    const o = { sol: false, oeil: 0, mur: lisse((dz + .02)/.1) };
    let t1 = Infinity, lev = 0;
    if (dy < -.01){
      t1 = Y0/(-dy);
      if (t1*dz > ZE[0]){ lev = 1; t1 = (Y0 + HM)/(-dy); }
    }
    const zf = t1*dz;
    if (t1 < Infinity && zf > .02 && Zc - zf > .3){
      const Dd = Zc - zf;
      o.sol = true;
      o.x = cx + F*(X0 + t1*dx)/Dd;
      o.y = yh + F*(E + lev*HM)/Dd;
      o.s = F/Dd;
      o.oeil = lisse((1.05 - Dd)/.6);                                       // la tache arrive à nos pieds
    }
    else {
      let tt = dz > .05 ? (Zc - .3)/dz : 4;
      if (t1 < tt) tt = t1;
      const Dd = Math.max(.3, Zc - tt*Math.max(0, dz));
      o.x = cx + F*(X0 + tt*dx)/Dd;
      o.y = yh + F*(E - (Y0 + tt*dy))/Dd;
      o.s = F/Dd;
      o.oeil = dz > .05 ? 1 : 0;                                            // il passe le plan de l'œil : il nous traverse
    }
    return o;
  }
  // l'éventail du moment : une entrée par longueur d'onde (null si la lumière est piégée)
  // la couronne : au seuil, les 28 médaillons des jours deviennent aussi des cristaux (même loi, huit λ chacun),
  // leur base tournée vers le cœur de la roue ; leur éclat suit le jour (0 à 4 priorités faites)
  const LC = [0, 2, 4, 6, 8, 10, 12, 15];
  function eventailCalc(S){
    let piege = 0, oeil = 0, Dv = 0, Dr = 0;
    const p = LAMBDAS.map(l => traverse(indice(l), S.i));
    const r = p.map((q, k) => {
      if (!q){ piege++; return null; }
      const o = rayon(q.D, S.phi);
      o.a = q.T*o.mur;
      oeil = Math.max(oeil, o.oeil*o.a);
      if (k === 0) Dv = q.D;
      if (k === 15) Dr = q.D;
      return o;
    });
    const couronne = [], co = Math.cos(S.th), si = Math.sin(S.th), cr = S.fan*lisse((S.T - 1600)/1400);
    if (cr > 0) for (const c of cells){
      if (c.kind !== "jour" || c.gain < .2) continue;
      const u = c.g[0]*co - c.g[1]*si, v = c.g[0]*si + c.g[1]*co;
      const phi = Math.atan2(v, -u);                                         // la base vers le cœur (Y monte)
      const rs = LC.map(k => {
        if (!p[k]) return null;
        const o = rayon(p[k].D, phi, u, v);
        o.a = p[k].T*o.mur*c.gain*cr;
        return o;
      });
      couronne.push({ x: cx + u*R, y: cy + v*R, r: rs });
    }
    return { r, couronne, piege: piege/LAMBDAS.length, oeil: oeil*S.fan, Dv, Dr };
  }
  // la tache d'arc-en-ciel posée au sol (dans le calque du sol, avant que la pierre ne la multiplie) :
  // le cristal est une barre, sa lumière une nappe ; chaque λ pose un trait, perpendiculaire à la dispersion
  function arcAuSol(X, S, EV){
    const fs = fsL, a0 = S.fan;
    if (a0 <= 0) return;
    X.globalCompositeOperation = "lighter";
    for (const m of EV.couronne){                                             // les 28 petits arcs de la couronne
      for (let j = 0; j < LC.length; j++){
        const o = m.r[j];
        if (!o || !o.sol || o.a <= .02) continue;
        const L = o.s*.06, e = Math.max(1.6, L*.4);
        X.setTransform(fs, 0, 0, fs, 0, -yF0*fs);
        X.globalAlpha = clamp(1.4*o.a);
        X.drawImage(SPR_L[LC[j]], o.x - L, o.y - e, 2*L, 2*e);
      }
    }
    X.setTransform(1, 0, 0, 1, 0, 0);
    X.globalAlpha = 1;
    const pr = EV.r.filter(o => o && o.sol);
    if (pr.length < 2){ X.globalCompositeOperation = "source-over"; return; }
    let ux = pr[pr.length - 1].x - pr[0].x, uy = pr[pr.length - 1].y - pr[0].y;
    const ecart = Math.hypot(ux, uy) || 1;
    ux /= ecart; uy /= ecart;
    const ang = Math.atan2(uy, ux) + Math.PI/2;
    X.globalCompositeOperation = "lighter";
    for (let k = 0; k < EV.r.length - 1; k++){
      const p = EV.r[k], q = EV.r[k + 1];
      if (!p || !q || !p.sol || !q.sol) continue;
      for (let m = 0; m < 3; m++){
        const f = m/3, x = p.x + (q.x - p.x)*f, y = p.y + (q.y - p.y)*f, s = p.s + (q.s - p.s)*f;
        const L = s*.09, e = Math.max(1.6, ecart/16*1.1), sp = SPR_L[f < .5 ? k : k + 1], a = a0*(p.a + (q.a - p.a)*f);
        X.setTransform(fs, 0, 0, fs, 0, -yF0*fs);
        X.translate(x, y);
        X.rotate(ang);
        X.scale(1, .55 + .45*Math.abs(Math.cos(ang)));
        X.globalAlpha = clamp(.95*a);
        X.drawImage(sp, -L, -e, 2*L, 2*e);
        X.globalAlpha = clamp(.3*a);
        X.drawImage(sp, -L*1.5, -e*3, 3*L, 6*e);
      }
    }
    X.setTransform(1, 0, 0, 1, 0, 0);
    X.globalAlpha = 1;
    X.globalCompositeOperation = "source-over";
  }
  // les rayons de l'éventail dans la poussière : une nappe par λ, du cristal à son trait ; blanches là où elles se superposent,
  // elles se séparent en couleurs à mesure qu'elles s'éloignent (c'est la dispersion, à la bonne échelle)
  function eventailAir(ctx, S, EV){
    const a0 = S.fan*(1 - .3*S.fin);
    if (a0 <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const m of EV.couronne){                                             // la couronne : 28 nappes de spectre
      const o = m.r[3], a = m.r[0], b = m.r[LC.length - 1];                   // le vert au milieu ; violet et rouge aux bords
      if (!o || !o.sol || o.a <= .02 || !a || !b) continue;                  // seules les nappes qui touchent la dalle
      const dx = o.x - m.x, dy = o.y - m.y, l = Math.hypot(dx, dy) || 1, nx = -dy/l, ny = dx/l;
      const w = Math.max(3, o.s*.025 + Math.abs((a.x - b.x)*nx + (a.y - b.y)*ny)/2), w0 = R*.02;
      const g = ctx.createLinearGradient(o.x + nx*w, o.y + ny*w, o.x - nx*w, o.y - ny*w);
      const sens = ((a.x - b.x)*nx + (a.y - b.y)*ny) > 0;
      [0, 2, 4, 7].forEach((jj, q) => g.addColorStop(sens ? q/3 : 1 - q/3, COUL_C[jj]));
      ctx.globalAlpha = Math.min(1, .16*a0*o.a);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(m.x + nx*w0, m.y + ny*w0);
      ctx.lineTo(o.x + nx*w, o.y + ny*w);
      ctx.lineTo(o.x - nx*w, o.y - ny*w);
      ctx.lineTo(m.x - nx*w0, m.y - ny*w0);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (let k = 0; k < EV.r.length; k++){
      const o = EV.r[k];
      if (!o || o.a <= .01) continue;
      const dx = o.x - cx, dy = o.y - cy, l = Math.hypot(dx, dy) || 1, nx = -dy/l, ny = dx/l;
      const r0 = R*.012, w1 = Math.max(1.6, o.s*.011);
      const g = ctx.createLinearGradient(cx, cy, o.x, o.y), c = COUL_L[k], al = a0*o.a;
      g.addColorStop(0, rgb(c, .3*al));
      g.addColorStop(.4, rgb(c, .22*al));
      g.addColorStop(1, rgb(c, (o.sol ? .5 : .3)*al));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx + nx*r0, cy + ny*r0);
      ctx.lineTo(o.x + nx*w1, o.y + ny*w1);
      ctx.lineTo(o.x - nx*w1, o.y - ny*w1);
      ctx.lineTo(cx - nx*r0, cy - ny*r0);
      ctx.fill();
    }
    ctx.restore();
  }
  // le cristal dans l'oculus : un prisme de 45°, sa base vers phi, qui piège puis libère la lumière
  function cristal(ctx, S, EV, t){
    if (S.pr <= 0) return;
    const bxs = Math.cos(S.phi), bys = -Math.sin(S.phi), pxs = -bys, pys = bxs;
    const h = R*.3*(1 + .6*(1 - S.pr)), hw = h*Math.tan(A_P/2);
    const ap = [cx - bxs*h*.62, cy - bys*h*.62];
    const b1 = [cx + bxs*h*.38 + pxs*hw, cy + bys*h*.38 + pys*hw], b2 = [cx + bxs*h*.38 - pxs*hw, cy + bys*h*.38 - pys*hw];
    const trace = () => { ctx.beginPath(); ctx.moveTo(...ap); ctx.lineTo(...b1); ctx.lineTo(...b2); ctx.closePath(); };
    ctx.save();
    ctx.globalAlpha = S.pr;
    // le corps du cristal : un verre presque noir qui laisse voir les lobes
    const g = ctx.createLinearGradient(ap[0], ap[1], (b1[0] + b2[0])/2, (b1[1] + b2[1])/2);
    g.addColorStop(0, "rgba(230,236,255,.34)");
    g.addColorStop(.5, "rgba(40,44,60,.22)");
    g.addColorStop(1, "rgba(200,210,240,.3)");
    ctx.fillStyle = g;
    trace();
    ctx.fill();
    // la lumière piégée : réflexion totale, le cristal brille de l'intérieur
    const pi = EV.piege*(1 - S.fin*.6) + .25*Math.exp(-Math.pow((S.T - 1800)/900, 2));
    ctx.globalCompositeOperation = "lighter";
    if (pi > .01){
      ctx.globalAlpha = S.pr*Math.min(1, pi);
      ctx.drawImage(SPR_BLANC, cx - h*.9, cy - h*.9, h*1.8, h*1.8);
      ctx.fillStyle = `rgba(255,248,230,${.35*pi})`;
      trace();
      ctx.fill();
    }
    ctx.globalAlpha = S.pr;
    // les arêtes : le facettage, et la face de sortie qui se teinte du spectre
    ctx.lineJoin = "round";
    ctx.lineWidth = 1.1;
    ctx.strokeStyle = "rgba(255,250,236,.7)";
    trace();
    ctx.stroke();
    // le biseau : un second triangle, en retrait, plus pâle (la taille du cristal)
    const mid = [(ap[0] + b1[0] + b2[0])/3, (ap[1] + b1[1] + b2[1])/3], ins = v => [mid[0] + (v[0] - mid[0])*.72, mid[1] + (v[1] - mid[1])*.72];
    ctx.lineWidth = .7;
    ctx.strokeStyle = "rgba(255,255,255,.28)";
    ctx.beginPath();
    [ap, b1, b2].map(ins).forEach((v, k) => k ? ctx.lineTo(...v) : ctx.moveTo(...v));
    ctx.closePath();
    [ap, b1, b2].forEach(v => { const w = ins(v); ctx.moveTo(...v); ctx.lineTo(...w); });
    ctx.stroke();
    if (S.fan > 0 && EV.piege < 1){
      const sg = ctx.createLinearGradient(...b1, ...b2);
      COUL_L.forEach((c, k) => sg.addColorStop(k/15, rgb(c, .9*S.fan*(EV.r[15 - k] ? 1 : 0))));
      ctx.strokeStyle = sg;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(...b1);
      ctx.lineTo(...b2);
      ctx.stroke();
    }
    // l'éclat qui court sur l'arête quand la roue tourne
    const sc = .5 + .5*Math.sin(t/260 + S.th*3);
    ctx.globalAlpha = S.pr*(.35 + .5*sc);
    const q = [ap[0] + (b1[0] - ap[0])*sc, ap[1] + (b1[1] - ap[1])*sc];
    ctx.drawImage(SPR_BLANC, q[0] - 7, q[1] - 7, 14, 14);
    ctx.restore();
  }
  // la poussière d'or au premier plan, et le spectre qui nous traverse
  function traversee(ctx, S, EV, t){
    const w = EV.oeil;
    if (w > .01){
      const p = EV.r.find(o => o), q = [...EV.r].reverse().find(o => o);
      let ux = 1, uy = 0;
      if (p && q && Math.hypot(q.x - p.x, q.y - p.y) > 1){ ux = (q.x - p.x); uy = (q.y - p.y); const l = Math.hypot(ux, uy); ux /= l; uy /= l; }
      const L2 = Math.hypot(W, H)/2, g = ctx.createLinearGradient(W/2 - ux*L2, H/2 - uy*L2, W/2 + ux*L2, H/2 + uy*L2);
      COUL_L.forEach((c, k) => g.addColorStop(k/15, rgb(c, .3*w)));
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = `rgba(255,246,230,${.12*w})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    const b = Math.max(w*1.1, .45*lisse((S.T - 900)/1500)*(1 - .55*S.fin));
    if (b <= .01) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const p of BOKEH){
      const x = ((p.x + Math.sin(t/3100*p.v + p.ph)*.04 + S.th*.012*p.v) % 1 + 1) % 1*W;
      const y = ((p.y - t*.000012*p.v) % 1 + 1) % 1*H;
      const r = p.r*(1 + w*.8), a = b*(.25 + .2*Math.sin(t/700 + p.ph*5))*(p.r > 18 ? .6 : 1);
      if (a <= .01) continue;
      ctx.globalAlpha = Math.min(1, a);
      ctx.drawImage(p.l < 0 || w < .2 ? SPR_OR : SPR_L[p.l], x - r, y - r, 2*r, 2*r);
    }
    ctx.restore();
  }

  /* ---------- l'image ---------- */
  const VIDE = toile(1, 1, 1)[1];
  const vider = c => VIDE.drawImage(c, 0, 0, 1, 1);   // force le tramage d'une toile pendant SA tranche de travail
  function avancer(budget){
    const h0 = performance.now();
    while (travaux.length && performance.now() - h0 < budget){
      if (travaux[0].next().done) travaux.shift();
    }
  }
  const LARG = new Map();
  function largeur(x, ch){                                       // la largeur d'un signe, mesurée une fois par police
    const k = x.font + "|" + ch;
    let v = LARG.get(k);
    if (v === undefined){
      v = x.measureText(ch).width;
      if (LARG.size > 4000) LARG.clear();
      LARG.set(k, v);
    }
    return v;
  }
  function espace(x, s, X, Y, sp, al, trait){
    const ws = [...s].map(ch => largeur(x, ch)), w = ws.reduce((a, b) => a + b + sp, -sp);
    let u = al === "right" ? X - w : al === "center" ? X - w/2 : X;
    [...s].forEach((ch, i) => {
      if (trait) x.strokeText(ch, u, Y);
      else x.fillText(ch, u, Y);
      u += ws[i] + sp;
    });
  }

  function frame(ctx, t){
    avancer(5);
    if (!BG){
      ctx.fillStyle = rgb(NUIT);
      ctx.fillRect(0, 0, W, H);
      return;
    }
    ctx.globalCompositeOperation = "copy";                       // le fond est opaque : il remplace l'image précédente
    ctx.drawImage(BG, 0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
    const sr = lisse((t - tSeuil - 300)/2600);
    if (!L){                                                     // la rosace se reconstruit (Encore) : l'ancienne s'efface
      if (Lvieux){
        ctx.globalAlpha = clamp(1 - (t - tVieux)/700);
        ctx.drawImage(Lvieux.compo, cx - 1.2*R, cy - 1.2*R, 2.4*R, 2.4*R);
        ctx.globalAlpha = 1;
      }
      return;
    }
    // le seuil : la roue (th), le cristal et son éventail calculé
    const S = seuilA(t), EV = S ? eventailCalc(S) : null, th = S ? S.th : 0;
    const tourne = !!S && S.u > 0 && S.u < 1, seuilVif = !!S && S.T < SFIN;
    // l'état de chaque verre : dans la rosace (l), puis au sol un instant après (lf)
    let nl = 0, nCuit = 0, actif = false, cuits = 0, manque = false;
    for (const c of cells){
      c.l = lisse((t - c.t0)/550);
      c.lf = lisse((t - c.t0 - 260)/700);
      if (c.l > 0) nl++;
      if (!c.cuit && t - c.t0 > 1500 && cuits < 12){             // cuire : au plus 12 verres par image
        cuits++;
        poser(L.bx, c, c.gain);
        poser(L.ax, c, c.gain);
        c.cuit = true;
      }
      if (c.cuit){
        nCuit++;
        if (!c.inGlow) manque = true;
      }
      else if (t >= c.t0) actif = true;
    }
    const vibA = vib && t - vib.t < 2200, ondeA = t - tSeuil > 0 && t - tSeuil < 3600, ouvre = sr > 0 && sr < 1;
    const vif = actif || vibA || ondeA || ouvre, bouge = vif || tourne;   // (la roue qui tourne ne demande pas de recomposer la rosace)
    const k = K0*kM;

    // trois travaux lourds possibles : le calque soleil, le sol (et ses faisceaux), la rosace composée.
    // Un seul par image, celui qui attend depuis le plus longtemps : aucune image ne les cumule.
    const cleG = lxM + "|" + kM + "|" + Math.round(sr*4);
    const veutGlow = !!L.job || ((cleG !== L.cleG || manque) && t - L.tGl > (bouge ? 400 : 120));
    const cleF = bouge ? "t" + Math.floor(t/(tourne ? 16 : 50)) : lxM + "|" + kM + "|" + nl + "|" + nCuit + "|" + sr + "|" + !!S;
    const veutSol = nl > 0 && cleF !== solCle;
    const cleR = vif ? "t" + Math.floor(t/16) : "g" + L.version + "|" + nCuit;
    const veutRose = cleR !== roseCle;
    let choix = null;
    if (veutRose && roseCle === "") choix = "rose";
    else if (tourne && veutSol && t - L.tSol >= 48) choix = "sol";            // la roue tourne : le sol suit, une image sur deux
    else {
      let vieux = Infinity;
      for (const [n, tt, v] of [["glow", L.tJob, veutGlow], ["sol", L.tSol, veutSol], ["rose", L.tRose, veutRose]]){
        if (v && tt < vieux){ vieux = tt; choix = n; }
      }
    }
    if (L.fxDu && choix !== "sol" && choix !== null || L.fxDu && choix === null) choix = "fais";   // un travail lourd par image, pas deux
    if (choix === "glow"){
      if (!L.job) L.job = refaireGlow(cleG, t);
      if (L.job.next().done) L.job = null;
      L.tJob = t;
    }
    else if (choix === "sol"){
      solCle = cleF;
      L.tSol = t;
      sol(t, sr, vibA, th, S, EV);
      if (tourne) L.fxDu = true;                                  // la roue tourne : les faisceaux suivront à l'image d'après
      else faisceaux(sr, th);
    }
    else if (choix === "fais"){
      L.fxDu = false;
      faisceaux(sr, th);
    }
    else if (choix === "rose"){
      roseCle = cleR;
      L.tRose = t;
      composer(t, vibA);
    }

    // 1. la lumière au sol
    if (nl && LF){
      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(LF, 0, yF0, LF.width/LF.fs, LF.height/LF.fs);
      if (sr > 0){                                               // au seuil, plus d'éclat : la lumière s'ajoute à elle-même
        ctx.globalAlpha = .6*sr;
        ctx.drawImage(LF, 0, yF0, LF.width/LF.fs, LF.height/LF.fs);
        ctx.globalAlpha = 1;
      }
      ctx.globalCompositeOperation = "source-over";
    }

    // 2. les faisceaux dans la poussière, et la poussière elle-même
    if (nl && rayC){
      const ray = .32 + .68*sr;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const rh = rayC.height, r0 = Math.max(0, Math.floor((cy - R)*rh/H));   // au-dessus de la rosace, il n'y a pas de faisceau
      ctx.drawImage(rayC, 0, r0, rayC.width, rh - r0, 0, r0*H/rh, W, (rh - r0)*H/rh);
      const nb = sr > 0 ? poussiere.length : 110;
      for (let i = 0; i < nb; i++){
        const p = poussiere[i], c = cells[p.c];
        if (!c || c.lf <= 0 || c.fx === undefined) continue;
        const b = (p.b + t*p.v) % 1, Cx = c.sx, Cy = c.sy;     // c.fx, c.fy : sa tache au sol (calculée avec les faisceaux)
        const x = Cx + (c.fx - Cx)*b + p.w*c.rad*R*.6 + Math.sin(t/1700 + p.ph)*4;
        const y = Cy + (c.fy - Cy)*b + Math.cos(t/2100 + p.ph)*3;
        const a = c.lf*ray*(.4 + .35*Math.sin(t/400 + p.ph*3))*c.gain;
        if (a <= .02) continue;
        ctx.globalAlpha = Math.min(1, a);
        ctx.fillStyle = c.pc || (c.pc = rgb(mix(c.col, BLANC_PUR, .6)));
        ctx.fillRect(x, y, p.s, p.s);
      }
      ctx.restore();
    }

    // 3. la rosace : une lueur à peine autour, puis le vitrail
    if (nl){
      const part = clamp(nl/cells.length);
      const g = ctx.createRadialGradient(cx, cy, R*.95, cx, cy, R*1.45);
      g.addColorStop(0, `rgba(130,110,150,${.12*part + .1*sr})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = g;
      ctx.fillRect(cx - 1.5*R, cy - 1.5*R, 3*R, 3*R);
      ctx.restore();
    }
    if (th){                                                     // la roue de lumière : la rosace entière tourne
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(th);
      ctx.drawImage(L.compo, -1.2*R, -1.2*R, 2.4*R, 2.4*R);
      ctx.restore();
    }
    else ctx.drawImage(L.compo, cx - 1.2*R, cy - 1.2*R, 2.4*R, 2.4*R);

    // 3 bis. le cristal du cœur et son éventail
    if (S){
      eventailAir(ctx, S, EV);
      cristal(ctx, S, EV, t);
    }

    // 4. l'éclair du seuil
    const fl = t - tSeuil;
    if (fl > 0 && fl < 1000){
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = `rgba(255,244,222,${.42*Math.exp(-fl/320)*clamp(fl/80)})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 4 bis. la lumière qui nous traverse, la poussière d'or au premier plan
    if (S) traversee(ctx, S, EV, t);

    // 5. les noms, couchés sur la dalle, dans leur lumière (ils tournent avec la roue)
    noms(ctx, t, k, th);
    // 6. la ligne mono : la loi en clair ; au seuil, le cristal en direct, puis le mot de la fin
    const fm = clamp(R*.05, 7.5, 10), haut = Math.atan(1/Math.hypot(lxM, k))*180/Math.PI;
    const yl = cy + R + fm*1.9;
    ctx.font = `${fm}px ui-monospace, Consolas, monospace`;
    ctx.fillStyle = "rgba(170,166,160,.5)";
    if (!S) espace(ctx, `D${N} · LLOYD ×40 · ${cells.length} VERRES · H = P·A · SOLEIL ${Math.round(haut)}°`, cx, yl, .6, "center");
    else legende(ctx, S, EV, fm, yl);
  }

  function legende(ctx, S, EV, fm, yl){
    const f1 = v => (v/DEG).toFixed(1).replace(".", ",");
    const txt = S.fin < 1
      ? (EV.piege >= 1 ? `PRISME ${PRI.A}° · ${PRI.verre} · i ${Math.round(S.i/DEG)}° · RÉFLEXION TOTALE`
        : `SNELL · CAUCHY · i ${Math.round(S.i/DEG)}° · D ${f1(EV.Dr)}° ROUGE → ${f1(EV.Dv)}° VIOLET`)
      : `SNELL-DESCARTES · CAUCHY n = A + B/λ² · DÉVIATION MINIMALE ${f1(DMIN)}°`;
    ctx.save();
    ctx.globalAlpha = 1 - .5*S.fin;
    espace(ctx, txt, cx, yl + fm*1.9*S.fin, .5, "center");
    ctx.restore();
    if (S.fin <= 0) return;
    // le mot de la fin, gravé en lumière sous la rosace
    const fz = clamp(R*.085, 12, 19);
    ctx.save();
    ctx.font = `500 ${fz}px Georgia, "Times New Roman", serif`;
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.strokeStyle = `rgba(4,4,8,${.7*S.fin})`;
    ctx.lineWidth = 3;
    espace(ctx, DON.mot, cx, yl - fz*.15, fz*.32, "center", true);
    ctx.fillStyle = `rgba(255,246,226,${S.fin})`;
    espace(ctx, DON.mot, cx, yl - fz*.15, fz*.32, "center");
    ctx.restore();
  }

  /* ---------- le sol : le motif lumineux du moment (verres cuits + verres qui arrivent), reposé au sol ---------- */
  function sol(t, sr, vibA, th, S, EV){
    let src = L.allum;
    const ws = (t - tSeuil - 900)/1500;
    const arrivent = cells.some(c => !c.cuit && c.lf > 0);
    if (arrivent || vibA || (ws > 0 && ws < 1.6)){
      const P = L.px;
      P.globalCompositeOperation = "copy";
      P.drawImage(L.allum, 0, 0);
      P.globalCompositeOperation = "source-over";
      for (const c of cells){
        if (c.cuit || c.lf <= 0) continue;
        poser(P, c, c.lf*c.gain);
        if (c.lf < 1) poser(P, c, .8*Math.sin(Math.PI*c.lf)*c.gain, "lighter");   // la tache arrive : elle éclate puis se pose
      }
      if (vibA){
        const a = Math.exp(-(t - vib.t)/650)*(.55 + .45*Math.sin((t - vib.t)/38));
        poser(P, vib.c, .95*a, "lighter");
      }
      if (ws > 0 && ws < 1.6) onde(P, ws, L.Dp);                // l'onde du seuil, en retard, arrive au sol
      src = L.pat;
    }
    if (th){                                                     // la roue tourne : le motif tourne avant d'être reposé au sol
      // (en mouvement, à demi-résolution : le flou du mouvement le cache, et le sol suit la roue sans retard)
      const Dh = Math.ceil(L.Dp/2);
      if (!L.rot){
        L.rot = document.createElement("canvas");
        L.rot.width = L.rot.height = Dh;
        L.rx = L.rot.getContext("2d");
      }
      const X = L.rx;
      X.setTransform(1, 0, 0, 1, 0, 0);
      X.clearRect(0, 0, Dh, Dh);
      X.translate(Dh/2, Dh/2);
      X.rotate(th);
      X.drawImage(src, -Dh/2, -Dh/2, Dh, Dh);
      X.setTransform(1, 0, 0, 1, 0, 0);
      src = L.rot;
    }
    peindreSol(src, sr, S, EV, !!th);
  }

  /* ---------- les faisceaux : de chaque verre allumé à sa tache, au quart de la résolution ; la brume du seuil ---------- */
  function faisceaux(sr, th){
    const rw = Math.ceil(W/4), rh = Math.ceil(H/4), ray = .32 + .68*sr;
    if (!rayC || rayC.width !== rw || rayC.height !== rh){
      rayC = document.createElement("canvas");
      rayC.width = rw;
      rayC.height = rh;
    }
    const rx = rayC.getContext("2d");
    rx.setTransform(1, 0, 0, 1, 0, 0);
    rx.globalCompositeOperation = "source-over";
    rx.clearRect(0, 0, rw, rh);
    rx.setTransform(rw/W, 0, 0, rh/H, 0, 0);
    rx.globalCompositeOperation = "lighter";
    cells.forEach((c, i) => {
      if (c.lf <= 0) return;
      const co = Math.cos(th), si = Math.sin(th), gu = c.g[0]*co - c.g[1]*si, gv = c.g[0]*si + c.g[1]*co;
      const C = [cx + gu*R, cy + gv*R], Fp = auSol(gu, gv);
      c.sx = C[0];
      c.sy = C[1];
      c.fx = Fp[0];
      c.fy = Fp[1];
      if (c.kind === "v" && i % 2) return;
      const dx = Fp[0] - C[0], dy = Fp[1] - C[1], l = Math.hypot(dx, dy) || 1, nx = -dy/l, ny = dx/l;
      const wc = c.rad*R*.7, wf = c.rad*Fp[2]*.7;
      const eclat = 1 + 2.2*Math.sin(Math.PI*c.lf);            // le faisceau s'allume fort quand la couleur descend
      rx.globalAlpha = Math.min(1, c.lf*c.gain*ray*.06*eclat);
      rx.fillStyle = c.cs || (c.cs = rgb(c.col));
      rx.beginPath();
      rx.moveTo(C[0] + nx*wc, C[1] + ny*wc);
      rx.lineTo(Fp[0] + nx*wf, Fp[1] + ny*wf);
      rx.lineTo(Fp[0] - nx*wf, Fp[1] - ny*wf);
      rx.lineTo(C[0] - nx*wc, C[1] - ny*wc);
      rx.fill();
    });
    rx.globalAlpha = 1;
    if (sr > 0){                                                 // la brume colorée du seuil : la nef entière s'emplit
      const yc = (cy + yPres)/2, g = rx.createRadialGradient(cx, yc, R*.2, cx, yc, Math.max(W, H)*.75);
      g.addColorStop(0, `rgba(120,90,130,${.16*sr})`);
      g.addColorStop(.55, `rgba(60,70,130,${.08*sr})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      rx.fillStyle = g;
      rx.fillRect(0, 0, W, H);
    }
  }

  function onde(X, ws, Dp){   // un anneau de lumière qui part du cœur et traverse tous les verres allumés
    const T = L.tx, Dh = L.tmp.width;
    T.globalCompositeOperation = "copy";
    T.drawImage(L.allum, 0, 0, Dh, Dh);
    T.globalCompositeOperation = "destination-in";
    const g = T.createRadialGradient(Dh/2, Dh/2, 0, Dh/2, Dh/2, L.S*.525);
    const p = clamp(ws/1.4, 0, 1);
    [[p - .18, 0], [p, .95], [Math.min(1, p + .08), 0]].forEach(([o, a]) => g.addColorStop(clamp(o), `rgba(255,255,255,${a})`));
    T.fillStyle = g;
    T.fillRect(0, 0, Dh, Dh);
    X.globalCompositeOperation = "lighter";
    X.drawImage(L.tmp, 0, 0, Dp, Dp);
    X.globalCompositeOperation = "source-over";
  }

  /* ---------- la rosace composée : calque soleil + ce qui s'allume + plombs et remplage ---------- */
  function composer(t, vibA){
    const K = L.kx;
    idL(K);
    K.globalCompositeOperation = "copy";
    K.drawImage(L.glow, 0, 0);
    K.globalCompositeOperation = "source-over";
    for (const c of cells){
      if (c.inGlow || c.l <= 0) continue;                        // ce qui n'est pas encore dans le calque soleil
      poser(K, c, c.l*c.gain);
      const fl = Math.sin(Math.PI*clamp((t - c.t0)/1100));
      if (fl > 0) poser(K, c, .75*fl*c.gain, "lighter");
    }
    if (vibA){
      const a = Math.exp(-(t - vib.t)/650)*(.55 + .45*Math.sin((t - vib.t)/38));
      poser(K, vib.c, .95*a, "lighter");
    }
    const ws = (t - tSeuil)/1500;
    if (ws > 0 && ws < 1.6) onde(K, ws, L.Dp);
    K.drawImage(L.plomb, 0, 0);
  }

  function noms(ctx, t, k, th){
    const co = Math.cos(th || 0), si = Math.sin(th || 0);
    PR.forEach((p, q) => {
      // le nom se couche au milieu de la tache de son quartier (vu au sol, le vitrail est renversé) ; il tourne avec la roue
      const a = -Math.PI/4 + q*Math.PI/2, u0 = .5*Math.sign(Math.cos(a)), v0 = .6*Math.sign(Math.sin(a));
      const u = u0*co - v0*si, v = u0*si + v0*co;
      const P0 = auSol(u, v), P1 = auSol(u, v + .06);
      const squash = clamp(Math.abs(P1[1] - P0[1])/(.06*P0[2]), .55, 1);
      const lit = lisse((t - tG[q] - 700)/1300), nom = p.nom.toUpperCase();
      let fsz = clamp(P0[2]*.12, 11, 20);
      ctx.save();
      ctx.font = `500 ${fsz}px Georgia, "Times New Roman", serif`;
      const large = ctx.measureText(nom).width + nom.length*fsz*.3;
      fsz *= Math.min(1, P0[2]*.86/large);                       // le nom tient dans la demi-tache
      const sp = fsz*.3, fm = clamp(fsz*.5, 7, 9.5);
      const demi = (large*fsz/clamp(P0[2]*.12, 11, 20))/2;
      ctx.translate(clamp(P0[0], demi + 8, W - demi - 8), P0[1]);   // jamais coupé par le bord
      ctx.scale(1, squash);
      ctx.font = `500 ${fsz}px Georgia, "Times New Roman", serif`;
      ctx.textBaseline = "middle";
      if (lit < 1){                                             // avant le geste : une inscription à peine lisible dans le noir
        ctx.fillStyle = `rgba(150,146,140,${.2*(1 - lit)})`;
        espace(ctx, nom, 0, 0, sp, "center");
      }
      if (lit > 0){
        ctx.lineJoin = "round";
        ctx.strokeStyle = `rgba(4,4,8,${.7*lit})`;              // le creux de la lettre gravée, qui la détache de la lumière
        ctx.lineWidth = Math.max(2.4, fsz*.2);
        espace(ctx, nom, 0, 0, sp, "center", true);
        ctx.fillStyle = rgb(mix(TONS[q], BLANC_PUR, .7), lit);
        espace(ctx, nom, 0, 0, sp, "center");
        ctx.font = `${fm}px ui-monospace, Consolas, monospace`;
        const sous = (p.min + " min").toUpperCase();
        ctx.lineWidth = 2.4;
        espace(ctx, sous, 0, fsz*.95, 1.2, "center", true);
        ctx.fillStyle = rgb(mix(TONS[q], BLANC_PUR, .75), .9*lit);
        espace(ctx, sous, 0, fsz*.95, 1.2, "center");
      }
      ctx.restore();
    });
  }

  /* ---------- les gestes et l'état ---------- */
  const nFaits = () => fait.filter(Boolean).length;
  const boucle = () => tSeuil < Infinity;
  function textes(){
    const n = nFaits();
    M.bouton = boucle() ? "Encore" : n < 4 ? PR[fait.indexOf(false)].nom : "Boucler";
    M.ligne = boucle() ? ligneGeste(5)
      : n ? n + " sur 4 · " + PR.filter((p, i) => fait[i]).map(p => p.nom).join(" · ")
      : ligneGeste(0);
  }
  function etat(liste, bouclee){
    const Lr = (liste || []).filter(i => i >= 0 && i < 4);

  function encore(){

  function geste(i){
    if (i !== undefined) return faire(i);
    const t = maintenant();
    if (t - dernierGeste < 900) return;
    dernierGeste = t;
    if (boucle()) return encore();
    const q = fait.indexOf(false);
    if (q >= 0) faire(q);
    else boucler();
  }

  M.taille = (w, h, dpr) => {
    W = w; H = h; DPR = Math.min(dpr || 1, 1.5);
    const kk = W + "×" + H + "×" + DPR;
    if (kk === cle) return;
    cle = kk;
    mise();
    BG = null;
    if (L) Lvieux = null;
    L = null;
    LF = null;
    LFc = {};

  };
  M.frame = frame;
  M.geste = geste;

  M.retirer = i => { if (!fait[i]) return; etat([0, 1, 2, 3].filter(k => k !== i && fait[k]), false); };
  M.boucler = boucler;
  M.etat = etat;
  M.faits = () => [0, 1, 2, 3].filter(i => fait[i]);
  M.boucle = boucle;
  M.aller = n => { n = clamp(n | 0, 0, 5); etat([0, 1, 2, 3].slice(0, Math.min(n, 4)), n >= 5); };
  M.tap = (x, y) => {
    if (boucle() && maintenant() - tSeuil < SP1) return;          // la roue tourne : on la laisse tourner
    const u = (x - cx)/R, v = (y - cy)/R;

    for (let i = cells.length - 1; i >= 0; i--){
      const c = cells[i];
      if (u < c.bb[0] || u > c.bb[2] || v < c.bb[1] || v > c.bb[3]) continue;
      let dedans = false;
      for (let a = 0, b = c.p.length - 1; a < c.p.length; b = a++){
        const A = c.p[a], B = c.p[b];
        if ((A[1] > v) !== (B[1] > v) && u < (B[0] - A[0])*(v - A[1])/(B[1] - A[1]) + A[0]) dedans = !dedans;
      }
      if (!dedans) continue;
      vib = { c, t: maintenant() };
      M.ligne = c.kind === "jour" ? "J-" + (DON.jours.length - c.jour) + " · " + c.n + " sur 4"
        : c.kind === "coeur" ? "aujourd'hui · " + nFaits() + " sur 4"
        : PR[c.q].nom + " · " + DON.tons[c.q].nom + (c.l > .5 ? "" : " · éteint");
      return;
    }
  };
  M.glisse = (dx, dy) => {
    lxM = clamp(lxM - dx*.004, -.55, .55);
    kM = clamp(kM*Math.exp(dy*.003), .84, 1.08);
  };
  geometrie();
  mise();
  travaux = [fond(), rose()];
  return M;
}
