<script>
/* ======================= Atelier du Pointage : outils communs ======================= */
/* Repris de l'« atelier des mondes » d'Eliodor (mêmes noms, pour que ses pièces et les nôtres parlent la même langue),
   avec la palette du Pointage : gris neutre, le blanc pour seul accent (choix de Thomas, 26/10).
   Toute pièce peut appeler ces outils ; aucune ne les redéfinit. Le temps se lit avec maintenant(), jamais Date.now(). */
function graine(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function bruit1(seed){ const R = graine(seed), v = Array.from({length:512}, R); return x => { const i = Math.floor(x), f = x - i, a = v[i & 511], b = v[(i+1) & 511], u = f*f*(3-2*f); return a + (b-a)*u; }; }
function bruit2(seed){ const R = graine(seed), v = Array.from({length:4096}, R);
  const h = (i,j) => v[((i*73856093) ^ (j*19349663)) & 4095];
  return (x,y) => { const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx*fx*(3-2*fx), w = fy*fy*(3-2*fy);
    const a = h(i,j), b = h(i+1,j), c = h(i,j+1), d = h(i+1,j+1); return a + (b-a)*u + (c-a)*w + (a-b-c+d)*u*w; }; }
const mix = (a,b,t) => a.map((x,i) => x + (b[i]-x)*t);
const rgb = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const doux = u => 1 - Math.pow(1 - clamp(u), 3);
const lisse = u => { u = clamp(u); return u*u*(3 - 2*u); };
const maintenant = () => performance.now();
/* La palette du Pointage : un fond gris-noir, des gris, le blanc cassé pour ce qui est fait. */
const FOND = [15,16,20], CARTE = [23,24,29], TRAIT = [52,53,61], GRIS = [119,117,125], GRIS_CLAIR = [163,161,168], BLANC = [242,240,234], BLANC_PUR = [255,253,248];
function toile(w, h, dpr){ const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w*dpr)); c.height = Math.max(1, Math.round(h*dpr)); const x = c.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); return [c, x]; }
function grainTexture(){ const g = document.createElement("canvas"); g.width = g.height = 128; const x = g.getContext("2d"), im = x.createImageData(128,128), R = graine(9);
  for (let i = 0; i < im.data.length; i += 4) { const v = R()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; } x.putImageData(im,0,0); return g; }
const GRAIN = grainTexture();
function passeGrain(ctx, W, H, t, a){ ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = ctx.createPattern(GRAIN, "repeat"); ctx.translate((t*.07)%128, (t*.05)%128); ctx.fillRect(-128, -128, W + 256, H + 256); ctx.restore(); }
function fondu(ctx, W, H, coul, depuis=.82){ const f = ctx.createLinearGradient(0, H*depuis, 0, H); f.addColorStop(0, rgb(coul, 0)); f.addColorStop(1, rgb(coul, 1)); ctx.fillStyle = f; ctx.fillRect(0, H*depuis, W, H*(1-depuis)); }
/* Les données communes à toutes les pièces du premier tour : la journée de Thomas (fictive, mais à sa forme).
   Plus tard, l'app les remplacera par les vraies : priorités du jour, minutes, les 28 derniers jours. */
const JOURNEE = {
  priorites: [
    { nom: "990",        domaine: "Langues",  min: 20, serie: 12 },
    { nom: "CUMBRE",     domaine: "Langues",  min: 20, serie: 11 },
    { nom: "Lecture",    domaine: "Lecture",  min: 12, serie: 9 },
    { nom: "LE CLOSING", domaine: "Carrière", min: 30, serie: 3 }
  ],
  // les 28 derniers jours, du plus ancien à hier : combien de priorités faites (0 à 4)
  jours: [4,4,3,4,2,4,4,4,1,0,4,4,3,4,4,4,4,2,4,4,4,4,3,4,4,4,4,4],
  chaine: 9
};
/* Le bouton dit la prochaine priorité ; le cinquième geste boucle la journée ; ensuite « Encore » relance une variante. */
function libelleGeste(n){ const P = JOURNEE.priorites; return n < 4 ? P[n].nom : n === 4 ? "Boucler" : "Encore"; }
function ligneGeste(n){ const P = JOURNEE.priorites; if (n === 0) return "chaîne · " + JOURNEE.chaine + " jours"; if (n <= 4) return P[n-1].nom + " · " + Math.min(n,4) + " sur 4"; return "journée bouclée · " + (JOURNEE.chaine + 1) + " jours"; }

<script>
/* ======================= Tour 2, pièce 08 : L'ENLUMINURE (etude_enluminure) ======================= */
/* Ce qu'on voit : une page de manuscrit plein cadre, sur un vélin gris-beige (marbrures, fibres, follicules, taches et lignes de
   marée), réglée à la pointe sèche et piquée en marge. Le texte du jour est copié à la plume, en gris ; un espace est réservé
   pour la miniature (« ici la tour des jours », au crayon). Au repos, rien n'est peint : quatre lettrines N, C, L, F et leurs
   rinceaux ne sont qu'esquissés au crayon.
   La loi : chaque rinceau est une tige ondulante d'où partent, aux crêtes, des branches en spirale logarithmique
   r = r0·e^(−bθ), b = ln φ /(π/2) (la spirale d'or ; Bernoulli, 1692). Les feuilles suivent la phyllotaxie de l'angle d'or,
   137,5° = 360°(1 − 1/φ) : la n-ième tourne de n·137,5° autour de la tige ; vue de côté, sin donne son côté et sa longueur,
   cos dit si elle passe devant ou derrière. Le cœur des fleurs : Vogel (1979), graine n en r = c√n, θ = n·137,5°.
   L'or bruni : Blinn-Phong (Blinn, 1977), (N·H)^16 + (N·H)^128, calculé au pixel sur les normales d'une feuille d'or froissée
   (crêtes de bruit, joints, poinçons), et sur chaque point d'or et chaque carreau des barres, selon la position de la lumière.
   La main : lapis, vermillon, vert-de-gris, or ; cerne d'encre, blanc de plomb, hachures, pigment grenu.
   L'usage : « Ta journée ». Une priorité faite enlumine SA lettrine : l'or se pose et luit, la lettre prend sa couleur, son nom
   s'écrit en rubrique rouge, le rinceau pousse dans la marge et sous le paragraphe ; les points d'or s'allument au passage.
   Le seuil (Boucler) : un rinceau sur barre d'or court tout autour de la page et se referme ; une lumière rasante traverse la
   page et embrase l'or ; la miniature se peint couche après couche : la tour des jours (une assise par jour de chaîne) et sa
   cité sous un ciel de lapis. La page reste ainsi. « Encore » : une autre page (autre graine).
   Le doigt : toucher une lettrine fait reluire son or et dit sa priorité ; glisser déplace la lumière : l'or change.
   Le budget : vélin, texte et esquisse sont peints une fois, par tranches de 5 ms ; ce qui a fini de pousser est cuit dans un
   calque ; par image, seuls le front de pousse, l'or (deux lettrines sur quatre), les points et les carreaux sont recalculés. */
const etude_enluminure_DONNEES = Object.assign({
  incipit: "Ici commence le livre du jour",
  jour: "lundi 26 octobre", folio: "f. 299 r°",
  lettres: ["N", "C", "L", "F"],
  textes: [
    "Neuf cent nonante points, c'est la mesure de l'épreuve des Anglois. Chaque matin l'escholier tend l'oreille vingt minutes, répond aux questions du maître sans hâte, et note en marge les mots qui lui ont échappé.",
    "Cumbre veut dire la cime, en la langue d'Espagne. On y monte une marche par jour : lire à voix haute, conjuguer, retenir trois mots, jusqu'à l'épreuve du DELE où l'on parlera sans trembler.",
    "Lecture d'un seul texte des philosophes, lu deux fois : la première pour l'entendre, la seconde plume en main, en copiant la phrase qui demeure, afin de la relire au soir et d'y répondre.",
    "Fusions et acquisitions sont le métier du Closing : peser une maison de commerce, lire ses comptes et ses dettes, mener la négociation jusqu'au sceau, et ne rien laisser au hasard."
  ],
  miniature: { titre: "La tour des jours", note: "ici la tour des jours" }
}, JOURNEE);

function etude_enluminure(donnees){   // donnees : propres à cette page (l'app en ouvre deux : aujourd'hui, et un jour du Livre)
  const { PI, abs, atan2, ceil, cos, exp, floor, hypot, log, max, min, pow, round, sin, sqrt } = Math;
  const D = donnees ? Object.assign({}, etude_enluminure_DONNEES, donnees) : etude_enluminure_DONNEES, P = D.priorites;
  const LAPIS = [30,58,148], VERMIL = [204,56,30], VERDET = [36,132,108], ENCRE = [22,18,16], INK = [14,12,11],   // encre noire franche (tour 2 : « écriture noire foncé »)
   
    OR_S = [112,80,28], OR_C = [255,238,180], OR_P = [208,162,60], PIERRE = [212,206,194], GRAPH = [66,66,72], BLANC_P = [255,250,236];
  const GA = PI * (3 - sqrt(5)), BSP = log((1 + sqrt(5)) / 2) / (PI / 2);
  const PIG = [
    { l: [LAPIS], t: LAPIS, f: [VERDET, LAPIS, VERDET], fl: VERMIL },
    { l: [VERMIL], t: VERMIL, f: [VERDET, VERMIL, VERDET], fl: LAPIS },
    { l: [VERDET], t: VERDET, f: [VERDET, LAPIS, VERMIL], fl: VERMIL },
    { l: [LAPIS, VERMIL], t: LAPIS, f: [VERMIL, VERDET, LAPIS], fl: VERMIL } ];
  let W = 390, H = 760, DPR = 1, seed = D.graine || 1977, etape = 0;   // l'app donne une graine par jour : une page neuve chaque jour
  let Lay = null, RN = [], BORD = null, MG = null, base = null, peint = null, pctx = null, gen = null, mini = null;
  let lettres = [], ors = [], anim = [null, null, null, null], cuit = [false, false, false, false], tS = null, bordCuit = false, RS = [], BS = null, cz = null;
  let lum = { x: 0, y: 0 }, lumMain = false, nImg = 0, flash = [-1e9, -1e9, -1e9, -1e9], dernierGeste = -1e9;
  const M = { titre: "L'ENLUMINURE", bouton: libelleGeste(0), ligne: ligneGeste(0), dprMax: 1.5 };
  const mes = document.createElement("canvas").getContext("2d");
  const SERIF = "Georgia, serif", MONO = "ui-monospace, monospace";

  /* — petits outils — */
  const ink = a => rgb(ENCRE, a), blanc = a => rgb(BLANC_P, a), mine = a => rgb(GRAPH, a), TAU = 6.2832;
  const trait = (c, s, w) => { c.strokeStyle = s; c.lineWidth = w; }, remplir = (c, f) => { c.fillStyle = f; c.fill(); };
  const dist = (a, b) => hypot(a[0] - b[0], a[1] - b[1]);
  function reech(pts, pas){ const out = [pts[0].slice()]; let carry = 0;
    for (let i = 1; i < pts.length; i++){ const a = pts[i - 1], b = pts[i], L = dist(a, b); if (L < 1e-6) continue; let s = pas - carry;
      while (s <= L){ out.push([a[0] + (b[0] - a[0]) * s / L, a[1] + (b[1] - a[1]) * s / L]); s += pas; } carry = L - (s - pas); }
    out.push(pts[pts.length - 1].slice()); return out; }
  function bez(p0, p1, p2, n){ const o = []; for (let k = 0; k <= n; k++){ const u = k / n, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u;
    o.push([a * p0[0] + b * p1[0] + c * p2[0], a * p0[1] + b * p1[1] + c * p2[1]]); } return o; }
  function tang(q, i){ const a = q[max(0, i - 3)], b = q[min(q.length - 1, i + 3)], L = dist(a, b) || 1; return [(b[0] - a[0]) / L, (b[1] - a[1]) / L]; }
  function espace(c, txt, x, y, sp, centre){ const ch = [...txt], ws = ch.map(k => c.measureText(k).width); const w = ws.reduce((a, b) => a + b + sp, -sp);
    let xx = centre ? x - w / 2 : x; ch.forEach((k, i) => { c.fillText(k, xx, y); xx += ws[i] + sp; }); return w; }

  /* — la mise en page : le texte remplit la colonne, la miniature prend ce qui reste — */
  function couper(tx, larg, fs){ const mots = tx.split(/\s+/); mots[0] = mots[0].toUpperCase();
    mes.font = `italic ${fs}px ${SERIF}`; const esp = mes.measureText(" ").width; const L = []; let cur = [], lw = 0;
    for (const m of mots){ const mw = mes.measureText(m).width, lim = larg(L.length);
      if (cur.length && lw + esp + mw > lim){ L.push({ mots: cur }); cur = [m]; lw = mw; } else { lw += (cur.length ? esp : 0) + mw; cur.push(m); } }
    if (cur.length) L.push({ mots: cur, fin: true }); return L; }
  function mise(){
    const ext = H > 560, top = ext ? max(58, H * .075) : H * .055 + 8, bot = H - (ext ? max(78, H * .105) : H * .05 + 8);
    const e = max(7, min(W, H) * .03), mL = max(W * .22, 64), xR = W - max(W * .07, 22), avail = bot - top;
    let L = null;
    for (let fs = max(6, min(15, W / 25)); fs >= 6; fs -= .25){   // au moins un essai, même dans un bloc très étroit (sinon L restait vide)
      const lh = fs * 1.45, s = lh * 3 - fs * .3, bx = mL - s * .22, ind = bx + s + fs * .6;
      const paras = D.textes.map(tx => couper(tx.slice(1), j => j < 4 ? xR - ind : xR - mL, fs));
      const headH = lh * 2.3, gapMin = lh * 1.05;
      const textH = headH + paras.reduce((a, l) => a + max(4, l.length) * lh, 0) + gapMin * 6 + lh;
      L = { fs, lh, s, bx, ind, paras, headH, gapMin, textH };
      if (textH + avail * .25 <= avail) break;
    }
    const miniH = max(40, min(avail - L.textH, avail * .42)), gap = L.gapMin + max(0, avail - L.textH - miniH) / 6;
    Object.assign(L, { top, bot, e, mL, xR, gap, p: [] });
    let y = top + L.headH + gap;
    L.paras.forEach((lignes, i) => {
      if (i === 2){ L.mini = { x: mL, y: y, w: xR - mL, h: miniH }; L.miniRub = y + miniH + L.lh * .95; y += L.lh + miniH + gap; }
      const n = max(4, lignes.length);
      L.p.push({ y0: y, lignes, box: { x: L.bx, y: y + L.lh * .2, s: L.s }, rub: { x: L.bx + L.s / 2, y: y + 3 * L.lh + L.fs * .95 }, yEnd: y + n * L.lh });
      y += n * L.lh + gap;
    });
    Lay = L;
  }

  /* — le rinceau : tige ondulante, spirales d'or aux crêtes, feuilles en phyllotaxie, poils et points d'or — */
  function vigne(basePts, o, R){
    const pts = reech(basePts, 1.5), n = pts.length, S = [0];
    for (let i = 1; i < n; i++) S[i] = S[i - 1] + dist(pts[i - 1], pts[i]);
    const out = { tiges: [], feuilles: [], fleurs: [], poils: [], points: [] }, q = [];
    for (let i = 0; i < n; i++){ const T = tang(pts, i), ramp = lisse(S[i] / (o.lam * .45));
      const off = o.A * ramp * sin(2 * PI * S[i] / o.lam + o.ph); q.push([pts[i][0] - T[1] * off, pts[i][1] + T[0] * off, 0]); }
    q[0][2] = o.d0; for (let i = 1; i < n; i++) q[i][2] = q[i - 1][2] + dist(q[i - 1], q[i]);
    out.tiges.push({ p: q, w: o.w, col: o.tige });
    const Send = S[n - 1], idxDe = s => { let i = 0; while (i < n - 1 && S[i] < s) i++; return i; };
    // aux crêtes : spirale d'or r = r0·e^(−bθ), finie en fleur ou en point d'or
    for (let k = 0; k < 200; k++){
      const sk = ((PI / 2 + k * PI - o.ph) / (2 * PI)) * o.lam; if (sk < o.lam * .3) continue; if (sk > Send - o.lam * .3) break;
      const i = idxDe(sk), Pq = q[i], T = tang(q, i), side = (k % 2 ? -1 : 1), no = [-T[1] * side, T[0] * side];
      if (o.spirale){
        const Rs = o.Rs * (.8 + .4 * R()), C = [Pq[0] + no[0] * Rs * .95 + T[0] * Rs * .3, Pq[1] + no[1] * Rs * .95 + T[1] * Rs * .3];
        const a0 = atan2(Pq[1] - C[1], Pq[0] - C[0]), r0 = dist(Pq, C); let w = 1; if (-sin(a0) * T[0] + cos(a0) * T[1] < 0) w = -1;
        const sp = [], th = 4.3 + R() * 1.2; let dd = Pq[2], prev = [Pq[0], Pq[1]];
        for (let a = 0; a <= th; a += .1){ const r = r0 * exp(-BSP * a), p = [C[0] + r * cos(a0 + w * a), C[1] + r * sin(a0 + w * a)];
          dd += dist(prev, p); prev = p; sp.push([p[0], p[1], dd]); }
        out.tiges.push({ p: sp, w: o.w * .68, col: o.tige });
        const j = min(sp.length - 1, 9), lp = sp[j], ang = atan2(lp[1] - C[1], lp[0] - C[0]) + w * .5;
        out.feuilles.push({ x: lp[0], y: lp[1], a: ang, L: o.fl * .8, Wd: o.fl * .34, side: w, front: true, d: lp[2], col: o.feuilles[k % o.feuilles.length] });
        const e = sp[sp.length - 1];
        if (k % 3 !== 2) out.fleurs.push({ x: e[0], y: e[1], r: Rs * .5, d: e[2], col: o.fleur, n: 5 + (k % 2), a0: R() * 6.28, ns: 13 });
        else out.points.push({ x: e[0], y: e[1], r: o.rp * 1.25, d: e[2], nx: R() - .5, ny: R() - .5 });
      } else if (k % 2 === 0){
        const ang = atan2(T[1], T[0]) + side * 1.1;
        out.feuilles.push({ x: Pq[0], y: Pq[1], a: ang, L: o.fl * 1.05, Wd: o.fl * .4, side, front: true, d: Pq[2], col: o.feuilles[(k >> 1) % o.feuilles.length] });
      }
    }
    // phyllotaxie : feuille n à n·137,5° (sin : côté, longueur ; cos : devant/derrière)
    let j = 0;
    for (let s = o.pas * .7; s < Send - 3; s += o.pas, j++){
      const phi = j * GA, sn = sin(phi), cs = cos(phi), side = sn >= 0 ? 1 : -1, i = idxDe(s), Pq = q[i], T = tang(q, i);
      const L = o.fl * (.38 + .62 * abs(sn)), ang = atan2(T[1], T[0]) + side * (.55 + .55 * (1 - abs(sn)));
      out.feuilles.push({ x: Pq[0], y: Pq[1], a: ang, L, Wd: L * .42, side, front: cs > 0, d: Pq[2], col: o.feuilles[j % o.feuilles.length], t: out.tiges[0] });
    }
    // poils à l'encre finis d'un point d'or
    j = 0;
    for (let s = o.pp * .5; s < Send - 4; s += o.pp, j++){
      const i = idxDe(s), Pq = q[i], T = tang(q, i), side = j % 2 ? 1 : -1, nrm = [-T[1] * side, T[0] * side], lp = o.lp * (.8 + .4 * R());
      const c1 = [Pq[0] + nrm[0] * lp * .6 + T[0] * lp * .5, Pq[1] + nrm[1] * lp * .6 + T[1] * lp * .5], e = [Pq[0] + nrm[0] * lp + T[0] * lp * .2, Pq[1] + nrm[1] * lp + T[1] * lp * .2];
      const b = bez([Pq[0], Pq[1]], c1, e, 6); let dd = Pq[2]; const pp = b.map((p, k) => { if (k) dd += dist(b[k - 1], p); return [p[0], p[1], dd]; });
      out.poils.push({ p: pp }); out.points.push({ x: e[0], y: e[1], r: o.rp * (.8 + .4 * R()), d: dd, nx: (R() - .5) * 1.2, ny: (R() - .5) * 1.2 });
    }
    const fin = q[n - 1]; out.fleurs.push({ x: fin[0], y: fin[1], r: o.rf, d: fin[2], col: o.fleur, n: 6, a0: R() * 6.28, ns: 21 });

    for (let i = 0; i < 4; i++) if (vit(i) && !cuit[i]){ if (t - anim[i] > T_RIN){ avance(RS[i], 1e9); rubrique(pctx, i, 1); cuit[i] = true; } else avance(RS[i], croissance(i, t)); }
    const vitS = tS !== null && tS > -1e8;
    if (vitS && !bordCuit){ if (t - tS > T_BORD){ avance(BS, 1e9); bordCuit = true; } else avance(BS, lisse((t - tS) / 3200) * BORD.Dmax); }
    ctx.drawImage(peint, 0, 0, W, H);
    for (let i = 0; i < 4; i++) if (vit(i) && !cuit[i]){ vivants(RS[i], ctx); rubrique(ctx, i, lisse((t - anim[i] - 900) / 900)); }
    // le seuil : l'encadrement pousse, la miniature se peint
    let aS = tS === null ? -1 : t - tS;
    if (aS >= 0){
      const Db = BS.D, vb = vitS && !bordCuit;
      if (vb) vivants(BS, ctx);
      tuilesOr(ctx, BORD.tuiles, Db, Lp, 1);
      pointsOr(ctx, BORD.points, Db, Lp, vb);
      const m = Lay.mini;
      if (mini){ mini.forEach((cv, k) => { const a = lisse((aS - 2300 - k * 750) / 900); if (a > 0){ ctx.globalAlpha = a; ctx.drawImage(cv, m.x, m.y, m.w, m.h); } }); ctx.globalAlpha = 1; }
      const af = lisse((aS - 4300) / 900); if (af > 0){ tuilesOr(ctx, MG.tuiles, 1, Lp, af); }
      const ar = lisse((aS - 4400) / 1100);
      if (ar > 0){ ctx.save(); ctx.font = `${Lay.fs * .78}px ${SERIF}`; mes.font = ctx.font; const txt = `${D.miniature.titre} · ${D.chaine + 1} assises`.toUpperCase();
        ctx.beginPath(); ctx.rect(m.x, Lay.miniRub - Lay.fs * 1.2, m.w * ar, Lay.fs * 1.8); ctx.clip(); ctx.fillStyle = rgb(VERMIL); ctx.textAlign = "left"; espace(ctx, txt, m.x + m.w / 2, Lay.miniRub, 1.3, true); ctx.restore(); }
      const ai = lisse((aS - 5000) / 1000);
      if (ai > 0 && Lay.fsI){ ctx.save(); ctx.globalAlpha = ai; incipit(ctx, VERMIL); ctx.restore(); }
    }
    // lettrines : or calculé, lettre, lueur
    for (let i = 0; i < 4; i++){ if (anim[i] === null || !ors[i]) continue; const a = t - anim[i], b = Lay.p[i].box, rev = doux(a / 800);
      const fl = max(exp(-max(0, a - 500) / 700) * (a > 0 ? 1 : 0), exp(-(t - flash[i]) / 900)), boost = 1 + fl * 2.2;
      const O = ors[i]; if (fl > .02 || !O.r || (nImg + i) % 2 === 0) O.r = orRendre(i, Lp, boost); const r = O.r;
      ctx.save(); if (rev < 1){ ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + 2.2 * b.s * rev, b.y); ctx.lineTo(b.x, b.y + 2.2 * b.s * rev); ctx.closePath(); ctx.clip(); }
      ctx.drawImage(ors[i].cv, b.x, b.y, b.s, b.s); ctx.restore();
      const la = lisse((a - 350) / 650); if (la > 0){ const sc = 1.14 - .14 * la; ctx.globalAlpha = la; ctx.drawImage(lettres[i], b.x + b.s * (1 - sc) / 2, b.y + b.s * (1 - sc) / 2, b.s * sc, b.s * sc); ctx.globalAlpha = 1; }
      etincelle(ctx, r.x, r.y, min(1, r.best * 1.2) * (.5 + fl), b.s * (.25 + .35 * fl));
      const Dc = RS[i].D, vv = vit(i) && !cuit[i];
      pointsOr(ctx, RN[i].points, Dc, Lp, vv);
    }
    // la lumière rasante du seuil
    if (aS > 600 && aS < 3600){ const u = (aS - 600) / 3000, px = -W * .4 + W * 1.8 * u, py = H * 1.1 - H * 1.2 * u, g = ctx.createLinearGradient(px - W * .25, py - W * .25, px + W * .25, py + W * .25);
      const a = sin(PI * u) * .3; g.addColorStop(0, rgb(OR_C, 0)); g.addColorStop(.5, rgb(OR_C, a)); g.addColorStop(1, rgb(OR_C, 0));
      ctx.save(); ctx.globalCompositeOperation = "screen"; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
    passeGrain(ctx, W, H, t, .035);
  }

  function ligne(n){ if (n === 0) return ligneGeste(0); if (n <= 4){ const p = P[n - 1]; return `${p.nom} · lettrine ${D.lettres[n - 1]} enluminée · ${n} sur 4`; }
    return `explicit · journée bouclée · ${D.chaine + 1} jours`; }
  function aller(n){ n = clamp(n | 0, 0, 5); etape = n; anim = [0, 1, 2, 3].map(i => i < n ? -1e9 : null); tS = n >= 5 ? -1e9 : null;
    if (pctx){ pctx.save(); pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.clearRect(0, 0, peint.width, peint.height); pctx.restore(); }
    cuit = [false, false, false, false]; bordCuit = false; RS = RN.map(r => pousse(r.vignes)); BS = pousse(BORD.vignes);
    cz = (function*(){ for (let i = 0; i < min(n, 4); i++) yield* cuire(RS[i], () => { rubrique(pctx, i, 1); cuit[i] = true; });
      if (n >= 5) yield* cuire(BS, () => { bordCuit = true; }); })();
    M.bouton = libelleGeste(etape); M.ligne = ligne(etape); }
  M.aller = aller;
  /* Pour la pose dans l'app (tour 3) : les priorités se cochent dans n'importe quel ordre, et se décochent.
     etat(liste, boucle) pose l'état sans animation ; faire(i) enlumine la lettrine i ; retirer(i) la rend au crayon. */
  function textes(){ const n = anim.filter(a => a !== null).length; M.bouton = tS !== null ? "Encore" : n < 4 ? P[anim.findIndex(a => a === null)].nom : "Boucler";
    M.ligne = tS !== null ? ligne(5) : n ? `${n} sur 4 · ${P.filter((p, i) => anim[i] !== null).map(p => p.nom).join(" · ")}` : ligneGeste(0); }
  function etat(liste, boucle){ const L = (liste || []).filter(i => i >= 0 && i < 4);
    anim = [0, 1, 2, 3].map(i => L.includes(i) ? -1e9 : null); tS = boucle && L.length === 4 ? -1e9 : null; etape = L.length + (tS !== null ? 1 : 0);
    if (pctx){ pctx.save(); pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.clearRect(0, 0, peint.width, peint.height); pctx.restore(); }
    cuit = [false, false, false, false]; bordCuit = false; RS = RN.map(r => pousse(r.vignes)); BS = pousse(BORD.vignes);
    cz = (function*(){ for (const i of L) yield* cuire(RS[i], () => { rubrique(pctx, i, 1); cuit[i] = true; });
      if (tS !== null) yield* cuire(BS, () => { bordCuit = true; }); })();
    textes(); }
  M.etat = etat;
  M.faire = i => { if (i < 0 || i > 3 || anim[i] !== null) return; anim[i] = maintenant(); etape++; textes(); };
  M.retirer = i => { if (anim[i] === null) return; etat([0, 1, 2, 3].filter(k => k !== i && anim[k] !== null), false); };
  M.boucler = () => { if (tS === null && anim.every(a => a !== null)){ tS = maintenant(); etape = 5; textes(); } };
  M.faits = () => [0, 1, 2, 3].filter(i => anim[i] !== null);
  M.boucle = () => tS !== null;
  // la taille change (ou se pose) : on refait la page en gardant les lettrines faites, quelles qu'elles soient
  // (avant : aller(etape) rendait « les n premières », et l'app qui posait N et F se retrouvait avec N et C)
  M.taille = (w, h, dpr) => { W = w; H = h; DPR = dpr || 1; const f = [0, 1, 2, 3].filter(i => anim[i] !== null), b = tS !== null; batir(true); etat(f, b); };
  M.frame = frame;
  M.geste = (i) => { if (i !== undefined) return M.faire(i); const t = maintenant(); if (t - dernierGeste < 900) return; dernierGeste = t;
    if (etape >= 5){ seed += 7; batir(false); aller(0); return; }
    if (etape < 4) anim[etape] = t; else tS = t;
    etape++; M.bouton = libelleGeste(etape); M.ligne = ligne(etape); };
  M.tap = (x, y) => { const t = maintenant();
    for (let i = 0; i < 4; i++){ const b = Lay.p[i].box; if (x > b.x - 8 && x < b.x + b.s + 8 && y > b.y - 8 && y < b.y + b.s + 8){ flash[i] = t; const p = P[i];
      M.ligne = anim[i] !== null ? `${p.nom} · ${p.domaine.toLowerCase()} · ${p.min} min · son or reluit` : `${p.nom} · ${D.lettres[i]} au crayon · pas encore faite`; return; } }
    const m = Lay.mini; if (tS !== null && x > m.x && x < m.x + m.w && y > m.y && y < m.y + m.h){ M.ligne = `${D.miniature.titre.toLowerCase()} · ${D.chaine + 1} assises, une par jour`; } };
  M.glisse = (dx, dy) => { lumMain = true; lum.x = clamp(lum.x + dx * 1.8, -W * .6, W * 1.6); lum.y = clamp(lum.y + dy * 1.8, -H * .5, H * 1.5); };
  batir(true); aller(0);
  return M;
}

<script>
/* Le moteur : une image par rafraîchissement, le doigt, le bouton. */
(function(){
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), bouton = document.getElementById("geste");
  const montrerErreur = e => { const p = document.createElement("div"); p.className = "erreur"; p.textContent = "Erreur : " + (e && e.message || e); document.body.appendChild(p); };
  let m; try { m = window.ETUDE(); } catch (e) { montrerErreur(e); return; }

    cv.width = Math.round(W*D); cv.height = Math.round(H*D); ctx.setTransform(D, 0, 0, D, 0, 0); m.taille(W, H, D); }

  }

  window.__ETUDE = m;
  requestAnimationFrame(boucle);
